/* ============================================================
   ⑨ 修复：小屏（<1024px）整页无法向下滚动
   原因：#appDrawer 被 Apple Glass 段无差别加了 overflow:hidden!important，
        而小屏下 #mainScroll 没有 overflow-y:auto（那是 lg: 前缀，只在桌面生效）。
        结果 100dvh 的框把 4000px 的内容直接裁掉，且页面里没有任何滚动容器。
   修法：小屏恢复文件原本设计的「由 body 滚动」（#mainScroll 在手机端不是滚动容器，
        与底部无限滚动的 IntersectionObserver root:null 也是一致的）。
   ============================================================ */
@media (max-width: 1023px) {
  #appDrawer {
    height: auto !important;
    min-height: 100dvh !important;
    overflow: visible !important;
    border-radius: 0 !important;
  }
  #appDrawer > .drawer-content { height: auto !important; }
}

/* ============================================================
   ⑪ 背景光斑：柔和大圆 + 极缓慢的漂浮 / 呼吸
   说明：浅色/深色都必须让 #appShell 保持透明（见上面 #appShell 那条深色规则），
        光斑才能透过 #appDrawer(半透明玻璃) 显进内容面板；只透外框是不够的。
   层次：html 木纹底 → body 底色渐变 → #bgOrbs(本层) → #appDrawer → #appShell(透明) → 内容。
   用 z-index:0 而不是负值——body 底色是不透明的，负值会被压在它下面看不见。
   深色光斑透明度比浅色高一档：它要额外穿过 #appDrawer 的 rgba(35,32,28/.54)。
   ============================================================ */
#bgOrbs {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
#bgOrbs span {
  position: absolute;
  display: block;
  border-radius: 50%;
  background: radial-gradient(
    circle closest-side,
    var(--orb-c) 0%,
    color-mix(in srgb, var(--orb-c) 58%, transparent) 60%,
    transparent 100%
  );
  will-change: transform;
  animation: orbDrift var(--orb-t, 34s) ease-in-out infinite alternate;
  animation-delay: var(--orb-d, 0s);
}
/* 四颗光斑：尺寸 / 位置 / 周期 / 漂移幅度各不相同，避免看出同频 */
#bgOrbs span:nth-child(1) { width: 54vmax; height: 54vmax; top: -16vmax; left: -12vmax; --orb-t: 42s; --orb-x: 7vmax; --orb-y: 5vmax; --orb-s: 1.16; }
#bgOrbs span:nth-child(2) { width: 46vmax; height: 46vmax; right: -10vmax; bottom: -16vmax; --orb-t: 36s; --orb-d: -6s; --orb-x: -6vmax; --orb-y: -5vmax; --orb-s: 1.12; }
#bgOrbs span:nth-child(3) { width: 34vmax; height: 34vmax; top: 38%; left: 42%; --orb-t: 48s; --orb-d: -14s; --orb-x: 9vmax; --orb-y: -4vmax; --orb-s: 1.2; }
#bgOrbs span:nth-child(4) { width: 26vmax; height: 26vmax; left: 6%; bottom: 8%; --orb-t: 30s; --orb-d: -20s; --orb-x: -5vmax; --orb-y: 6vmax; --orb-s: 1.1; }

@keyframes orbDrift {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to   { transform: translate3d(var(--orb-x, 5vmax), var(--orb-y, -4vmax), 0) scale(var(--orb-s, 1.12)); }
}

/* 浅色：薄荷 / 薰衣草 / 天蓝 / 暖杏，通透 */
html:not([data-theme="dark"]):not([data-theme="halloween"]) #bgOrbs span:nth-child(1) { --orb-c: rgb(139 114 246/.34); }
html:not([data-theme="dark"]):not([data-theme="halloween"]) #bgOrbs span:nth-child(2) { --orb-c: rgb(18 166 122/.32); }
html:not([data-theme="dark"]):not([data-theme="halloween"]) #bgOrbs span:nth-child(3) { --orb-c: rgb(47 128 237/.20); }
html:not([data-theme="dark"]):not([data-theme="halloween"]) #bgOrbs span:nth-child(4) { --orb-c: rgb(255 206 138/.30); }
/* 深色：暖金 / 青瓷 / 琥珀 / 冷灰，压暗后像落在桌面上的光 */
html:is([data-theme="dark"], [data-theme="halloween"]) #bgOrbs span:nth-child(1) { --orb-c: rgb(213 189 145/.26); }
html:is([data-theme="dark"], [data-theme="halloween"]) #bgOrbs span:nth-child(2) { --orb-c: rgb(122 178 168/.23); }
html:is([data-theme="dark"], [data-theme="halloween"]) #bgOrbs span:nth-child(3) { --orb-c: rgb(196 138 84/.20); }
html:is([data-theme="dark"], [data-theme="halloween"]) #bgOrbs span:nth-child(4) { --orb-c: rgb(154 165 180/.17); }

/* 尊重系统的"减少动态效果" */
@media (prefers-reduced-motion: reduce) {
  #bgOrbs span { animation: none; }
}

/* ============================================================
   ⑬ 说说卡片：圆角收紧 + 顶部日期改成「小号灰字元信息行」
   参考站实测（用户给的截图，1x）：卡片宽 558px、圆角约 6px → 圆角/卡宽 ≈ 1.1%；
   我们的卡片宽约 1026px，按同一比例取 12px（原为 22px，用户反馈"太圆润"）。
   文字布局也对齐参考站：最上方单独一行放小号、低对比的日期（原来是个彩色胶囊），
   往下才是正文与标签（标签本来就跟在正文尾部）——节奏与参考站一致。
   照片瓦片（.carousel-strip .strip-item / 内层 img）按用户"图片保留自己的"要求未改动。
   ============================================================ */
#content ul.memo-list .memo-card { border-radius: 12px !important; }

#content ul.memo-list .memo-card .memo-tape-date {
  display: block;
  width: auto;
  height: auto;
  margin: 0 0 .5rem;
  padding: 0;
  border-radius: 0 !important;
  background: none !important;
  box-shadow: none !important;
  font-family: var(--font-family);
  font-size: .76rem;
  font-weight: 500;
  letter-spacing: .035em;
  line-height: 1.5;
  text-shadow: none !important;
  color: color-mix(in oklch, var(--color-base-content) 48%, transparent);
}

/* ============================================================
   ⑭ 图片计数徽章（1 / N）：补上浅色 / 深色两套外观
   原来 markup 里是 Tailwind 写死的 `bg-black/55 text-white`，
   不论什么主题都是同一块深灰底 + 白字，浅色下很突兀（贴在照片上尤其跳）。
   做法：做成"磨砂玻璃药丸"，底色/文字/描边/投影分主题给值，
   用 !important 压过 Tailwind 的 bg-black/55、text-white 与 daisyUI .badge 的默认色。
   注意：徽章永远压在照片上，所以不能只靠页面底色——两套都要自带足够对比。
   ============================================================ */
.strip-count {
  background: rgb(255 255 255 / .78) !important;
  color: rgb(38 34 28 / .92) !important;
  border: 1px solid rgb(255 255 255 / .90) !important;
  /* 最外面那圈极淡的 0 0 0 1px 很关键：白玻璃贴在亮照片上时，
     光靠白色描边会糊成一片，这圈淡暗描边负责把徽章的轮廓勾出来 */
  box-shadow:
    0 0 0 1px rgb(48 40 30 / .07),
    0 4px 12px rgb(24 78 62 / .20),
    inset 0 1px 0 rgb(255 255 255 / .95) !important;
  -webkit-backdrop-filter: blur(12px) saturate(1.6);
  backdrop-filter: blur(12px) saturate(1.6);
  font-variant-numeric: tabular-nums;
  letter-spacing: .05em;
}
html:is([data-theme="dark"], [data-theme="halloween"]) .strip-count {
  background: rgb(22 19 16 / .70) !important;
  color: rgb(255 240 216 / .94) !important;
  border-color: rgb(255 239 210 / .20) !important;
  box-shadow:
    0 0 0 1px rgb(0 0 0 / .25),
    0 5px 14px rgb(0 0 0 / .48),
    inset 0 1px 0 rgb(255 240 216 / .12) !important;
}

/* ============================================================
   ⑮ 刊头偈语「化灰」特效
   「生死去来，棚头傀儡 / 一线断时，落落磊磊」四个层次叠出"烧剩的灰"：
     ① 字底下那团还没熄的暖光（#masthead::before）—— 让灰有个来源
     ② 每个字灰化程度不一 + 明灭不定（.mh-ch 的 --o1 静态底 + mh-ember-breathe）
     ③ 字面不断有细灰剥落、上浮、游移（.mh-em + mh-ash-rise）
     ④ 字迹外蹭开的一圈极淡"尘晕"（text-shadow）

   性能取舍（关键）：全程**只动 opacity / transform**——
   这两个属性由合成器接管，不触发重排重绘，而这页到处是 backdrop-filter，
   一旦掉进重绘就会被放大成卡顿。所以：
     · 不用 canvas、不跑 requestAnimationFrame（省一条常驻主线程循环）
     · 粒子的"热→冷"烘死在 radial-gradient 里，靠 scale 变大时冷边占比升高来体现冷却，
       而不是动画 background-color（那会每帧重绘）
     · 每粒灰只有 2px，DOM 一次性播种完就让 CSS 自己无限循环
   #masthead 带 .hidden(display:none) 时浏览器根本不渲染这些动画，
   切到图片/剪藏等视图零开销；两个主题全靠 CSS 变量，切主题不需要 JS 参与。
   ============================================================ */
#masthead{
  /* 浅色（Garden：浅绿纸 + 深墨字）：灰要用偏深的暖褐——
     浅底上如果灰太浅，肉眼会读成"噪点"而不是"灰烬"，所以冷灰压深、alpha 抬高一档 */
  --mh-ash-hot-rgb: 206 104 34;
  --mh-ash-cold-rgb: 112 98 80;
  --mh-ash-dust: rgb(140 122 98 / .20);
}
html:is([data-theme="dark"], [data-theme="halloween"]) #masthead{
  /* 深色（手账：深褐纸 + 米白字）：灰是暖白，余烬可以亮一档 */
  --mh-ash-hot-rgb: 255 178 98;
  --mh-ash-cold-rgb: 238 226 204;
  --mh-ash-dust: rgb(255 226 180 / .12);
}

/* ① 字底下那团余温 */
#masthead::before{
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  width: min(440px, 76vw);
  height: 8.4rem;
  transform: translate(-50%, -42%);
  background: radial-gradient(ellipse at center,
    rgb(var(--mh-ash-hot-rgb) / .11),
    rgb(var(--mh-ash-hot-rgb) / 0) 72%);
  pointer-events: none;
  z-index: 0;
}
#masthead .mh-body{ position: relative; z-index: 1; }

/* ④ 尘晕：像字迹旁边蹭开的灰。很淡，只负责"毛边" */
#masthead .mh-poem p{
  text-shadow:
    0 0 2px   var(--mh-ash-dust),
    0 0 7px   var(--mh-ash-dust),
    0 -1px 14px var(--mh-ash-dust);
}

/* ② 单字：既是粒子的定位上下文，也承载自己的灰化程度与明灭相位 */
.mh-ch{
  position: relative;
  display: inline-block;
  opacity: var(--o1, 1);   /* 静态底（reduced-motion 下就是最终色），也是动画的基准 */
}

/* ③ 一粒灰：热→冷烘死在渐变里，整个生命周期只需 transform / opacity */
.mh-em{
  position: absolute;
  left: var(--x, 50%);
  top: var(--y, 50%);
  width: var(--s, 2px);
  height: var(--s, 2px);
  border-radius: 50%;
  background: radial-gradient(circle,
    rgb(var(--mh-ash-hot-rgb) / .95) 0%,
    rgb(var(--mh-ash-cold-rgb) / .48) 46%,
    rgb(var(--mh-ash-cold-rgb) / 0) 100%);
  opacity: 0;
  pointer-events: none;
  animation: mh-ash-rise var(--dur, 7s) linear var(--delay, 0s) infinite;
}

/* 出生 → 亮一下 → 一路变淡、变大、飘走 */
@keyframes mh-ash-rise{
  0%   { transform: translate(-50%, -50%) scale(.5); opacity: 0; }
  13%  { opacity: var(--peak, .6); }
  58%  { opacity: calc(var(--peak, .6) * .78); }
  100% { transform: translate(calc(-50% + var(--dx, 6px)), calc(-50% + var(--dy, -36px))) scale(1.12); opacity: 0; }
}

/* 余烬明灭：幅度刻意压小（只在 20% 以内），像暗下去又亮一下，不是闪 */
@keyframes mh-ember-breathe{
  0%, 100% { opacity: var(--o1, 1); }
  37%      { opacity: calc(var(--o1, 1) * .80); }
  63%      { opacity: calc(var(--o1, 1) * .93); }
}

@media (prefers-reduced-motion: no-preference){
  .mh-ch{ animation: mh-ember-breathe var(--br-dur, 6.5s) ease-in-out var(--br-delay, 0s) infinite; }
}
/* 系统开了"减少动态效果"：一粒灰都不撒，只留安静的字 + 极淡尘晕 */
@media (prefers-reduced-motion: reduce){
  #masthead::before{ display: none; }
  .mh-em{ display: none; }
}

/* ============================================================
   ⑫ 移动端「单层纸面」修正（2026-09-15）
   ------------------------------------------------------------
   现象：小屏浅色下，首页正常，但切到「想看 / 看过」等菜单后，白色顶栏下方
        会连出一大片近白色区域（筛选工具条），整页像好几层纸叠在一起；
        海报磁贴也透着底，能看到"卡片下面还有背景"。
   成因：小屏同时叠了 4 层底色，而且冷暖深浅各不相同——
        ① body 的薄荷渐变（Garden 主题，2026-09-14 那版留下的）
        ② #appDrawer 的玻璃白纱 rgb(255 255 255/.34) + 白描边 + 内高光
        ③ #mainScroll>.max-w-5xl 的米色纸（手账主题遗留，第 5682 段）
        ④ 内容里的近白玻璃（筛选工具条 42% 白、海报磁贴 48% 白）
       关键：#topNav 是 base-100/90 ≈ #f5f4ec，而 ④ 的 42% 白压在米色纸上
        ≈ #f9f5ec，两者几乎同色 → 顶栏和工具条连成一整块白，米色纸反而
        "退"到下面才露出来，于是首页没问题、其他菜单就分层。
   修法：小屏只留一层底色（纸色），卡片一律换成不透明白卡（与首页说说卡同款）。
   ============================================================ */
@media (max-width: 1023px) {
  /* ① 全屏时不需要"桌面上的玻璃面板"这层白纱，去掉白纱/白描边/内高光/外投影 */
  html:not([data-theme="dark"]):not([data-theme="halloween"]) #appDrawer,
  html:is([data-theme="dark"], [data-theme="halloween"]) #appDrawer {
    background: transparent !important;
    border-color: transparent !important;
    box-shadow: none !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }

  /* ② 底色只由 body 一处提供：整页就是一张纸，和首页内容列完全同色 */
  html:not([data-theme="dark"]):not([data-theme="halloween"]) body,
  html:is([data-theme="dark"], [data-theme="halloween"]) body {
    background: var(--journal-paper) !important;
  }

  /* ③ 光斑在小屏没有舞台（上面那层纸是不透明的），关掉更省电，也少一层 */
  #bgOrbs { display: none !important; }

  /* ④ 筛选工具条：换成首页说说卡那种"实心白卡"，不再半透地跟顶栏糊成一片 */
  html:not([data-theme="dark"]):not([data-theme="halloween"]) #content>div:has(.mf-type)>.flex.flex-col.gap-2\.5 {
    background: linear-gradient(rgb(255 255 255/.78), rgb(255 255 255/.70)) !important;
    border: 1px solid rgb(255 255 255/.80) !important;
    box-shadow: 0 10px 26px rgb(24 78 62/.10), inset 0 1px 0 rgb(255 255 255/.86) !important;
  }
  html:is([data-theme="dark"], [data-theme="halloween"]) #content>div:has(.mf-type)>.flex.flex-col.gap-2\.5 {
    background: linear-gradient(rgb(47 44 38/.90), rgb(38 36 31/.84)) !important;
    border: 1px solid rgb(255 239 210/.10) !important;
    box-shadow: 0 10px 26px rgb(0 0 0/.22), inset 0 1px 0 rgb(255 240 216/.05) !important;
  }

  /* ⑤ 热搜 / 书签的吸顶工具条：换成纸色（仍不透明，吸顶时照样盖住滚动内容） */
  #content > div > div.sticky {
    background: var(--journal-paper) !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }

  /* ⑥ 海报磁贴同样换成实心白卡，和说说卡共用一套材质 */
  html:not([data-theme="dark"]):not([data-theme="halloween"]) #content>div .grid.grid-cols-2.sm\:grid-cols-3.lg\:grid-cols-4>* {
    background: linear-gradient(rgb(255 255 255/.78), rgb(255 255 255/.70)) !important;
    border-color: rgb(255 255 255/.80) !important;
    box-shadow: 0 6px 16px rgb(24 78 62/.10), inset 0 1px 0 rgb(255 255 255/.86) !important;
  }
  html:is([data-theme="dark"], [data-theme="halloween"]) #content>div .grid.grid-cols-2.sm\:grid-cols-3.lg\:grid-cols-4>* {
    background: linear-gradient(rgb(47 44 38/.90), rgb(38 36 31/.84)) !important;
    border-color: rgb(255 239 210/.10) !important;
  }
}

/* ============================================================
   ⑬ 小屏菜单抽屉：从"贴边扁平长条"改成"浮起来的圆角玻璃卡"
   对齐 PC 上标签抽屉（.tag-drawer，见第 5852 段）的那套规格：
   四周留 10px、圆角 16px（--glass-radius-xl）、
   玻璃底 + 1px 白描边 + 大投影 + 单侧滑入，遮罩用同一层灰。
   注意：背景/描边必须用和 Apple Glass 段（5815）**同样的选择器形状**才能压过它，
   因为两边都带 !important，这时候靠的是 specificity 而不是源码顺序。
   ============================================================ */
@media (max-width: 1023px) {
  /* ① 关闭态要多推出去 24px：面板左边留了 10px 边距，
        只推 -100% 的话圆角还会露出细细一条 */
  #appDrawer > .drawer-toggle ~ .drawer-side > #appSidebar {
    translate: calc(-100% - 24px) 0 !important;
  }
  #appDrawer > .drawer-toggle:checked ~ .drawer-side > #appSidebar {
    translate: 0 0 !important;
  }

  /* ② 面板几何：四周留边 + 圆角 + 裁剪。
        高度写死成「视口高 - 上下各 10px」而不是靠 stretch——
        daisyUI 的 .drawer-side 是 grid 容器，grid item 给 height:100% 会连
        margin 一起算进去而溢出（被 .drawer-side 的 overflow:hidden 裁掉底边）。 */
  #appSidebar {
    width: min(304px, 84vw) !important;
    height: calc(100dvh - 20px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) !important;
    margin: calc(10px + env(safe-area-inset-top, 0px)) 0 calc(10px + env(safe-area-inset-bottom, 0px)) 10px !important;
    padding: 10px 12px 14px !important;
    border-radius: var(--glass-radius-xl) !important;
    overflow: hidden auto !important;
    transition: translate .38s cubic-bezier(.22, 1, .36, 1) !important;
  }

  /* ③ 浅色：Garden 白绿玻璃，和标签抽屉逐字一致 */
  html:not([data-theme="dark"]):not([data-theme="halloween"]) #appSidebar {
    background: linear-gradient(155deg, rgb(255 255 255/.80), rgb(229 247 239/.64)) !important;
    border: 1px solid rgb(255 255 255/.72) !important;
    box-shadow: 0 24px 60px rgb(24 78 62/.22), inset 0 1px 0 rgb(255 255 255/.80) !important;
    -webkit-backdrop-filter: var(--glass-blur-strong);
    backdrop-filter: var(--glass-blur-strong);
  }
  /* ④ 深色：暖炭玻璃，同样对齐标签抽屉 */
  html:is([data-theme="dark"], [data-theme="halloween"]) #appSidebar {
    background: linear-gradient(155deg, rgb(47 43 37/.92), rgb(29 27 23/.88)) !important;
    border: 1px solid rgb(255 239 210/.10) !important;
    box-shadow: 0 24px 60px rgb(0 0 0/.55), inset 0 1px 0 rgb(255 240 216/.05) !important;
    -webkit-backdrop-filter: var(--glass-blur-strong);
    backdrop-filter: var(--glass-blur-strong);
  }

  /* ⑤ 遮罩换成标签抽屉那层灰（原来是 daisyUI 默认的半透 base-100，偏白） */
  #appDrawer > .drawer-toggle ~ .drawer-side > .drawer-overlay {
    background: rgba(35, 27, 19, .24) !important;
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }
}

/* ============================================================
   ⑭ 图片页：张数统计与瀑布流之间补一点呼吸
   （原来那句「共 N 张图片 · 来自所有说说」是个 margin:0 的 <p>，
     紧接着就是 Masonry 容器，文字几乎贴在第一排照片上。
      18px 是为了明显大于照片之间 5+5=10px 的内间距，
     让"一句话 + 一堵墙"读起来是两段，而不是糊在一起。）
   ============================================================ */
#photoGrid {
  margin-top: 18px;
}

/* ============================================================
   ⑯ 手机端布局改版（2026-09-15）：撤掉置顶横幅 → 换到底部 Dock
   ------------------------------------------------------------
   动机：≤1023px 时顶部只有「面包按钮 + 小记」一条横幅，占掉一整条高度，
        却不携带任何信息；同时屏幕下方是完全空着的。
   改法：
     ① 整条顶栏 #topHeader 在 ≤1023px 下 display:none（桌面端照旧）。
     ② 底部换成 daisyUI 的 .dock，5 项：首页 / 音乐 / 热搜 / 时间 / 更多。
        「更多」= 打开左侧抽屉（勾选 #appNavChk），与原来的面包按钮完全同一条逻辑。
     ③ Dock 做成"悬浮磨砂玻璃卡"：四周留 10px + 16px 圆角 + 强模糊，
        与标签抽屉 / 歌单抽屉 / 小屏菜单抽屉（第 5852 段、⑬ 段）同一套规格。
     ④ 连带让位：内容底部留白、#toTop、歌词药丸、#mediaPager 全部抬高 --dock-space，
        否则会被 Dock 压住；顶部再补回刘海/状态栏安全距离
        （原来由 #topNav 的 padding-top 负责，顶栏撤了就得自己补）。
   ------------------------------------------------------------
   注：本补丁层的编号此前重复过一次（6120 段与 6285 段各有一套 ⑫⑬⑭），
      这里取 ⑯ 保证唯一。
   ============================================================ */

/* 桌面端（≥1024px）不存在 Dock。放在全局是为了压掉 daisyUI .dock 的 display:flex */
#mobileDock { display: none; }

@media (max-width: 1023px) {
  :root {
    --dock-gap: 10px;      /* 悬浮卡四周留边，与三个抽屉一致 */
    --dock-h: 58px;        /* Dock 本体高度 */
    /* Dock 从视口底部往上占掉的总高度：本体 + 上下留边 + Home 指示条 */
    --dock-space: calc(var(--dock-h) + var(--dock-gap) * 2 + env(safe-area-inset-bottom, 0px));
  }

  /* ① 顶栏整条撤掉，把这条高度让给内容 */
  #topHeader { display: none !important; }

  /* ② 内容顶端补回刘海 / 状态栏的安全距离；
        内容里的吸顶工具条（热搜 / 书签）的 top 也要跟着让位，否则会钻到状态栏下面 */
  #content { padding-top: calc(.75rem + env(safe-area-inset-top, 0px)); }
  #content > div > div.sticky { top: env(safe-area-inset-top, 0px); }

  /* ③ Dock 本体：悬浮磨砂玻璃卡 */
  #mobileDock {
    display: flex !important;
    position: fixed !important;
    left: var(--dock-gap) !important;
    right: var(--dock-gap) !important;
    bottom: calc(var(--dock-gap) + env(safe-area-inset-bottom, 0px)) !important;
    width: auto !important;
    height: var(--dock-h) !important;
    padding: 6px 4px !important;
    border: 1px solid transparent !important;   /* 描边颜色交给下面两套主题 */
    border-radius: var(--glass-radius-xl) !important;
    z-index: 55 !important;                     /* 低于抽屉（60/70/80），高于内容与翻页条 */
    overflow: hidden;
    -webkit-backdrop-filter: var(--glass-blur-strong) !important;
    backdrop-filter: var(--glass-blur-strong) !important;
  }
  html:not([data-theme="dark"]):not([data-theme="halloween"]) #mobileDock {
    background: linear-gradient(155deg, rgb(255 255 255/.84), rgb(229 247 239/.70)) !important;
    border-color: rgb(255 255 255/.88) !important;
    box-shadow: 0 16px 40px rgb(24 78 62/.22), inset 0 1px 0 rgb(255 255 255/.90) !important;
  }
  /* 深色：比抽屉那套稍实一点。抽屉背后永远是一层满屏遮罩，Dock 背后却是
     随时在滚的内容，所以底色要更沉、描边要更亮，才能"浮"在手账纸面上
     （#25231f）而不是糊成一片。 */
  html:is([data-theme="dark"], [data-theme="halloween"]) #mobileDock {
    background: linear-gradient(155deg, rgb(46 42 35/.95), rgb(24 22 19/.95)) !important;
    border-color: rgb(255 239 210/.15) !important;
    box-shadow: 0 18px 46px rgb(0 0 0/.60), 0 0 0 1px rgb(0 0 0/.30), inset 0 1px 0 rgb(255 240 216/.07) !important;
  }

  /* ④ Dock 里的每一项 */
  #mobileDock > button {
    margin-bottom: 0 !important;   /* daisyUI 默认给子项留了 .5rem 下边距 */
    height: 100% !important;
    gap: 2px !important;
    border-radius: 12px !important;
    background: transparent !important;
    color: var(--journal-muted);
    -webkit-tap-highlight-color: transparent;
    transition: background-color .18s ease, color .18s ease, opacity .18s ease;
  }
  #mobileDock > button:active { opacity: .62; }
  #mobileDock .dock-icon { font-size: 1.28rem; line-height: 1; }
  #mobileDock .dock-label { font-size: .68rem; letter-spacing: .02em; }

  /* ⑤ 选中态：柔色药丸底（比 daisyUI 默认那根小横杠更贴这套纸感 UI）。
        选择器比 ④ 多一个 .active / .dock-more-on——两边都带 !important 时靠 specificity 决胜。 */
  #mobileDock > .tab-btn.active,
  #mobileDock > .dock-more-on {
    background: color-mix(in oklch, var(--color-primary) 16%, transparent) !important;
    color: var(--color-primary) !important;
  }
  /* daisyUI 给每个 dock 子项都挂了 ::after（一条透明小横杠），选中时会显形。
     这套 UI 用上面的药丸就够了，横杠统一关掉 */
  #mobileDock > button::after { display: none !important; }

  /* ⑥ 音乐项右上角的"正在播放"小点（侧栏那个是单 id 的 #musicDot，这里另起一个） */
  #mobileDock .dock-dot {
    position: absolute;
    top: 3px;
    left: 50%;
    width: 6px;
    height: 6px;
    margin-left: 6px;
    border-radius: 999px;
    background: var(--color-primary);
    box-shadow: 0 0 0 2px color-mix(in oklch, var(--color-primary) 26%, transparent);
  }

  /* ⑦ 让位：所有吸底 / 悬浮元素都要抬到 Dock 上方 */
  #mainScroll { padding-bottom: calc(var(--dock-space) + 10px) !important; }
  #toTop { bottom: calc(var(--dock-space) + 8px) !important; }
  #headerLyricsBar:not(.hidden) { bottom: calc(var(--dock-space) + 6px) !important; }
  /* 翻页条本身就是"吸底托盘"（自带一层纸色渐变）：
     直接把 Dock 的高度算进它自己的下内边距，按钮就自然落在 Dock 上方，
     中间那段渐变也不会漏出滚动内容 */
  #mediaPager {
    bottom: 0 !important;
    padding-bottom: calc(var(--dock-space) + 6px) !important;
  }
}

/* ============================================================
   ⑰ 手机端 Dock「上滑收起 / 下滑弹出」（2026-09-15）
   ------------------------------------------------------------
   行为：内容往下滚（手指上滑）→ Dock 滑出屏幕外收走；
        往回滚（手指下滑）→ 立刻滑回来。
        三个例外永远保持显示：距顶部 90px 内、距页面底部 96px 内、
        以及页面根本不可滚动时（判据见脚本里的 SHOW_ZONE / BOTTOM_ZONE）。
   ------------------------------------------------------------
   实现：只挂一个状态类 `body.dock-asleep`，由脚本按滚动方向开关。
   为什么 #toTop / 歌词药丸要一起收：
        它们都靠 --dock-space 悬在 Dock 正上方（第 ⑯ 段 ⑦），
        Dock 走了它们还杵在半空会很奇怪，所以整排"底部家具"一起下移，
        落回它们本来该在的位置（1.25rem / 18px）。
   #mediaPager 例外，不动：
        它是吸底托盘，让位靠的是自己的 padding-bottom，
        改 padding 就等于改元素高度 → 会引起内容跳动；
        而它只在页面底部出现，那个时候 Dock 按上面的规则本来就是显示的。
   ============================================================ */
@media (max-width: 1023px) {
  #mobileDock {
    transition: translate .34s cubic-bezier(.22, 1, .36, 1), opacity .26s ease;
    will-change: translate;
  }
  body.dock-asleep #mobileDock {
    /* 100% 是 Dock 自己的高 58px；加上它离底的 10px + Home 指示条 + 8px 余量，
       正好整条落到视口外 */
    translate: 0 calc(100% + var(--dock-gap) + env(safe-area-inset-bottom, 0px) + 8px);
    opacity: 0;
    pointer-events: none;   /* 别让"收走途中"的误触点了音乐/更多 */
  }

  /* 回到顶部：跟 Dock 同进同出（两个 !important 之间，靠 body.dock-asleep 这档 specificity 取胜） */
  #toTop {
    transition: bottom .34s cubic-bezier(.22, 1, .36, 1), opacity .3s ease,
                color .2s ease, transform .2s ease !important;
  }
  body.dock-asleep #toTop {
    bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)) !important;
  }

  /* 歌词药丸：同理 */
  #headerLyricsBar:not(.hidden) {
    transition: bottom .34s cubic-bezier(.22, 1, .36, 1);
  }
  body.dock-asleep #headerLyricsBar:not(.hidden) {
    bottom: calc(18px + env(safe-area-inset-bottom, 0px)) !important;
  }
}

/* 尊重系统的"减少动态效果"：不做位移过渡，直接切 */
@media (prefers-reduced-motion: reduce) {
  #mobileDock,
  #toTop,
  #headerLyricsBar:not(.hidden) { transition: none !important; }
}

/* ============================================================
   ⑱ 修：小屏页面底部露出一条「木桌」色带（2026-09-15）
   ------------------------------------------------------------
   现象：手机端滚到页面最底部，最后 88px 是一块偏棕/偏灰的色带，
        跟纸色明显不是一家。
   成因：第 ⑫ 段当时说"小屏只允许一层底色"，但只改了 body，漏了 html：
     ① html 背着桌面那张木桌渐变（第 5309 行 `html, body {background:
        linear-gradient(...)}`）；
     ② html 自己有背景时，它会被提升成 canvas 背景，body 的背景
        就**只画自己那个盒子**了——而 body 是 `height:100dvh`，
        只够盖住文档的第一屏；
     ③ 小屏真正的"纸"其实是 .max-w-5xl（第 5722 行），
        凡是在它**外面**的东西都没有底：
            · #mainScroll 的 padding-bottom（第 ⑯ 段为 Dock 让位的 88px）
            · #appDrawer / #appShell / .drawer-content 全是透明的
        → 一路漏到 canvas，也就是那张木桌。
   实测（Playwright 390×844，拉到真正的底部）：最后 89px = #b19f86（木色），
        往上才是 #e9e6d7（纸色）；层级栈最后一环正是 html(+IMG)。
   修法：小屏把 html 也刷成纸色，让"只留一层底色"真正闭环。
        比"再给某几个容器补背景"稳——以后无论谁在 .max-w-5xl 外面留白，
        露出来的都是纸，不是木头。
        桌面端不动：那张木桌是"桌上一本手账"的底，要留着。
   ============================================================ */
@media (max-width: 1023px) {
  /* 浅色：:root 里的 --journal-paper 就是纸色，直接用 */

    background: var(--journal-paper, #f4eedf) !important;
  }
  /* 深色：--journal-paper 被重定义在 body 上（见上面深色段），html 这边取不到，
     所以写死同一个值。改深色纸色时两处要一起改。 */
  html:is([data-theme="dark"], [data-theme="halloween"]) {
    background: #25231f !important;
  }
}

/* ③ 平铺参数。原生 56×28 在大屏上偏细密，放大 1.5 倍。
      ⚠️ 必须写成和 ①② 同一个选择器形状：§⑱ 那条 `html:not():not(){background: …}`
         是 shorthand + !important（specificity 0,2,1），会把**窄选择器**里的
         `background-size` 一起重置回 `auto` —— v1 就栽在这，手机端平铺参数静默失效。
      不带 attachment：根元素的背景本来就铺满 canvas 且不随滚动移动，天然是壁纸。 */
html:not([data-theme="dark"]):not([data-theme="halloween"]),
html:is([data-theme="dark"], [data-theme="halloween"]) {
  background-repeat: repeat !important;
  background-size: 84px 42px !important;
  background-position: 0 0 !important;
}

/* ④ 中间层透明：壁纸一路透到底，不再有任何中间底色。
      **故意不含 #appDrawer** —— 那块浮动面板在桌面要留着（见 ⑤）。
      小屏要的"面板全透明"交给 §⑫ 段（那边选择器更强：0,2,1，且带 !important）。
      ⚠️ body 这两条也必须带 `html:not():not()` / `html:is()` 前缀：
         §⑫ 的 `html:not():not() body{background: var(--journal-paper)}`（0,2,2）
         和 Apple Glass 段 body 那条薄荷渐变（0,2,2）都比我写成裸 `body{}` 强，
         否则手机端第一屏会是一块米色纸盖在壁纸上（v2 第一版就漏了这个）。 */
html:not([data-theme="dark"]):not([data-theme="halloween"]) body,
html:is([data-theme="dark"], [data-theme="halloween"]) body,

#mainScroll,
#mainScroll > .max-w-5xl {

/* ⑤ 桌面：恢复「桌上一本手账」那块浮动圆角面板——现在它是"浮在云上的一张纸"。
      圆角 + 投影就是"圆润"的来源：没有一层看得见的面板底，
      侧栏（250px 直角竖条）就只是块直板，整个版面立刻显平。
      ⚠️ 只写在 min-width:1024px 里：小屏必须保持全透明（§⑫ 段），

  }
  html:is([data-theme="dark"], [data-theme="halloween"]) #appDrawer {

    box-shadow: 0 26px 72px rgb(0 0 0/.42), inset 0 1px 0 rgb(255 240 216/.04) !important;
  }
}

      用户原话：「说说卡片有这种横线啊，去掉吧。没必要模拟那种笔记本的横线，没意思」。
      横向 32px 淡格线在这个文件里有三处生效点：
        · 5586 段  手账底座 .memo-card 的格线（早就被 5849 段的 Apple Glass 覆盖，不用管）
        · 5849 段  浅色 rgb(18 166 122/.038) —— 被上面 ⑧ 那层白渐变盖住了
        · 5849 段  深色 rgb(220 207 184/.035) —— **还有效**，所以要单独压一条（下面这条）
      压完以后卡片背景只剩一层白 / 暗底渐变，没有任何纹理，也就没有"横线"了。
      选择器形状照抄 5849 段（那边全是 !important，同 specificity 时靠源码顺序取胜）。

html:is([data-theme="dark"], [data-theme="halloween"]) #content ul.memo-list .memo-card {

/* ⑪ 世界时间：相邻两块面板之间挨着的「两条线」合成一条（2026-09-15）
      用户原话：「世界时间这里，转换时间下面 2 条线，我觉得有一条线就可以了」。
      成因：5870 段最后那条
        `#content .wc-root .rounded-2xl:not(:first-child){border-color:…;
         border-left:0;border-right:0;border-radius:0}`
      只去了**左右**两条边和圆角，上下两条都留着；而每块面板本来就带
      `border border-base-300/70`。于是相邻两块 = 「上一块的下边」+「下一块的上边」
      = 两条线，中间还夹着 `.wc-root` 的 `gap-4`(16px)，看着就是上下两条细线。
      修法：用**相邻兄弟选择器**，只打「紧跟在另一块 .rounded-2xl 后面」的那块，
            去掉它的**上边**。这样：
              · 世界城市时间 → 时间转换   不受影响（前者是普通 div，本来就只有一条）
              · 时间转换 → 我的播放提醒   只剩「时间转换的下边」这一条  ✅
      选择器形状对齐 5870 段（那边全是 !important，同 specificity 靠源码顺序取胜）。 */
#content .wc-root .rounded-2xl + .rounded-2xl {
  border-top: 0 !important;
}

/* ⑳ 桌面端：右侧内容区补上「跟左侧菜单同一套」的磨砂玻璃（2026-09-15）
      文哥原话：「把右侧这个区域也加上左侧一样的玻璃效果，现在的我感觉太透了」
      现状：桌面 #appDrawer 只铺了一层 rgb(255 255 255/.62) 的白纱（⑲ 段 ⑤），
            面板内部其他层全是 transparent（⑲ 段 ④）→ 云纹是"清晰但很淡"地透出来，
            没有模糊也没有冷调，读起来就是"太透"。
            左侧 #appSidebar 之所以显得更实，是因为它在同一层白纱之上**又多叠了一层**
            Apple Glass 的玻璃：`linear-gradient(155deg,…)` + `backdrop-filter`
            （第 5846 行，`--glass-blur-strong` = blur(34px) saturate(155%)）。
      改法：给右侧那一列 `#appDrawer > .drawer-content` 铺**逐字相同**的一套值。
            实测范围 [x 279, w 1132, h 842] = 正好是 250px 侧栏之后的整列、铺满面板高度，
            跟 #appSidebar 是同级的两个 grid 列，所以叠出来的层次完全对称：
              左 = 白纱@.62 + 侧栏玻璃   /   右 = 白纱@.62 + 本段这层玻璃
            合起来通透度落到 ~.82，就是一块正经毛玻璃，不再是"淡云纸"。
      ⚠️ 只写在 `min-width:1024px` 里：小屏 #appDrawer 是 `overflow:visible` 的整页流
         （第 ⑨ 段），没有面板可言，不该挂面板玻璃；小屏观感由 ⑫ / ⑯ 段各自管。
      ⚠️ **不碰 #appSidebar 本身**——⑲ 段 v1 就是因为顺手改了左侧把版面搞"扁"，
         用户明确要求过"左边菜单恢复圆润"。这次只加右侧，左侧一个字不动。
      ⚠️ 圆角不用自己管：#appDrawer 有 `overflow:hidden` + `radius 16px`（第 5845 行），
         会把这一层的四角裁好。
      ⚠️ 不给本层加 border：`.drawer-content` 左边界 x=279 与 #appSidebar 右边界是同一条线，
         侧栏那边已经有 `border-right + inset 高光` 当了分隔，再加 `border-left` 会变成 2px。
      想调通透度：改下面两个渐变的**端点 alpha**（.70/.53 与 .78/.67），数越大越实。
      想退回"太透"的原样：删掉本段整块即可。 */

/* ㉑ 去掉云朵壁纸：浅色纯白 / 深色用 iOS 系统深灰（2026-09-15）
      文哥原话：「去掉这个云朵壁纸，直接浅色就是纯白色，暗色就是纯灰色还是黑色来着，
                 你觉得呢？苹果系统一般的暗黑模式是啥颜色你就用那种颜色吧」
      真正的动机（原话）：手机上「iOS 自带的浏览器都无法好好跟手机屏幕结合起来」。
      ------------------------------------------------------------
      配色取值（Apple HIG · Dark Mode 的系统色）：
        · systemBackground          = #000000   ← 纯黑，OLED 上最"黑"
        · secondarySystemBackground = #1C1C1E   ← 取这个
        · tertiarySystemBackground  = #2C2C2E
      iOS 深色界面的"灰底"（设置里的分组行、Safari 自己的深色工具栏）用的就是 #1C1C1E。
      页面要跟手机自己的 UI **融成一体**，用这个比纯黑更贴（纯黑反而会跟工具栏差一档）。
      → 想换纯黑：只改下面 dark 那条的 `#1c1c1e` 为 `#000000`，一处。
      ------------------------------------------------------------
      ⚠️ 选择器形状必须和 ⑲ 段 ①② **一模一样**：那边是
         `html:not([data-theme="dark"]):not([data-theme="halloween"])`（0,2,1）
         配 `background-color` + `background-image` 两条 !important，
         同形状 + 源码顺序靠后才是本段赢（光靠 !important 不够）。
      ⚠️ 只把 background-image 压掉，**不动 ⑲ 段那两条 data URI 本身**。
         想恢复云朵壁纸：删掉本段整块就回去了（那两条还在，不会丢）。
      ------------------------------------------------------------
      同一件事另外还改了两处（都是老配色遗留，一并纠正）：
        · <head> 的 theme-color：浅色原本是 **#1a1a2e 深藏青** —— 页面是白的、
          Safari 顶栏却被染成深蓝，这才是"跟手机屏幕结合不起来"的真凶。
        · site.webmanifest 的 theme_color / background_color：原本 **#0a0e18**。
      ------------------------------------------------------------
      旁注（没有改，仅记录）：壁纸一去，⑳ 段那层玻璃的 `backdrop-filter` 就没东西可模糊了，
      但它的**渐变**仍然有效 —— 桌面面板会从纯白渐到极淡的薄荷（rgb(241,251,247)），
      配合面板投影，依旧读得出"浮在桌面的一张纸"。手机端的磨砂（Dock / 抽屉 / 吸顶条）
      同理：模糊失效，白色不透明度照旧。视觉上没有副作用。 */
html:not([data-theme="dark"]):not([data-theme="halloween"]),
html:is([data-theme="dark"], [data-theme="halloween"]) {
  background-image: none !important;
  background-repeat: no-repeat !important;
}
html:not([data-theme="dark"]):not([data-theme="halloween"]) {
  background-color: #ffffff !important;
}
html:is([data-theme="dark"], [data-theme="halloween"]) {
  background-color: #1c1c1e !important;
}

/* ㉒ 手机端撤掉底部 Dock，改成「左边缘往右滑」唤出左侧菜单抽屉（2026-09-15）
      文哥原话：「上面确实跟浏览器完美融合了，下方还是无法做到，我想可能是我们网页上有
                 dock 的缘故…去掉 dock 改成在网页上往右边侧滑，出现抽屉吧。」
      ------------------------------------------------------------
      为什么 Dock 会挡住融合：Dock 是 position:fixed 的磨砂玻璃卡，悬在视口底部，
      iOS Safari 自己的底栏又紧贴在它下面 —— 两层 chrome 叠着，中间必然出现一道缝。
      撤掉之后，页面自己的白底一路铺到最底，跟 Safari 的底栏就成了一片。
      ------------------------------------------------------------
      ① **藏** Dock（不是删 DOM）。⑯ 段的绑定（更多按钮 / 音乐小点 / MutationObserver）
         和 ⑰ 段的上滑收起脚本都留着不碍事；想找回 Dock，删掉本段即可。
         注：Dock 那 5 项在左侧抽屉里一个都没少 ——
         首页 / 热搜 / 时间 / 标签 是菜单项，音乐在侧栏资料卡那排小图标里。
      ② 把 ⑯ 段 ④⑦ 为 Dock 让位而加的间距**还原成 Dock 出现之前的值**
         （原值就在本文件里：`#mainScroll` 796 行、`#toTop` 797 行、
          `#mediaPager` 801 行 / 5882 行、`#headerLyricsBar` 225 行）。
         不还原的话，页面底部会白白空掉 88px。
      ③ 顺手一个巧合：⑰ 段「收起态」的目标值本来就等于这些原始值
         （toTop `1.25rem`、歌词 `18px`）→ 还原之后 ⑰ 段自动退化成无害的空操作，
         **不用去改它**。
      ⚠️ 覆盖 ⑯ 段 ⑦ 那几条，选择器形状必须跟它一样（都是 id 级 + !important），
         靠"源码顺序在后来"取胜。 */
#mobileDock { display: none !important; }

@media (max-width: 1023px) {
  #mainScroll { padding-bottom: env(safe-area-inset-bottom, 0px) !important; }
  #toTop { bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)) !important; }
  #headerLyricsBar:not(.hidden) {
    bottom: calc(18px + env(safe-area-inset-bottom, 0px)) !important;
  }
  #mediaPager { padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)) !important; }
}

/* ㉓ 手机端翻页控件不再「吸底」，跟着列表末尾走（2026-09-15）
      文哥原话：「首页下拉底部 URL 会变小，很原生；但看过/想看的页面下拉 URL 不缩小，
                 底部还一片白，除非拉到最底部才缩小。是翻页控件的原因还是筛选卡片？」
      ------------------------------------------------------------
      **答案：是翻页控件。筛选卡片完全无辜。**
      实测（500px 探针，滚到 55% 位置）：
        · 筛选卡片 `#content > div > .flex.flex-col` → `position: static`，
          rect.top 已到 -1188px，**它是普通文档流，跟着内容一起滚走了**，
          根本不可能影响浏览器 chrome。
        · `#mediaPager` → `position: sticky; bottom: 0; z-index: 30`，
          rect 的 bottom **正好等于视口高度**（805 / vh=805），高度 71px，
          而且是**整宽、紧贴底边**的一条带。
        · 对照首页（说说）：底部 150px 内 elementFromPoint 全是 `img`，
          **没有任何元素被钉在底边**。
        · 两页的 scrollingElement 都是 `html`、都没有内部滚动容器 → 滚动结构一致，
          不是"滚动容器不同"的问题。
      ------------------------------------------------------------
      为什么"吸血底那一条"会拦住 Safari 底栏收起：
      Apple WWDC「Design for Safari 15」原文——Safari 的底部标签栏是**随主框架滚动方向
      自动收起/展开**的，收起后只剩一行域名贴在屏幕最底。而 iOS 对"从视口最底那条带
      开始的触摸"有特殊处理（认为是想去够浏览器自己的工具栏 → 把工具栏重新展开）。
      ⑯ 段给翻页控件写的是「吸底常显」（801 行 `position: sticky; bottom: 0`），
      等于**我们用自己的一条带，常年占着 Safari 底栏要落的那块地方**。
      ------------------------------------------------------------
      修法：手机端把 `position` 从 `sticky` 改回 `static` → 它就变成列表末尾的普通一块，
      页面底边跟首页一样是"纯内容"。**这一步的全部意义就是让两页的底边结构等价**
      （首页 = 已知能融合的对照样本），所以好验证、也好回滚。
      · 只改 ≤1023px；桌面端保持吸底（那边没有浏览器 chrome 要避让）。
      · 顺手补一点下边距，不用再替 Dock 留位（㉒ 段已经把 ⑯ 段那 88px 还原了）。
      ⚠️ 覆盖 801 行那条：id 级 + !important + 源码在后，稳赢。
      ⚠️ 翻页后的体验没有损失：`renderMediaPage()` 里本来就 `scrollToTop()`，
        点了页码会自动回到顶部，不需要抬手就能再翻。 */
@media (max-width: 1023px) {
  #mediaPager {
    position: static !important;
    bottom: auto !important;
    padding: 18px 0 calc(26px + env(safe-area-inset-bottom, 0px)) !important;
  }
}

/* ㉔ 小屏标签抽屉收窄，跟「左侧菜单抽屉」同宽（2026-09-15）
      文哥原话：「把点击标签出来的抽屉宽度改成首页右滑出来的菜单抽屉一样款吧。
                 这样点击不会感觉突然变大的抽屉，而且我也好方便单手点击完标签后，
                 可以自己点去页面其他部分好关闭这个抽屉。毕竟这个抽屉的标签是组合查询，
                 逻辑功能上我是不能让它点一下标签就自动关闭抽屉的。」
      ------------------------------------------------------------
      ⚠️ 关键前提：**标签抽屉不能改成"点标签就自动关"**。
      它是组合查询（类型 / 年代 / 题材可多选叠加），点一个标签只是改条件，
      抽屉必须留在原地让人接着点第二个。→ 所以唯一的解法是**把它变窄**，
      让右边露出足够宽的遮罩，单手拇指能直接点到抽屉外面去关。
      ------------------------------------------------------------
      实测差距（390×844）：
        · 左侧菜单抽屉 `#appSidebar`：`width: min(304px, 84vw)` + `left:10px`
          → 占 10+304 = 314px，右边露出 76px 遮罩（好点）
        · 标签抽屉 `.tag-drawer`：`width: min(390px, 92vw)`（1201 行）+ `left:10px`
          → 占 10+359 = 369px，右边只剩 21px 遮罩（基本点不到）
      差 55px，就是文哥说的"突然变大"。
      ------------------------------------------------------------
      ① 宽度：`.tag-drawer` 改成跟 `#appSidebar` **逐字一致** `min(304px, 84vw)`。
         ⚠️ 要覆盖两处，而且两处的压法不一样：
            · 1201 行（小屏 width）——**没有** !important，我用 !important 直接压掉；
            · 5911 行（top/bottom/left）——**有** !important，这就要靠
              "同样的 (0,1,0) 选择器形状 + 源码顺序在后"（同特异性下后写的赢）。
              别想着用 id 级去提权，`#tagBar` 那个 id 在当前 DOM 上不好接。
      ② 顺手修一个真毛病：5911 段把抽屉写死成 `top:10px; bottom:10px`，
         **没有加 `env(safe-area-inset-*)`**。而 `viewport-fit=cover` 是开着的（第 7 行），
         所以这两个 10px 是量到**屏幕物理边**的 —— 在刘海里抽屉顶边会钻到状态栏底下、
         底边会压到 Home 指示条。⑬ 段给 `#appSidebar` 就是加了 safe-area 的，
         这里补齐，两个抽屉的上下边距才真的一致。
      ------------------------------------------------------------
      ③ **不动桌面端宽度**（≥1024px 仍是 390px）。桌面用鼠标、也没有刘海挤压。
         （抽屉的**站位**在 ㉖ 段里改成右侧了；本段只管宽度和上下安全区，仍然有效。）
      ④ 也不动 `#tagBar` 的名字 —— 是 id="tagBar"，类名才是 `.tag-drawer`，
         别被这俩不一致搞混。 */
@media (max-width: 1023px) {
  .tag-drawer {
    width: min(304px, 84vw) !important;
    top: calc(10px + env(safe-area-inset-top, 0px)) !important;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important;
  }
}

/* ㉖ 标签抽屉改到**屏幕右侧**，由「右边缘往左滑」唤出（2026-09-15）
      文哥原话：「这个标签打开抽屉跟右滑出菜单的抽屉逻辑体验有点冲突，
                 把这个标签菜单直接变成在屏幕右侧左滑出标签抽屉，
                 直接把这个标签菜单抽离出来就会好很多。」
      ------------------------------------------------------------
      病根：左右两个抽屉都从**左边**出来、都靠左边缘那一带触发、关闭手势还都在左边
      （菜单"往左滑关"），一重叠起来人根本分不清现在滑的是哪一个。
      上上版为了绕开这个还搞了一套"记住上次在标签抽屉"的逻辑，
      等于在冲突之上又加了一层状态 —— 现在整块删掉，两边各管各的边。
      ------------------------------------------------------------
      改法：把 `.tag-drawer` 的锚点从 left 换成 right，滑出方向取反。
      这几条要覆盖 5911 行那套（必须同 (0,1,0) 形状 + !important + 源码在后）：
        5911 → `.tag-drawer{top:10px;bottom:10px;left:10px;
                              transform:translateX(calc(-100% - 28px))}`
        这里 → right:10px / left:auto / translateX(calc(100% + 28px))
      `.tag-drawer.open{transform:translateX(0)}` 在 5912 行，值一样，不用重写。
      ------------------------------------------------------------
      现在三对"左右对称"，一眼能记住：
        · 左菜单：左边缘**往右滑**开，开着时往左滑关
        · 标签本：右边缘**往左滑**开，开着时往右滑关
        · 关不掉的兜底：点抽屉外面那片遮罩（标签本现在剩左边 76px 可点，见 ㉔ 段）
      ------------------------------------------------------------
      ⚠️ 宽度（304px）和上下 safe-area 仍由 ㉔ 段负责，本段只管"站哪边、往哪滑"。
      ⚠️ 歌单抽屉本来就在右边（`right:10px` / `translateX(calc(100% + 28px))`）——
         `initTagDrawer` 里开标签抽屉时会先调 `window.closeMusicDrawer()`，两者不叠加。
      ⚠️ 桌面端（≥1024px）**也一起改成右侧**了：左菜单在桌面是常驻侧栏，
         标签抽屉原来会盖在它上面；挪到右边就不打架了。 */
.tag-drawer {
  right: 10px !important;
  left: auto !important;
  transform: translateX(calc(100% + 28px)) !important;
}

/* ㉗ 小屏：`body` / `#appShell` 的 `min-height` 从 `100vh` 换成 `100dvh`
      （2026-09-15，修文哥报的「标签筛选后下滑，URL 缩起来了却泡在一段白色区块里」）
      ------------------------------------------------------------
      病根：`min-h-screen` 是 `min-height: 100vh`，而 iOS Safari 的 `100vh`
           取的是**最大视口 = lvh**（工具栏收起时的高度），不是当前可视高度。
            工具栏展开时可视高度只有 `svh` ≈ `lvh - 60~90px`
            → **不管内容多长，页面永远比可视区高 60~90px**。
      于是：筛选后列表变短（多选标签 AND 甚至为空），屏幕底下本来就是一片
            **没有任何内容的纯白**；你手指一划，滚的根本不是内容、而是这段"空气"，
            iOS 照样判定"页面在滚"→ 收起工具栏 → 收起后可视视口变高、可滚距离
            归零、位置弹回顶端，而工具栏那一带底下正好是那段空白
            → 就是你看到的「URL 缩小了，却泡在一段白色区块里」。
            首页内容 4202px 高，滚到哪工具栏底下都是卡片，所以看不出来。
      ------------------------------------------------------------
      实测（390×844，Playwright + Chrome）：
        · 首页                    docScrollH 4202 / maxScroll 3358
        · 选中 1 个标签（7 张卡）  docScrollH 2144 / maxScroll 1300
        · 多选标签（交集为空）     docScrollH  846 / maxScroll    2 ← 底下全是白
        三种状态页面结构**完全一致**（无新增吸顶/吸底件、根滚动仍是 body、
        html 背景白、theme-color 白）→ 唯一的变量就是"内容长度"。
      ------------------------------------------------------------
      改法：只改小屏这两个 `100vh`。`100dvh` 跟着**当前可视视口**走：
        · 内容长 → `min-height` 是空操作，一切照旧；
        · 内容短 → 页面高度正好等于可视高度（不再多出那 60~90px），
                   滚不动 → iOS 不会莫名收起工具栏 → 白块消失。
      ⚠️ 这与 ⑨ 段给 `#appDrawer` 写的 `min-height: 100dvh`（6136 行）现在**对齐了**，
         当初就是漏了 body / #appShell 这两个 `100vh`。
      ⚠️ 只写在小屏 `@media (max-width:1023px)` 里：桌面端 `body` 是
         `lg:h-screen lg:overflow-hidden` + `#appDrawer` 固定高，不归这条管。
      🔙 想回滚：整块删掉即可，等于恢复 `100vh` 的老行为。
      ⚠️ 如果哪天还看到"底部一条白缝"，优先怀疑的还是任何 `vh` 单位
         （Tailwind 的 `h-screen` / `min-h-screen` / `max-h-screen` 全是 `vh`）。 */
@media (max-width: 1023px) {
  body.min-h-screen,
  #appShell.min-h-screen {
    min-height: 100dvh !important;
  }
}

<script>
// 歌词药丸（顶栏）：播放时显示当前歌词，过长则左右滚动
(function () {
  const bar = document.getElementById('headerLyricsBar');
  const textEl = document.getElementById('headerLyricsText');
  const marquee = document.getElementById('headerLyricsMarquee');
  if (!bar || !textEl || !marquee) return;
  // 窗口尺寸变化时重新计算 marquee 滚动距离
  window.addEventListener('resize', () => { if (!bar.classList.contains('hidden')) applyMarquee(); });

  const lrcCache = new Map();
  let currentTrackId = null;
  let lines = [];
  let shownText = '';

  function parseLRC(lrcText) {
    if (!lrcText) return [];
    const timeTag = /\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
    const result = [];
    for (const line of String(lrcText).split(/\r?\n/)) {
      const tags = [...line.matchAll(timeTag)];
      if (!tags.length) continue;
      const text = line.replace(timeTag, '').trim();
      if (!text) continue;
      for (const t of tags) {
        const min = parseInt(t[1], 10), sec = parseInt(t[2], 10);
        let frac = t[3] || '';
        if (frac.length === 1) frac += '00';
        else if (frac.length === 2) frac += '0';
        const ms = frac ? parseInt(frac.slice(0, 3), 10) : 0;
        result.push({ time: min * 60000 + sec * 1000 + ms, text });
      }
    }
    result.sort((a, b) => a.time - b.time);
    return result;
  }

  function extractLrc(raw) {
    const t = String(raw || '').trim();
    if (!t) return '';
    if (t.startsWith('{') || t.startsWith('[')) {
      try {
        const j = JSON.parse(t);
        if (typeof j === 'string') return j;
        if (Array.isArray(j)) {
          const first = j[0] || {};
          return first.lrc && first.lrc.lyric || first.lyric || first.lrc || '';
        }
        return (j.lrc && j.lrc.lyric) || j.lyric || (typeof j.lrc === 'string' ? j.lrc : '') || '';
      } catch (_) {}
    }
    return t;
  }

  function fetchLyrics(neteaseId) {
    if (lrcCache.has(neteaseId)) return lrcCache.get(neteaseId);
    const p = (async () => {
      try {
        const res = await fetch('https://meting.zhheo.com/?server=netease&type=lrc&id=' + encodeURIComponent(neteaseId));
        const txt = await res.text();
        return parseLRC(extractLrc(txt));
      } catch { return []; }
    })();
    lrcCache.set(neteaseId, p);
    return p;
  }

  function applyMarquee() {
    marquee.classList.remove('is-scrolling');
    marquee.style.removeProperty('--lyrics-shift');
    marquee.style.removeProperty('--lyrics-dur');
    textEl.style.transform = '';
    requestAnimationFrame(() => {
      const overflow = textEl.scrollWidth - marquee.clientWidth;
      if (overflow > 8) {
        marquee.style.setProperty('--lyrics-shift', '-' + overflow + 'px');
        marquee.style.setProperty('--lyrics-dur', Math.max(6, overflow / 28) + 's');
        marquee.classList.add('is-scrolling');
      }
    });
  }

  function renderLine(posMs, meta) {
    let text = '';
    if (lines.length) {
      let idx = -1;
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].time <= posMs) idx = i; else break;
      }
      text = idx >= 0 ? lines[idx].text : '';
    }
    if (!text) text = (meta && meta.title) || '♪ 播放中';
    if (text === shownText) return;
    shownText = text;
    textEl.textContent = text;
    bar.classList.remove('hidden');
    applyMarquee();
  }

  document.addEventListener('hwplayer:update', e => {
    const d = e.detail || {};
    const meta = d._currentMeta || d.currentMeta || null;
    if (!d.isPlaying || !meta || !meta.trackId) {
      bar.classList.add('hidden');
      currentTrackId = null;
      lines = [];
      shownText = '';
      textEl.textContent = '';
      marquee.classList.remove('is-scrolling');
      return;
    }

    const trackId = meta.trackId;
    if (trackId !== currentTrackId) {
      currentTrackId = trackId;
      lines = [];
      shownText = '';
      const neId = String(trackId).replace(/^ne-/, '');
      if (neId) {
        fetchLyrics(neId).then(ls => {
          if (currentTrackId !== trackId) return;
          lines = ls;
          renderLine(d.position, meta);
        });
      }
    }
    renderLine(d.position, meta);
  });
})();
</script>

<script>
/* 刊头偈语「化灰」：把每个字包一层 span，再往字面撒几粒灰。
   与 ⑮ 样式区配套。这里只做"一次性播种"——随机值写进内联自定义属性，
   之后动画全部交给 CSS 无限循环，不再占用主线程（不跑 rAF）。
   #masthead 初始是 .hidden，但这里不量尺寸、只按百分比定位，所以隐藏状态下播种也没问题。 */
(() => {
  const poem = document.querySelector('#masthead .mh-poem');
  if (!poem || poem.dataset.ashReady) return;

  const rnd = (a, b) => a + Math.random() * (b - a);
  const perChar = window.matchMedia('(max-width: 640px)').matches ? 3 : 5; // 手机上别烧太旺
  const PUNCT = '，。、；：！？…—「」『』（）《》,.;:!? ';  // 标点不撒灰

  const chars = [];
  poem.querySelectorAll('p').forEach((p) => {
    const text = p.textContent;
    p.textContent = '';
    for (const ch of text) {
      const s = document.createElement('span');
      s.className = 'mh-ch';
      s.textContent = ch;
      // 每个字自己的灰化程度 + 明灭节奏，避免一整块同步呼吸（那会像闪烁）
      s.style.setProperty('--o1', rnd(.78, 1).toFixed(3));
      s.style.setProperty('--br-dur', rnd(5.2, 8.8).toFixed(2) + 's');
      s.style.setProperty('--br-delay', (-rnd(0, 8.8)).toFixed(2) + 's');
      p.appendChild(s);
      chars.push(s);
    }
  });

  chars.forEach((s) => {
    if (PUNCT.includes(s.textContent)) return;
    const n = perChar + (Math.random() < .45 ? 1 : 0);
    for (let i = 0; i < n; i++) {
      const em = document.createElement('i');
      em.className = 'mh-em';
      em.setAttribute('aria-hidden', 'true');
      em.style.setProperty('--x', rnd(12, 88).toFixed(1) + '%');   // 出生点在字面之内
      em.style.setProperty('--y', rnd(8, 92).toFixed(1) + '%');
      em.style.setProperty('--s', rnd(1.5, 2.9).toFixed(2) + 'px');
      em.style.setProperty('--dx', rnd(-11, 11).toFixed(1) + 'px');
      // 大多数随热气流上浮，少数是慢慢沉落的冷灰（全往上飘会很假）
      const down = Math.random() < .25;
      em.style.setProperty('--dy', (down ? rnd(4, 18) : -rnd(24, 54)).toFixed(1) + 'px');
      em.style.setProperty('--dur', rnd(5.5, 10.5).toFixed(2) + 's');
      em.style.setProperty('--delay', (-rnd(0, 10.5)).toFixed(2) + 's'); // 负延迟 → 首屏就有灰在飘，不用等
      em.style.setProperty('--peak', rnd(.42, .76).toFixed(3));
      s.appendChild(em);
    }
  });

  poem.dataset.ashReady = '1';
})();
</script>

<script>
/* ============================================================
   手机端底部 Dock（样式见 ⑯ 段）
   1) 「更多」= 打开左侧抽屉，和原来的面包按钮走同一条路（勾选 #appNavChk）
   2) 音乐项的"正在播放"小点：侧栏那个是单 id 的 #musicDot，这里另起一个监听
   3) 「更多」的选中态：当前视图不在 Dock 的 4 个 tab 里
      （图片 / 看过 / 想看 / 标注 / 书签）时点亮，
      用 MutationObserver 盯 dock 内 tab 的 class，不侵入 switchView
   ============================================================ */
(() => {
  const dock = document.getElementById('mobileDock');
  if (!dock) return;

  const chk = document.getElementById('appNavChk');
  const navBtn = document.getElementById('navToggleBtn');
  const moreBtn = document.getElementById('dockMoreBtn');

  /* ---------- 1) 更多 = 打开左侧抽屉 ---------- */
  if (chk && moreBtn) {
    moreBtn.addEventListener('click', () => {
      chk.checked = true;
      // 程序化勾选不触发原生 change → 手动补（initTagDrawer 的"直接带出标签抽屉"靠它）
      chk.dispatchEvent(new Event('change', { bubbles: true }));
      moreBtn.setAttribute('aria-expanded', 'true');
      if (navBtn) navBtn.setAttribute('aria-expanded', 'true');
    });
    // 抽屉被遮罩 / 菜单项关掉时，把「更多」的 aria 状态同步回来
    chk.addEventListener('change', () => moreBtn.setAttribute('aria-expanded', String(chk.checked)));
  }

  /* ---------- 2) 音乐播放小点 ---------- */
  const dot = document.getElementById('dockMusicDot');
  if (dot) {
    document.addEventListener('hwplayer:update', (e) => {
      dot.classList.toggle('hidden', !(e.detail && e.detail.isPlaying));
    });
  }

  /* ---------- 3) 「更多」选中态 ---------- */
  if (moreBtn) {
    const items = [...dock.querySelectorAll('.tab-btn[data-view]')];
    const syncMore = () => {
      const anyActive = items.some((b) => b.classList.contains('active'));
      moreBtn.classList.toggle('dock-more-on', !anyActive);
    };
    syncMore();
    const mo = new MutationObserver(syncMore);
    // 只盯 dock 内这几项：moreBtn 自己的 class 不在观察范围，不会自激
    items.forEach((b) => mo.observe(b, { attributes: true, attributeFilter: ['class'] }));
  }

  /* ---------- 4) 上滑收起 / 下滑弹出（样式见 ⑰ 段） ----------
     只挂一个 body 状态类，Dock / 回到顶部 / 歌词药丸一起动。
     阈值 MIN_DELTA 是必须的：`scroll` 事件里同一方向的微小抖动会被误判成反向。 */
  const mqMobile = window.matchMedia('(max-width: 1023px)');
  const SHOW_ZONE  = 90;   // 距顶部这么近 → 永远显示
  const BOTTOM_ZONE = 96;  // 距底部这么近 → 永远显示（#mainScroll 底部留白是 88px）
  const MIN_DELTA  = 8;    // 方向判定门槛
  let lastY = getScrollPos();
  let asleep = false;

  const setAsleep = (v) => {
    if (v === asleep) return;
    asleep = v;
    document.body.classList.toggle('dock-asleep', v);
  };

  const onScroll = () => {
    if (!mqMobile.matches) { setAsleep(false); return; }   // 桌面端不存在 Dock
    const cur = getScrollPos();
    if (cur <= SHOW_ZONE) {                 // 顶部这段永远显示（也省掉一次 scrollHeight 读取）
      lastY = cur;
      setAsleep(false);
      return;
    }
    const d = cur - lastY;
    if (d > MIN_DELTA) {
      lastY = cur;
      /* 只在"往下滚"这一支去读 scrollHeight —— 它会触发一次强制布局，
         能少读就少读。到底部时强制显示：不然翻页条上方会空出一块。 */
      const max = isBodyScroll()
        ? document.documentElement.scrollHeight - window.innerHeight
        : Math.max(0, mainScroll.scrollHeight - mainScroll.clientHeight);
      setAsleep(cur < max - BOTTOM_ZONE);
    } else if (d < -MIN_DELTA) {
      lastY = cur;
      setAsleep(false);
    }
  };

  window.addEventListener('scroll', onScroll, { passive: true });
  mainScroll.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', () => {
    lastY = getScrollPos();
    if (!mqMobile.matches) setAsleep(false);
  });
  mqMobile.addEventListener('change', () => {
    lastY = getScrollPos();
    setAsleep(false);
  });
})();
</script>

<script>
/* ============================================================
   ㉒ + ㉖ 手机端两侧边缘侧滑（2026-09-15）
     · 左边缘 → 往右滑 → 唤出**左侧菜单**抽屉（daisyUI #appNavChk）
     · 右边缘 → 往左滑 → 唤出**右侧标签本**（调 window.openTagDrawer）
     · 抽屉开着时把方向反过来拖回去即可关：菜单往左滑关、标签本往右滑关
   ------------------------------------------------------------
   为什么起点限制在"屏幕最边缘 EDGE 这一条带"而不是全屏任意位置：
     正文里有横向排布的东西（图集胶片条、底部的翻页托盘），
     全屏横滑会跟它们抢手势；收窄起点，冲突面最小。
   **左右两条带互不重叠，一次触摸只会命中其中一边** —— 这正是文哥要的
     "把标签菜单抽离出来"：以前两个抽屉都在左边、都从左边缘出发，
     根本分不清滑出来的是哪一个。
   为什么要把"竖向优先"判死（VERT_KILL）：
     手指斜着划是很常见的，如果不先判竖向，轻轻一划就会莫名弹出抽屉，
     比"不响应"更烦人。竖着走就直接放手，交回给页面滚动。
   ------------------------------------------------------------
   注：iOS Safari 自己的「左边缘右滑 = 后退」也吃左边这条带。本站通常是直接输入
   网址打开的、没有可后退的历史，所以撞不上；真撞上了再把这个 EDGE 往右挪一点。
   ============================================================ */
(() => {
  const chk = document.getElementById('appNavChk');
  const mqMobile = window.matchMedia('(max-width: 1023px)');

  const EDGE      = 30;   // 起点要落在最边缘这么宽的一条带里，才算"从边缘起手"
  const OPEN_AT   = 44;   // 往屏幕内侧划够这么远 → 打开
  const CLOSE_AT  = 56;   // 抽屉开着时，往它那一侧推够这么远 → 关闭
  const VERT_KILL = 16;   // 竖向位移超过它、且比横向大 → 判定为滚动，放手

  /* active: 'nav-open' | 'nav-close' | 'tag-open' | 'tag-close' | null */
  let sx = 0, sy = 0, active = null;

  const first = (e) => (e.touches && e.touches[0]) ||
                       (e.changedTouches && e.changedTouches[0]);

  /* 改 checked 不会自动冒 change 事件，显式补一发，别让别的监听者（⑯ 段那套
     aria 同步）读到过期状态。daisyUI 抽屉本身只认 :checked 伪类，不受影响。 */
  const setNav = (v) => {
    if (!chk || chk.checked === v) return;
    chk.checked = v;
    chk.dispatchEvent(new Event('change', { bubbles: true }));
  };
  const tagIsOpen = () => typeof window.isTagDrawerOpen === 'function' && window.isTagDrawerOpen();
  const tagOpen   = () => { if (typeof window.openTagDrawer  === 'function') window.openTagDrawer(); };
  const tagClose  = () => { if (typeof window.closeTagDrawer === 'function') window.closeTagDrawer(); };

  document.addEventListener('touchstart', (e) => {
    active = null;
    if (!mqMobile.matches || e.touches.length !== 1) return;
    const t = first(e);
    if (!t) return;
    const W = innerWidth;
    /* 优先级：先看"有没有开着的抽屉"—— 开着就只等把它拖回去；
       都没开，才按起手落在哪条边缘决定要开哪个。 */
    if (tagIsOpen())            active = 'tag-close';
    else if (chk && chk.checked) active = 'nav-close';
    else if (t.clientX >= W - EDGE) active = 'tag-open';   // 右边缘
    else if (t.clientX <= EDGE)     active = 'nav-open';   // 左边缘
    else return;
    sx = t.clientX;
    sy = t.clientY;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!active) return;
    const t = first(e);
    if (!t) return;
    const dx = t.clientX - sx;
    const dy = t.clientY - sy;

    if (Math.abs(dy) > VERT_KILL && Math.abs(dy) > Math.abs(dx)) {
      active = null;                          // 竖着走 → 让给页面滚动
      return;
    }
    const horiz = Math.abs(dy) < Math.abs(dx);
    if (!horiz) return;

    if (active === 'nav-open'  && dx >  OPEN_AT)  { setNav(true);   active = null; }
    else if (active === 'nav-close' && dx < -CLOSE_AT) { setNav(false);  active = null; }
    else if (active === 'tag-open'  && dx < -OPEN_AT)  { tagOpen();      active = null; }
    else if (active === 'tag-close' && dx >  CLOSE_AT) { tagClose();     active = null; }
  }, { passive: true });

  const end = () => { active = null; };
  document.addEventListener('touchend', end, { passive: true });
  document.addEventListener('touchcancel', end, { passive: true });
})();
</script>
