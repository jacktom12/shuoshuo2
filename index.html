     <style>
  :root { color-scheme: light; --font-family: "LXGW WenKai Screen", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  [data-theme="dark"], [data-theme="halloween"] { color-scheme: dark; }
  html { scroll-behavior: smooth; font-family: var(--font-family); font-size: 16.5px; }
  body { -webkit-tap-highlight-color: transparent; font-family: var(--font-family); }

  /* 标签徽章：保证 button 上的 badge 继承全局字体 */
  .tag-chip { font-family: inherit; }

  .memo-card { transition: transform .25s ease, box-shadow .25s ease; }
  @media (hover: hover) {
    .memo-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px -14px rgb(0 0 0 / .18); }
  }

  /* ============ 图片墙（Masonry.js 瀑布流） ============ */
  .photo-sizer,
  .photo-item {
    width: 33.3333%;
  }
  @media (max-width: 640px) {
    .photo-sizer,
    .photo-item {
      width: 50%;
    }
  }
  .photo-sizer {
    visibility: hidden;
    height: 0;
    padding: 0;
    margin: 0;
  }
  .photo-item {
    box-sizing: border-box;
    padding: 5px;
    cursor: zoom-in;
  }
  .photo-item a {
    display: block; width: 100%; height: 100%;
    border-radius: 12px; overflow: hidden;
    background: rgb(128 128 128 / .12);
  }
  .photo-item img { width: 100%; height: auto; display: block; transition: transform .35s ease; }
  @media (hover: hover) { .photo-item:hover img { transform: scale(1.03); } }

  /* ============ Threads 风格横向图片条 ============ */
  .strip-wrap { position: relative; }
  .carousel-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    -ms-overflow-style: none;
    cursor: grab;
  }
  .carousel-strip::-webkit-scrollbar { display: none; }
  .carousel-strip.dragging { cursor: grabbing; }
  .carousel-strip.dragging img { pointer-events: none; }
  .strip-item {
    flex-shrink: 0;
    transition: transform .32s cubic-bezier(.34, 1.56, .64, 1);
    transform-origin: center center;
    will-change: transform;
  }
  .strip-item.pressed {
    transform: scale(.94);
    transition: transform .12s ease-out;
  }
  .strip-end { flex-shrink: 0; }
  .strip-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    cursor: inherit;
  }
  @media (hover: hover) { .strip-item img:hover { filter: brightness(1.06); } }
  .strip-count { position: absolute; top: 8px; right: 8px; z-index: 2; pointer-events: none; }

  /* 骨架屏 */
  .shimmer {
    background: linear-gradient(90deg,
      rgb(128 128 128 / .10) 25%, rgb(128 128 128 / .22) 37%, rgb(128 128 128 / .10) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 0 } 100% { background-position: -100% 0 } }

  /* 海报卡片 */
  .poster-card { transition: transform .25s ease, box-shadow .25s ease; }
  @media (hover: hover) {
    .poster-card:hover { transform: translateY(-4px); box-shadow: 0 16px 36px -16px rgb(0 0 0 / .35); }
  }

  .fade-up { animation: fadeUp .45s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

  .memo-text { word-break: break-word; overflow-wrap: anywhere; }
  .memo-text a { color: oklch(60% .18 250); text-decoration: underline; text-underline-offset: 3px; }

  /* ============ Markdown 渲染样式 ============ */
  .memo-text h1, .memo-text h2, .memo-text h3, .memo-text h4, .memo-text h5, .memo-text h6 {
    font-weight: 700; line-height: 1.4; margin: 0.9em 0 0.45em;
  }
  .memo-text h1 { font-size: 1.45em; }
  .memo-text h2 { font-size: 1.32em; }
  .memo-text h3 { font-size: 1.18em; }
  .memo-text h4, .memo-text h5, .memo-text h6 { font-size: 1.05em; }
  .memo-text p { margin: 0.5em 0; }
  .memo-text ul, .memo-text ol { margin: 0.5em 0; padding-left: 1.4em; }
  .memo-text ul { list-style: disc; }
  .memo-text ol { list-style: decimal; }
  .memo-text li { margin: 0.2em 0; }
  .memo-text blockquote {
    margin: 0.6em 0; padding: 0.25em 0.9em;
    border-left: 3px solid oklch(60% .18 250 / .6);
    color: color-mix(in oklch, currentColor 70%, transparent);
  }
  .memo-text code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    background: rgb(128 128 128 / .15); padding: 0.1em 0.4em; border-radius: 6px; font-size: .88em;
  }
  .memo-text pre {
    margin: 0.7em 0; padding: 0.85em 1em; border-radius: 10px;
    background: rgb(128 128 128 / .12); overflow-x: auto;
  }
  .memo-text pre code { background: transparent; padding: 0; border-radius: 0; font-size: .86em; line-height: 1.6; }
  .memo-text table { border-collapse: collapse; margin: 0.7em 0; width: 100%; font-size: .95em; }
  .memo-text th, .memo-text td { border: 1px solid rgb(128 128 128 / .35); padding: 0.4em 0.7em; text-align: left; }
  .memo-text th { background: rgb(128 128 128 / .12); font-weight: 600; }
  .memo-text hr { border: none; border-top: 1px solid rgb(128 128 128 / .35); margin: 1em 0; }
  .memo-text img { max-width: 100%; border-radius: 10px; }

  /* 隐藏所有滚动条（保留滚动功能，营造系统 APP 无滚动条体验） */
  * {
    scrollbar-width: none;           /* Firefox */
    -ms-overflow-style: none;        /* IE/Edge */
  }
  *::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }

  /* ============ 歌词均衡器动画 ============ */
  .eq {
    display: flex; align-items: flex-end;
    gap: 2.5px; height: 16px; flex-shrink: 0;
  }
  .eq i {
    width: 3px; border-radius: 2px;
    background: linear-gradient(180deg, var(--color-primary), var(--color-accent));
    animation: eq-bounce 1s ease-in-out infinite;
    transform-origin: bottom;
  }
  .eq i:nth-child(1) { height: 60%; animation-delay: 0s; }
  .eq i:nth-child(2) { height: 100%; animation-delay: .18s; }
  .eq i:nth-child(3) { height: 45%; animation-delay: .36s; }
  .eq i:nth-child(4) { height: 80%; animation-delay: .54s; }
  @keyframes eq-bounce { 50% { transform: scaleY(.35); } }

  /* ============ 深色主题下内容图片降亮度（避免刺眼） ============ */
  html:is([data-theme="dark"], [data-theme="halloween"]) #content img {
    filter: brightness(.75);
  }
  html:is([data-theme="dark"], [data-theme="halloween"]) .strip-item img:hover {
    filter: brightness(.85);
  }

  /* ============ 音乐抽屉（右侧滑出播放器） ============ */
  .music-drawer-overlay {
    position: fixed; inset: 0; z-index: 60;
    background: rgb(0 0 0 / .35);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
  }
  .music-drawer-overlay.open { opacity: 1; pointer-events: auto; }

  .music-drawer {
    --paper: var(--color-base-100);
    --bg: var(--color-base-100);
    --border: var(--color-base-300);
    --border-light: var(--color-base-300);
    --text: var(--color-base-content);
    --text-main: var(--color-base-content);
    --secondary-text: color-mix(in oklch, var(--color-base-content) 55%, transparent);
    --text-muted: var(--secondary-text);
    --accent: var(--color-primary);
    --accent-color: var(--color-primary);
    --accent-dark: color-mix(in oklch, var(--color-primary) 82%, black);
    --bg-player: var(--color-base-200);
    --dot-normal: var(--color-base-300);
    --img-brightness: 1;

    position: fixed; top: 0; right: 0;
    height: 100%; height: 100dvh;
    width: 85%; max-width: 400px; z-index: 70;
    background: var(--bg); color: var(--text);
    border-left: 1px solid var(--border-light);
    box-shadow: -4px 0 24px rgb(0 0 0 / .12);
    transform: translateX(100%);
    transition: transform .35s cubic-bezier(.22, 1, .36, 1);
    display: flex; flex-direction: column;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 12px calc(20px + env(safe-area-inset-bottom, 0px));
    overflow: hidden;
  }
  .music-drawer.open { transform: translateX(0); }
  html:is([data-theme="dark"], [data-theme="halloween"]) .music-drawer {
    --img-brightness: .7;
    box-shadow: -4px 0 24px rgb(0 0 0 / .5);
  }

  .music-drawer .drawer-header {
    display: flex; align-items: center; justify-content: space-between;
    flex: 0 0 auto; margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border-light);
  }
  .music-drawer .drawer-title { font-size: 1rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .music-drawer .drawer-close {
    appearance: none; background: transparent; border: none;
    font-size: 1.4rem; line-height: 1; cursor: pointer;
    color: var(--text-muted); padding: 0 4px; transition: color .2s;
    display: inline-flex; align-items: center;
  }
  .music-drawer .drawer-close:hover { color: var(--text); }
  .music-drawer .drawer-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .music-drawer .hw-playlist-mount { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

  /* —— 播放器组件（迁移自参考站 HWPlayer） —— */
  .music-drawer .hw-playlist {
    position: relative; width: 100%; height: 100%;
    margin: 0; padding: 0;
    background: transparent; border: none; box-shadow: none;
    overflow: visible; display: flex; flex-direction: column;
  }
  .music-drawer .hw-pl-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding: 4px 0 6px; flex: 0 0 auto; }
  .music-drawer .hw-pl-cover { width: 64px; height: 64px; flex: 0 0 64px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg-player); }
  .music-drawer .hw-pl-meta { flex: 1; min-width: 0; }
  .music-drawer .hw-pl-title { font-size: .95rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-drawer .hw-pl-artist { font-size: .82rem; color: var(--secondary-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .music-drawer .hw-pl-count { font-size: .72rem; color: var(--secondary-text); margin-top: 2px; }
  .music-drawer .hw-pl-view-lyrics {
    display: none; flex-direction: column;
    height: 100px; min-height: 50px; margin-bottom: 6px;
    background: var(--bg-player); padding: 6px 4px;
    border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light);
    flex: 0 0 auto;
  }
  .music-drawer .hw-playlist.lyrics-mode .hw-pl-view-normal { display: none; }
  .music-drawer .hw-playlist.lyrics-mode .hw-pl-view-lyrics { display: flex; }
  .music-drawer .hw-lyrics-scroll-full { flex: 1; overflow-y: auto; padding: 4px 6px; scrollbar-width: none; -ms-overflow-style: none; }
  .music-drawer .hw-lyrics-scroll-full::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .music-drawer .hw-lyrics-line { color: var(--secondary-text); padding: 2px 4px; text-align: center; font-size: .8rem; line-height: 1.6; transition: color .2s, font-size .2s; }
  .music-drawer .hw-lyrics-line.active { color: var(--accent); font-weight: 700; font-size: .9rem; }
  .music-drawer .hw-lyrics-empty { margin: auto; text-align: center; color: var(--secondary-text); font-size: .82rem; padding: 6px; }
  .music-drawer .hw-pl-progress-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex: 0 0 auto; }
  .music-drawer .hw-time { font-size: .72rem; color: var(--secondary-text); font-weight: 500; min-width: 32px; }
  .music-drawer .hw-time.hw-pl-dur { text-align: right; }
  .music-drawer .hw-progress {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; background: var(--dot-normal); border: none; border-radius: 2px;
    outline: none; cursor: pointer;
  }
  .music-drawer .hw-progress::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; }
  .music-drawer .hw-progress::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; }
  .music-drawer .hw-pl-controls { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px; flex: 0 0 auto; }
  .music-drawer .hw-btn {
    border: none; background: transparent; color: var(--text);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .15s ease; position: relative;
    border-radius: 6px; padding: 4px;
    width: 34px; height: 30px;
  }
  .music-drawer .hw-btn:hover { background: rgb(128 128 128 / .12); }
  .music-drawer .hw-btn:active { transform: scale(.92); }
  .music-drawer .hw-btn svg { display: block; }
  .music-drawer .hw-play { width: 34px; height: 30px; border-radius: 6px; background: var(--accent); color: var(--color-primary-content, #fff); }
  .music-drawer .hw-play:hover { background: var(--accent-dark); }
  .music-drawer .hw-pl-shuffle, .music-drawer .hw-pl-repeat, .music-drawer .hw-pl-lyrics-toggle { color: var(--text-muted); }
  .music-drawer .hw-pl-shuffle.active, .music-drawer .hw-pl-repeat.active, .music-drawer .hw-pl-lyrics-toggle.active { color: var(--accent); }
  .music-drawer .hw-repeat-badge {
    position: absolute; bottom: -2px; right: -2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); color: var(--color-primary-content, #fff);
    font-size: 8px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .music-drawer .hw-pl-list {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding-top: 6px; margin-top: 4px;
    border-top: 1px solid var(--border-light);
    scrollbar-width: none; -ms-overflow-style: none; max-height: none;
  }
  .music-drawer .hw-pl-list::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .music-drawer .hw-pl-row { display: flex; align-items: center; gap: 6px; padding: 5px 2px; border-radius: 6px; cursor: pointer; transition: background .15s ease; }
  .music-drawer .hw-pl-row:hover { background: rgb(128 128 128 / .08); }
  .music-drawer .hw-pl-row.playing { background: color-mix(in oklch, var(--accent) 12%, transparent); }
  .music-drawer .hw-pl-row-idx { width: 16px; text-align: center; font-size: .68rem; color: var(--secondary-text); flex: 0 0 16px; }
  .music-drawer .hw-pl-row.playing .hw-pl-row-idx { color: var(--accent); }
  .music-drawer .hw-pl-row-thumb { width: 28px; height: 28px; flex: 0 0 28px; border-radius: 4px; border: 1px solid var(--border); overflow: hidden; background: var(--bg-player); }
  .music-drawer .hw-pl-row-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .music-drawer .hw-pl-row-info { flex: 1; min-width: 0; }
  .music-drawer .hw-pl-row-title { font-size: .8rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-drawer .hw-pl-row-artist { font-size: .68rem; color: var(--secondary-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-drawer .hw-pl-row-playicon { flex: 0 0 14px; text-align: center; color: var(--accent); opacity: 0; }
  .music-drawer .hw-pl-row.playing .hw-pl-row-playicon { opacity: 1; }
  .music-drawer .hw-pl-loading, .music-drawer .hw-pl-error { text-align: center; padding: 16px 8px; color: var(--secondary-text); font-size: .82rem; margin: auto; }
  .music-drawer .hw-cover-img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(var(--img-brightness)); }

  @media (max-width: 640px) {
    .music-drawer { width: 88%; }
  }
  @media (max-width: 400px) {
    .music-drawer { width: 92%; }
  }
</style>
</head>
<body class="h-screen overflow-hidden flex flex-col bg-base-200/60 text-base-content px-3 sm:px-4 pt-3">

<!-- ======================= 主体卡片（头部 + 内容一体） ======================= -->
<div class="max-w-2xl mx-auto w-full flex-1 min-h-0 flex flex-col bg-base-100 rounded-2xl shadow-sm border border-base-300/60">

  <header class="shrink-0">
    <div class="h-14 flex items-center justify-between gap-3 px-3 sm:px-4">
      <div class="flex items-center gap-2.5 min-w-0">
        <img src="/avatar.webp" alt="头像" class="w-8 h-8 rounded-full object-cover shadow-md shrink-0" />
        <div class="min-w-0">
          <h1 class="font-bold leading-none text-[15px] truncate">小记</h1>
          <p class="text-[11px] opacity-50 leading-tight mt-0.5">说说 · 光影 · 日常</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="musicBtn" class="btn btn-ghost btn-sm btn-circle relative" aria-label="音乐">
          <span class="iconify text-xl" data-icon="mdi:music-note-outline"></span>
          <span id="musicDot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-success animate-pulse"></span>
        </button>

        <div class="dropdown dropdown-end">
          <button tabindex="0" class="btn btn-ghost btn-sm btn-circle" aria-label="选择主题配色">
            <span class="iconify text-xl" data-icon="mdi:palette-outline"></span>
          </button>
          <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-2xl z-50 w-40 p-2 shadow-xl border border-base-300 mt-2">
            <li class="menu-title text-xs opacity-50">主题配色</li>
            <li>
              <a data-theme-pick="auto" class="theme-pick-item flex items-center justify-between rounded-xl">
                <span>默认</span><span class="pick-check text-primary">✓</span>
              </a>
            </li>
            <li>
              <a data-theme-pick="caramellatte" class="theme-pick-item flex items-center justify-between rounded-xl">
                <span>焦糖拿铁</span><span class="pick-check text-primary hidden">✓</span>
              </a>
            </li>
            <li>
              <a data-theme-pick="halloween" class="theme-pick-item flex items-center justify-between rounded-xl">
                <span>万圣夜</span><span class="pick-check text-primary hidden">✓</span>
              </a>
            </li>
          </ul>
        </div>

        <button id="themeBtn" class="btn btn-ghost btn-sm btn-circle" aria-label="切换明暗">
          <span id="iconSun" class="iconify text-xl" data-icon="mdi:white-balance-sunny"></span>
          <span id="iconMoon" class="iconify text-xl hidden" data-icon="mdi:moon-waning-crescent"></span>
        </button>
      </div>
    </div>

    <!-- 歌词横幅：音乐播放时在顶栏显示当前歌词 -->
    <div id="headerLyricsBar" class="hidden px-3 sm:px-4 pb-2">
      <div class="flex items-center gap-2 rounded-xl bg-base-200 px-3 py-1.5">
        <span class="eq shrink-0" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div class="min-w-0 flex-1 text-center">
          <p id="headerLyricsText" class="text-sm truncate font-medium leading-snug"></p>
        </div>
      </div>
    </div>

    <!-- 菜单（icon only，横向） -->

const $ = sel => document.querySelector(sel);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function relativeTime(rawDate) {
  const t = new Date(String(rawDate).replace(' ', 'T')).getTime();
  if (!Number.isFinite(t)) return rawDate || '';
  const diff = Date.now() - t;
  const m = 6e4, h = 36e5, d = 864e5;
  if (diff < m) return '刚刚';
  if (diff < h) return Math.floor(diff / m) + ' 分钟前';
  if (diff < d) return Math.floor(diff / h) + ' 小时前';
  if (diff < 7 * d) return Math.floor(diff / d) + ' 天前';
  return String(rawDate).split(' ')[0];
}

function fmtDate(rawDate) {
  const s = String(rawDate || '');
  return s.length >= 16 ? s.slice(0, 16) : s;
}

function parseContent(raw) {
  const content = String(raw || '');
  const images = [];
  const imgRe = /!\[([^\]]*)\]\(\s*(https?:[^)\s]+?)\s*\)|(https?:\/\/[^\s<>"']+?\.(?:png|jpe?g|gif|webp|avif|bmp)(?:\?[^\s<>"']*)?)|<img[^>]+?src=["']([^"']+)["'][^>]*>/gi;
  const text = content.replace(imgRe, (m, alt, mdUrl, bareUrl, htmlUrl) => {
    const url = mdUrl || bareUrl || htmlUrl;
    if (url) images.push({ url, alt: alt || '' });
    return '\n';
  });

  let html;
  if (window.marked && typeof marked.parse === 'function') {
    try {
      html = marked.parse(text, { gfm: true, breaks: true, extendedAutolinks: true });
    } catch {
      html = escapeHtml(text).replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
    }
  } else {
    html = escapeHtml(text)
      .replace(/(https?:\/\/[^\s&lt;&gt;"']+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
      .replace(/\n{2,}/g, '<br><br>')
      .replace(/\n/g, '<br>');
  }

  return { html, images };
}

const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
function animateValue(from, to, duration, onUpdate, onDone) {
  const start = performance.now();
  let raf;
  function frame(now) {
    const p = Math.min((now - start) / duration, 1);
    onUpdate(from + (to - from) * easeOutQuart(p));
    if (p < 1) raf = requestAnimationFrame(frame);
    else onDone && onDone();
  }
  raf = requestAnimationFrame(frame);
  return () => cancelAnimationFrame(raf);
}

============================================================ */
async function fetchApi(params) {
  const res = await fetch(API_BASE + '?' + params.toString(), { headers: { 'Accept': 'application/json' } });
  if (!res.ok) throw new Error(`请求失败 (${res.status})`);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function fetchData({ view, page = 1, tags = [] }) {
  if (!USE_MOCK) {
    const params = new URLSearchParams({ view });
    if (view === 'say') {
      params.set('page', page);
      if (tags.length) params.set('tags', tags.join(','));
    }
    return fetchApi(params);
  }

  await sleep(300 + Math.random() * 400);

  if (view === 'tags') {
    const countMap = new Map();
    MOCK_MEMOS.forEach(m => (m.tags || []).forEach(t => countMap.set(t, (countMap.get(t) || 0) + 1)));
    const tagsArr = [...countMap.entries()]
      .filter(([id]) => MOCK_TAGS[id])
      .map(([id, count]) => ({ id, name: MOCK_TAGS[id], count }))
      .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'zh-CN'));
    return { data: tagsArr, total: tagsArr.length };
  }

  if (view === 'say') {
    let list = MOCK_MEMOS;
    if (tags.length) list = list.filter(m => tags.every(t => (m.tags || []).includes(t)));
    const total = list.length;
    const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
    const p = Math.min(Math.max(1, page), totalPages);
    return { data: list.slice((p - 1) * PAGE_SIZE, p * PAGE_SIZE), total, page: p, totalPages };
  }

  const list = MOCK_MEDIA[view] || [];
  return { data: list, total: list.length, page: 1, totalPages: 1 };
}

/* ============================================================
   图片灯箱：Fancybox（委托打开，兼容动态渲染内容）
============================================================ */
function initFancybox() {
  if (!window.Fancybox) return;
  document.addEventListener('click', e => {
    const trigger = e.target.closest('[data-fancybox]');
    if (!trigger) return;
    e.preventDefault();
    const group = trigger.getAttribute('data-fancybox') || 'gallery';
    const items = [...document.querySelectorAll(`[data-fancybox="${group}"]`)]
      .map(a => ({
        src: a.getAttribute('href') || a.getAttribute('data-src') || '',
        caption: a.getAttribute('data-caption') || '',
      }))
      .filter(it => it.src);
    const target = trigger.getAttribute('href') || trigger.getAttribute('data-src') || '';
    const startIndex = Math.max(0, items.findIndex(it => it.src === target));
    Fancybox.show(items, { startIndex });
  });
}

/* ============================================================

============================================================ */
function renderImages(images, group) {
  if (!images.length) return '';
  const g = group || 'gallery';

  if (images.length === 1) {
    const img = images[0];
    return `
    <div class="mt-3 rounded-xl overflow-hidden bg-base-300/50">
      <img src="${escapeHtml(img.url)}" alt="${escapeHtml(img.alt)}" loading="lazy"
           data-fancybox="${escapeHtml(g)}" data-src="${escapeHtml(img.url)}"
           data-caption="${escapeHtml(img.alt || '')}"
           class="w-full h-auto max-h-[520px] object-cover cursor-zoom-in" />
    </div>`;
  }

  const items = images.map((img, i) => `
    <div class="strip-item rounded-xl overflow-hidden bg-base-300/50 w-[72%] sm:w-[58%] h-52 sm:h-64">
      <img src="${escapeHtml(img.url)}" alt="${escapeHtml(img.alt)}" loading="lazy"
           data-fancybox="${escapeHtml(g)}" data-src="${escapeHtml(img.url)}"
           data-caption="${escapeHtml(img.alt || '')}" />
    </div>`).join('');

  return `
  <div class="strip-wrap mt-3">
    <div class="carousel-strip">
      ${items}
      <div class="strip-end w-1"></div>
    </div>
    <span class="strip-count badge badge-sm bg-black/55 text-white border-none backdrop-blur-sm">1 / ${images.length}</span>
  </div>`;
}

function initCarousels(root) {
  root.querySelectorAll('.carousel-strip').forEach(strip => {
    if (strip.dataset.carouselInit) return;
    strip.dataset.carouselInit = '1';

    const wrap = strip.closest('.strip-wrap');
    const badge = wrap && wrap.querySelector('.strip-count');
    const maxScroll = () => Math.max(0, strip.scrollWidth - strip.clientWidth);
    const itemW = () => {
      const first = strip.querySelector('.strip-item');
      return first ? first.getBoundingClientRect().width + 8 : strip.clientWidth * 0.72;
    };

    if (badge) {
      const update = () => {
        const total = strip.querySelectorAll('.strip-item').length;
        const i = strip.scrollLeft >= maxScroll() - 2
          ? total - 1
          : Math.round(strip.scrollLeft / itemW());
        badge.textContent = `${Math.min(Math.max(i + 1, 1), total)} / ${total}`;
      };
      strip.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
    }

    let down = false, startX = 0, startL = 0, moved = 0;
    let samples = [];
    let cancelGlide = null;
    let pressedItem = null;

    const releasePress = () => {
      if (pressedItem) {
        pressedItem.classList.remove('pressed');
        pressedItem = null;
      }
    };

    const glideTo = target => {
      const to = Math.max(0, Math.min(target, maxScroll()));
      const from = strip.scrollLeft;
      const dist = Math.abs(to - from);
      if (dist < 1) return;
      if (cancelGlide) cancelGlide();
      const duration = Math.min(200 + dist * 0.55, 550);
      cancelGlide = animateValue(from, to, duration, v => { strip.scrollLeft = v; }, () => {
        cancelGlide = null;
      });
    };

    strip.addEventListener('pointerdown', e => {
      pressedItem = e.target.closest('.strip-item');
      if (pressedItem) pressedItem.classList.add('pressed');

      if (e.pointerType === 'touch') return;
      if (cancelGlide) { cancelGlide(); cancelGlide = null; }
      down = true; moved = 0;
      startX = e.clientX; startL = strip.scrollLeft;
      samples = [{ x: e.clientX, t: performance.now() }];
    });
    strip.addEventListener('pointermove', e => {
      if (!down) return;
      const dx = e.clientX - startX;
      moved = Math.max(moved, Math.abs(dx));
      if (moved > 4) {
        strip.classList.add('dragging');
        try { strip.setPointerCapture(e.pointerId); } catch {}
      }
      strip.scrollLeft = startL - dx;
      samples.push({ x: e.clientX, t: performance.now() });
      if (samples.length > 6) samples.shift();
    });
    const up = () => {
      releasePress();
      if (!down) return;
      down = false;
      strip.classList.remove('dragging');
      if (moved > 8) strip.dataset.justDragged = '1';
      let v = 0;
      if (samples.length >= 2) {
        const a = samples[0], b = samples[samples.length - 1];
        const dt = b.t - a.t;
        if (dt > 0) v = (b.x - a.x) / dt;
      }
      glideTo(strip.scrollLeft - v * 220);
    };
    strip.addEventListener('pointerup', up);
    strip.addEventListener('pointercancel', up);
    strip.addEventListener('pointerleave', up);
    strip.addEventListener('click', e => {
      if (strip.dataset.justDragged) {
        delete strip.dataset.justDragged;
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);
  });
}

/* ============================================================
   渲染：说说
============================================================ */
let tagNameMap = new Map();

const TAG_COLORS = ['primary', 'secondary', 'accent', 'info', 'success', 'warning', 'error'];

// 根据标签 id 生成稳定颜色（同一标签始终同色，不同标签颜色分散）
function tagColor(id) {
  let h = 0;
  const s = String(id);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return TAG_COLORS[h % TAG_COLORS.length];
}

function tagChipClasses(id, active) {
  const color = tagColor(id);
  const base = 'badge tag-chip cursor-pointer select-none transition-all shrink-0 whitespace-nowrap';
  return active ? `${base} badge-${color}` : `${base} badge-soft badge-${color}`;
}

function tagChipHtml(id, { active = false, count = null } = {}) {
  const name = tagNameMap.get(id) || id.replace(/^tag_/, '');
  const countHtml = count != null ? ` <span class="opacity-70 ml-0.5">${count}</span>` : '';
  return `<button type="button" class="${tagChipClasses(id, active)}" data-tag="${escapeHtml(id)}">${escapeHtml(name)}${countHtml}</button>`;
}

function memoCard(m, idx) {
  const { html, images: parsedImages } = parseContent(m.content);
  // 生产数据图片在 m.images 数组中，与 content 解析的图片合并
  const extraImages = Array.isArray(m.images) ? m.images.map(url => ({ url, alt: '' })) : [];
  const images = parsedImages.length ? parsedImages : extraImages;
  const tags = (m.tags || []).map(t =>
    `<span class="badge badge-dash badge-${tagColor(t)} cursor-pointer hover:opacity-75 transition-opacity memo-tag" data-tag="${escapeHtml(t)}">#${escapeHtml(tagNameMap.get(t) || t.replace(/^tag_/, ''))}</span>`
  ).join(' ');
  return `
  <article class="memo-card fade-up card bg-base-100 shadow-sm border border-base-300/50 overflow-hidden" style="animation-delay:${Math.min(idx * 40, 400)}ms">
    <div class="card-body p-4 sm:p-5 gap-3">
      <div class="memo-text text-[17px] leading-relaxed">${html}</div>
      ${renderImages(images, m.id)}
      <div class="flex items-center justify-between flex-wrap gap-2 pt-1">
        <time class="text-xs opacity-50 flex items-center gap-1" title="${escapeHtml(fmtDate(m.rawDate))}">
          <span class="iconify text-sm" data-icon="mdi:clock-outline"></span>
          ${relativeTime(m.rawDate)}
        </time>
        ${tags ? `<div class="flex flex-wrap gap-1.5">${tags}</div>` : ''}
      </div>
    </div>
  </article>`;
}

function skeletonCards(n = 3) {
  return Array.from({ length: n }, () => `
    <div class="card bg-base-100 border border-base-300/50"><div class="card-body p-5 gap-3">
      <div class="shimmer h-4 rounded w-3/4"></div>
      <div class="shimmer h-4 rounded w-full"></div>
      <div class="shimmer h-4 rounded w-1/2"></div>
      <div class="shimmer h-52 rounded-xl w-full"></div>
      <div class="shimmer h-3 rounded w-24"></div>
    </div></div>`).join('');
}

function emptyState(text) {
  return `<div class="text-center py-16 opacity-60 fade-up">
    <span class="iconify text-4xl block mb-3 mx-auto" data-icon="mdi:leaf"></span><p class="text-sm">${text}</p></div>`;
}

function errorState(msg, retryFn) {
  const box = document.createElement('div');
  box.className = 'fade-up alert alert-error alert-soft rounded-2xl';
  box.innerHTML = `<span class="text-sm">加载失败：${escapeHtml(msg)}</span>`;
  const btn = document.createElement('button');
  btn.className = 'btn btn-sm btn-outline ml-auto'; btn.textContent = '重试';
  btn.onclick = retryFn;
  box.appendChild(btn);
  return box;
}

/* ============================================================
   渲染：影视
============================================================ */
function mediaCard(m, idx) {
  const typeBadge = m.media_type === 'tv'
    ? '<span class="badge badge-xs badge-secondary">剧集</span>'
    : '<span class="badge badge-xs badge-accent">电影</span>';
  return `
  <div class="poster-card fade-up card bg-base-100 shadow-sm border border-base-300/50 overflow-hidden" style="animation-delay:${Math.min(idx * 30, 300)}ms">
    <figure class="relative aspect-[2/3] bg-base-300">
      <img src="${escapeHtml(m.poster_path)}" alt="${escapeHtml(m.title)}" loading="lazy" class="w-full h-full object-cover" />
      <span class="absolute top-1.5 right-1.5 badge badge-sm bg-black/60 text-white border-none gap-0.5"><span class="iconify text-xs" data-icon="mdi:star"></span>${escapeHtml(m.vote_average)}</span>
    </figure>
    <div class="p-2.5">
      <h3 class="font-semibold text-[13px] leading-snug line-clamp-1" title="${escapeHtml(m.title)}">${escapeHtml(m.title)}</h3>
      <p class="text-[11px] opacity-50 line-clamp-1 mt-0.5" title="${escapeHtml(m.original_title)}">${escapeHtml(m.original_title || '—')}</p>
      <div class="flex items-center justify-between mt-1.5">
        <div class="flex items-center gap-1.5 min-w-0">
          ${typeBadge}
          <a href="${escapeHtml(m.douban_url)}" target="_blank" rel="noopener" class="btn btn-xs btn-ghost btn-circle shrink-0" aria-label="豆瓣搜索" title="豆瓣搜索">
            <span class="iconify text-base" data-icon="streamline-logos:douban-logo-block"></span>
          </a>
        </div>
        <span class="text-[10px] opacity-40 shrink-0">${escapeHtml(m.date)}</span>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   影视筛选（迁移自参考站：类型单选 / 年代多选 OR / 题材多选 AND）
   全程操作前端缓存，不重新请求 API
============================================================ */
function mediaFiltersActive() {
  const f = state.mediaFilter;
  return f.type !== 'all' || f.ranges.size > 0 || f.genres.size > 0;
}

function resetMediaFilter() {
  state.mediaFilter = { type: 'all', ranges: new Set(), genres: new Set() };
}

function getFilteredMedia(view) {
  const list = state.mediaCache[view] || [];
  const f = state.mediaFilter;
  return list.filter(m => {
    if (f.type !== 'all' && m.media_type !== f.type) return false;
    if (f.ranges.size) {
      const y = parseInt(String(m.release_date || '').slice(0, 4), 10);
      if (!Number.isFinite(y)) return false;
      let hit = false;
      f.ranges.forEach(id => {
        const r = RELEASE_RANGES.find(r => r.id === id);
        if (r && r.test(y)) hit = true;
      });
      if (!hit) return false;
    }
    if (f.genres.size) {
      const gids = Array.isArray(m.genre_ids) ? m.genre_ids : [];
      for (const g of f.genres) if (!gids.includes(g)) return false;
    }
    return true;
  });
}

/* 可选题材：从当前视图缓存中统计，且与类型、年代联动（电影→电影题材，剧集→剧集题材，选年代后题材数量即时刷新） */
function availableGenres(view) {
  const f = state.mediaFilter;
  const list = state.mediaCache[view] || [];
  // 题材数量 = 当前「类型 + 年代」条件下各题材的独立数量（不考虑已选题材的 AND 约束）
  const pool = list.filter(m => {
    if (f.type !== 'all' && m.media_type !== f.type) return false;
    if (f.ranges.size) {
      const y = parseInt(String(m.release_date || '').slice(0, 4), 10);
      if (!Number.isFinite(y)) return false;
      let hit = false;
      for (const id of f.ranges) {
        const r = RELEASE_RANGES.find(r => r.id === id);
        if (r && r.test(y)) { hit = true; break; }
      }
      if (!hit) return false;
    }
    return true;
  });
  const typeSet = f.type === 'movie' ? MOVIE_GENRES : f.type === 'tv' ? TV_GENRES : null;
  const count = new Map();
  pool.forEach(m => (Array.isArray(m.genre_ids) ? m.genre_ids : []).forEach(g => {
    if (!GENRE_MAP[g]) return;
    if (typeSet && !typeSet.has(g)) return;
    count.set(g, (count.get(g) || 0) + 1);
  }));
  return [...count.entries()]
    .map(([id, c]) => ({ id, name: GENRE_MAP[id], count: c }))
    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'zh-CN'));
}

function mediaFilterBarHtml(view) {
  const f = state.mediaFilter;
  // checkbox 按钮组（daisyUI btn 风格）：label 包裹 hidden checkbox，选中态用 btn-primary 高亮
  const chipLabel = on => 'btn btn-xs rounded-full cursor-pointer transition-all ' + (on ? 'btn-primary' : 'btn-ghost bg-base-100 border border-base-300');

  const typeRow = [['all','全部'],['movie','电影'],['tv','剧集']]
    .map(([v, n]) => `
      <label class="${chipLabel(f.type === v)}">
        <input type="radio" class="hidden mf-type" name="mf-type" data-v="${v}"${f.type === v ? ' checked' : ''} />
        <span>${n}</span>
      </label>`).join('');

  const rangeRow = RELEASE_RANGES
    .map(r => `
      <label class="${chipLabel(f.ranges.has(r.id))}">
        <input type="checkbox" class="hidden mf-range" data-v="${r.id}"${f.ranges.has(r.id) ? ' checked' : ''} />
        <span>${r.name}</span>
      </label>`).join('');

  const genres = availableGenres(view);
  const genreRow = genres.length
    ? genres.map(g => `
      <label class="${chipLabel(f.genres.has(g.id))}">
        <input type="checkbox" class="hidden mf-genre" data-v="${g.id}"${f.genres.has(g.id) ? ' checked' : ''} />
        <span>${g.name}</span>
        <span class="badge badge-xs ${f.genres.has(g.id) ? 'badge-neutral' : 'badge-ghost'} ml-1">${g.count}</span>
      </label>`).join('')
    : '<span class="text-xs opacity-40 py-1">该类型下暂无题材数据</span>';

  return `
  <div class="flex flex-col gap-2.5 px-1 fade-up">
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-xs opacity-50 w-7 shrink-0">类型</span>${typeRow}
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-xs opacity-50 w-7 shrink-0">年代</span>${rangeRow}
    </div>
    <div class="flex flex-wrap items-start gap-2">
      <span class="text-xs opacity-50 w-7 shrink-0 pt-1.5">题材</span>
      <div class="flex flex-wrap gap-2 flex-1 min-w-0">${genreRow}</div>
    </div>
    ${mediaFiltersActive() ? '<div><button class="btn btn-square btn-sm mf-clear" aria-label="清空筛选"><span class="iconify" data-icon="mdi:close"></span></button></div>' : ''}
  </div>`;
}

function bindMediaFilterEvents(view) {
  contentEl.querySelectorAll('.mf-type').forEach(cb => cb.addEventListener('change', () => {
    const v = cb.dataset.v;
    if (state.mediaFilter.type === v) return;
    state.mediaFilter.type = v;
    state.mediaFilter.genres.clear();   // 切类型时清空题材（参考站逻辑）
    state.mediaPage[view] = 1;
    renderMediaPage(view);
  }));
  contentEl.querySelectorAll('.mf-range').forEach(cb => cb.addEventListener('change', () => {
    const v = cb.dataset.v;
    cb.checked ? state.mediaFilter.ranges.add(v) : state.mediaFilter.ranges.delete(v);
    state.mediaPage[view] = 1;
    renderMediaPage(view);
  }));
  contentEl.querySelectorAll('.mf-genre').forEach(cb => cb.addEventListener('change', () => {
    const v = Number(cb.dataset.v);
    cb.checked ? state.mediaFilter.genres.add(v) : state.mediaFilter.genres.delete(v);
    state.mediaPage[view] = 1;
    renderMediaPage(view);
  }));
  const clear = contentEl.querySelector('.mf-clear');
  if (clear) clear.onclick = () => { resetMediaFilter(); state.mediaPage[view] = 1; renderMediaPage(view); };
}

/* ============================================================
   应用状态 & 控制器
============================================================ */
const state = {
  view: 'say',
  sayPage: 1,
  sayTotalPages: 1,
  sayTotal: 0,
  selectedTags: new Set(),
  tagsLoaded: false,
  mediaCache: { watched: null, watchlist: null },
  photosCache: null,
  mediaPage: { watched: 1, watchlist: 1 },
  mediaFilter: { type: 'all', ranges: new Set(), genres: new Set() },
  loading: false,
};

const contentEl = $('#content');
const mainScroll = $('#mainScroll');

/* ---------- 标签栏 ---------- */
let cachedTags = [];
let tagsPromise = null;

function loadTags() {
  if (state.tagsLoaded) return Promise.resolve();
  if (tagsPromise) return tagsPromise;
  tagsPromise = (async () => {
    try {
      const res = await fetchData({ view: 'tags' });
      (res.data || []).forEach(t => tagNameMap.set(t.id, t.name));
      cachedTags = res.data || [];
      renderTagChips(cachedTags);
    } catch {} finally {
      state.tagsLoaded = true;
    }
  })();
  return tagsPromise;
}

function renderTagChips(tags) {
  const bar = $('#tagBar');
  const selectedEl = $('#tagSelected');
  const chipsEl = $('#tagChips');
  const clearBtn = $('#clearTagsBtn');

  const selected = [...state.selectedTags];
  const unselected = (tags || []).filter(t => !state.selectedTags.has(t.id));

  if (!tags.length && !selected.length) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');

  // 已选标签固定在最前面（实心，点击取消）
  selectedEl.innerHTML = selected.map(id => tagChipHtml(id, { active: true })).join('');
  // 未选标签横向滚动
  chipsEl.innerHTML = unselected.map(t => tagChipHtml(t.id, { count: t.count })).join('');
  // 清空按钮
  clearBtn.classList.toggle('hidden', selected.length === 0);

  selectedEl.querySelectorAll('.tag-chip').forEach(btn => { btn.onclick = () => toggleTag(btn.dataset.tag); });
  chipsEl.querySelectorAll('.tag-chip').forEach(btn => { btn.onclick = () => toggleTag(btn.dataset.tag); });
}

function toggleTag(id) {
  state.selectedTags.has(id) ? state.selectedTags.delete(id) : state.selectedTags.add(id);
  renderTagChips(cachedTags);   // 重新渲染：选中标签移到最前面
  resetSay();
}

$('#clearTagsBtn').onclick = () => { state.selectedTags.clear(); renderTagChips(cachedTags); resetSay(); };

/* ---------- 说说：加载与无限滚动 ---------- */
function bindCardInteractions() {
  contentEl.querySelectorAll('.memo-tag').forEach(el => { el.onclick = () => toggleTag(el.dataset.tag); });
  initCarousels(contentEl);
}

function resetSay() {
  state.sayPage = 1;
  state.sayTotalPages = 1;
  if (mainScroll) mainScroll.scrollTop = 0;   // 筛选/切换后回到列表顶部
  contentEl.innerHTML = skeletonCards(3);
  $('#endHint').classList.add('hidden');
  loadSayPage(1, { replace: true });
}

async function loadSayPage(page, { replace = false } = {}) {
  if (state.loading) return;
  state.loading = true;
  if (!replace) $('#loadingMore').classList.remove('hidden');

  try {
    // 并行：确保标签名加载 + 拉取说说数据，渲染前等待标签名就绪（避免卡片标签显示 id）
    const tagsReady = loadTags();
    const res = await fetchData({ view: 'say', page, tags: [...state.selectedTags] });
    await tagsReady;
    state.sayPage = res.page;
    state.sayTotalPages = res.totalPages;
    state.sayTotal = res.total;

    const html = (res.data || []).map((m, i) => memoCard(m, i)).join('');
    if (replace) {
      contentEl.innerHTML = res.data && res.data.length ? html
        : emptyState(state.selectedTags.size ? '这些标签的交集下暂时没有说说，试试少选几个？' : '还没有说说，去写第一条吧。');
    } else {
      contentEl.insertAdjacentHTML('beforeend', html);
    }

    bindCardInteractions();

    const done = state.sayPage >= state.sayTotalPages;
    $('#endHint').classList.toggle('hidden', !done || state.sayTotal === 0);
    if (done) $('#endHint').textContent = state.selectedTags.size ? `— 筛选共 ${state.sayTotal} 条，到底啦 —` : `— 共 ${state.sayTotal} 条，到底啦 —`;
  } catch (err) {
    const box = errorState(err.message, () => { box.remove(); loadSayPage(page, { replace }); });
    if (replace) { contentEl.innerHTML = ''; contentEl.appendChild(box); }
    else contentEl.appendChild(box);
  } finally {
    state.loading = false;
    $('#loadingMore').classList.add('hidden');
  }
}

const observer = new IntersectionObserver(entries => {
  if (!entries[0].isIntersecting) return;
  if (state.view === 'say' && state.sayPage < state.sayTotalPages && !state.loading) {
    loadSayPage(state.sayPage + 1);
  }
}, { root: mainScroll, rootMargin: '400px' });
observer.observe($('#sentinel'));

/* ---------- 图片墙：聚合所有说说的图片 ---------- */
async function loadPhotos() {
  contentEl.innerHTML = skeletonCards(2);
  try {
    if (!state.photosCache) {
      // 拉取全部说说分页，提取其中的图片（与普通说说同一图片来源）
      const first = await fetchData({ view: 'say', page: 1, tags: [] });
      const all = [...(first.data || [])];
      const totalPages = first.totalPages || 1;
      if (totalPages > 1) {
        const rest = await Promise.all(
          Array.from({ length: totalPages - 1 }, (_, i) =>
            fetchData({ view: 'say', page: i + 2, tags: [] }))
        );
        rest.forEach(r => all.push(...(r.data || [])));
      }
      const photos = [];
      all.forEach(m => {
        const parsedImages = parseContent(m.content).images;
        const extraImages = Array.isArray(m.images) ? m.images.map(url => ({ url, alt: '' })) : [];
        const images = parsedImages.length ? parsedImages : extraImages;
        images.forEach(img =>
          photos.push({ url: img.url, date: m.rawDate }));
      });
      state.photosCache = photos;
    }
    renderPhotos();
  } catch (err) {
    contentEl.innerHTML = '';
    contentEl.appendChild(errorState(err.message, () => { state.photosCache = null; loadPhotos(); }));
  }
}

function renderPhotos() {
  const photos = state.photosCache || [];
  if (!photos.length) { contentEl.innerHTML = emptyState('说说里还没有图片。'); return; }
  contentEl.innerHTML = `
    <p class="text-xs opacity-50 px-1">共 ${photos.length} 张图片 · 来自所有说说</p>
    <div id="photoGrid">
      <div class="photo-sizer"></div>${photos.map(p => `
      <div class="photo-item">
        <a href="${escapeHtml(p.url)}" data-fancybox="photos" data-caption="${escapeHtml(fmtDate(p.date))}">
          <img src="${escapeHtml(p.url)}" loading="lazy" alt="" />
        </a>
      </div>`).join('')}
    </div>`;

  initPhotoGrid();
}

let photoGridInstance = null;

function initPhotoGrid() {
  const container = $('#photoGrid');
  if (!container || !window.Masonry) return;

  if (photoGridInstance) {
    try { photoGridInstance.destroy(); } catch {}
    photoGridInstance = null;
  }

  const grid = new Masonry(container, {
    itemSelector: '.photo-item',
    columnWidth: '.photo-sizer',
    percentPosition: true,
    transitionDuration: 0,
  });
  photoGridInstance = grid;

  // 图片加载完成后重新布局（防抖，避免抖动）
  let raf = null;
  const scheduleLayout = () => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      try { grid.layout(); } catch {}
    });
  };
  container.querySelectorAll('img').forEach(img => {
    if (img.complete && img.naturalWidth) return;
    img.addEventListener('load', scheduleLayout);
    img.addEventListener('error', scheduleLayout);
  });

  grid.layout();
}

/* ---------- 影视 ---------- */
async function loadMedia(view) {
  contentEl.innerHTML = skeletonCards(2);
  $('#mediaPager').classList.add('hidden');
  $('#endHint').classList.add('hidden');
  try {
    if (!state.mediaCache[view]) {
      const res = await fetchData({ view });   // 每个视图只拉一次，之后筛选翻页全在前端
      state.mediaCache[view] = res.data || [];
    }
    state.mediaPage[view] = 1;
    renderMediaPage(view);
  } catch (err) {
    contentEl.innerHTML = '';
    contentEl.appendChild(errorState(err.message, () => { state.mediaCache[view] = null; loadMedia(view); }));
  }
}

function renderMediaPage(view) {
  const all = state.mediaCache[view] || [];
  const list = getFilteredMedia(view);
  const filterBar = mediaFilterBarHtml(view);

  if (!all.length) {
    contentEl.innerHTML = emptyState(view === 'watched' ? '还没有看过的记录。' : '想看清单是空的。');
    $('#mediaPager').classList.add('hidden');
    return;
  }

  if (!list.length) {
    contentEl.innerHTML = filterBar + emptyState('这个筛选条件下没有片子，放宽一点试试？');
    bindMediaFilterEvents(view);
    $('#mediaPager').classList.add('hidden');
    return;
  }

  const pages = Math.ceil(list.length / PAGE_SIZE);
  const p = Math.min(state.mediaPage[view], pages);
  state.mediaPage[view] = p;
  const slice = list.slice((p - 1) * PAGE_SIZE, p * PAGE_SIZE);

  const countText = mediaFiltersActive()
    ? `筛出 ${list.length} / ${all.length} 部 · 第 ${p}/${pages} 页`
    : `共 ${all.length} 部${view === 'watched' ? '看过' : '想看'} · 第 ${p}/${pages} 页`;

  contentEl.innerHTML = `
    ${filterBar}
    <p class="text-xs opacity-50 px-1">${countText}</p>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${slice.map((m, i) => mediaCard(m, i)).join('')}</div>`;
  bindMediaFilterEvents(view);

  if (pages > 1) {
    const btns = [];
    btns.push(`<button class="join-item btn btn-sm ${p === 1 ? 'btn-disabled' : ''}" data-p="${p - 1}">«</button>`);
    const win = [];
    for (let i = 1; i <= pages; i++) {
      if (i === 1 || i === pages || Math.abs(i - p) <= 2) win.push(i);
    }
    let prev = 0;
    win.forEach(i => {
      if (i - prev > 1) btns.push('<button class="join-item btn btn-sm btn-disabled">…</button>');
      btns.push(`<button class="join-item btn btn-sm ${i === p ? 'btn-active' : ''}" data-p="${i}">${i}</button>`);
      prev = i;
    });
    btns.push(`<button class="join-item btn btn-sm ${p === pages ? 'btn-disabled' : ''}" data-p="${p + 1}">»</button>`);
    const pager = $('#pagerBtns');
    pager.innerHTML = btns.join('');
    pager.querySelectorAll('button[data-p]').forEach(b => {
      b.onclick = () => {
        if (b.classList.contains('btn-disabled')) return;
        state.mediaPage[view] = Number(b.dataset.p);
        renderMediaPage(view);
        mainScroll.scrollTo({ top: 0, behavior: 'smooth' });
      };
    });
    $('#mediaPager').classList.remove('hidden');
  } else {
    $('#mediaPager').classList.add('hidden');
  }
}

/* ---------- 视图切换 ---------- */
function switchView(view) {
  // 在 看过/想看 之间切换时重置筛选（参考站逻辑）
  if (view !== state.view && (view === 'watched' || view === 'watchlist')) {
    resetMediaFilter();
  }
  state.view = view;
  document.querySelectorAll('.tab-btn').forEach(t => {
    const on = t.dataset.view === view;
    t.classList.toggle('bg-base-300', on);
    t.classList.toggle('text-primary', on);
  });
  $('#tagBar').classList.toggle('hidden', view !== 'say');
  $('#mediaPager').classList.add('hidden');
  $('#endHint').classList.add('hidden');

  if (view === 'say') {
    loadTags();
    resetSay();
  } else if (view === 'photos') {
    loadPhotos();
  } else {
    loadMedia(view);
  }
}

document.querySelectorAll('.tab-btn').forEach(t => {
  t.onclick = () => { if (state.view !== t.dataset.view) switchView(t.dataset.view); };
});

   主题系统
============================================================ */
const DARK_THEMES = new Set(['dark', 'halloween']);
let themePick = 'auto';

function isDarkTheme(t) { return DARK_THEMES.has(t); }

function updateThemeIcons(theme) {
  const dark = isDarkTheme(theme);
  $('#iconSun').classList.toggle('hidden', dark);
  $('#iconMoon').classList.toggle('hidden', !dark);
}

function updatePickChecks() {
  document.querySelectorAll('.theme-pick-item').forEach(item => {
    const active = item.dataset.themePick === themePick;
    item.classList.toggle('bg-base-200', active);
    const check = item.querySelector('.pick-check');
    if (check) check.classList.toggle('hidden', !active);
  });
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  updateThemeIcons(theme);
  try { localStorage.setItem('memo-theme', theme); } catch {}
}

function applyPick(pick) {
  themePick = pick;
  try { localStorage.setItem('memo-theme-pick', pick); } catch {}
  updatePickChecks();
  if (pick === 'auto') {
    let t = 'light';
    try { t = localStorage.getItem('memo-theme'); } catch {}
    if (!t || (t !== 'light' && t !== 'dark')) {
      t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    applyTheme(t === 'light' || t === 'dark' ? t : 'light');
  } else {
    applyTheme(pick);
  }
}

document.querySelectorAll('.theme-pick-item').forEach(item => {
  item.addEventListener('click', () => {
    applyPick(item.dataset.themePick);
    document.activeElement && document.activeElement.blur();
  });
});

$('#themeBtn').onclick = () => {
  if (themePick !== 'auto') {
    applyPick('auto');
    const cur = document.documentElement.dataset.theme;
    applyTheme(isDarkTheme(cur) ? 'light' : 'dark');
    return;
  }
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
};

(function initTheme() {
  let pick = 'auto';
  try { pick = localStorage.getItem('memo-theme-pick') || 'auto'; } catch {}
  if (!['auto', 'caramellatte', 'halloween'].includes(pick)) pick = 'auto';
  applyPick(pick);
})();

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  if (themePick !== 'auto') return;
  let saved = null;
  try { saved = localStorage.getItem('memo-theme'); } catch {}
  if (saved !== 'light' && saved !== 'dark') applyTheme(e.matches ? 'dark' : 'light');
});

/* ---------- 回到顶部 ---------- */
const toTop = $('#toTop');
mainScroll.addEventListener('scroll', () => {
  const show = mainScroll.scrollTop > 500;
  toTop.style.opacity = show ? '1' : '0';
  toTop.style.pointerEvents = show ? 'auto' : 'none';
}, { passive: true });
toTop.onclick = () => mainScroll.scrollTo({ top: 0, behavior: 'smooth' });

/* ---------- 启动 ---------- */
initFancybox();
switchView('say');
