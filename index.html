<!-- 浏览器/系统 UI 的颜色（iOS Safari 顶栏与底栏、Android 状态栏）。
     浅色原本是 #1a1a2e 那个深藏青 —— 老配色遗留，白页面配深蓝栏，
     正是「跟手机屏幕结合不起来」的元凶。这里给 light 白 / dark #1c1c1e 的兜底值，
     真正的取值由下面的 syncThemeColor() 按**站点主题**动态写（见 §㉑ 的注释：
     本站主题存在 localStorage，可以和系统偏好相反，所以不能用 media 写死）。 -->
<meta name="theme-color" content="#ffffff" id="metaThemeColor" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />

     <title>小记 · 说说与光影</title>
<meta name="description" content="个人说说与影视记录" />

     <style>
  :root { color-scheme: light; --font-family: "LXGW WenKai Screen", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }

  /* ============ 主题配色（仅浅 / 深两套，跟随系统自动切换） ============ */
  :root,
  [data-theme="light"] {
    color-scheme: light;
    --color-base-100: oklch(97% 0.014 105);
    --color-base-200: oklch(93.5% 0.022 105);
    --color-base-300: oklch(88% 0.032 105);
    --color-base-content: oklch(32% 0.02 130);
    --color-primary: oklch(52% 0.062 178);
    --color-primary-content: oklch(97% 0.012 178);
    --color-secondary: oklch(60% 0.05 160);
    --color-secondary-content: oklch(97% 0.012 160);
    --color-accent: oklch(62% 0.085 75);
    --color-accent-content: oklch(97% 0.012 75);
    --color-neutral: oklch(38% 0.02 160);
    --color-neutral-content: oklch(93% 0.015 160);
    /* 圆角尺度（daisyUI 5 token）：勾选 8px / 控件 12px / 卡片 16px */
    --radius-selector: 0.5rem;
    --radius-field: 0.75rem;
    --radius-box: 1rem;
  }
  /* 深色：墨绿炭底 + 亮青主色 */
  [data-theme="halloween"],
  [data-theme="dark"] {
    color-scheme: dark;
    --color-base-100: oklch(22.5% 0.01 190);
    --color-base-200: oklch(19.5% 0.01 190);
    --color-base-300: oklch(27% 0.012 190);
    --color-base-content: oklch(88% 0.012 175);
    --color-primary: oklch(74% 0.095 175);
    --color-primary-content: oklch(21% 0.02 175);
    --color-secondary: oklch(68% 0.045 165);
    --color-secondary-content: oklch(18% 0.012 165);
    --color-accent: oklch(76% 0.09 85);
    --color-accent-content: oklch(20% 0.02 85);
    --color-neutral: oklch(30% 0.012 190);
    --color-neutral-content: oklch(88% 0.012 175);
    /* 圆角尺度（与浅色一致） */
    --radius-selector: 0.5rem;
    --radius-field: 0.75rem;
    --radius-box: 1rem;
  }
  [data-theme="dark"], [data-theme="halloween"] { color-scheme: dark; }
  html { scroll-behavior: smooth; font-family: var(--font-family); font-size: 16.5px; }
  body { -webkit-tap-highlight-color: transparent; font-family: var(--font-family); }

  /* ============ 全站圆润化：不再全局清零圆角，各组件用自身声明 / 主题半径 ============ */
  /* 旧规则（扁平化时期，已废弃）：
     *, *::before, *::after { border-radius: 0 !important; } */

  /* 标签徽章：保证 button 上的 badge 继承全局字体 */
  .tag-chip { font-family: inherit; }

  /* ============ 图片墙（Masonry.js 瀑布流） ============ */
  .photo-sizer,
  .photo-item {
    width: 33.3333%;
  }
  @media (max-width: 640px) {
    .photo-sizer,
    .photo-item {
      width: 50%;
    }
  }
  .photo-sizer {
    visibility: hidden;
    height: 0;
    padding: 0;
    margin: 0;
  }
  .photo-item {
    box-sizing: border-box;
    padding: 5px;
    cursor: zoom-in;
  }
  .photo-item a {
    display: block; width: 100%; height: 100%;
    border-radius: 12px; overflow: hidden;
    background: rgb(128 128 128 / .12);
  }
  .photo-item img { width: 100%; height: auto; display: block; transition: transform .35s ease; }
  @media (hover: hover) { .photo-item:hover img { transform: scale(1.03); } }

  /* ============ Threads 风格横向图片条 ============ */
  .strip-wrap { position: relative; }
  .carousel-strip {
    display: flex;
    align-items: center;   /* 各图按自身高度自适应，垂直居中，避免拉伸出留白 */
    gap: 8px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    -ms-overflow-style: none;
    cursor: grab;
  }
  .carousel-strip::-webkit-scrollbar { display: none; }
  .carousel-strip.dragging { cursor: grabbing; }
  .carousel-strip.dragging img { pointer-events: none; }
  /* Threads 风格：各图按原始比例完整显示，只限制最大尺寸；盒子随图自适应，不会出现上下留白 */
  .strip-item {
    position: relative;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 8rem;
    min-height: 100px;
    max-width: 100%;
    transition: transform .32s cubic-bezier(.34, 1.56, .64, 1);
    transform-origin: center center;
    will-change: transform;
  }
  .strip-item img {
    display: block;
    width: auto; height: auto;
    max-width: 100%;
    max-height: min(56vw, 260px);
    user-select: none;
    -webkit-user-drag: none;
    cursor: inherit;
  }
  @media (min-width: 1024px) {
    .strip-item img { max-height: 340px; }
  }
  .strip-item.pressed {
    transform: scale(.94);
    transition: transform .12s ease-out;
  }
  .strip-end { flex-shrink: 0; }
  @media (hover: hover) { .strip-item img:hover { filter: brightness(1.06); } }
  .strip-count { position: absolute; top: 8px; right: 8px; z-index: 2; pointer-events: none; }
  /* 手机端：多图条改为两列栅格铺满卡片宽度（PC 保持横向滑动） */
  @media (max-width: 640px) {
    .carousel-strip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; overflow: hidden; cursor: default; }
    .carousel-strip .strip-end { display: none; }
    .carousel-strip .strip-item { min-width: 0; min-height: 0; }
    .carousel-strip .strip-item img {
      width: 100%; height: auto; max-height: none;
      aspect-ratio: 4 / 3; object-fit: cover;
    }
    /* 最多展示 9 格，超出折叠；全部可见时无需计数徽章 */
    .carousel-strip .strip-item:nth-child(n + 10) { display: none; }
    .strip-wrap .strip-count { display: none; }
    /* 第 9 格 +N 覆盖层（N = 未展示张数），点击仍打开灯箱查看全部 */
    .carousel-strip .strip-item[data-more] { position: relative; cursor: pointer; }
    .carousel-strip .strip-item[data-more]::after {
      content: '+' attr(data-more);
      position: absolute; inset: 0; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      background: rgb(0 0 0 / .45); color: #fff;
      font-size: 1.4rem; font-weight: 700;
    }
  }
  .hw-lyrics-float {
    position: fixed; z-index: 80;
    width: min(320px, calc(100vw - 24px)); height: 280px;
    display: none; flex-direction: column;
    background: var(--color-base-100); color: var(--color-base-content);
    border: 1px solid var(--color-base-300); border-radius: 14px;
    box-shadow: 0 16px 40px -16px rgb(0 0 0 / .35);
    overflow: hidden; user-select: none;
  }
  .hw-lyrics-float.open { display: flex; }
  .hw-lyrics-float-bar {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 8px 10px; cursor: grab;
    background: var(--color-base-200); border-bottom: 1px solid var(--color-base-300);
    touch-action: none;
  }
  .hw-lyrics-float.dragging .hw-lyrics-float-bar { cursor: grabbing; }
  .hw-lyrics-float-title { font-size: .82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hw-lyrics-float-close {
    appearance: none; border: none; background: transparent; cursor: pointer;
    width: 28px; height: 28px; border-radius: 8px; color: inherit; opacity: .6;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .hw-lyrics-float-close:hover { opacity: 1; background: rgb(128 128 128 / .12); }
  .hw-lyrics-float .hw-lyrics-scroll-full { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 8px; scrollbar-width: none; }
  .hw-lyrics-float .hw-lyrics-scroll-full::-webkit-scrollbar { display: none; }
  .hw-lyrics-float .hw-lyrics-line { color: color-mix(in oklch, var(--color-base-content) 55%, transparent); padding: 3px 6px; text-align: center; font-size: .86rem; line-height: 1.65; transition: color .2s, font-size .2s; }
  .hw-lyrics-float .hw-lyrics-line.active { color: var(--color-primary); font-weight: 700; font-size: .95rem; }
  .hw-lyrics-float .hw-lyrics-empty { margin: auto; text-align: center; opacity: .5; font-size: .82rem; padding: 16px; }
  #headerLyricsBar { user-select: none; }
  /* 底部悬浮歌词药丸栏（自顶栏迁移）：居中悬浮，避开右下角回到顶部按钮 */
  #headerLyricsBar:not(.hidden) {
    position: fixed; z-index: 50;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    left: 50%; transform: translateX(-50%);
    width: min(520px, calc(100vw - 104px));
  }


  /* 骨架屏 */
  .shimmer {
    background: linear-gradient(90deg,
      rgb(128 128 128 / .10) 25%, rgb(128 128 128 / .22) 37%, rgb(128 128 128 / .10) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 0 } 100% { background-position: -100% 0 } }

  /* 海报卡片 */
  .poster-card { transition: transform .25s ease, box-shadow .25s ease; }
  @media (hover: hover) {
    .poster-card:hover { transform: translateY(-4px); box-shadow: 0 16px 36px -16px rgb(0 0 0 / .35); }
  }

  /* fade-up 必须用 backwards 填充：
     both/forwards 会让动画结束时的 `transform:none` 永久生效，
     从而把元素自己的 :hover 位移整个吃掉（海报卡片上浮曾因此失效）；
     另外 `to{opacity:1}` 也会一直压着 opacity-60 这类普通声明。 */
  .fade-up { animation: fadeUp .45s ease backwards; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

  .memo-text { word-break: break-word; overflow-wrap: anywhere; }
  /* 正文链接：主题色药丸底，换行时每个片段保留圆角，带外链箭头提示 */
  .memo-text a {
    color: var(--color-primary);
    background: color-mix(in oklch, var(--color-primary) 10%, transparent);
    padding: 0.08em 0.45em;
    border-radius: 6px;
    text-decoration: none;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    transition: background .15s ease;
  }
  .memo-text a:hover {
    background: color-mix(in oklch, var(--color-primary) 22%, transparent);
  }
  .memo-text a::after {
    content: '↗';
    font-size: .78em;
    margin-left: 1px;
    opacity: .55;
  }

  /* ============ Markdown 渲染样式 ============ */
  .memo-text h1, .memo-text h2, .memo-text h3, .memo-text h4, .memo-text h5, .memo-text h6 {
    font-weight: 700; line-height: 1.4; margin: 0.9em 0 0.45em;
  }
  .memo-text h1 { font-size: 1.45em; }

  /* ## 水彩笔涂划：双层柔化色块模拟水彩笔刷过的痕迹（主题色、低透明度保证文字可读） */
  .memo-text h2 {
    font-size: 1.32em;
    width: fit-content;
    position: relative;
    z-index: 0;
    padding: .1em .45em .16em .5em;
  }
  .memo-text h2::before,
  .memo-text h2::after {
    content: '';
    position: absolute;
    z-index: -1;
    filter: blur(5px);
  }
  .memo-text h2::before {
    inset: .08em -.1em .04em -.32em;
    background: var(--color-primary);
    opacity: .28;
    border-radius: 20% 70% 65% 25% / 55% 90% 40% 60%;
    transform: rotate(-.8deg) skewX(-10deg);
  }
  .memo-text h2::after {
    inset: .12em -.28em .02em -.18em;
    background: var(--color-accent);
    opacity: .16;
    border-radius: 75% 25% 40% 70% / 45% 35% 80% 55%;
    transform: rotate(1deg) skewX(-8deg);
  }

  /* ### 下划线 */
  .memo-text h3 {
    font-size: 1.18em;
    text-decoration: underline;
    text-decoration-color: var(--color-primary);
    text-decoration-thickness: 2px;
    text-underline-offset: 5px;
  }

  .memo-text h4, .memo-text h5, .memo-text h6 { font-size: 1.05em; }
  /* #### 波浪线 */
  .memo-text h4 {
    text-decoration: underline wavy var(--color-accent);
    text-decoration-thickness: 1.5px;
    text-underline-offset: 5px;
  }
  .memo-text p { margin: 0.5em 0; }
  .memo-text ul, .memo-text ol { margin: 0.5em 0; padding-left: 1.4em; }
  .memo-text ul { list-style: disc; }
  .memo-text ol { list-style: decimal; }
  .memo-text li { margin: 0.2em 0; }
  .memo-text blockquote {
    margin: 0.6em 0; padding: 0.25em 0.9em;
    border-left: 3px solid oklch(60% .18 250 / .6);
    color: color-mix(in oklch, currentColor 70%, transparent);
  }
  .memo-text code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    background: rgb(128 128 128 / .15); padding: 0.1em 0.4em; border-radius: 6px; font-size: .88em;
  }
  .memo-text pre {
    margin: 0.7em 0; padding: 0.85em 1em; border-radius: 10px;
    background: rgb(128 128 128 / .12); overflow-x: auto;
  }
  .memo-text pre code { background: transparent; padding: 0; border-radius: 0; font-size: .86em; line-height: 1.6; }
  .memo-text table { border-collapse: collapse; margin: 0.7em 0; width: 100%; font-size: .95em; }
  .memo-text th, .memo-text td { border: 1px solid rgb(128 128 128 / .35); padding: 0.4em 0.7em; text-align: left; }
  .memo-text th { background: rgb(128 128 128 / .12); font-weight: 600; }
  .memo-text hr { border: none; border-top: 1px solid rgb(128 128 128 / .35); margin: 1em 0; }
  .memo-text img { max-width: 100%; border-radius: 10px; }

  /* 隐藏所有滚动条（保留滚动功能，营造系统 APP 无滚动条体验） */
  * {
    scrollbar-width: none;           /* Firefox */
    -ms-overflow-style: none;        /* IE/Edge */
  }
  *::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }

  /* ============ 歌词均衡器动画 ============ */
  .eq {
    display: flex; align-items: flex-end;
    gap: 2.5px; height: 16px; flex-shrink: 0;
  }
  .eq i {
    width: 3px; border-radius: 2px;
    background: linear-gradient(180deg, var(--color-primary), var(--color-accent));
    animation: eq-bounce 1s ease-in-out infinite;
    transform-origin: bottom;
  }
  .eq i:nth-child(1) { height: 60%; animation-delay: 0s; }
  .eq i:nth-child(2) { height: 100%; animation-delay: .18s; }
  .eq i:nth-child(3) { height: 45%; animation-delay: .36s; }
  .eq i:nth-child(4) { height: 80%; animation-delay: .54s; }
  @keyframes eq-bounce { 50% { transform: scaleY(.35); } }

  /* ============ 深色主题下内容图片降亮度（避免刺眼） ============ */
  html:is([data-theme="dark"], [data-theme="halloween"]) #content img {
    filter: brightness(.75);
  }
  html:is([data-theme="dark"], [data-theme="halloween"]) .strip-item img:hover {
    filter: brightness(.85);
  }

  /* ============ 应用框架：侧边栏布局（daisyUI Drawer） ============ */
  #appDrawer { height: 100dvh; }
  #appDrawer > .drawer-content { height: 100dvh; }
  /* daisyUI 静态 CSS 不含响应式 open 变体：大屏按官方 drawer-open 规则常驻显示侧栏 */
  @media (min-width: 1024px) {
    #appDrawer > .drawer-toggle { display: none; }
    #appDrawer > .drawer-toggle ~ .drawer-side {
      pointer-events: auto;
      visibility: visible;
      opacity: 1;
      overscroll-behavior: auto;
      width: auto;
      height: 100dvh;
      display: block;
      position: sticky;
      top: 0;
      overflow-y: auto;
    }
    #appDrawer > .drawer-toggle ~ .drawer-side > .drawer-overlay { display: none; }
    #appDrawer > .drawer-toggle ~ .drawer-side > :not(.drawer-overlay) { translate: 0%; will-change: auto; }
  }

  /* 侧栏菜单项（参考图样式：圆角行 + 主题色高亮 + 左侧指示条） */
  #appSidebar .menu li > a,
  #appSidebar .menu li > summary,
  #appSidebar .menu li > button,
  #appSidebar .menu li > label {
    border-radius: .75rem;
    font-weight: 500;
    padding-block: .4375rem;
  }
  #appSidebar .menu .tab-btn.active {
    background: color-mix(in oklch, var(--color-primary) 13%, transparent);
    color: var(--color-primary);
  }
  #appSidebar .menu > li { position: relative; }
  #appSidebar .menu > li:has(> .tab-btn.active)::before {
    content: '';
    position: absolute;
    left: -.75rem;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 1.35em;
    border-radius: 999px;
    background: var(--color-primary);
  }
  /* 子项激活时父级“标记”同步着色 */
  #appSidebar details:has(> ul .tab-btn.active) > summary { color: var(--color-primary); }

  /* 热门标签列表（参考图样式：彩点 + 名称 + 数量） */
  .sidebar-tag {
    display: flex;
    align-items: center;
    gap: .6rem;
    width: 100%;
    padding: .45rem .65rem;
    border-radius: .7rem;
    font-size: .92rem;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .sidebar-tag:hover { background: color-mix(in oklch, var(--color-base-content) 8%, transparent); }
  .sidebar-tag.active {
    background: color-mix(in oklch, var(--color-primary) 14%, transparent);
    color: var(--color-primary);
  }
  .tag-dot {
    width: .8rem;
    height: .8rem;
    border-radius: 50%;
    flex: 0 0 auto;
    background: var(--dot, var(--color-primary));
    box-shadow: inset 0 0 0 1px rgb(0 0 0 / .08), inset 0 -2px 3px rgb(0 0 0 / .12);
  }
  .sidebar-tag .tag-count {
    margin-left: auto;
    font-size: .78rem;
    opacity: .55;
    font-variant-numeric: tabular-nums;
  }

  /* ============================================================
     手账时间轴主题（概念 B）
  ============================================================ */
  /* 全站隐藏滚动条：保留滚动能力，视觉上像原生 APP */
  * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
  *::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }

  /* 页面底色：全站统一单一底色（无多层背景色带） */
  .paper-bg {
    background-color: var(--color-base-100);
  }
  #topNav { border-bottom-color: color-mix(in oklch, var(--color-base-content) 10%, transparent); }
  /* 标签区标题（替代原分隔横线，标示下方为标签列表） */
  .tag-title { font-size: 1.02rem; font-weight: 700; padding: .4rem .25rem .45rem; letter-spacing: .1em; }

  /* 侧栏资料卡 */
  .side-profile { display: flex; align-items: center; gap: .8rem; padding: .95rem .95rem .4rem; }
  .side-profile img {
    width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex: 0 0 auto;
    border: 2px solid var(--color-base-100);
    box-shadow: 0 2px 10px color-mix(in oklch, var(--color-base-content) 18%, transparent);
  }
  .side-profile .name { font-weight: 700; line-height: 1.25; }
  /* 资料卡功能图标行（原 bio 位置） */
  .side-actions { display: flex; align-items: center; gap: 2px; margin-top: 3px; }

  /* 侧栏激活项：淡底 + 左侧竖条指示 */
  #appSidebar .menu .tab-btn.active {
    background: color-mix(in oklch, var(--color-base-content) 7%, transparent);
    color: var(--color-primary);
    border-color: transparent;
    box-shadow: none;
  }

  /* 侧栏菜单：一行一项 */
  #appSidebar .menu { gap: 2px; }
  #appSidebar .menu .tab-btn {
    padding: .45rem .55rem;
    font-size: .92rem;
    gap: .55rem;
    border: 1px solid transparent;
    min-height: 0;
  }
  #appSidebar .menu .tab-btn .iconify { font-size: 1.15rem; }
  #appSidebar .menu > li { position: relative; }
  /* 激活项左侧竖条指示（圆角短棒，骑在条目左缘） */
  #appSidebar .menu > li:has(> .tab-btn.active)::before {
    content: '';
    position: absolute;
    left: -10px;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 1.5em;
    border-radius: 999px;
    background: var(--color-primary);
  }

  /* 桌面端：侧栏 + 主区合并为一个居中的宽屏面板（C 杂志风：纯色、无边框、无阴影） */
  @media (min-width: 1024px) {
    /* body 自身 padding 撑出边距，避免与面板 margin 塌陷露出 html 白底 */
    body { padding: 16px; }
    #appDrawer {
      height: calc(100dvh - 32px);
      max-width: 1560px;
      margin: 0 auto;
      background: var(--color-base-100);
      overflow: hidden;
    }
    #appDrawer > .drawer-content { height: 100%; }
    #appDrawer > .drawer-toggle ~ .drawer-side { height: 100%; }
    /* 关键：把 grid 行高钉死为 1fr，否则 100% 高度链会退化为内容高度，面板内无法内部滚动 */
    #appDrawer { grid-template-rows: minmax(0, 1fr); }
    #appShell { height: 100%; background: transparent; border: none; box-shadow: none; border-radius: 0; overflow: hidden; }
    /* 顶栏（汉堡 + 标题）只在移动端存在 */
    #appShell > header { display: none; }
    /* 侧栏是面板内的透明分区，与主区之间无分隔线 */
    #appSidebar {
      height: 100%;
      margin: 0; border-radius: 0;
      background: transparent;
      border: none;
      backdrop-filter: none; -webkit-backdrop-filter: none;
      box-shadow: none;
    }
  }

  

  /* ====== 说说：无时间线轨道，卡片占满主内容区 ====== */
  #content ul.memo-list { width: 100%; max-width: none; margin: 0; padding: 0; list-style: none; }
  #content ul.memo-list > li { display: block; width: 100%; margin: 0; padding: 0 0 1.25rem; }
  #content ul.memo-list .memo-card { width: 100%; }

  /* 便签卡：与页面同底色，以描边 + 阴影区分 */
  .memo-card {
    position: relative;
    background: var(--color-base-100);
    border: 1px solid color-mix(in oklch, var(--color-base-content) 10%, transparent);
    border-radius: 14px;
    padding: 1.1rem 1.25rem .8rem;
    box-shadow: 0 2px 14px color-mix(in oklch, var(--color-base-content) 7%, transparent);
  }
  /* 和纸胶带装饰（.memo-card::before）已彻底移除——用户不再需要胶布 UI。
     注意：骨架屏 skeletonNotes() 用的也是 .memo-card，所以以前刷新首页时
     骨架卡片上会露出这块胶布（它没有 .memo-tape-date，:has() 那条隐藏规则不生效）。 */

  @media (max-width: 640px) {
    .memo-card { padding: 1rem 1rem .75rem; }
  }

  /* 单图说说：图文左右分栏（按条目稳定随机左右），标签跟在文字下方 */
  .memo-split { display: grid; grid-template-columns: 5fr 7fr; gap: 22px; align-items: center; }
  .memo-split.rev { grid-template-columns: 7fr 5fr; }
  .memo-split.rev .split-img { order: 2; }
  .memo-split.rev .split-text { order: 1; }
  .split-img img { width: 100%; height: 230px; object-fit: cover; cursor: zoom-in; display: block; }
  .memo-split .split-text .memo-text { font-size: 1.02rem; }
  @media (max-width: 640px) {
    .memo-split, .memo-split.rev { grid-template-columns: 1fr; gap: 12px; }
    .memo-split.rev .split-img { order: 0; }
    .split-img img { height: auto; }
  }

  /* 弹窗里的单条说说（无时间线轨道） */
  .memo-entry { max-width: 760px; margin: 0 auto; }

  @media (max-width: 640px) {
    .memo-bubble, .sk-bubble { width: 42px; height: 42px; }

  /* ====== 刊头「花镜」偈（仅说说视图） ====== */
  #masthead { text-align: center; padding: 3rem 0 .6rem; }

  html:is([data-theme="dark"], [data-theme="halloween"]) #appSidebar .menu .tab-btn.active {

  }

  @media (max-width: 640px) {
    .memo-entry { padding: 1.3rem 0 1.2rem; }
  }

  /* ============ 音乐抽屉（右侧滑出播放器） ============ */

  .music-drawer .hw-time { font-size: .72rem; color: var(--secondary-text); font-weight: 500; min-width: 32px; }

  /* ============ 单图等比显示（参考 Threads：按原始比例呈现，不强行拉满容器宽度） ============ */

  /* ============ iOS 安全区适配 ============ */
  /* 100vh 在 iOS Safari 里包含地址栏高度，底部内容会被压在工具栏下面；改用动态视口高度（不支持的旧浏览器自动回退 h-screen 的 100vh） */
  body { height: 100dvh !important; }
  /* 顶部导航避开状态栏/刘海（viewport-fit=cover 时内容会顶到屏幕物理边缘） */
  #topNav { padding-top: env(safe-area-inset-top, 0px); }

  #toTop { bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)); }

}

#mediaPager .join .btn-disabled {

}
  /* ============ 全站快速搜索（Ctrl+K Command Palette） ============ */

/* ============================================================
   标签抽屉 v1：像音乐歌单一样的左侧纸页抽屉
   ============================================================ */

.tag-drawer-overlay {
  position: fixed;
  inset: 0;
  z-index: 88;
  background: rgba(35, 27, 19, .24);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .28s ease;
}

.tag-drawer-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.tag-drawer {
  position: fixed !important;
  top: 0;
  left: 0;
  bottom: 0;
  width: min(390px, 88vw);
  z-index: 89;
  display: flex !important;
  flex-direction: column;
  background:
    linear-gradient(90deg, rgba(112, 88, 59, .035), transparent 22%),
    var(--journal-paper);
  color: var(--journal-ink);
  border-right: 1px solid rgba(83, 68, 48, .18);
  box-shadow:
    14px 0 36px rgba(48, 35, 22, .18),
    2px 0 8px rgba(48, 35, 22, .08);
  transform: translateX(-104%);
  transition: transform .38s cubic-bezier(.22, 1, .36, 1);
  overflow: hidden;
}

.tag-drawer.hidden {
  display: flex !important;
}

.tag-drawer.open {
  transform: translateX(0);
}

.tag-drawer::after {
  content: "";
  position: absolute;
  top: 0;
  right: 10px;
  bottom: 0;
  width: 1px;
  background: linear-gradient(
    transparent,
    rgba(100, 77, 50, .14) 18%,
    rgba(100, 77, 50, .08) 82%,
    transparent
  );
  pointer-events: none;
}

.tag-drawer-head {
  flex: 0 0 auto;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 28px 28px 20px;
  border-bottom: 1px dashed rgba(91, 72, 49, .16);
}

.tag-drawer-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 1.22rem;
  font-weight: 700;
  letter-spacing: .12em;
}

.tag-drawer-subtitle {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 5px;
  margin-left: 28px;
  color: var(--journal-muted);
  font-size: .72rem;
  letter-spacing: .12em;
}

 

.tag-drawer-close {
  appearance: none;
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  border: none;
  background: transparent;
  color: var(--journal-muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  transition: background .18s ease, color .18s ease;
}

/* hover 只做颜色反馈，不再出现大方块底 */
.tag-drawer-close:hover {
  background: transparent !important;
  box-shadow: none !important;
  color: var(--journal-ink);
}

.tag-drawer-current {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 18px 24px 10px;
  padding: 12px 13px;
  background: rgba(128, 103, 70, .055);
  border-left: 3px solid #9a7d55;
}

.tag-drawer-current-label {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.tag-drawer-current-label > span:first-child {
  color: var(--journal-muted);
  font-size: .68rem;
  letter-spacing: .16em;
}

#tagSelectedSummary {
  font-size: .84rem;
  color: #765f40;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tag-drawer-clear {
  flex: 0 0 auto;
  border: none;
  background: transparent;
  color: var(--journal-muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 3px;
  font: inherit;
  font-size: .74rem;
}

.tag-drawer-clear:hover {
  color: #765f40;
}

.tag-drawer-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 6px 24px 30px;
}

.tag-drawer-body .tag-title {
  border-top: none !important;
  margin-top: 0 !important;
  padding: 9px 2px 12px !important;
  color: var(--journal-muted) !important;
  font-size: .72rem !important;
  font-weight: 600 !important;
  letter-spacing: .18em !important;
}

.tag-drawer-list {
  display: flex !important;
  flex-direction: column !important;
  gap: 4px !important;
}

.tag-drawer-list .tag-chip {
  width: 100%;
  min-height: 44px;
  display: flex !important;
  align-items: center;
  gap: 10px;
  padding: 9px 10px !important;
  border: 1px solid transparent !important;
  border-bottom: 1px dashed rgba(91, 72, 49, .10) !important;
  border-radius: 2px !important;
  background: transparent !important;
  color: var(--journal-ink) !important;
  text-align: left;
  cursor: pointer;
  transition:
    background .18s ease,
    padding-left .18s ease,
    border-color .18s ease;
}

.tag-drawer-list .tag-chip:hover {
  background: rgba(112, 89, 60, .055) !important;
  padding-left: 14px !important;
}

.tag-drawer-list .tag-chip.active {
  background: rgba(139, 113, 76, .10) !important;
  border-color: rgba(139, 113, 76, .10) !important;
  color: #705938 !important;
}

.tag-drawer-list .tag-dot {
  flex: 0 0 auto;
  width: 9px;
  height: 9px;
}

.tag-drawer-chip-name {
  min-width: 0;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: .9rem;
  letter-spacing: .025em;
}

.tag-drawer-list .tag-count {
  flex: 0 0 auto;
  color: var(--journal-muted);
  font-size: .72rem;
  opacity: .72;
}

.tag-drawer-check {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  color: #806844;
  opacity: .9;
}

.tag-drawer-check.hidden {
  display: none !important;
}

#tagSelectedCount {
  min-width: 1.15rem;
  height: 1.15rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(112, 89, 60, .18);
  background: rgba(139, 113, 76, .07);
  color: #806844;
}
#tagSelectedCount.hidden {
  display: none !important;
}
/* 桌面端：标签抽屉盖在手账和侧栏之上，像一本从书架抽出的标签索引 */
@media (min-width: 1024px) {
  .tag-drawer {
    width: 390px;
  }
}

 /* 移动端：抽屉加宽、内边距收紧，避免拥挤 */
@media (max-width: 1023px) {
  .tag-drawer {
    width: min(390px, 92vw);
  }

  .tag-drawer-head {
    gap: 10px;
    padding: 20px 18px 15px;
  }

  .tag-drawer-title {
    font-size: 1.1rem;
  }

  .tag-drawer-subtitle {
    margin-top: 4px;
    margin-left: 27px;
  }

  .tag-drawer-close {
    width: 30px;
    height: 30px;
  }

  .tag-drawer-current {
    margin: 12px 16px 8px;
    padding: 10px 12px;
  }

  .tag-drawer-body {
    padding: 4px 16px 26px;
  }

  .tag-drawer-body .tag-title {
    padding: 6px 2px 10px !important;
  }

  .tag-drawer-list .tag-chip {
    min-height: 40px;
    padding: 7px 8px !important;
    gap: 8px;
  }

  .tag-drawer-chip-name {
    font-size: .86rem;
  }
}

/* 深色手账 */
html:is([data-theme="dark"], [data-theme="halloween"]) .tag-drawer {
  background:
    linear-gradient(90deg, rgba(255,255,255,.015), transparent 22%),

}

}
html:is([data-theme="dark"], [data-theme="halloween"]) .tag-drawer-close {

}
html:is([data-theme="dark"], [data-theme="halloween"]) .tag-drawer-close:hover {

}
html:is([data-theme="dark"], [data-theme="halloween"]) #tagSelectedSummary,
html:is([data-theme="dark"], [data-theme="halloween"]) .tag-drawer-list .tag-chip.active,

}

html:is([data-theme="dark"], [data-theme="halloween"]) .tag-drawer-list .tag-chip:hover {

}

html:is([data-theme="dark"], [data-theme="halloween"]) .tag-drawer-current {
  background: rgba(218, 199, 166, .055);
  border-left-color: #aa8b5e;
}

</style>

/* ============================================================

const $ = sel => document.querySelector(sel);
// ========== 滚动管理器（兼容 body 滚动与 #mainScroll 滚动） ==========
const SCROLL_BREAKPOINT = 1024; // 与 tailwind lg: 对齐
function isBodyScroll() {
  return window.innerWidth < SCROLL_BREAKPOINT;
}
function getScrollPos() {
  if (isBodyScroll()) return window.scrollY;
  return mainScroll ? mainScroll.scrollTop : 0;
}
function setScrollPos(pos) {
  if (isBodyScroll()) {
    window.scrollTo(0, pos);
  } else if (mainScroll) {
    mainScroll.scrollTop = pos;
  }
}
function scrollToTop(opts = {}) {
  const pos = 0;
  if (opts.behavior === 'smooth') {
    if (isBodyScroll()) {
      window.scrollTo({ top: pos, behavior: 'smooth' });
    } else if (mainScroll) {
      mainScroll.scrollTo({ top: pos, behavior: 'smooth' });
    }
  } else {
    setScrollPos(pos);
  }
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function relativeTime(rawDate) {
  const t = new Date(String(rawDate).replace(' ', 'T')).getTime();
  if (!Number.isFinite(t)) return rawDate || '';
  const diff = Date.now() - t;
  const m = 6e4, h = 36e5, d = 864e5;
  if (diff < m) return '刚刚';
  if (diff < h) return Math.floor(diff / m) + ' 分钟前';
  if (diff < d) return Math.floor(diff / h) + ' 小时前';
  if (diff < 7 * d) return Math.floor(diff / d) + ' 天前';
  return String(rawDate).split(' ')[0];
}

function fmtDate(rawDate) {
  const s = String(rawDate || '');
  return s.length >= 16 ? s.slice(0, 16) : s;
}

function parseContent(raw) {
  const content = String(raw || '');
  const images = [];
  const imgRe = /!\[([^\]]*)\]\(\s*(https?:[^)\s]+?)\s*\)|(https?:\/\/[^\s<>"']+?\.(?:png|jpe?g|gif|webp|avif|bmp)(?:\?[^\s<>"']*)?)|<img[^>]+?src=["']([^"']+)["'][^>]*>/gi;
  const text = content.replace(imgRe, (m, alt, mdUrl, bareUrl, htmlUrl) => {
    const url = mdUrl || bareUrl || htmlUrl;
    if (url) images.push({ url, alt: alt || '' });
    return '\n';
  });

  let html;
  if (window.marked && typeof marked.parse === 'function') {
    try {
      html = marked.parse(text, { gfm: true, breaks: true, extendedAutolinks: true });
    } catch {
      html = escapeHtml(text).replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
    }
  } else {
    html = escapeHtml(text)
      .replace(/(https?:\/\/[^\s&lt;&gt;"']+)/g, '<a href="$1">$1</a>')
      .replace(/\n{2,}/g, '<br><br>')
      .replace(/\n/g, '<br>');
  }

  // 正文里的所有链接统一在新标签页打开
  html = html.replace(/<a\s+/gi, '<a target="_blank" rel="noopener noreferrer" ');

  return { html, images };
}

const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
function animateValue(from, to, duration, onUpdate, onDone) {
  const start = performance.now();
  let raf;
  function frame(now) {
    const p = Math.min((now - start) / duration, 1);
    onUpdate(from + (to - from) * easeOutQuart(p));
    if (p < 1) raf = requestAnimationFrame(frame);
    else onDone && onDone();
  }
  raf = requestAnimationFrame(frame);
  return () => cancelAnimationFrame(raf);
}

============================================================ */
async function fetchApi(params) {
  const res = await fetch(API_BASE + '?' + params.toString(), { headers: { 'Accept': 'application/json' } });
  if (!res.ok) throw new Error(`请求失败 (${res.status})`);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function fetchData({ view, page = 1, tags = [] }) {
  if (!USE_MOCK) {
    const params = new URLSearchParams({ view });
    if (view === 'say') {
      params.set('page', page);
      if (tags.length) params.set('tags', tags.join(','));
    }
    return fetchApi(params);
  }

  await sleep(300 + Math.random() * 400);

  if (view === 'tags') {
    const countMap = new Map();
    MOCK_MEMOS.forEach(m => (m.tags || []).forEach(t => countMap.set(t, (countMap.get(t) || 0) + 1)));
    const tagsArr = [...countMap.entries()]
      .filter(([id]) => MOCK_TAGS[id])
      .map(([id, count]) => ({ id, name: MOCK_TAGS[id], count }))
      .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'zh-CN'));
    return { data: tagsArr, total: tagsArr.length };
  }

  if (view === 'say') {
    let list = MOCK_MEMOS;
    if (tags.length) list = list.filter(m => tags.every(t => (m.tags || []).includes(t)));
    const total = list.length;
    const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
    const p = Math.min(Math.max(1, page), totalPages);
    return { data: list.slice((p - 1) * PAGE_SIZE, p * PAGE_SIZE), total, page: p, totalPages };
  }

  const list = MOCK_MEDIA[view] || [];
  return { data: list, total: list.length, page: 1, totalPages: 1 };
}

/* ============================================================
   图片灯箱：Fancybox（委托打开，兼容动态渲染内容）
============================================================ */
function initFancybox() {
  if (!window.Fancybox) return;
  document.addEventListener('click', e => {
    const trigger = e.target.closest('[data-fancybox]');
    if (!trigger) return;
    e.preventDefault();
    const group = trigger.getAttribute('data-fancybox') || 'gallery';
    // 排除手机端 +N 覆盖格（div），它只是灯箱入口，本身不算一页
    const items = [...document.querySelectorAll(`[data-fancybox="${group}"]`)]
      .filter(a => !a.classList.contains('strip-item'))
      .map(a => ({
        src: a.getAttribute('href') || a.getAttribute('data-src') || '',
        caption: a.getAttribute('data-caption') || '',
      }))
      .filter(it => it.src);
    const target = trigger.getAttribute('href') || trigger.getAttribute('data-src') || '';
    const startIndex = Math.max(0, items.findIndex(it => it.src === target));
    Fancybox.show(items, { startIndex });
  });
}

  const items = images.map((img, i) => {

    const more = images.length > 9 && i === 8
      ? ` data-more="${images.length - 8}" data-fancybox="${escapeHtml(g)}" data-src="${escapeHtml(img.url)}" data-caption="${escapeHtml(img.alt || '')}"`
      : '';
    return `
    <div class="strip-item rounded-xl overflow-hidden bg-base-300/50"${more}>
      <img src="${escapeHtml(img.url)}" alt="${escapeHtml(img.alt)}" loading="lazy"
           data-fancybox="${escapeHtml(g)}" data-src="${escapeHtml(img.url)}"
           data-caption="${escapeHtml(img.alt || '')}" />
    </div>`;
  }).join('');

  return `
  <div class="strip-wrap mt-3">
    <div class="carousel-strip">
      ${items}
      <div class="strip-end w-1"></div>
    </div>
    ${images.length > 2 ? `<span class="strip-count badge badge-sm bg-black/55 text-white border-none backdrop-blur-sm">1 / ${images.length}</span>` : ''}
  </div>`;
}
   
   
function initCarousels(root) {
  root.querySelectorAll('.carousel-strip').forEach(strip => {
    if (strip.dataset.carouselInit) return;
    strip.dataset.carouselInit = '1';

    const wrap = strip.closest('.strip-wrap');
    const badge = wrap && wrap.querySelector('.strip-count');
    const maxScroll = () => Math.max(0, strip.scrollWidth - strip.clientWidth);
    const itemW = () => {
      const first = strip.querySelector('.strip-item');
      return first ? first.getBoundingClientRect().width + 8 : strip.clientWidth * 0.72;
    };

    if (badge) {
      const update = () => {
        const total = strip.querySelectorAll('.strip-item').length;
        const i = strip.scrollLeft >= maxScroll() - 2
          ? total - 1
          : Math.round(strip.scrollLeft / itemW());
        badge.textContent = `${Math.min(Math.max(i + 1, 1), total)} / ${total}`;
      };
      strip.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
    }

    let down = false, startX = 0, startL = 0, moved = 0;
    let samples = [];
    let cancelGlide = null;
    let pressedItem = null;

    const releasePress = () => {
      if (pressedItem) {
        pressedItem.classList.remove('pressed');
        pressedItem = null;
      }
    };

    const glideTo = target => {
      const to = Math.max(0, Math.min(target, maxScroll()));
      const from = strip.scrollLeft;
      const dist = Math.abs(to - from);
      if (dist < 1) return;
      if (cancelGlide) cancelGlide();
      const duration = Math.min(200 + dist * 0.55, 550);
      cancelGlide = animateValue(from, to, duration, v => { strip.scrollLeft = v; }, () => {
        cancelGlide = null;
      });
    };

    strip.addEventListener('pointerdown', e => {
      pressedItem = e.target.closest('.strip-item');
      if (pressedItem) pressedItem.classList.add('pressed');

      if (e.pointerType === 'touch') return;
      if (cancelGlide) { cancelGlide(); cancelGlide = null; }
      down = true; moved = 0;
      startX = e.clientX; startL = strip.scrollLeft;
      samples = [{ x: e.clientX, t: performance.now() }];
    });
    strip.addEventListener('pointermove', e => {
      if (!down) return;
      const dx = e.clientX - startX;
      moved = Math.max(moved, Math.abs(dx));
      if (moved > 4) {
        strip.classList.add('dragging');
        try { strip.setPointerCapture(e.pointerId); } catch {}
      }
      strip.scrollLeft = startL - dx;
      samples.push({ x: e.clientX, t: performance.now() });
      if (samples.length > 6) samples.shift();
    });
    const up = () => {
      releasePress();
      if (!down) return;
      down = false;
      strip.classList.remove('dragging');
      if (moved > 8) strip.dataset.justDragged = '1';
      let v = 0;
      if (samples.length >= 2) {
        const a = samples[0], b = samples[samples.length - 1];
        const dt = b.t - a.t;
        if (dt > 0) v = (b.x - a.x) / dt;
      }
      glideTo(strip.scrollLeft - v * 220);
    };
    strip.addEventListener('pointerup', up);
    strip.addEventListener('pointercancel', up);
    strip.addEventListener('pointerleave', up);
    strip.addEventListener('click', e => {
      if (strip.dataset.justDragged) {
        delete strip.dataset.justDragged;
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);
  });
}

// 横向拖拽滚动（PC 端鼠标拖拽，移动端走原生触摸滚动）
function initDragScroll(el) {
  if (!el || el.dataset.dragScroll) return;
  el.dataset.dragScroll = '1';

  let down = false, startX = 0, startL = 0, moved = 0;
  let samples = [];
  let cancelGlide = null;

  const maxScroll = () => Math.max(0, el.scrollWidth - el.clientWidth);

  const glideTo = target => {
    const to = Math.max(0, Math.min(target, maxScroll()));
    const from = el.scrollLeft;
    const dist = Math.abs(to - from);
    if (dist < 1) return;
    if (cancelGlide) cancelGlide();
    const duration = Math.min(200 + dist * 0.55, 550);
    cancelGlide = animateValue(from, to, duration, v => { el.scrollLeft = v; }, () => { cancelGlide = null; });
  };

  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') return;   // 移动端交给原生触摸滚动
    if (cancelGlide) { cancelGlide(); cancelGlide = null; }
    down = true; moved = 0;
    startX = e.clientX; startL = el.scrollLeft;
    samples = [{ x: e.clientX, t: performance.now() }];
  });

  el.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - startX;
    moved = Math.max(moved, Math.abs(dx));
    if (moved > 4) {
      el.classList.add('dragging');
      try { el.setPointerCapture(e.pointerId); } catch {}
    }
    el.scrollLeft = startL - dx;
    samples.push({ x: e.clientX, t: performance.now() });
    if (samples.length > 6) samples.shift();
  });

  const up = () => {
    if (!down) return;
    down = false;
    el.classList.remove('dragging');
    if (moved > 8) el.dataset.justDragged = '1';
    let v = 0;
    if (samples.length >= 2) {
      const a = samples[0], b = samples[samples.length - 1];
      const dt = b.t - a.t;
      if (dt > 0) v = (b.x - a.x) / dt;
    }
    glideTo(el.scrollLeft - v * 220);
  };

  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);

  // 拖拽后阻止 click（避免误触标签切换）
  el.addEventListener('click', e => {
    if (el.dataset.justDragged) {
      delete el.dataset.justDragged;
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);
}

// 根据标签 id 生成稳定颜色（同一标签始终同色，不同标签颜色分散）
function tagColor(id) {
  let h = 0;
  const s = String(id);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return TAG_COLORS[h % TAG_COLORS.length];
}

// 解析 rawDate（"YYYY-MM-DD HH:mm:00"）为日期牌所需信息（含年份，不同年份同月日不会合并）；解析失败返回 null
function tapeTime(rawDate) {
  const t = new Date(String(rawDate || '').replace(' ', 'T'));
  if (!Number.isFinite(t.getTime())) return '';
  const diff = Date.now() - t.getTime();
  const minute = 6e4, hour = 36e5, day = 864e5;
  if (diff >= 0 && diff < minute) return '刚刚';
  if (diff >= 0 && diff < hour) return Math.floor(diff / minute) + '分钟前';
  if (diff >= 0 && diff < day) return Math.floor(diff / hour) + '小时前';
  if (diff >= 0 && diff < 7 * day) return Math.floor(diff / day) + '天前';
  return (t.getMonth() + 1) + '月' + t.getDate() + '日';
}
function memoCard(m, idx, { plain = false, parsed = null, imgs = null, single = false, rev = false } = {}) {

/* ============================================================
   影视筛选（迁移自参考站：类型单选 / 年代多选 OR / 题材多选 AND）
   全程操作前端缓存，不重新请求 API
============================================================ */
function mediaFiltersActive(view) {
  const f = state.mediaFilter[view];
  return f.type !== 'all' || f.ranges.size > 0 || f.genres.size > 0;
}

function resetMediaFilter(view) {
  state.mediaFilter[view] = { type: 'all', ranges: new Set(), genres: new Set() };
}

function getFilteredMedia(view) {
  const list = state.mediaCache[view] || [];
  const f = state.mediaFilter[view];
  return list.filter(m => {
    if (f.type !== 'all' && m.media_type !== f.type) return false;
    if (f.ranges.size) {
      const y = parseInt(String(m.release_date || '').slice(0, 4), 10);
      if (!Number.isFinite(y)) return false;
      let hit = false;
      f.ranges.forEach(id => {
        const r = RELEASE_RANGES.find(r => r.id === id);
        if (r && r.test(y)) hit = true;
      });
      if (!hit) return false;
    }
    if (f.genres.size) {
      const gids = Array.isArray(m.genre_ids) ? m.genre_ids : [];
      for (const g of f.genres) if (!gids.includes(g)) return false;
    }
    return true;
  });
}

/* 可选题材：从当前视图缓存中统计，且与类型、年代联动（电影→电影题材，剧集→剧集题材，选年代后题材数量即时刷新） */
function availableGenres(view) {
  const f = state.mediaFilter[view];
  const list = state.mediaCache[view] || [];
  // 题材数量 = 当前「类型 + 年代」条件下各题材的独立数量（不考虑已选题材的 AND 约束）
  const pool = list.filter(m => {
    if (f.type !== 'all' && m.media_type !== f.type) return false;
    if (f.ranges.size) {
      const y = parseInt(String(m.release_date || '').slice(0, 4), 10);
      if (!Number.isFinite(y)) return false;
      let hit = false;
      for (const id of f.ranges) {
        const r = RELEASE_RANGES.find(r => r.id === id);
        if (r && r.test(y)) { hit = true; break; }
      }
      if (!hit) return false;
    }
    return true;
  });
  const typeSet = f.type === 'movie' ? MOVIE_GENRES : f.type === 'tv' ? TV_GENRES : null;
  const count = new Map();
  pool.forEach(m => (Array.isArray(m.genre_ids) ? m.genre_ids : []).forEach(g => {
    if (!GENRE_MAP[g]) return;
    if (typeSet && !typeSet.has(g)) return;
    count.set(g, (count.get(g) || 0) + 1);
  }));
  return [...count.entries()]
    .map(([id, c]) => ({ id, name: GENRE_MAP[id], count: c }))
    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'zh-CN'));
}

}

function loadTags({ force = false } = {}) {
  if (!force) {
    if (tagsPromise) return tagsPromise;   // 有进行中的拉取（含强制刷新）则共用结果
    if (state.tagsLoaded) return Promise.resolve();
  }
  tagsPromise = (async () => {

function renderTagChips(tags) {

  const selected = [...state.selectedTags];
  const unselected = (tags || []).filter(t => !state.selectedTags.has(t.id));

  // 标签现在由左侧抽屉承载；数据和筛选状态仍然沿用原来的 state.selectedTags。
  if (!tags.length && !selected.length) {
    bar.classList.add('hidden');

  }

    const countEl = $('#tagSelectedCount');
  const summaryEl = $('#tagSelectedSummary');
  if (countEl) {

    countEl.classList.toggle('hidden', selected.length === 0);
  }
  if (summaryEl) summaryEl.textContent = selected.length
    ? `${selected.length} 个标签 · AND`
    : '未选择标签';

  // 选中的标签永远置顶，方便组合筛选时连续点击。
  const chip = (id, { active = false, count = null } = {}) => {
    const name = tagNameMap.get(id) || String(id).replace(/^tag_/, '');
    const color = tagColor(id);
    const dot = `<span class="tag-dot" style="--dot: var(--color-${color})"></span>`;
    const countHtml = count != null ? `<span class="tag-count">${count}</span>` : '';
    return `<button type="button" class="sidebar-tag tag-chip${active ? ' active' : ''}" data-tag="${escapeHtml(id)}">
      ${dot}
      <span class="tag-drawer-chip-name">${escapeHtml(name)}</span>
      ${countHtml}
      <span class="tag-drawer-check ${active ? '' : 'hidden'}"><span class="iconify" data-icon="lucide:check"></span></span>
    </button>`;
  };

  chipsEl.innerHTML =
    selected.map(id => chip(id, { active: true })).join('') +
    unselected.map(t => chip(t.id, { count: t.count })).join('');

  clearBtn.classList.toggle('hidden', selected.length === 0);

  chipsEl.querySelectorAll('.tag-chip').forEach(btn => {
    btn.onclick = () => toggleTag(btn.dataset.tag);
  });
}

function toggleTag(id) {
  const wasSelected = state.selectedTags.has(id);
  const wasEmpty = state.selectedTags.size === 0;

  // 从无筛选切到有筛选时，保存无筛选时的滚动位置和加载页数
  if (wasEmpty) {
    saveCurrentScroll();
    sayUnfilteredScroll = viewScrollPos.say;
    sayUnfilteredPage = state.sayPage;
  }

  wasSelected ? state.selectedTags.delete(id) : state.selectedTags.add(id);
  renderTagChips(cachedTags);   // 重新渲染：选中标签移到最前面

  if (state.view !== 'say') {
    // 在其他视图点标签：切回说说视图（switchView 会同步菜单高亮/标题并带筛选加载）
    restoreTarget = null;
    switchView('say');
  } else if (!wasEmpty && state.selectedTags.size === 0) {
    // 从有筛选回到无筛选时，恢复之前无筛选的滚动位置（含加载页数）；否则回顶部
    restoreTarget = { view: 'say', pos: sayUnfilteredScroll, page: sayUnfilteredPage };
    resetSay();
  } else {
    restoreTarget = null;
    resetSay();
  }
  // 标签抽屉故意保持打开：可以连续选择多个标签组成 AND 筛选。
}

$('#clearTagsBtn').onclick = () => {
  state.selectedTags.clear();
  renderTagChips(cachedTags);
  if (state.view !== 'say') {
    restoreTarget = null;
    switchView('say');
  } else {
    // 清空筛选：恢复之前无筛选时的滚动位置（含加载页数）
    restoreTarget = { view: 'say', pos: sayUnfilteredScroll, page: sayUnfilteredPage };
    resetSay();
  }
  // 清空后也保持标签抽屉打开，方便重新组合。
};

/* ---------- 说说：加载与无限滚动 ---------- */
function bindCardInteractions() {
  contentEl.querySelectorAll('.memo-tag').forEach(el => { el.onclick = () => toggleTag(el.dataset.tag); });
  initCarousels(contentEl);
}

function resetSay() {
  state.sayPage = 1;
  state.sayTotalPages = 1;
  scrollToTop(); // 先回顶部（视图切换渲染后恢复位置，筛选保持顶部）
  contentEl.innerHTML = skeletonNotes(3);
  $('#endHint').classList.add('hidden');
  loadSayPage(1, { replace: true });
}

// 单图分栏方向：每渲染一张单图就翻转一次，保证连续的单图说说左右交替
let splitFlip = 0;
const MEMO_LIST_UL = '<ul class="memo-list">';

async function loadSayPage(page, { replace = false } = {}) {
  if (state.loading) return;
  state.loading = true;
  if (replace) { splitFlip = 0; }
  if (!replace) $('#loadingMore').classList.remove('hidden');

  try {
    // 并行：确保标签名加载 + 拉取说说数据，渲染前等待标签名就绪（避免卡片标签显示 id）
    const tagsReady = loadTags();
    const res = await fetchData({ view: 'say', page, tags: [...state.selectedTags] });
    await tagsReady;
    state.sayPage = res.page;
    state.sayTotalPages = res.totalPages;
    state.sayTotal = res.total;

    const html = (res.data || []).map((m, i) => {
      // 合并正文图片与 m.images 附件（生产数据图片在附件数组里），再判断是否单图
      const parsed = parseContent(m.content);
      const imgs = parsed.images.length ? parsed.images
        : (Array.isArray(m.images) ? m.images.map(url => ({ url, alt: '' })) : []);
      // 连续单图说说：左右交替（计数器只在单图时翻转）
      const single = imgs.length === 1;
      const rev = single ? (splitFlip++ % 2 === 1) : false;
      return memoCard(m, i, { parsed, imgs, single, rev });
    }).join('');
    if (replace) {
      const hasData = res.data && res.data.length;
      contentEl.innerHTML = hasData ? MEMO_LIST_UL + html + '</ul>'
        : emptyState(state.selectedTags.size ? '这些标签的交集下暂时没有说说，试试少选几个？' : '还没有说说，去写第一条吧。');
    } else if (html) {
      // 翻页：追加到时间线 ul 内部
      let ul = contentEl.querySelector('ul.memo-list');
      if (!ul) { contentEl.insertAdjacentHTML('beforeend', MEMO_LIST_UL); ul = contentEl.querySelector('ul.memo-list'); }
      ul.insertAdjacentHTML('beforeend', html);
    }

    bindCardInteractions();

    if (replace) applyRestore('say');

    const done = state.sayPage >= state.sayTotalPages;
    $('#endHint').classList.toggle('hidden', !done || state.sayTotal === 0);
    if (done) $('#endHint').textContent = state.selectedTags.size ? `— 筛选共 ${state.sayTotal} 条，到底啦 —` : `— 共 ${state.sayTotal} 条，到底啦 —`;
  } catch (err) {
    const box = errorState(err.message, () => { box.remove(); loadSayPage(page, { replace }); });
    if (replace) { contentEl.innerHTML = ''; contentEl.appendChild(box); }
    else contentEl.appendChild(box);
  } finally {
    state.loading = false;
    $('#loadingMore').classList.add('hidden');
  }
}

const observer = new IntersectionObserver(entries => {
  if (!entries[0].isIntersecting) return;
  if (state.view === 'say' && state.sayPage < state.sayTotalPages && !state.loading) {
    loadSayPage(state.sayPage + 1);
  }
/* root 用视口（null）：桌面端 mainScroll 是内部滚动容器、手机端由 body 滚动，
   两种模式下哨兵相对视口的位置都会随滚动变化，观察器都能正确触发；
   若 root 固定为 mainScroll，手机端它不是滚动容器、永远包含哨兵，交叉状态不变导致下拉加载失效 */
}, { rootMargin: '400px' });
observer.observe($('#sentinel'));

/* ---------- 图片墙：聚合所有说说的图片 ---------- */
async function loadPhotos() {
  contentEl.innerHTML = skeletonCards(2);
  try {
    if (!state.photosCache) {
      // 拉取全部说说分页，提取其中的图片（与普通说说同一图片来源）
      const first = await fetchData({ view: 'say', page: 1, tags: [] });
      const all = [...(first.data || [])];
      const totalPages = first.totalPages || 1;
      if (totalPages > 1) {
        const rest = await Promise.all(
          Array.from({ length: totalPages - 1 }, (_, i) =>
            fetchData({ view: 'say', page: i + 2, tags: [] }))
        );
        rest.forEach(r => all.push(...(r.data || [])));
      }
      const photos = [];
      all.forEach(m => {
        const parsedImages = parseContent(m.content).images;
        const extraImages = Array.isArray(m.images) ? m.images.map(url => ({ url, alt: '' })) : [];
        const images = parsedImages.length ? parsedImages : extraImages;
        images.forEach(img =>
          photos.push({ url: img.url, date: m.rawDate }));
      });
      state.photosCache = photos;
    }
    renderPhotos();
  } catch (err) {
    contentEl.innerHTML = '';
    contentEl.appendChild(errorState(err.message, () => { state.photosCache = null; loadPhotos(); }));
  }
}

function renderPhotos() {
  const photos = state.photosCache || [];
  if (!photos.length) { contentEl.innerHTML = emptyState('说说里还没有图片。'); applyRestore('photos'); return; }

  // 需要恢复滚动位置时图片改为立即加载：lazy 模式下视口外的图片不加载、瀑布流高度不足，位置永远恢复不到位
  const restoring = !!(restoreTarget && restoreTarget.view === 'photos' && restoreTarget.pos > 1);
  const pos = restoring ? restoreTarget.pos : 0;
  if (restoring) restoreTarget = null;
  const loadingAttr = restoring ? 'eager' : 'lazy';

  contentEl.innerHTML = `
    <div>
      <p class="text-xs opacity-50">共 ${photos.length} 张图片 · 来自所有说说</p>
      <div id="photoGrid">
        <div class="photo-sizer"></div>${photos.map(p => `
        <div class="photo-item">
          <a href="${escapeHtml(p.url)}" data-fancybox="photos">
            <img src="${escapeHtml(p.url)}" loading="${loadingAttr}" alt="" />
          </a>
        </div>`).join('')}
      </div>
    </div>`;

  initPhotoGrid();
  if (restoring) restorePhotosScroll(pos);
  else applyRestore('photos');
}

/* 图片墙恢复滚动：瀑布流高度随图片加载逐渐增长，需反复把滚动条钉到目标位置，直到够高或超时 */
 function restorePhotosScroll(pos) {
  const start = performance.now();
  const tick = () => {
    setScrollPos(pos);
    if (Math.abs(getScrollPos() - pos) <= 8) return;
    if (performance.now() - start > 3500) return;
    requestAnimationFrame(tick);
  };
  tick();
}

let photoGridInstance = null;

function initPhotoGrid() {
  const container = $('#photoGrid');
  if (!container || !window.Masonry) return;

  if (photoGridInstance) {
    try { photoGridInstance.destroy(); } catch {}
    photoGridInstance = null;
  }

  const grid = new Masonry(container, {
    itemSelector: '.photo-item',
    columnWidth: '.photo-sizer',
    percentPosition: true,
    transitionDuration: 0,
  });
  photoGridInstance = grid;

  // 图片加载完成后重新布局（防抖，避免抖动）
  let raf = null;
  const scheduleLayout = () => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      try { grid.layout(); } catch {}
    });
  };
  container.querySelectorAll('img').forEach(img => {
    if (img.complete && img.naturalWidth) return;
    img.addEventListener('load', scheduleLayout);
    img.addEventListener('error', scheduleLayout);
  });

  grid.layout();
}

/* ---------- Kindle 标注（My Clippings.txt） ---------- */
let clipsListScroll = 0;   // 进入某本书前的书单滚动位置，返回时恢复

/* 解码：Kindle 老设备导出 UTF-16（带 BOM），新设备 UTF-8，按 BOM 自适应 */
function decodeClippings(buf) {
  const b = new Uint8Array(buf);
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf);
  if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf);
  return new TextDecoder('utf-8').decode(buf);
}

/* 解析 My Clippings.txt：按 ========== 分块，每块 = 标题行 + 元信息行 + 正文 */
function parseClippings(text) {
  const blocks = [];
  let cur = [];
  String(text || '').replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').split('\n').forEach(line => {
    if (/^={9,}\s*$/.test(line.trim())) { blocks.push(cur); cur = []; }
    else cur.push(line);
  });
  blocks.push(cur);

  const books = new Map();
  blocks.forEach(blockLines => {
    while (blockLines.length && !blockLines[0].trim()) blockLines.shift();
    while (blockLines.length && !blockLines[blockLines.length - 1].trim()) blockLines.pop();
    if (blockLines.length < 3) return;
    const titleLine = blockLines[0].trim();
    const metaLine = blockLines[1].trim();
    const content = blockLines.slice(2).join('\n').trim();
    if (!titleLine || !content) return;

    // 标题行："书名 (作者名)"
    const tm = titleLine.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
    const title = tm ? tm[1].trim() : titleLine;
    const author = tm ? tm[2].trim() : '';

    // 元信息：类型 / 页码 / 位置 / 添加时间（兼容中英文 Kindle 格式）
    let type = '标注';
    if (/笔记|note/i.test(metaLine)) type = '笔记';
    else if (/书签|bookmark/i.test(metaLine)) type = '书签';
    const pm = metaLine.match(/第\s*(\d+)\s*页|on page (\d+)/i);
    const page = pm ? (pm[1] || pm[2]) : '';
    const lm = metaLine.match(/位置\s*#?\s*([\d\-–,\s]+)|Location\s*([\d\-–,\s]+)/i);
    const loc = lm ? (lm[1] || lm[2]).trim() : '';
    const am = metaLine.match(/添加于\s*(.+)|Added on (.+)/i);
    const added = am ? (am[1] || am[2]).trim() : '';

    const key = title + '|' + author;
    if (!books.has(key)) books.set(key, { key, title, author, items: [] });
    books.get(key).items.push({ type, page, loc, added, content });
  });

  return [...books.values()]
    .map(b => ({ ...b, count: b.items.length }))
    .sort((a, b) => b.count - a.count || a.title.localeCompare(b.title, 'zh-CN'));
}

async function loadClips() {
  if (state.clipsCache) { renderClips(); return; }
  contentEl.innerHTML = skeletonCards(2);
  $('#mediaPager').classList.add('hidden');
  try {
    const res = await fetch('My Clippings.txt', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status === 404 ? '未找到 My Clippings.txt，把它放在网站根目录（与 index.html 同级）' : `读取失败 (HTTP ${res.status})`);
    state.clipsCache = parseClippings(decodeClippings(await res.arrayBuffer()));
    renderClips();
  } catch (err) {
    contentEl.innerHTML = '';
    contentEl.appendChild(errorState(err.message, () => { state.clipsCache = null; loadClips(); }));
  }
}

const CLIP_TYPE_META = {
  '标注': { icon: 'lucide:highlighter', cls: 'bg-primary/10 text-primary', fg: 'text-primary' },
  '笔记': { icon: 'lucide:pencil', cls: 'bg-secondary/10 text-secondary', fg: 'text-secondary' },
  '书签': { icon: 'lucide:bookmark', cls: 'bg-accent/10 text-accent', fg: 'text-accent' },
};

function renderClips() {
  const books = state.clipsCache || [];
  const book = state.clipsBook ? books.find(b => b.key === state.clipsBook) : null;

  if (!book) {
    // 书单页：按标注数排序的书籍列表
    if (!books.length) { contentEl.innerHTML = emptyState('没有解析到标注内容，检查一下 My Clippings.txt 的格式。'); applyRestore('clips'); return; }
    const total = books.reduce((s, b) => s + b.count, 0);
    contentEl.innerHTML = `
    <div>
      <ul class="list bg-base-100 rounded-box shadow-md">
        <li class="p-4 pb-2 text-xs opacity-60 tracking-wide">Kindle 标注 · 共 ${books.length} 本书 · ${total} 条</li>
        ${books.map((b, i) => `
        <li class="list-row">
          <div class="text-4xl font-thin opacity-30 tabular-nums">${String(i + 1).padStart(2, '0')}</div>
          <div class="clips-ico size-10 text-primary flex items-center justify-center shrink-0">
            <span class="iconify text-xl" data-icon="lucide:book-open"></span>
          </div>
          <div class="list-col-grow min-w-0">
            <div class="font-semibold text-sm line-clamp-1" title="${escapeHtml(b.title)}">${escapeHtml(b.title)}</div>
            <div class="text-xs opacity-60 line-clamp-1">${escapeHtml(b.author || '未知作者')} · ${b.count} 条标注</div>
          </div>
          <button class="btn btn-square btn-ghost btn-sm clips-open shrink-0" data-book="${escapeHtml(b.key)}" aria-label="查看标注">
            <span class="iconify text-lg" data-icon="lucide:chevron-right"></span>
          </button>
        </li>`).join('')}
      </ul>
    </div>`;
    contentEl.querySelectorAll('.clips-open').forEach(btn => {
      btn.onclick = () => {
        clipsListScroll = getScrollPos();
        state.clipsBook = btn.dataset.book;
        renderClips();
        mainScroll.scrollTop = 0;   // 进入书内页从第一条标注开始，书单位置留在 clipsListScroll 备返回恢复
      };
    });
  } else {
    // 书内页：这本书的全部标注，复用同样的 List 控件
    const back = `<button class="btn btn-sm btn-ghost gap-1 mb-2 clips-back">
        <span class="iconify" data-icon="lucide:arrow-left"></span>返回书单
      </button>`;
    contentEl.innerHTML = `
    <div>
      ${back}
      <ul class="list bg-base-100 rounded-box shadow-md">
        <li class="p-4 pb-2 text-xs opacity-60 tracking-wide leading-relaxed break-words">《${escapeHtml(book.title)}》 · ${escapeHtml(book.author || '未知作者')} · ${book.count} 条标注</li>
        ${book.items.map((c, i) => {
          const tm = CLIP_TYPE_META[c.type] || CLIP_TYPE_META['标注'];
          const metaBits = [
            c.page ? `第 ${c.page} 页` : '',
            c.loc ? `位置 ${c.loc}` : '',
            c.added,
          ].filter(Boolean).join(' · ');
          return `
        <li class="list-row">
          <div class="text-4xl font-thin opacity-30 tabular-nums">${String(i + 1).padStart(2, '0')}</div>
          <div class="clips-ico size-10 ${tm.fg} flex items-center justify-center shrink-0" title="${c.type}">
            <span class="iconify text-xl" data-icon="${tm.icon}"></span>
          </div>
          <div class="list-col-grow min-w-0">
            <div class="whitespace-pre-wrap break-words text-[15px] leading-relaxed">${escapeHtml(c.content)}</div>
            ${metaBits ? `<div class="text-xs opacity-50 mt-1">${escapeHtml(metaBits)}</div>` : ''}
          </div>
          <button class="btn btn-square btn-ghost btn-sm clips-copy shrink-0" data-idx="${i}" aria-label="复制标注">
            <span class="iconify text-lg" data-icon="mdi:content-copy"></span>
          </button>
        </li>`;
        }).join('')}
      </ul>
    </div>`;
    const backBtn = contentEl.querySelector('.clips-back');
    if (backBtn) backBtn.onclick = () => {
      state.clipsBook = null;
      renderClips();
      setScrollPos(clipsListScroll);   // 回到书单时恢复离开时的位置
    };
    contentEl.querySelectorAll('.clips-copy').forEach(btn => {
      btn.onclick = async () => {
        const item = book.items[Number(btn.dataset.idx)];
        if (!item) return;
        try {
          await navigator.clipboard.writeText(item.content);
          const icon = btn.querySelector('.iconify');
          icon.dataset.icon = 'lucide:check';
          icon.classList.add('text-success');
          setTimeout(() => { icon.dataset.icon = 'mdi:content-copy'; icon.classList.remove('text-success'); }, 1200);
        } catch {}
      };
    });
  }
  applyRestore('clips');
}

/* ---------- 热搜聚合（uapis hotboard，多平台，自动+手动刷新） ---------- */
const HOT_SITES = [
  { id: 'weibo',    name: '微博' },
  { id: 'zhihu',    name: '知乎' },
  { id: 'bilibili', name: 'B站' },
  { id: 'douyin',   name: '抖音' },
  { id: 'toutiao',  name: '头条' },
  { id: 'baidu',    name: '百度' },
  { id: 'ithome',   name: 'IT之家' },
  { id: 'thepaper', name: '澎湃' },
  { id: '36kr',     name: '36氪' },
  { id: 'hupu',     name: '虎扑' },
  { id: 'kuaishou', name: '快手' },
  { id: 'sspai',    name: '少数派' },
  { id: 'weread',   name: '微信读书' },
];
const HOT_API = 'https://uapis.cn/api/v1/misc/hotboard?type=';
const HOT_TTL = 2 * 60 * 1000;        // 平台缓存有效期
const HOT_AUTO_MS = 3 * 60 * 1000;    // 自动刷新间隔
let hotTimer = null;
const hotScrolls = {};                // 各平台独立的滚动位置

function hotSite(id) { return HOT_SITES.find(s => s.id === id) || { id, name: id }; }

function startHotAutoRefresh() {
  stopHotAutoRefresh();
  hotTimer = setInterval(() => {
    if (state.view === 'hot' && !document.hidden) loadHot(state.hotActive, true);
  }, HOT_AUTO_MS);
}
function stopHotAutoRefresh() {
  if (hotTimer) { clearInterval(hotTimer); hotTimer = null; }
}

async function loadHot(platform, force = false) {
  const cached = state.hotCache[platform];
  const renderList = (data, ts) => renderHotList(platform, data, ts);
  const showError = (msg) => {
    const body = contentEl.querySelector('.hot-body');
    if (!body) return;
    const box = errorState(msg, () => loadHot(platform, true));
    if (cached) {
      // 有旧数据：列表保留，错误提示追加在下方
      box.classList.add('mx-4', 'sm:mx-5', 'mt-3');
      const old = body.querySelector('.hot-error');
      if (old) old.remove();
      body.appendChild(box);
    } else {
      body.innerHTML = '';
      body.appendChild(box);
    }
  };

  if (!force && cached && Date.now() - cached.ts < HOT_TTL) { renderList(cached.data, cached.ts); return; }

  contentEl.querySelector('.hot-refresh')?.classList.add('loading');
  if (!cached) {
    // 首次加载该平台：列表区显示骨架
    const body = contentEl.querySelector('.hot-body');
    if (body) body.innerHTML = `<div class="pt-1">${skeletonCards(3)}</div>`;
  }
  try {
    const res = await fetch(HOT_API + encodeURIComponent(platform));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    const list = (json && Array.isArray(json.list)) ? json.list : [];
    if (!list.length) throw new Error('该平台暂无数据');
    state.hotCache[platform] = { data: list, ts: Date.now() };
    renderList(list, Date.now());
  } catch (err) {
    if (cached) renderList(cached.data, cached.ts);   // 有旧数据则先显示旧数据
    showError(`「${hotSite(platform).name}」热搜获取失败：${err.message}`);
  } finally {
    contentEl.querySelector('.hot-refresh')?.classList.remove('loading');
  }
}

function renderHotView() {
  const active = state.hotActive;
  const tabs = HOT_SITES.map(s => {
    const on = s.id === active;
    const color = tagColor(s.id);

const bmScrolls = {};   // 各分类独立的滚动位置
let bmSearchTimer = null;

async function loadBookmarks() {
  if (state.bookmarksCache) { renderBookmarks(); return; }
  contentEl.innerHTML = skeletonCards(2);
  $('#mediaPager').classList.add('hidden');
  try {
    let list;
    if (USE_MOCK) {
      await sleep(300);
      list = MOCK_BOOKMARKS;
    } else {
      // 注意：API_BASE 已含 /api/public-memos 路径，书签走同一端点的 view 参数，避免拼出双重路径
      const res = await fetch(API_BASE + '?view=bookmarks');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      list = Array.isArray(json.data) ? json.data : [];
      list = list.filter(b => b && b.title && b.url);   // 数据形状防御：过滤异常条目
    }
    state.bookmarksCache = list;
    renderBookmarks();
  } catch (err) {
    contentEl.innerHTML = '';
    contentEl.appendChild(errorState(err.message, () => { state.bookmarksCache = null; loadBookmarks(); }));
  }
}

function bookmarkFiltered() {
  const q = state.bookmarksQuery.trim().toLowerCase();
  return (state.bookmarksCache || []).filter(b => {
    if (state.bookmarksCat === '收藏') {
      if (!b.favorite) return false;
    } else if (state.bookmarksCat !== '全部' && b.category !== state.bookmarksCat) {
      return false;
    }
    if (!q) return true;
    // 搜索：title OR desc OR tags（大小写不敏感）
    return String(b.title || '').toLowerCase().includes(q)
      || String(b.desc || '').toLowerCase().includes(q)
      || (b.tags || []).some(t => String(t).toLowerCase().includes(q));

/* ---------- 世界时间 & 播放提醒 ---------- */
const WC_BJ = 'Asia/Shanghai';
const WC_ZONES = [
  { tz: 'Asia/Shanghai',      name: '北京',   region: '中国标准时间' },
  { tz: 'America/New_York',   name: '纽约',   region: '美国东部' },
  { tz: 'America/Chicago',    name: '芝加哥', region: '美国中部' },
  { tz: 'America/Denver',     name: '丹佛',   region: '美国山区' },
  { tz: 'America/Los_Angeles',name: '洛杉矶', region: '美国西部' },
  { tz: 'Pacific/Honolulu',   name: '檀香山', region: '夏威夷' },
  { tz: 'Europe/London',      name: '伦敦',   region: '英国' },
  { tz: 'Europe/Berlin',      name: '柏林',   region: '欧洲中部' },
  { tz: 'Europe/Moscow',      name: '莫斯科', region: '俄罗斯' },
  { tz: 'Asia/Tokyo',         name: '东京',   region: '日本' },
  { tz: 'Asia/Seoul',         name: '首尔',   region: '韩国' },
  { tz: 'Asia/Singapore',     name: '新加坡', region: '东南亚' },
  { tz: 'Australia/Sydney',   name: '悉尼',   region: '澳大利亚东部' },
  { tz: 'UTC',                name: 'UTC',    region: '协调世界时' },
];
let wcTimer = null;
/* 这个视图里最细的粒度是"分钟"（列表只显示 HH:MM、日期、昼夜段），
   只有顶部北京时钟需要秒级刷新。用分钟戳做缓存，别每秒把 14 行全部标脏。 */
let wcMinuteStamp = null;
/* 昼夜段图标只有 4 种，而且配色 cls 完全由图标决定
   （moon→secondary / sunrise·sun→warning / sunset→error）。
   一次性把 4 个变体都渲染进同一个格子（grid-area 叠放），之后每秒只切 display。
   原因：原来每秒 innerHTML 重建一个 `<span class="iconify">`，
   Iconify 得异步重画 SVG —— 实测图标每秒缺 1~2 帧，就是用户看到的"闪一闪"。 */
const WC_PART_ICONS = ['lucide:moon', 'lucide:sunrise', 'lucide:sun', 'lucide:sunset'];
const WC_ICON_VARIANTS = WC_PART_ICONS
  .map(ic => `<span class="iconify text-xl" data-icon="${ic}" data-wc-pv="${ic}" style="grid-area:1/1;display:none"></span>`)
  .join('');

function wcParts(tz, date = new Date()) {
  const dtf = new Intl.DateTimeFormat('zh-CN', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'long', hourCycle: 'h23',
  });
  const p = {};
  for (const x of dtf.formatToParts(date)) p[x.type] = x.value;
  return p;
}
function wcOffsetMs(tz, date) {
  const p = {};
  const dtf = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
  });
  for (const x of dtf.formatToParts(date)) p[x.type] = x.value;
  return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - date.getTime();
}
/* 把"某时区的墙上时间"换算成 UTC 毫秒（两次逼近处理夏令时边界） */
function wallToUtcMs(wall, tz) {
  const naive = Date.parse(wall.length === 16 ? wall + ':00Z' : wall + 'Z');
  if (!Number.isFinite(naive)) return NaN;
  let utc = naive - wcOffsetMs(tz, new Date(naive));
  utc = naive - wcOffsetMs(tz, new Date(utc));
  return utc;
}
function wcDayPart(hour) {
  if (hour < 5) return { t: '深夜', icon: 'lucide:moon', cls: 'bg-secondary/15 text-secondary' };
  if (hour < 8) return { t: '清晨', icon: 'lucide:sunrise', cls: 'bg-warning/15 text-warning' };
  if (hour < 11) return { t: '上午', icon: 'lucide:sun', cls: 'bg-warning/15 text-warning' };
  if (hour < 13) return { t: '中午', icon: 'lucide:sun', cls: 'bg-warning/15 text-warning' };
  if (hour < 17) return { t: '下午', icon: 'lucide:sun', cls: 'bg-warning/15 text-warning' };
  if (hour < 19) return { t: '傍晚', icon: 'lucide:sunset', cls: 'bg-error/15 text-error' };
  return { t: '晚上', icon: 'lucide:moon', cls: 'bg-secondary/15 text-secondary' };
}
function wcDaysFromNow(utcMs) {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const t = new Date(utcMs); t.setHours(0, 0, 0, 0);
  return Math.round((t - now) / 864e5);
}
function wcDaysLabel(d) {
  if (d === 0) return '就是今天';
  if (d === 1) return '明天';
  if (d === 2) return '后天';
  return d > 0 ? `${d} 天后` : `已过去 ${-d} 天`;
}
function fmtDelta(ms) {
  const abs = Math.abs(ms);
  const d = Math.floor(abs / 864e5), h = Math.floor(abs % 864e5 / 36e5), m = Math.floor(abs % 36e5 / 6e4);
  if (d > 0) return `${d} 天 ${h} 小时`;
  if (h > 0) return `${h} 小时 ${m} 分`;
  return `${Math.max(1, m)} 分钟`;
}

function startWcTick() { stopWcTick(); wcTimer = setInterval(updateWcTimes, 1000); }
function stopWcTick() { if (wcTimer) { clearInterval(wcTimer); wcTimer = null; } }

function loadWorldClock() {

      </div>

      <div id="wcReminders" class="flex flex-col gap-2"></div>

  $('#wcConvert').onclick = wcConvertClick;

function updateWcTimes() {
  const now = new Date();
  const main = wcParts(WC_BJ, now);

  // ① 顶部北京时钟：唯一需要每秒刷新的东西
  const mainTime = contentEl.querySelector('[data-wc-main-time]');
  if (mainTime) {
    const t = `${main.hour}:${main.minute}:${main.second}`;
    if (mainTime.textContent !== t) mainTime.textContent = t;
  }

  // ② 其余全是"分钟级"信息，同一分钟内直接跳过。
  //    这就是"闪一闪"的根治点：原来每秒都要重写 14 行 × 4 个字段，
  //    还把每行的昼夜图标 innerHTML 拆掉重画，实测每秒 86 次 DOM 变更（新增 72 / 删除 72 个节点），
  //    图标每秒缺 1~2 帧。
  const stamp = `${main.year}-${main.month}-${main.day} ${main.hour}:${main.minute}`;
  if (stamp === wcMinuteStamp) return;
  wcMinuteStamp = stamp;

  const mainDate = contentEl.querySelector('[data-wc-main-date]');
  if (mainDate) mainDate.textContent = `${main.year} 年 ${main.month} 月 ${main.day} 日 · ${main.weekday}`;

  WC_ZONES.forEach(z => {
    const p = wcParts(z.tz, now);
    const part = wcDayPart(+p.hour);
    const tEl = contentEl.querySelector(`[data-wc-time="${z.tz}"]`);
    const dEl = contentEl.querySelector(`[data-wc-date="${z.tz}"]`);
    const iEl = contentEl.querySelector(`[data-wc-icon="${z.tz}"]`);
    const pEl = contentEl.querySelector(`[data-wc-part="${z.tz}"]`);
    if (tEl) tEl.textContent = `${p.hour}:${p.minute}`;
    if (dEl) dEl.textContent = `${p.month}-${p.day} ${p.weekday}`;
    if (pEl) pEl.textContent = part.t;
    if (iEl) {
      // 只切换 4 个预渲染图标的显隐：不建 DOM、不碰 innerHTML。
      // 注意：Iconify 会把 `<span class="iconify">` 整个换成 `<svg>`（保留属性），
      // 所以这里同时兼容自己的 data-wc-pv 和 iconify 自己的 data-icon，避免将来被换掉就失联。
      iEl.querySelectorAll('[data-wc-pv],[data-icon]').forEach(s => {
        const ic = s.dataset.wcPv || s.dataset.icon;
        s.style.display = ic === part.icon ? '' : 'none';
      });
      // 外层只负责配色。注意必须保留 wc-daybox —— 原来重写 className 时把它丢了，
      // 使得末段那条 `#content .wc-root .wc-daybox{...}` 覆盖样式只生效 1 秒。
      if (iEl.dataset.wcCls !== part.cls) {
        iEl.dataset.wcCls = part.cls;
        iEl.className = `size-10 rounded-lg grid place-items-center shrink-0 wc-daybox ${part.cls}`;
      }
    }
  });

  // ③ 提醒倒计时（文案本身就是"X 小时 Y 分 / X 分钟"，分钟级足够）
  contentEl.querySelectorAll('[data-cd-utc]').forEach(el => {
    const ms = Date.parse(el.dataset.cdUtc) - Date.now();

/* 提醒数据：生产走 API，本地开发用 localStorage 模拟 */
async function loadReminders() {
  if (USE_MOCK) {
    state.remindersCache = JSON.parse(localStorage.getItem('mock-reminders') || '[]');
    return;
  }
  const res = await fetch(API_BASE + '?view=reminders');
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  state.remindersCache = Array.isArray(json.data) ? json.data : [];
}
async function reminderPost(body) {
  if (USE_MOCK) {
    const list = JSON.parse(localStorage.getItem('mock-reminders') || '[]');
    if (body.action === 'add') {
      list.push({ id: 'mock-' + Date.now(), title: body.title, utc: body.utc, fromTz: body.fromTz || '' });
    } else if (body.action === 'delete') {
      const i = list.findIndex(r => r.id === body.id);
      if (i >= 0) list.splice(i, 1);
    }
    localStorage.setItem('mock-reminders', JSON.stringify(list));
    state.remindersCache = list;
    return;
  }
  const res = await fetch(API_BASE + '?view=reminders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
  state.remindersCache = Array.isArray(json.data) ? json.data : state.remindersCache;
}

/* 提醒监视器：页面打开期间实时弹 toast（右上角），不依赖刷新 */
const reminderFired = new Set();
let reminderRefreshTimer = null;
function startReminderWatch() {
  loadReminders().catch(() => {});
  if (!reminderRefreshTimer) {
    reminderRefreshTimer = setInterval(() => loadReminders().catch(() => {}), 5 * 60 * 1000);
  }
  setInterval(checkDueReminders, 1000);
}
function checkDueReminders() {
  const list = state.remindersCache || [];
  for (const r of list) {
    const ms = Date.parse(r.utc) - Date.now();
    // 到点（或刚刚到 1 分钟内，覆盖刷新页面的情况）且没弹过
    if (ms <= 0 && ms > -60 * 1000 && !reminderFired.has(r.id)) {
      reminderFired.add(r.id);
      showReminderToast(r);
    }
  }
}
function showReminderToast(r) {
  let box = document.querySelector('.reminder-toast-box');
  if (!box) {
    box = document.createElement('div');
    box.className = 'reminder-toast-box toast toast-top toast-end z-[100]';

  const el = document.createElement('div');
