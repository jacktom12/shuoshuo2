<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

     <title>小记 · 说说与光影</title>
<meta name="description" content="个人说说与影视记录" />
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>

     <style>
  :root { color-scheme: light; }
  [data-theme="dark"], [data-theme="sunset"] { color-scheme: dark; }
  html { scroll-behavior: smooth; }
  body { -webkit-tap-highlight-color: transparent; }

  .top-glow {
    background: linear-gradient(90deg,
      oklch(65% .2 250) 0%, oklch(70% .18 330) 50%, oklch(72% .15 180) 100%);
  }

  .memo-card { transition: transform .25s ease, box-shadow .25s ease; }
  @media (hover: hover) {
    .memo-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px -14px rgb(0 0 0 / .18); }
  }

  /* ============ 图片墙（所有说说的图片，瀑布流） ============ */
  .photo-grid { columns: 3; column-gap: 8px; }
  @media (max-width: 640px) { .photo-grid { columns: 2; } }
  .photo-item {
    position: relative; border-radius: 12px; overflow: hidden;
    margin-bottom: 8px; break-inside: avoid; display: block;
    cursor: zoom-in; background: rgb(128 128 128 / .12);
  }
  .photo-item img { width: 100%; height: auto; display: block; transition: transform .35s ease; }
  @media (hover: hover) { .photo-item:hover img { transform: scale(1.03); } }

  /* ============ Threads 风格横向图片条 ============ */
  .strip-wrap { position: relative; }
  .carousel-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    -ms-overflow-style: none;
    cursor: grab;
  }
  .carousel-strip::-webkit-scrollbar { display: none; }
  .carousel-strip.dragging { cursor: grabbing; }
  .carousel-strip.dragging img { pointer-events: none; }
  .strip-item {
    flex-shrink: 0;
    transition: transform .32s cubic-bezier(.34, 1.56, .64, 1);
    transform-origin: center center;
    will-change: transform;
  }
  .strip-item.pressed {
    transform: scale(.94);
    transition: transform .12s ease-out;
  }
  .strip-end { flex-shrink: 0; }
  .strip-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    cursor: inherit;
  }
  @media (hover: hover) { .strip-item img:hover { filter: brightness(1.06); } }
  .strip-count { position: absolute; top: 8px; right: 8px; z-index: 2; pointer-events: none; }

  /* ============ 灯箱：轨道滑动 + 挤压式切换 ============ */
  #lightbox { backdrop-filter: blur(10px); }
  #lbWrap {
    position: absolute; inset: 0;
    overflow: hidden;
    touch-action: pan-y;
    cursor: grab;
  }
  #lbWrap.dragging { cursor: grabbing; }
  #lbTrack { display: flex; height: 100%; will-change: transform; }
  .lb-slide {
    width: 100%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 1rem;
  }
  .lb-slide img {
    max-width: 94vw; max-height: 86vh;
    object-fit: contain;
    border-radius: .75rem;
    box-shadow: 0 25px 60px -15px rgb(0 0 0 / .6);
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .lb-exit img { animation: lbOut .42s cubic-bezier(.22,.61,.36,1) both; }
  .lb-enter img { animation: lbIn .42s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes lbOut {
    from { transform: scale(1); opacity: 1; }
    to   { transform: scale(.86); opacity: .35; }
  }
  @keyframes lbIn {
    from { transform: scale(1.06); opacity: .55; }
    to   { transform: scale(1); opacity: 1; }
  }

  /* 骨架屏 */
  .shimmer {
    background: linear-gradient(90deg,
      rgb(128 128 128 / .10) 25%, rgb(128 128 128 / .22) 37%, rgb(128 128 128 / .10) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 0 } 100% { background-position: -100% 0 } }

  /* 海报卡片 */
  .poster-card { transition: transform .25s ease, box-shadow .25s ease; }
  @media (hover: hover) {
    .poster-card:hover { transform: translateY(-4px); box-shadow: 0 16px 36px -16px rgb(0 0 0 / .35); }
    .poster-card:hover .poster-overlay { opacity: 1; }
  }
  .poster-overlay { opacity: 0; transition: opacity .25s ease; }

  .fade-up { animation: fadeUp .45s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

  .memo-text { word-break: break-word; overflow-wrap: anywhere; }
  .memo-text a { color: oklch(60% .18 250); text-decoration: underline; text-underline-offset: 3px; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgb(128 128 128 / .3); border-radius: 8px; }

  /* ============ 音乐抽屉（右侧滑出播放器） ============ */
  .music-drawer-overlay {
    position: fixed; inset: 0; z-index: 60;
    background: rgb(0 0 0 / .35);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
  }
  .music-drawer-overlay.open { opacity: 1; pointer-events: auto; }

  .music-drawer {
    --paper: var(--color-base-100);
    --bg: var(--color-base-100);
    --border: var(--color-base-300);
    --border-light: var(--color-base-300);
    --text: var(--color-base-content);
    --text-main: var(--color-base-content);
    --secondary-text: color-mix(in oklch, var(--color-base-content) 55%, transparent);
    --text-muted: var(--secondary-text);
    --accent: var(--color-primary);
    --accent-color: var(--color-primary);
    --accent-dark: color-mix(in oklch, var(--color-primary) 82%, black);
    --bg-player: var(--color-base-200);
    --dot-normal: var(--color-base-300);
    --img-brightness: 1;

    position: fixed; top: 0; right: 0;
    height: 100%; height: 100dvh;
    width: 85%; max-width: 400px; z-index: 70;
    background: var(--bg); color: var(--text);
    border-left: 1px solid var(--border-light);
    box-shadow: -4px 0 24px rgb(0 0 0 / .12);
    transform: translateX(100%);
    transition: transform .35s cubic-bezier(.22, 1, .36, 1);
    display: flex; flex-direction: column;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 12px calc(20px + env(safe-area-inset-bottom, 0px));
    overflow: hidden;
  }
  .music-drawer.open { transform: translateX(0); }
  html:is([data-theme="dark"], [data-theme="sunset"]) .music-drawer {
    --img-brightness: .7;
    box-shadow: -4px 0 24px rgb(0 0 0 / .5);
  }

  .music-drawer .drawer-header {
    display: flex; align-items: center; justify-content: space-between;
    flex: 0 0 auto; margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border-light);
  }
  .music-drawer .drawer-title { font-size: 1rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .music-drawer .drawer-close {
    appearance: none; background: transparent; border: none;
    font-size: 1.4rem; line-height: 1; cursor: pointer;
    color: var(--text-muted); padding: 0 4px; transition: color .2s;
    display: inline-flex; align-items: center;
  }
  .music-drawer .drawer-close:hover { color: var(--text); }
  .music-drawer .drawer-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .music-drawer .hw-playlist-mount { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

  /* —— 播放器组件（迁移自参考站 HWPlayer） —— */
  .music-drawer .hw-playlist {
    position: relative; width: 100%; height: 100%;
    margin: 0; padding: 0;
    background: transparent; border: none; box-shadow: none;
    overflow: visible; display: flex; flex-direction: column;
  }
  .music-drawer .hw-pl-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding: 4px 0 6px; flex: 0 0 auto; }
  .music-drawer .hw-pl-cover { width: 64px; height: 64px; flex: 0 0 64px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg-player); }
  .music-drawer .hw-pl-meta { flex: 1; min-width: 0; }
  .music-drawer .hw-pl-title { font-size: .95rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-drawer .hw-pl-artist { font-size: .82rem; color: var(--secondary-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .music-drawer .hw-pl-count { font-size: .72rem; color: var(--secondary-text); margin-top: 2px; }
  .music-drawer .hw-pl-view-lyrics {
    display: none; flex-direction: column;
    height: 100px; min-height: 50px; margin-bottom: 6px;
    background: var(--bg-player); padding: 6px 4px;
    border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light);
    flex: 0 0 auto;
  }
  .music-drawer .hw-playlist.lyrics-mode .hw-pl-view-normal { display: none; }
  .music-drawer .hw-playlist.lyrics-mode .hw-pl-view-lyrics { display: flex; }
  .music-drawer .hw-lyrics-scroll-full { flex: 1; overflow-y: auto; padding: 4px 6px; scrollbar-width: none; -ms-overflow-style: none; }
  .music-drawer .hw-lyrics-scroll-full::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .music-drawer .hw-lyrics-line { color: var(--secondary-text); padding: 2px 4px; text-align: center; font-size: .8rem; line-height: 1.6; transition: color .2s, font-size .2s; }
  .music-drawer .hw-lyrics-line.active { color: var(--accent); font-weight: 700; font-size: .9rem; }
  .music-drawer .hw-lyrics-empty { margin: auto; text-align: center; color: var(--secondary-text); font-size: .82rem; padding: 6px; }
  .music-drawer .hw-pl-progress-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex: 0 0 auto; }
  .music-drawer .hw-time { font-size: .72rem; color: var(--secondary-text); font-weight: 500; min-width: 32px; }
  .music-drawer .hw-time.hw-pl-dur { text-align: right; }
  .music-drawer .hw-progress {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; background: var(--dot-normal); border: none; border-radius: 2px;
    outline: none; cursor: pointer;
  }
  .music-drawer .hw-progress::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; }
  .music-drawer .hw-progress::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; }
  .music-drawer .hw-pl-controls { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px; flex: 0 0 auto; }
  .music-drawer .hw-btn {
    border: none; background: transparent; color: var(--text);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .15s ease; position: relative;
    border-radius: 6px; padding: 4px;
    width: 34px; height: 30px;
  }
  .music-drawer .hw-btn:hover { background: rgb(128 128 128 / .12); }
  .music-drawer .hw-btn:active { transform: scale(.92); }
  .music-drawer .hw-btn svg { display: block; }
  .music-drawer .hw-play { width: 34px; height: 30px; border-radius: 6px; background: var(--accent); color: var(--color-primary-content, #fff); }
  .music-drawer .hw-play:hover { background: var(--accent-dark); }
  .music-drawer .hw-pl-shuffle, .music-drawer .hw-pl-repeat, .music-drawer .hw-pl-lyrics-toggle { color: var(--text-muted); }
  .music-drawer .hw-pl-shuffle.active, .music-drawer .hw-pl-repeat.active, .music-drawer .hw-pl-lyrics-toggle.active { color: var(--accent); }
  .music-drawer .hw-repeat-badge {
    position: absolute; bottom: -2px; right: -2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); color: var(--color-primary-content, #fff);
    font-size: 8px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .music-drawer .hw-pl-list {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding-top: 6px; margin-top: 4px;
    border-top: 1px solid var(--border-light);
    scrollbar-width: none; -ms-overflow-style: none; max-height: none;
  }
  .music-drawer .hw-pl-list::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .music-drawer .hw-pl-row { display: flex; align-items: center; gap: 6px; padding: 5px 2px; border-radius: 6px; cursor: pointer; transition: background .15s ease; }
  .music-drawer .hw-pl-row:hover { background: rgb(128 128 128 / .08); }
  .music-drawer .hw-pl-row.playing { background: color-mix(in oklch, var(--accent) 12%, transparent); }
  .music-drawer .hw-pl-row-idx { width: 16px; text-align: center; font-size: .68rem; color: var(--secondary-text); flex: 0 0 16px; }
  .music-drawer .hw-pl-row.playing .hw-pl-row-idx { color: var(--accent); }
  .music-drawer .hw-pl-row-thumb { width: 28px; height: 28px; flex: 0 0 28px; border-radius: 4px; border: 1px solid var(--border); overflow: hidden; background: var(--bg-player); }
  .music-drawer .hw-pl-row-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .music-drawer .hw-pl-row-info { flex: 1; min-width: 0; }
  .music-drawer .hw-pl-row-title { font-size: .8rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-drawer .hw-pl-row-artist { font-size: .68rem; color: var(--secondary-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .music-drawer .hw-pl-row-playicon { flex: 0 0 14px; text-align: center; color: var(--accent); opacity: 0; }
  .music-drawer .hw-pl-row.playing .hw-pl-row-playicon { opacity: 1; }
  .music-drawer .hw-pl-loading, .music-drawer .hw-pl-error { text-align: center; padding: 16px 8px; color: var(--secondary-text); font-size: .82rem; margin: auto; }
  .music-drawer .hw-cover-img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(var(--img-brightness)); }

  @media (max-width: 640px) {
    .music-drawer { width: 88%; }
  }
  @media (max-width: 400px) {
    .music-drawer { width: 92%; }
  }
</style>
</head>
<body class="min-h-screen bg-base-200/60 text-base-content">

<div class="top-glow h-1 w-full"></div>

<!-- ======================= 头部 ======================= -->
<header class="sticky top-0 z-30 backdrop-blur-xl bg-base-100/75 border-b border-base-300/60">
  <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-primary via-secondary to-accent grid place-items-center text-primary-content text-sm font-bold shadow-md shrink-0">记</div>
      <div class="min-w-0">
        <h1 class="font-bold leading-none text-[15px] truncate">小记</h1>
        <p class="text-[11px] opacity-50 leading-tight mt-0.5">说说 · 光影 · 日常</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="musicBtn" class="btn btn-ghost btn-sm btn-circle relative" aria-label="音乐">
        <span class="iconify text-xl" data-icon="mdi:music-note-outline"></span>
        <span id="musicDot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-success animate-pulse"></span>
      </button>

      <div class="dropdown dropdown-end">
        <button tabindex="0" class="btn btn-ghost btn-sm btn-circle" aria-label="选择主题配色">
          <span class="iconify text-xl" data-icon="mdi:palette-outline"></span>
        </button>
        <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-2xl z-50 w-40 p-2 shadow-xl border border-base-300 mt-2">
          <li class="menu-title text-xs opacity-50">主题配色</li>
          <li>
            <a data-theme-pick="auto" class="theme-pick-item flex items-center justify-between rounded-xl">
              <span>默认</span><span class="pick-check text-primary">✓</span>
            </a>
          </li>
          <li>
            <a data-theme-pick="cupcake" class="theme-pick-item flex items-center justify-between rounded-xl">
              <span>奶油粉彩</span><span class="pick-check text-primary hidden">✓</span>
            </a>
          </li>
          <li>
            <a data-theme-pick="sunset" class="theme-pick-item flex items-center justify-between rounded-xl">
              <span>日落暖橘</span><span class="pick-check text-primary hidden">✓</span>
            </a>
          </li>
        </ul>
      </div>

      <button id="themeBtn" class="btn btn-ghost btn-sm btn-circle" aria-label="切换明暗">
        <span id="iconSun" class="iconify text-xl" data-icon="mdi:white-balance-sunny"></span>
        <span id="iconMoon" class="iconify text-xl hidden" data-icon="mdi:moon-waning-crescent"></span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-2xl mx-auto px-3 sm:px-4 pb-24">

  <div class="pt-5 pb-2">
    <div role="tablist" class="tabs tabs-boxed bg-base-100 shadow-sm w-full grid grid-cols-4 rounded-2xl p-1">
      <button role="tab" data-view="say" class="tab tab-btn rounded-xl font-medium transition-all"><span class="iconify text-base mr-1" data-icon="mdi:chat-processing-outline"></span>说说</button>
      <button role="tab" data-view="photos" class="tab tab-btn rounded-xl font-medium transition-all"><span class="iconify text-base mr-1" data-icon="mdi:image-multiple-outline"></span>图片</button>
      <button role="tab" data-view="watched" class="tab tab-btn rounded-xl font-medium transition-all"><span class="iconify text-base mr-1" data-icon="mdi:movie-open-check-outline"></span>看过</button>
      <button role="tab" data-view="watchlist" class="tab tab-btn rounded-xl font-medium transition-all"><span class="iconify text-base mr-1" data-icon="mdi:star-outline"></span>想看</button>
    </div>
  </div>

  <div id="tagBar" class="mt-3">
    <div id="tagChips" class="flex flex-wrap gap-2"></div>
    <div id="tagFilterHint" class="hidden mt-2 flex items-center gap-2 text-xs opacity-70">
      <span>已选标签（交集筛选）</span>
      <button id="clearTagsBtn" class="btn btn-xs btn-ghost rounded-full"><span class="iconify" data-icon="mdi:close"></span>清空</button>
    </div>
  </div>

  <div id="content" class="mt-4 flex flex-col gap-4"></div>

  <div id="sentinel" class="py-6 text-center">
    <span id="loadingMore" class="loading loading-dots loading-md opacity-60 hidden"></span>
    <p id="endHint" class="text-xs opacity-40 hidden">— 到底啦 —</p>
  </div>

  <div id="mediaPager" class="hidden mt-6 flex justify-center">
    <div class="join shadow-sm" id="pagerBtns"></div>
  </div>

</main>

<button id="toTop" class="btn btn-circle btn-sm shadow-lg fixed bottom-5 right-5 z-40 opacity-0 pointer-events-none transition-all duration-300 bg-base-100 border-base-300" aria-label="回到顶部">
  <span class="iconify text-xl" data-icon="mdi:arrow-up"></span>
</button>

<!-- ======================= 灯箱（轨道滑动式） ======================= -->
<div id="lightbox" class="fixed inset-0 z-50 hidden bg-black/85">
  <div id="lbWrap">
    <div id="lbTrack"></div>
  </div>
  <button class="btn btn-circle btn-sm absolute top-4 right-4 z-10 bg-white/10 border-none text-white hover:bg-white/25" onclick="closeLightbox()" aria-label="关闭"><span class="iconify text-lg" data-icon="mdi:close"></span></button>
  <button id="lbPrev" class="btn btn-circle btn-sm absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 z-10 bg-white/10 border-none text-white hover:bg-white/25" aria-label="上一张"><span class="iconify text-2xl" data-icon="mdi:chevron-left"></span></button>
  <button id="lbNext" class="btn btn-circle btn-sm absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 z-10 bg-white/10 border-none text-white hover:bg-white/25" aria-label="下一张"><span class="iconify text-2xl" data-icon="mdi:chevron-right"></span></button>
  <p id="lbCounter" class="absolute bottom-4 left-1/2 -translate-x-1/2 text-white/70 text-xs z-10"></p>
</div>

<!-- ======================= 音乐抽屉（右侧滑出） ======================= -->
<div id="musicDrawerOverlay" class="music-drawer-overlay"></div>
<aside id="musicDrawer" class="music-drawer" role="dialog" aria-label="音乐播放器">
  <div class="drawer-header">
    <span class="drawer-title">
      <span class="iconify text-lg" data-icon="mdi:playlist-music-outline"></span>
      歌单
    </span>
    <button class="drawer-close" id="musicDrawerClose" aria-label="关闭播放器">
      <span class="iconify" data-icon="mdi:close"></span>
    </button>

/* ============================================================
   工具函数
============================================================ */
const $ = sel => document.querySelector(sel);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function relativeTime(rawDate) {
  const t = new Date(String(rawDate).replace(' ', 'T')).getTime();
  if (!Number.isFinite(t)) return rawDate || '';
  const diff = Date.now() - t;
  const m = 6e4, h = 36e5, d = 864e5;
  if (diff < m) return '刚刚';
  if (diff < h) return Math.floor(diff / m) + ' 分钟前';
  if (diff < d) return Math.floor(diff / h) + ' 小时前';
  if (diff < 7 * d) return Math.floor(diff / d) + ' 天前';
  return String(rawDate).split(' ')[0];
}

function fmtDate(rawDate) {
  const s = String(rawDate || '');
  return s.length >= 16 ? s.slice(0, 16) : s;
}

function parseContent(raw) {
  const content = String(raw || '');
  const images = [];
  const imgRe = /!\[([^\]]*)\]\(\s*(https?:[^)\s]+?)\s*\)|(https?:\/\/[^\s<>"']+?\.(?:png|jpe?g|gif|webp|avif|bmp)(?:\?[^\s<>"']*)?)|<img[^>]+?src=["']([^"']+)["'][^>]*>/gi;
  const text = content.replace(imgRe, (m, alt, mdUrl, bareUrl, htmlUrl) => {
    const url = mdUrl || bareUrl || htmlUrl;
    if (url) images.push({ url, alt: alt || '' });
    return '\n';
  });

  let html = escapeHtml(text)
    .replace(/(https?:\/\/[^\s&lt;&gt;"']+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/\n{2,}/g, '<br><br>')
    .replace(/\n/g, '<br>');

  return { html, images };
}

const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
function animateValue(from, to, duration, onUpdate, onDone) {
  const start = performance.now();
  let raf;
  function frame(now) {
    const p = Math.min((now - start) / duration, 1);
    onUpdate(from + (to - from) * easeOutQuart(p));
    if (p < 1) raf = requestAnimationFrame(frame);
    else onDone && onDone();
  }
  raf = requestAnimationFrame(frame);
  return () => cancelAnimationFrame(raf);
}

async function fetchApi(params) {
  const res = await fetch(API_BASE + '?' + params.toString(), { headers: { 'Accept': 'application/json' } });
  if (!res.ok) throw new Error(`请求失败 (${res.status})`);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function fetchData({ view, page = 1, tags = [] }) {
  if (!USE_MOCK) {
    const params = new URLSearchParams({ view });
    if (view === 'say') {
      params.set('page', page);
      if (tags.length) params.set('tags', tags.join(','));
    }
    return fetchApi(params);
  }

  await sleep(300 + Math.random() * 400);

  if (view === 'tags') {
    const countMap = new Map();
    MOCK_MEMOS.forEach(m => (m.tags || []).forEach(t => countMap.set(t, (countMap.get(t) || 0) + 1)));
    const tagsArr = [...countMap.entries()]
      .filter(([id]) => MOCK_TAGS[id])
      .map(([id, count]) => ({ id, name: MOCK_TAGS[id], count }))
      .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'zh-CN'));
    return { data: tagsArr, total: tagsArr.length };
  }

  if (view === 'say') {
    let list = MOCK_MEMOS;
    if (tags.length) list = list.filter(m => tags.every(t => (m.tags || []).includes(t)));
    const total = list.length;
    const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
    const p = Math.min(Math.max(1, page), totalPages);
    return { data: list.slice((p - 1) * PAGE_SIZE, p * PAGE_SIZE), total, page: p, totalPages };
  }

  const list = MOCK_MEDIA[view] || [];
  return { data: list, total: list.length, page: 1, totalPages: 1 };
}

/* ============================================================
   灯箱：轨道滑动 + 挤压式切换
============================================================ */
const lbWrap  = $('#lbWrap');
const lbTrack = $('#lbTrack');
let lbImages = [], lbIndex = 0, lbJustSwiped = false;
const LB_TRANSITION = 'transform .42s cubic-bezier(.22,.61,.36,1)';

const lbW = () => lbWrap.clientWidth;

function setTrack(animate) {
  lbTrack.style.transition = animate ? LB_TRANSITION : 'none';
  lbTrack.style.transform = `translateX(${-lbIndex * lbW()}px)`;
  updateLbUI();
}

function updateLbUI() {
  const total = lbImages.length;
  $('#lbCounter').textContent = total > 1 ? `${lbIndex + 1} / ${total}` : '';
  $('#lbPrev').style.display = $('#lbNext').style.display = total > 1 ? '' : 'none';
  [lbIndex - 1, lbIndex + 1].forEach(i => {
    if (i >= 0 && i < total) { const im = new Image(); im.src = lbImages[i]; }
  });
}

function lbGo(index, animate = true) {
  const prev = lbIndex;
  lbIndex = Math.max(0, Math.min(index, lbImages.length - 1));
  setTrack(animate);
  if (animate && prev !== lbIndex) {
    const slides = lbTrack.children;
    const outEl = slides[prev], inEl = slides[lbIndex];
    if (outEl) { outEl.classList.remove('lb-exit'); void outEl.offsetWidth; outEl.classList.add('lb-exit'); }
    if (inEl)  { inEl.classList.remove('lb-enter'); void inEl.offsetWidth; inEl.classList.add('lb-enter'); }
    setTimeout(() => {
      outEl && outEl.classList.remove('lb-exit');
      inEl && inEl.classList.remove('lb-enter');
    }, 460);
  }
}

function openLightbox(images, index) {
  lbImages = images;
  lbIndex = index;
  lbTrack.innerHTML = images.map(u =>
    `<div class="lb-slide"><img src="${escapeHtml(u)}" draggable="false" alt="" /></div>`
  ).join('');
  $('#lightbox').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => setTrack(false));
}

function closeLightbox() {
  $('#lightbox').classList.add('hidden');
  lbTrack.innerHTML = '';
  document.body.style.overflow = '';
}

$('#lbPrev').onclick = e => { e.stopPropagation(); lbGo(lbIndex - 1); };
$('#lbNext').onclick = e => { e.stopPropagation(); lbGo(lbIndex + 1); };

lbWrap.addEventListener('click', e => {
  if (lbJustSwiped) { lbJustSwiped = false; return; }
  if (e.target === lbWrap || e.target.classList.contains('lb-slide')) closeLightbox();
});

/* 灯箱拖拽：无锁自愈状态机 */
(function initLbDrag() {
  let dragging = false;
  let startX = 0, baseOffset = 0, curOffset = 0, moved = 0;
  let samples = [];

  const visualOffset = () => {
    try {
      const m = new DOMMatrixReadOnly(getComputedStyle(lbTrack).transform);
      return Number.isFinite(m.m41) ? m.m41 : 0;
    } catch { return -lbIndex * lbW(); }
  };

  lbWrap.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    if (!lbImages.length) return;
    dragging = true;
    moved = 0;
    startX = e.clientX;
    baseOffset = curOffset = visualOffset();
    lbTrack.style.transition = 'none';
    lbTrack.style.transform = `translateX(${baseOffset}px)`;
    samples = [{ x: e.clientX, t: performance.now() }];
    lbWrap.classList.add('dragging');
    e.preventDefault();
  });

  addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    moved = Math.max(moved, Math.abs(dx));
    const min = -(lbImages.length - 1) * lbW(), max = 0;
    curOffset = baseOffset + dx;
    if (curOffset > max) curOffset = max + (curOffset - max) / 3;
    if (curOffset < min) curOffset = min + (curOffset - min) / 3;
    lbTrack.style.transform = `translateX(${curOffset}px)`;
    samples.push({ x: e.clientX, t: performance.now() });
    if (samples.length > 6) samples.shift();
    if (lbImages.length > 1) {
      const near = Math.max(0, Math.min(Math.round(-curOffset / lbW()), lbImages.length - 1));
      $('#lbCounter').textContent = `${near + 1} / ${lbImages.length}`;
    }
  });

  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    lbWrap.classList.remove('dragging');

    let v = 0;
    if (samples.length >= 2) {
      const a = samples[0], b = samples[samples.length - 1];
      const dt = b.t - a.t;
      if (dt > 0) v = (b.x - a.x) / dt;
    }

    const frac = -curOffset / lbW();
    let target;
    if (Math.abs(v) > 0.3) {
      target = v < 0 ? Math.ceil(frac - 0.15) : Math.floor(frac + 0.15);
    } else {
      target = Math.round(frac);
    }
    target = Math.max(0, Math.min(target, lbImages.length - 1));

    if (moved > 8) {
      lbJustSwiped = true;
      setTimeout(() => { lbJustSwiped = false; }, 400);
    }
    lbGo(target, true);
  };
  addEventListener('pointerup', endDrag);
  addEventListener('pointercancel', endDrag);

  addEventListener('resize', () => {
    if (!$('#lightbox').classList.contains('hidden')) setTrack(false);
  });
})();

document.addEventListener('keydown', e => {
  if ($('#lightbox').classList.contains('hidden')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lbGo(lbIndex - 1);
  if (e.key === 'ArrowRight') lbGo(lbIndex + 1);
});

============================================================ */
function renderImages(images) {
  if (!images.length) return '';
  const urls = images.map(i => i.url);
  const urlsJson = JSON.stringify(urls).replace(/"/g, '&quot;');

  if (images.length === 1) {
    const img = images[0];
    return `
    <div class="mt-3 rounded-xl overflow-hidden bg-base-300/50">
      <img src="${escapeHtml(img.url)}" alt="${escapeHtml(img.alt)}" loading="lazy"
           class="w-full max-h-[26rem] object-cover cursor-zoom-in"
           onclick="openLightbox(${urlsJson}, 0)" />
    </div>`;
  }

  const items = images.map((img, i) => `
    <div class="strip-item rounded-xl overflow-hidden bg-base-300/50 w-[72%] sm:w-[58%] h-52 sm:h-64">
      <img src="${escapeHtml(img.url)}" alt="${escapeHtml(img.alt)}" loading="lazy"
           onclick="openLightbox(${urlsJson}, ${i})" />
    </div>`).join('');

  return `
  <div class="strip-wrap mt-3">
    <div class="carousel-strip">
      ${items}
      <div class="strip-end w-1"></div>
    </div>
    <span class="strip-count badge badge-sm bg-black/55 text-white border-none backdrop-blur-sm">1 / ${images.length}</span>
  </div>`;
}

function initCarousels(root) {
  root.querySelectorAll('.carousel-strip').forEach(strip => {
    if (strip.dataset.carouselInit) return;
    strip.dataset.carouselInit = '1';

    const wrap = strip.closest('.strip-wrap');
    const badge = wrap && wrap.querySelector('.strip-count');
    const maxScroll = () => Math.max(0, strip.scrollWidth - strip.clientWidth);
    const itemW = () => {
      const first = strip.querySelector('.strip-item');
      return first ? first.getBoundingClientRect().width + 8 : strip.clientWidth * 0.72;
    };

    if (badge) {
      const update = () => {
        const total = strip.querySelectorAll('.strip-item').length;
        const i = strip.scrollLeft >= maxScroll() - 2
          ? total - 1
          : Math.round(strip.scrollLeft / itemW());
        badge.textContent = `${Math.min(Math.max(i + 1, 1), total)} / ${total}`;
      };
      strip.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
    }

    let down = false, startX = 0, startL = 0, moved = 0;
    let samples = [];
    let cancelGlide = null;
    let pressedItem = null;

    const releasePress = () => {
      if (pressedItem) {
        pressedItem.classList.remove('pressed');
        pressedItem = null;
      }
    };

    const glideTo = target => {
      const to = Math.max(0, Math.min(target, maxScroll()));
      const from = strip.scrollLeft;
      const dist = Math.abs(to - from);
      if (dist < 1) return;
      if (cancelGlide) cancelGlide();
      const duration = Math.min(200 + dist * 0.55, 550);
      cancelGlide = animateValue(from, to, duration, v => { strip.scrollLeft = v; }, () => {
        cancelGlide = null;
      });
    };

    strip.addEventListener('pointerdown', e => {
      pressedItem = e.target.closest('.strip-item');
      if (pressedItem) pressedItem.classList.add('pressed');

      if (e.pointerType === 'touch') return;
      if (cancelGlide) { cancelGlide(); cancelGlide = null; }
      down = true; moved = 0;
      startX = e.clientX; startL = strip.scrollLeft;
      samples = [{ x: e.clientX, t: performance.now() }];
    });
    strip.addEventListener('pointermove', e => {
      if (!down) return;
      const dx = e.clientX - startX;
      moved = Math.max(moved, Math.abs(dx));
      if (moved > 4) {
        strip.classList.add('dragging');
        try { strip.setPointerCapture(e.pointerId); } catch {}
      }
      strip.scrollLeft = startL - dx;
      samples.push({ x: e.clientX, t: performance.now() });
      if (samples.length > 6) samples.shift();
    });
    const up = () => {
      releasePress();
      if (!down) return;
      down = false;
      strip.classList.remove('dragging');
      if (moved > 8) strip.dataset.justDragged = '1';
      let v = 0;
      if (samples.length >= 2) {
        const a = samples[0], b = samples[samples.length - 1];
        const dt = b.t - a.t;
        if (dt > 0) v = (b.x - a.x) / dt;
      }
      glideTo(strip.scrollLeft - v * 220);
    };
    strip.addEventListener('pointerup', up);
    strip.addEventListener('pointercancel', up);
    strip.addEventListener('pointerleave', up);
    strip.addEventListener('click', e => {
      if (strip.dataset.justDragged) {
        delete strip.dataset.justDragged;
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);
  });
}

/* ============================================================
   渲染：说说
============================================================ */
let tagNameMap = new Map();

function tagChipHtml(id, { active = false, count = null } = {}) {
  const name = tagNameMap.get(id) || id.replace(/^tag_/, '');
  const base = 'btn btn-xs rounded-full transition-all tag-chip';
  const cls = active ? base + ' btn-primary' : base + ' btn-ghost bg-base-100 border border-base-300';
  const badge = count != null ? `<span class="badge badge-xs ${active ? 'badge-neutral' : 'badge-ghost'} ml-0.5">${count}</span>` : '';
  return `<button class="${cls}" data-tag="${escapeHtml(id)}"># ${escapeHtml(name)}${badge}</button>`;
}

function memoCard(m, idx) {
  const { html, images: parsedImages } = parseContent(m.content);
  // 生产数据图片在 m.images 数组中，与 content 解析的图片合并
  const extraImages = Array.isArray(m.images) ? m.images.map(url => ({ url, alt: '' })) : [];
  const images = parsedImages.length ? parsedImages : extraImages;
  const tags = (m.tags || []).map(t =>
    `<span class="badge badge-sm badge-ghost badge-outline cursor-pointer hover:badge-primary transition-colors memo-tag" data-tag="${escapeHtml(t)}">#${escapeHtml(tagNameMap.get(t) || t.replace(/^tag_/, ''))}</span>`
  ).join(' ');
  return `
  <article class="memo-card fade-up card bg-base-100 shadow-sm border border-base-300/50 overflow-hidden" style="animation-delay:${Math.min(idx * 40, 400)}ms">
    <div class="card-body p-4 sm:p-5 gap-3">
      <div class="memo-text text-[15px] leading-relaxed">${html}</div>
      ${renderImages(images)}
      <div class="flex items-center justify-between flex-wrap gap-2 pt-1">
        <time class="text-xs opacity-50 flex items-center gap-1" title="${escapeHtml(fmtDate(m.rawDate))}">
          <span class="iconify text-sm" data-icon="mdi:clock-outline"></span>
          ${relativeTime(m.rawDate)}
        </time>
        ${tags ? `<div class="flex flex-wrap gap-1.5">${tags}</div>` : ''}
      </div>
    </div>
  </article>`;
}

function skeletonCards(n = 3) {
  return Array.from({ length: n }, () => `
    <div class="card bg-base-100 border border-base-300/50"><div class="card-body p-5 gap-3">
      <div class="shimmer h-4 rounded w-3/4"></div>
      <div class="shimmer h-4 rounded w-full"></div>
      <div class="shimmer h-4 rounded w-1/2"></div>
      <div class="shimmer h-52 rounded-xl w-full"></div>
      <div class="shimmer h-3 rounded w-24"></div>
    </div></div>`).join('');
}

function emptyState(text) {
  return `<div class="text-center py-16 opacity-60 fade-up">
    <span class="iconify text-4xl block mb-3 mx-auto" data-icon="mdi:leaf"></span><p class="text-sm">${text}</p></div>`;
}

function errorState(msg, retryFn) {
  const box = document.createElement('div');
  box.className = 'fade-up alert alert-error alert-soft rounded-2xl';
  box.innerHTML = `<span class="text-sm">加载失败：${escapeHtml(msg)}</span>`;
  const btn = document.createElement('button');
  btn.className = 'btn btn-sm btn-outline ml-auto'; btn.textContent = '重试';
  btn.onclick = retryFn;
  box.appendChild(btn);
  return box;
}

/* ============================================================
   渲染：影视
============================================================ */
function mediaCard(m, idx) {
  const typeBadge = m.media_type === 'tv'
    ? '<span class="badge badge-xs badge-secondary">剧集</span>'
    : '<span class="badge badge-xs badge-accent">电影</span>';
  return `
  <div class="poster-card fade-up card bg-base-100 shadow-sm border border-base-300/50 overflow-hidden" style="animation-delay:${Math.min(idx * 30, 300)}ms">
    <figure class="relative aspect-[2/3] bg-base-300">
      <img src="${escapeHtml(m.poster_path)}" alt="${escapeHtml(m.title)}" loading="lazy" class="w-full h-full object-cover" />
      <a href="${escapeHtml(m.douban_url)}" target="_blank" rel="noopener"
         class="poster-overlay absolute inset-0 bg-black/55 grid place-items-center">
        <span class="btn btn-sm btn-success text-white">豆瓣搜索</span>
      </a>
      <span class="absolute top-1.5 right-1.5 badge badge-sm bg-black/60 text-white border-none gap-0.5"><span class="iconify text-xs" data-icon="mdi:star"></span>${escapeHtml(m.vote_average)}</span>
    </figure>
    <div class="p-2.5">
      <h3 class="font-semibold text-[13px] leading-snug line-clamp-1" title="${escapeHtml(m.title)}">${escapeHtml(m.title)}</h3>
      <p class="text-[11px] opacity-50 line-clamp-1 mt-0.5" title="${escapeHtml(m.original_title)}">${escapeHtml(m.original_title || '—')}</p>
      <div class="flex items-center justify-between mt-1.5">
        ${typeBadge}
        <span class="text-[10px] opacity-40">${escapeHtml(m.date)}</span>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   影视筛选（迁移自参考站：类型单选 / 年代多选 OR / 题材多选 AND）
   全程操作前端缓存，不重新请求 API
============================================================ */
function mediaFiltersActive() {
  const f = state.mediaFilter;
  return f.type !== 'all' || f.ranges.size > 0 || f.genres.size > 0;
}

function resetMediaFilter() {
  state.mediaFilter = { type: 'all', ranges: new Set(), genres: new Set() };
}

function getFilteredMedia(view) {
  const list = state.mediaCache[view] || [];
  const f = state.mediaFilter;
  return list.filter(m => {
    if (f.type !== 'all' && m.media_type !== f.type) return false;
    if (f.ranges.size) {
      const y = parseInt(String(m.release_date || '').slice(0, 4), 10);
      if (!Number.isFinite(y)) return false;
      let hit = false;
      f.ranges.forEach(id => {
        const r = RELEASE_RANGES.find(r => r.id === id);
        if (r && r.test(y)) hit = true;
      });
      if (!hit) return false;
    }
    if (f.genres.size) {
      const gids = Array.isArray(m.genre_ids) ? m.genre_ids : [];
      for (const g of f.genres) if (!gids.includes(g)) return false;
    }
    return true;
  });
}

/* 可选题材：从当前视图缓存中统计，且与类型联动（电影→电影题材，剧集→剧集题材） */
function availableGenres(view) {
  const f = state.mediaFilter;
  const list = state.mediaCache[view] || [];
  const pool = f.type === 'all' ? list : list.filter(m => m.media_type === f.type);
  const typeSet = f.type === 'movie' ? MOVIE_GENRES : f.type === 'tv' ? TV_GENRES : null;
  const count = new Map();
  pool.forEach(m => (Array.isArray(m.genre_ids) ? m.genre_ids : []).forEach(g => {
    if (!GENRE_MAP[g]) return;
    if (typeSet && !typeSet.has(g)) return;
    count.set(g, (count.get(g) || 0) + 1);
  }));
  return [...count.entries()]
    .map(([id, c]) => ({ id, name: GENRE_MAP[id], count: c }))
    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'zh-CN'));
}

function mediaFilterBarHtml(view) {
  const f = state.mediaFilter;
  const chip = on => 'btn btn-xs rounded-full transition-all ' + (on ? 'btn-primary' : 'btn-ghost bg-base-100 border border-base-300');

  const typeRow = [['all','全部'],['movie','电影'],['tv','剧集']]
    .map(([v, n]) => `<button class="${chip(f.type === v)} mf-type" data-v="${v}">${n}</button>`).join('');

  const rangeRow = RELEASE_RANGES
    .map(r => `<button class="${chip(f.ranges.has(r.id))} mf-range" data-v="${r.id}">${r.name}</button>`).join('');

  const genres = availableGenres(view);
  const genreRow = genres.length
    ? genres.map(g => `<button class="${chip(f.genres.has(g.id))} mf-genre" data-v="${g.id}">${g.name}<span class="badge badge-xs ${f.genres.has(g.id) ? 'badge-neutral' : 'badge-ghost'} ml-0.5">${g.count}</span></button>`).join('')
    : '<span class="text-xs opacity-40 py-1">该类型下暂无题材数据</span>';

  return `
  <div class="flex flex-col gap-2.5 px-1 fade-up">
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-xs opacity-50 w-7 shrink-0">类型</span>${typeRow}
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-xs opacity-50 w-7 shrink-0">年代</span>${rangeRow}
    </div>
    <div class="flex flex-wrap items-start gap-2">
      <span class="text-xs opacity-50 w-7 shrink-0 pt-1.5">题材</span>
      <div class="flex flex-wrap gap-2 flex-1 min-w-0">${genreRow}</div>
    </div>
    ${mediaFiltersActive() ? '<div><button class="btn btn-xs btn-ghost rounded-full mf-clear"><span class="iconify" data-icon="mdi:filter-off-outline"></span>清空筛选</button></div>' : ''}
  </div>`;
}

function bindMediaFilterEvents(view) {
  contentEl.querySelectorAll('.mf-type').forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    if (state.mediaFilter.type === v) return;
    state.mediaFilter.type = v;
    state.mediaFilter.genres.clear();   // 切类型时清空题材（参考站逻辑）
    state.mediaPage[view] = 1;
    renderMediaPage(view);
  });
  contentEl.querySelectorAll('.mf-range').forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    state.mediaFilter.ranges.has(v) ? state.mediaFilter.ranges.delete(v) : state.mediaFilter.ranges.add(v);
    state.mediaPage[view] = 1;
    renderMediaPage(view);
  });
  contentEl.querySelectorAll('.mf-genre').forEach(b => b.onclick = () => {
    const v = Number(b.dataset.v);
    state.mediaFilter.genres.has(v) ? state.mediaFilter.genres.delete(v) : state.mediaFilter.genres.add(v);
    state.mediaPage[view] = 1;
    renderMediaPage(view);
  });
  const clear = contentEl.querySelector('.mf-clear');
  if (clear) clear.onclick = () => { resetMediaFilter(); state.mediaPage[view] = 1; renderMediaPage(view); };
}

/* ============================================================
   应用状态 & 控制器
============================================================ */
const state = {
  view: 'say',
  sayPage: 1,
  sayTotalPages: 1,
  sayTotal: 0,
  selectedTags: new Set(),
  tagsLoaded: false,
  mediaCache: { watched: null, watchlist: null },
  photosCache: null,
  mediaPage: { watched: 1, watchlist: 1 },
  mediaFilter: { type: 'all', ranges: new Set(), genres: new Set() },
  loading: false,
};

const contentEl = $('#content');

/* ---------- 标签栏 ---------- */
let cachedTags = [];

async function loadTags() {
  if (state.tagsLoaded) return;
  try {
    const res = await fetchData({ view: 'tags' });
    (res.data || []).forEach(t => tagNameMap.set(t.id, t.name));
    state.tagsLoaded = true;
    cachedTags = res.data || [];
    renderTagChips(cachedTags);
  } catch {}
}

function renderTagChips(tags) {
  const bar = $('#tagChips');
  if (!tags.length && !state.selectedTags.size) { bar.innerHTML = ''; return; }
  const extra = [...state.selectedTags].filter(id => !tags.some(t => t.id === id)).map(id => ({ id, count: null }));
  bar.innerHTML = [...tags, ...extra].map(t =>
    tagChipHtml(t.id, { active: state.selectedTags.has(t.id), count: t.count })
  ).join('');
  bar.querySelectorAll('.tag-chip').forEach(btn => { btn.onclick = () => toggleTag(btn.dataset.tag); });
  $('#tagFilterHint').classList.toggle('hidden', state.selectedTags.size === 0);
}

function toggleTag(id) {
  state.selectedTags.has(id) ? state.selectedTags.delete(id) : state.selectedTags.add(id);
  document.querySelectorAll('#tagChips .tag-chip').forEach(b => {
    const on = state.selectedTags.has(b.dataset.tag);
    b.className = on
      ? 'btn btn-xs rounded-full transition-all tag-chip btn-primary'
      : 'btn btn-xs rounded-full transition-all tag-chip btn-ghost bg-base-100 border border-base-300';
  });
  $('#tagFilterHint').classList.toggle('hidden', state.selectedTags.size === 0);
  resetSay();
}

$('#clearTagsBtn').onclick = () => { state.selectedTags.clear(); renderTagChips(cachedTags); resetSay(); };

/* ---------- 说说：加载与无限滚动 ---------- */
function bindCardInteractions() {
  contentEl.querySelectorAll('.memo-tag').forEach(el => { el.onclick = () => toggleTag(el.dataset.tag); });
  initCarousels(contentEl);
}

function resetSay() {
  state.sayPage = 1;
  state.sayTotalPages = 1;
  contentEl.innerHTML = skeletonCards(3);
  $('#endHint').classList.add('hidden');
  loadSayPage(1, { replace: true });
}

async function loadSayPage(page, { replace = false } = {}) {
  if (state.loading) return;
  state.loading = true;
  if (!replace) $('#loadingMore').classList.remove('hidden');

  try {
    const res = await fetchData({ view: 'say', page, tags: [...state.selectedTags] });
    state.sayPage = res.page;
    state.sayTotalPages = res.totalPages;
    state.sayTotal = res.total;

    const html = (res.data || []).map((m, i) => memoCard(m, i)).join('');
    if (replace) {
      contentEl.innerHTML = res.data && res.data.length ? html
        : emptyState(state.selectedTags.size ? '这些标签的交集下暂时没有说说，试试少选几个？' : '还没有说说，去写第一条吧。');
    } else {
      contentEl.insertAdjacentHTML('beforeend', html);
    }

    bindCardInteractions();

    const done = state.sayPage >= state.sayTotalPages;
    $('#endHint').classList.toggle('hidden', !done || state.sayTotal === 0);
    if (done) $('#endHint').textContent = state.selectedTags.size ? `— 筛选共 ${state.sayTotal} 条，到底啦 —` : `— 共 ${state.sayTotal} 条，到底啦 —`;
  } catch (err) {
    const box = errorState(err.message, () => { box.remove(); loadSayPage(page, { replace }); });
    if (replace) { contentEl.innerHTML = ''; contentEl.appendChild(box); }
    else contentEl.appendChild(box);
  } finally {
    state.loading = false;
    $('#loadingMore').classList.add('hidden');
  }
}

const observer = new IntersectionObserver(entries => {
  if (!entries[0].isIntersecting) return;
  if (state.view === 'say' && state.sayPage < state.sayTotalPages && !state.loading) {
    loadSayPage(state.sayPage + 1);
  }
}, { rootMargin: '400px' });
observer.observe($('#sentinel'));

/* ---------- 图片墙：聚合所有说说的图片 ---------- */
async function loadPhotos() {
  contentEl.innerHTML = skeletonCards(2);
  try {
    if (!state.photosCache) {
      // 拉取全部说说分页，提取其中的图片（与普通说说同一图片来源）
      const first = await fetchData({ view: 'say', page: 1, tags: [] });
      const all = [...(first.data || [])];
      const totalPages = first.totalPages || 1;
      if (totalPages > 1) {
        const rest = await Promise.all(
          Array.from({ length: totalPages - 1 }, (_, i) =>
            fetchData({ view: 'say', page: i + 2, tags: [] }))
        );
        rest.forEach(r => all.push(...(r.data || [])));
      }
      const photos = [];
      all.forEach(m => {
        const parsedImages = parseContent(m.content).images;
        const extraImages = Array.isArray(m.images) ? m.images.map(url => ({ url, alt: '' })) : [];
        const images = parsedImages.length ? parsedImages : extraImages;
        images.forEach(img =>
          photos.push({ url: img.url, date: m.rawDate }));
      });
      state.photosCache = photos;
    }
    renderPhotos();
  } catch (err) {
    contentEl.innerHTML = '';
    contentEl.appendChild(errorState(err.message, () => { state.photosCache = null; loadPhotos(); }));
  }
}

function renderPhotos() {
  const photos = state.photosCache || [];
  if (!photos.length) { contentEl.innerHTML = emptyState('说说里还没有图片。'); return; }
  const urls = photos.map(p => p.url);
  const urlsJson = JSON.stringify(urls).replace(/"/g, '&quot;');
  contentEl.innerHTML = `
    <p class="text-xs opacity-50 px-1">共 ${photos.length} 张图片 · 来自所有说说</p>
    <div class="photo-grid">${photos.map((p, i) => `
      <div class="photo-item" title="${escapeHtml(fmtDate(p.date))}" onclick="openLightbox(${urlsJson}, ${i})">
        <img src="${escapeHtml(p.url)}" loading="lazy" alt="" />
      </div>`).join('')}
    </div>`;
}

/* ---------- 影视 ---------- */
async function loadMedia(view) {
  contentEl.innerHTML = skeletonCards(2);
  $('#mediaPager').classList.add('hidden');
  $('#endHint').classList.add('hidden');
  try {
    if (!state.mediaCache[view]) {
      const res = await fetchData({ view });   // 每个视图只拉一次，之后筛选翻页全在前端
      state.mediaCache[view] = res.data || [];
    }
    state.mediaPage[view] = 1;
    renderMediaPage(view);
  } catch (err) {
    contentEl.innerHTML = '';
    contentEl.appendChild(errorState(err.message, () => { state.mediaCache[view] = null; loadMedia(view); }));
  }
}

function renderMediaPage(view) {
  const all = state.mediaCache[view] || [];
  const list = getFilteredMedia(view);
  const filterBar = mediaFilterBarHtml(view);

  if (!all.length) {
    contentEl.innerHTML = emptyState(view === 'watched' ? '还没有看过的记录。' : '想看清单是空的。');
    $('#mediaPager').classList.add('hidden');
    return;
  }

  if (!list.length) {
    contentEl.innerHTML = filterBar + emptyState('这个筛选条件下没有片子，放宽一点试试？');
    bindMediaFilterEvents(view);
    $('#mediaPager').classList.add('hidden');
    return;
  }

  const pages = Math.ceil(list.length / PAGE_SIZE);
  const p = Math.min(state.mediaPage[view], pages);
  state.mediaPage[view] = p;
  const slice = list.slice((p - 1) * PAGE_SIZE, p * PAGE_SIZE);

  const countText = mediaFiltersActive()
    ? `筛出 ${list.length} / ${all.length} 部 · 第 ${p}/${pages} 页`
    : `共 ${all.length} 部${view === 'watched' ? '看过' : '想看'} · 第 ${p}/${pages} 页`;

  contentEl.innerHTML = `
    ${filterBar}
    <p class="text-xs opacity-50 px-1">${countText}</p>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${slice.map((m, i) => mediaCard(m, i)).join('')}</div>`;
  bindMediaFilterEvents(view);

  if (pages > 1) {
    const btns = [];
    btns.push(`<button class="join-item btn btn-sm ${p === 1 ? 'btn-disabled' : ''}" data-p="${p - 1}">«</button>`);
    const win = [];
    for (let i = 1; i <= pages; i++) {
      if (i === 1 || i === pages || Math.abs(i - p) <= 2) win.push(i);
    }
    let prev = 0;
    win.forEach(i => {
      if (i - prev > 1) btns.push('<button class="join-item btn btn-sm btn-disabled">…</button>');

    });

function switchView(view) {
  // 在 看过/想看 之间切换时重置筛选（参考站逻辑）
  if (view !== state.view && (view === 'watched' || view === 'watchlist')) {
    resetMediaFilter();
  }
  state.view = view;
  document.querySelectorAll('.tab-btn').forEach(t => {

const DARK_THEMES = new Set(['dark', 'sunset']);
let themePick = 'auto';

function isDarkTheme(t) { return DARK_THEMES.has(t); }

function updateThemeIcons(theme) {
  const dark = isDarkTheme(theme);
  $('#iconSun').classList.toggle('hidden', dark);
  $('#iconMoon').classList.toggle('hidden', !dark);
}

function updatePickChecks() {
  document.querySelectorAll('.theme-pick-item').forEach(item => {

    item.classList.toggle('bg-base-200', active);
    const check = item.querySelector('.pick-check');
    if (check) check.classList.toggle('hidden', !active);

}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  updateThemeIcons(theme);
  try { localStorage.setItem('memo-theme', theme); } catch {}
}

function applyPick(pick) {
  themePick = pick;
  try { localStorage.setItem('memo-theme-pick', pick); } catch {}
  updatePickChecks();
  if (pick === 'auto') {
    let t = 'light';
    try { t = localStorage.getItem('memo-theme'); } catch {}
    if (!t || (t !== 'light' && t !== 'dark')) {
      t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    applyTheme(t === 'light' || t === 'dark' ? t : 'light');
  } else {
    applyTheme(pick);
  }
}

document.querySelectorAll('.theme-pick-item').forEach(item => {
  item.addEventListener('click', () => {
    applyPick(item.dataset.themePick);
    document.activeElement && document.activeElement.blur();

    applyTheme(isDarkTheme(cur) ? 'light' : 'dark');
    return;
  }
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
};

(function initTheme() {
  let pick = 'auto';
  try { pick = localStorage.getItem('memo-theme-pick') || 'auto'; } catch {}
  if (!['auto', 'cupcake', 'sunset'].includes(pick)) pick = 'auto';

        }

        const SHORTCODE_SONG_RE =
          /\{\{<\s*music\s+url=["']([^"']+)["']\s*>\}\}/g;
        const SHORTCODE_LIST_RE =
          /\{\{<\s*musiclist\s+id=["']([^"']+)["']\s*>\}\}/g;

        function escapeAttr(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        function parseShortcodes(text) {
          if (!text) return text;
          let out = text;
          if (SHORTCODE_SONG_RE.test(out)) {
            SHORTCODE_SONG_RE.lastIndex = 0;
            out = out.replace(SHORTCODE_SONG_RE, (_, url) => {
              const mountId = "hwmount-" + uidSeq++;
              return `\n<div class="hw-player-mount" data-hw-url="${escapeAttr(url)}" data-hw-mount-id="${mountId}"></div>\n`;
            });
          }
          if (SHORTCODE_LIST_RE.test(out)) {
            SHORTCODE_LIST_RE.lastIndex = 0;
            out = out.replace(SHORTCODE_LIST_RE, (_, listId) => {
              const mountId = "hwlistmount-" + uidSeq++;
              return `\n<div class="hw-playlist-mount" data-hw-list-id="${escapeAttr(listId)}" data-hw-mount-id="${mountId}"></div>\n`;
            });
          }
          return out;
        }

        function skeletonHTML() {
          return `<div class="hw-player hw-player-loading"><div class="hw-note-corner">♪</div><div class="hw-player-head"><div class="hw-disc-wrap"><div class="hw-disc"></div></div></div><div class="hw-meta"><div class="hw-title">加载中…</div></div></div>`;
        }

        function cardHTML(meta) {
          const cover = meta.cover || "";
          const liked = isLiked(meta.trackId);
          const repeatOn = isRepeatOn(meta.trackId);
          return `<div class="hw-player" data-track-id="${meta.trackId}">
              <div class="hw-note-corner">♪</div>
              <div class="hw-view-normal">
                <div class="hw-player-head">
                  <div class="hw-disc-wrap"><div class="hw-disc" style="${cover ? `background-image:url('${escapeAttr(cover)}')` : ""}"></div></div>
                  <div class="hw-cover">${cover ? `<img class="hw-cover-img" src="${escapeAttr(cover)}" alt="">` : ""}</div>
                </div>
                <div class="hw-meta">
                  <div class="hw-title">${escapeAttr(meta.title)}</div>
                  <div class="hw-artist">${escapeAttr(meta.artist || "")}</div>
                  ${meta.album ? `<div class="hw-album">${escapeAttr(meta.album)}</div>` : ""}
                </div>
              </div>
              <div class="hw-view-lyrics"><div class="hw-lyrics-scroll-full"><div class="hw-lyrics-empty">点击加载歌词…</div></div></div>
              <div class="hw-progress-row">
                <span class="hw-time hw-cur">00:00</span>
                <input type="range" class="hw-progress" min="0" max="1000" value="0">
                <span class="hw-time hw-dur">00:00</span>
              </div>
              <div class="hw-controls">
                <button class="hw-btn hw-like${liked ? " active" : ""}" title="喜欢">${liked ? ICONS.heartFilled : ICONS.heart}</button>
                <button class="hw-btn hw-lyrics-toggle" title="歌词">${ICONS.lyrics}</button>
                <button class="hw-btn hw-play" title="播放/暂停">${ICONS.play}</button>
                <button class="hw-btn hw-repeat${repeatOn ? " active" : ""}" title="单曲循环">${ICONS.repeat}</button>
              </div>
            </div>`;
        }

        function fmtTime(ms) {
          if (!ms || isNaN(ms)) return "00:00";
          const s = Math.floor(ms / 1000),
            m = Math.floor(s / 60),
            ss = s % 60;
          return `${String(m).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
        }

        function refreshCardUI(cardEl, meta) {
          const isActive = state.activeId === meta.trackId && !state.queue;
          const playBtn = cardEl.querySelector(".hw-play");
          const discWrap = cardEl.querySelector(".hw-disc-wrap");
          const progress = cardEl.querySelector(".hw-progress");
          const cur = cardEl.querySelector(".hw-cur");
          const dur = cardEl.querySelector(".hw-dur");
          const playing = isActive && state.isPlaying;
          playBtn.innerHTML = playing ? ICONS.pause : ICONS.play;
          discWrap.classList.toggle("spinning", playing);
          if (isActive) {
            const pct = state.duration
              ? (state.position / state.duration) * 1000
              : 0;
            progress.value = Math.min(1000, Math.max(0, pct));
            cur.textContent = fmtTime(state.position);
            dur.textContent = fmtTime(state.duration);
            syncLyrics(cardEl, state.position);
          } else {
            const savedMs = getSavedPosition(meta.trackId);
            progress.value = 0;
            cur.textContent = savedMs > 0 ? fmtTime(savedMs) : "00:00";
            dur.textContent = "00:00";
          }
        }

        function refreshLikeUI(cardEl, trackId) {
          const likeBtn = cardEl.querySelector(".hw-like");
          if (!likeBtn) return;
          const liked = isLiked(trackId);
          likeBtn.classList.toggle("active", liked);
          likeBtn.innerHTML = liked ? ICONS.heartFilled : ICONS.heart;
        }

        function refreshRepeatUI(cardEl, trackId) {
          const repeatBtn = cardEl.querySelector(".hw-repeat");
          if (!repeatBtn) return;
          repeatBtn.classList.toggle("active", isRepeatOn(trackId));
        }

        function renderLyricsList(scrollEl, lyricsResult) {
          if (!lyricsResult.lines.length) {
            scrollEl.innerHTML = '<div class="hw-lyrics-empty">暂无歌词</div>';
            return;
          }
          scrollEl.innerHTML = lyricsResult.lines
            .map(
              (l, i) =>
                `<div class="hw-lyrics-line" data-idx="${i}" data-time="${l.time}">${escapeAttr(l.text)}</div>`
            )
            .join("");
        }

        function syncLyrics(cardEl, positionMs) {
          const scroll = cardEl.querySelector(".hw-lyrics-scroll-full");
          if (!scroll) return;
          const lineEls = scroll.querySelectorAll(".hw-lyrics-line");
          if (!lineEls.length) return;
          let activeIdx = -1;
          lineEls.forEach((el, i) => {
            if (Number(el.dataset.time) <= positionMs) activeIdx = i;
          });
          lineEls.forEach((el, i) =>
            el.classList.toggle("active", i === activeIdx)
          );
          if (activeIdx >= 0) {
            const activeEl = lineEls[activeIdx];
            const targetTop =
              activeEl.offsetTop -
              scroll.clientHeight / 2 +
              activeEl.clientHeight / 2;
            scroll.scrollTo({
              top: Math.max(0, targetTop),
              behavior: "smooth",
            });
          }
        }

        function bindCard(cardEl, meta) {
          if (cardEl.dataset.hwBound) {
            refreshCardUI(cardEl, meta);
            refreshLikeUI(cardEl, meta.trackId);
            refreshRepeatUI(cardEl, meta.trackId);
            return;
          }
          cardEl.dataset.hwBound = "1";
          const playBtn = cardEl.querySelector(".hw-play");
          const likeBtn = cardEl.querySelector(".hw-like");
          const repeatBtn = cardEl.querySelector(".hw-repeat");
          const lyricsBtn = cardEl.querySelector(".hw-lyrics-toggle");
          const progress = cardEl.querySelector(".hw-progress");

          playBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            playTrack(meta);
          });
          likeBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            toggleLike(meta.trackId);
          });
          repeatBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            setRepeat(meta.trackId, !isRepeatOn(meta.trackId));
            refreshRepeatUI(cardEl, meta.trackId);
          });
          progress.addEventListener("input", (e) => {
            e.stopPropagation();
            if (state.activeId !== meta.trackId || state.queue || !audioEl)
              return;
            audioEl.currentTime =
              (Number(progress.value) / 1000) * (audioEl.duration || 0);
          });

          let lyricsLoaded = false;
          lyricsBtn.addEventListener("click", async (e) => {
            e.preventDefault();
            e.stopPropagation();
            const nowOn = cardEl.classList.toggle("lyrics-mode");
            lyricsBtn.classList.toggle("active", nowOn);
            if (nowOn && !lyricsLoaded) {
              lyricsLoaded = true;
              const lyricsResult = await getLyricsByNeteaseId(meta.neteaseId);
              renderLyricsList(
                cardEl.querySelector(".hw-lyrics-scroll-full"),
                lyricsResult
              );
              if (state.activeId === meta.trackId)
                syncLyrics(cardEl, state.position);
            }
            if (typeof window.HWonMasonryNeeded === "function")
              window.HWonMasonryNeeded();
          });

          cardEl.addEventListener("mousedown", (e) => e.stopPropagation());
          cardEl.addEventListener("touchstart", (e) => e.stopPropagation(), {
            passive: true,
          });

          document.addEventListener("hwplayer:update", () =>
            refreshCardUI(cardEl, meta)
          );
          document.addEventListener("hwplayer:like-update", (e) => {
            if (e.detail.trackId === meta.trackId)
              refreshLikeUI(cardEl, meta.trackId);
          });
          refreshCardUI(cardEl, meta);
          refreshLikeUI(cardEl, meta.trackId);
          refreshRepeatUI(cardEl, meta.trackId);
        }

        async function mountOne(mountEl) {
          const url = mountEl.getAttribute("data-hw-url");
          if (!url) return;
          mountEl.innerHTML = skeletonHTML();
          const meta = await getMeta(url);
          if (typeof window.HWonMasonryNeeded === "function")
            window.HWonMasonryNeeded();
          mountEl.innerHTML = cardHTML(meta);
          const cardEl = mountEl.querySelector(".hw-player");
          bindCard(cardEl, meta);
          if (typeof window.HWonMasonryNeeded === "function")
            window.HWonMasonryNeeded();
        }

        function playlistSkeletonHTML() {
          return `<div class="hw-playlist"><div class="hw-pl-loading">歌单加载中…</div></div>`;
        }

        function playlistErrorHTML(msg) {
          return `<div class="hw-playlist"><div class="hw-pl-error">歌单加载失败：${escapeAttr(msg)}</div></div>`;
        }

        function playlistCardHTML(listId, pls) {
          const track =
            state.queue && state.queue.listId === listId
              ? pls.tracks[state.queue.index]
              : pls.tracks[0];
          const cover = (track && track.cover) || "";
          const rowsHTML = pls.tracks
            .map(
              (t, i) =>
                `
              <div class="hw-pl-row" data-idx="${i}">
                <span class="hw-pl-row-idx">${i + 1}</span>
                <div class="hw-pl-row-thumb">${t.cover ? `<img src="${escapeAttr(t.cover)}" alt="">` : ""}</div>
                <div class="hw-pl-row-info">
                  <div class="hw-pl-row-title">${escapeAttr(t.title)}</div>
                  <div class="hw-pl-row-artist">${escapeAttr(t.artist)}</div>
                </div>
                <span class="hw-pl-row-playicon">♪</span>
              </div>`
            )
            .join("");

          return `<div class="hw-playlist" data-list-id="${escapeAttr(listId)}">
              <div class="hw-pl-view-normal">
                <div class="hw-pl-header">
                  <div class="hw-pl-cover">${cover ? `<img class="hw-cover-img hw-pl-cover-img" src="${escapeAttr(cover)}" alt="">` : ""}</div>
                  <div class="hw-pl-meta">
                    <div class="hw-pl-title hw-pl-current-title">${escapeAttr(track ? track.title : "播放列表")}</div>
                    <div class="hw-pl-artist hw-pl-current-artist">${escapeAttr(track ? track.artist : "")}</div>
                    <div class="hw-pl-count">共 ${pls.tracks.length} 首</div>
                  </div>
                </div>
              </div>
              <div class="hw-pl-view-lyrics"><div class="hw-lyrics-scroll-full"><div class="hw-lyrics-empty">点击歌曲开始播放</div></div></div>
              <div class="hw-pl-progress-row">
                <span class="hw-time hw-pl-cur">00:00</span>
                <input type="range" class="hw-progress hw-pl-progress" min="0" max="1000" value="0">
                <span class="hw-time hw-pl-dur">00:00</span>
              </div>
              <div class="hw-pl-controls">
                <button class="hw-btn hw-pl-shuffle${pls.shuffle ? " active" : ""}" title="随机播放">${ICONS.shuffle}</button>
                <button class="hw-btn hw-pl-lyrics-toggle" title="歌词">${ICONS.lyrics}</button>
                <button class="hw-btn hw-play hw-pl-play" title="播放/暂停">${ICONS.play}</button>
                <button class="hw-btn hw-pl-repeat${pls.repeatMode !== "off" ? " active" : ""}" title="循环模式">${ICONS.repeat}${pls.repeatMode === "one" ? '<span class="hw-repeat-badge">1</span>' : ""}</button>
              </div>
              <div class="hw-pl-list">${rowsHTML}</div>
            </div>`;
        }

        function refreshPlaylistUI(cardEl, listId) {
          const pls = getPlaylistState(listId);
          const isThisQueueActive =
            state.queue && state.queue.listId === listId;
          const playBtn = cardEl.querySelector(".hw-pl-play");
          const progress = cardEl.querySelector(".hw-pl-progress");
          const cur = cardEl.querySelector(".hw-pl-cur");
          const dur = cardEl.querySelector(".hw-pl-dur");
          const titleEl = cardEl.querySelector(".hw-pl-current-title");
          const artistEl = cardEl.querySelector(".hw-pl-current-artist");
          const shuffleBtn = cardEl.querySelector(".hw-pl-shuffle");
          const repeatBtn = cardEl.querySelector(".hw-pl-repeat");
          const coverImg = cardEl.querySelector(".hw-pl-cover-img");
          const rows = cardEl.querySelectorAll(".hw-pl-row");

          shuffleBtn.classList.toggle("active", pls.shuffle);
          repeatBtn.classList.toggle("active", pls.repeatMode !== "off");
          repeatBtn.innerHTML =
            ICONS.repeat +
            (pls.repeatMode === "one"
              ? '<span class="hw-repeat-badge">1</span>'
              : "");

          const playing = isThisQueueActive && state.isPlaying;
          playBtn.innerHTML = playing ? ICONS.pause : ICONS.play;

          if (isThisQueueActive) {
            const track = pls.tracks[state.queue.index];
            if (track) {
              titleEl.textContent = track.title;
              artistEl.textContent = track.artist;
              if (coverImg && track.cover) coverImg.src = track.cover;
            }
            const pct = state.duration
              ? (state.position / state.duration) * 1000
              : 0;
            progress.value = Math.min(1000, Math.max(0, pct));
            cur.textContent = fmtTime(state.position);
            dur.textContent = fmtTime(state.duration);
            rows.forEach((row, i) =>
              row.classList.toggle("playing", i === state.queue.index)
            );
            syncLyrics(cardEl, state.position);
          } else {
            const lastTrack =
              pls.lastPlayedIndex !== null
                ? pls.tracks[pls.lastPlayedIndex]
                : null;
            const savedMs = lastTrack ? getSavedPosition(lastTrack.trackId) : 0;
            if (lastTrack) {
              titleEl.textContent = lastTrack.title;
              artistEl.textContent = lastTrack.artist;
              if (coverImg && lastTrack.cover) coverImg.src = lastTrack.cover;
            }
            progress.value = 0;
            cur.textContent = savedMs > 0 ? fmtTime(savedMs) : "00:00";
            dur.textContent = "00:00";
            rows.forEach((row) => row.classList.remove("playing"));
          }
        }

        function bindPlaylistCard(cardEl, listId) {
          const pls = getPlaylistState(listId);
          const playBtn = cardEl.querySelector(".hw-pl-play");
          const shuffleBtn = cardEl.querySelector(".hw-pl-shuffle");
          const repeatBtn = cardEl.querySelector(".hw-pl-repeat");
          const lyricsBtn = cardEl.querySelector(".hw-pl-lyrics-toggle");
          const progress = cardEl.querySelector(".hw-pl-progress");

          playBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            const isThisQueueActive =
              state.queue && state.queue.listId === listId;
            if (isThisQueueActive) togglePauseCurrent();
            else playFromPlaylist(listId, pls.order[pls.posInOrder] || 0);
          });

          shuffleBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            togglePlaylistShuffle(listId);
          });
          repeatBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            cyclePlaylistRepeat(listId);
          });

          progress.addEventListener("input", (e) => {
            e.stopPropagation();
            const isThisQueueActive =
              state.queue && state.queue.listId === listId;
            if (!isThisQueueActive || !audioEl) return;
            audioEl.currentTime =
              (Number(progress.value) / 1000) * (audioEl.duration || 0);
          });

          let lyricsLoadedForTrackId = null;
          lyricsBtn.addEventListener("click", async (e) => {
            e.preventDefault();
            e.stopPropagation();
            const nowOn = cardEl.classList.toggle("lyrics-mode");
            lyricsBtn.classList.toggle("active", nowOn);
            const isThisQueueActive =
              state.queue && state.queue.listId === listId;
            if (nowOn && isThisQueueActive) {
              const track = pls.tracks[state.queue.index];
              if (track && lyricsLoadedForTrackId !== track.trackId) {
                lyricsLoadedForTrackId = track.trackId;
                const lyricsResult = await getLyricsByNeteaseId(
                  track.neteaseId
                );
                renderLyricsList(
                  cardEl.querySelector(
                    ".hw-pl-view-lyrics .hw-lyrics-scroll-full"
                  ),
                  lyricsResult
                );
                syncLyrics(cardEl, state.position);
              }
            }
            if (typeof window.HWonMasonryNeeded === "function")
              window.HWonMasonryNeeded();
          });

          cardEl.querySelectorAll(".hw-pl-row").forEach((row) => {
            row.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              playFromPlaylist(listId, Number(row.dataset.idx));
            });
          });

          cardEl.addEventListener("mousedown", (e) => e.stopPropagation());
          cardEl.addEventListener("touchstart", (e) => e.stopPropagation(), {
            passive: true,
          });

          document.addEventListener("hwplayer:update", () =>
            refreshPlaylistUI(cardEl, listId)
          );
          document.addEventListener("hwplayer:queue-change", (e) => {
            if (e.detail.listId !== listId) return;
            refreshPlaylistUI(cardEl, listId);
            const isThisQueueActive =
              state.queue && state.queue.listId === listId;
            if (cardEl.classList.contains("lyrics-mode") && isThisQueueActive) {
              const track = pls.tracks[state.queue.index];
              if (track && lyricsLoadedForTrackId !== track.trackId) {
                lyricsLoadedForTrackId = track.trackId;
                const scroll = cardEl.querySelector(
                  ".hw-pl-view-lyrics .hw-lyrics-scroll-full"
                );
                getLyricsByNeteaseId(track.neteaseId).then((r) => {
                  renderLyricsList(scroll, r);
                  syncLyrics(cardEl, state.position);
                });
              }
            }
          });
          refreshPlaylistUI(cardEl, listId);
        }

        async function mountOnePlaylist(mountEl) {
          const listId = mountEl.getAttribute("data-hw-list-id");
          if (!listId) return;
          mountEl.innerHTML = playlistSkeletonHTML();
          const result = await fetchPlaylist(listId);
          if (typeof window.HWonMasonryNeeded === "function")
            window.HWonMasonryNeeded();
          if (!result.ok || !result.tracks.length) {
            mountEl.innerHTML = playlistErrorHTML(result.error || "歌单为空");
            return;
          }
          const pls = getPlaylistState(listId);
          pls.tracks = result.tracks;
          pls.order = buildOrder(pls.tracks.length, pls.shuffle);
          mountEl.innerHTML = playlistCardHTML(listId, pls);
          const cardEl = mountEl.querySelector(".hw-playlist");
          bindPlaylistCard(cardEl, listId);
          if (typeof window.HWonMasonryNeeded === "function")
            window.HWonMasonryNeeded();
        }

        function mountAll(container) {
          const root = container || document;
          root.querySelectorAll(".hw-player-mount").forEach((el) => {
            if (el.dataset.hwMounted) return;
            el.dataset.hwMounted = "1";
            mountOne(el);
          });
          root.querySelectorAll(".hw-playlist-mount").forEach((el) => {
            if (el.dataset.hwMounted) return;
            el.dataset.hwMounted = "1";
            mountOnePlaylist(el);
          });
        }

        window.HWPlayer = {
          parseShortcodes,
          mountAll,
          getState: () => ({ ...state }),
        };
      })();
</script>

<!-- ========== 音乐抽屉控制 ========== -->
<script>
(function () {
  const drawer = document.getElementById('musicDrawer');
  const overlay = document.getElementById('musicDrawerOverlay');
  let mounted = false;

  function openDrawer() {
    drawer.classList.add('open');
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    if (!mounted && window.HWPlayer) {
      mounted = true;
      window.HWPlayer.mountAll(document.getElementById('musicDrawerMount').parentElement);
    }
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('musicBtn').onclick = openDrawer;
  document.getElementById('musicDrawerClose').onclick = closeDrawer;
  overlay.onclick = closeDrawer;

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
  });

  // 播放状态指示点
  document.addEventListener('hwplayer:update', e => {
    const dot = document.getElementById('musicDot');
    if (dot) dot.classList.toggle('hidden', !(e.detail && e.detail.isPlaying));
  });
})();
</script>
  </body>
</html>
