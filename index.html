/* ---------- 影视 ---------- */
async function loadMedia(view) {
  contentEl.innerHTML = skeletonCards(2);
  $('#mediaPager').classList.add('hidden');
  $('#endHint').classList.add('hidden');
  try {
    if (!state.mediaCache[view]) {
      const res = await fetchData({ view });   // 每个视图只拉一次，之后筛选翻页全在前端
      state.mediaCache[view] = res.data || [];
      state.mediaPage[view] = 1;   // 首次加载才重置页码
    }
    renderMediaPage(view);
  } catch (err) {
    contentEl.innerHTML = '';
    contentEl.appendChild(errorState(err.message, () => { state.mediaCache[view] = null; loadMedia(view); }));
  }
}

function renderMediaPage(view) {
  const all = state.mediaCache[view] || [];
  const list = getFilteredMedia(view);
  const filterBar = mediaFilterBarHtml(view);

  if (!all.length) {
    contentEl.innerHTML = emptyState(view === 'watched' ? '还没有看过的记录。' : '想看清单是空的。');
    $('#mediaPager').classList.add('hidden');
    applyRestore(view);
    return;
  }

  if (!list.length) {
    contentEl.innerHTML = filterBar + emptyState('这个筛选条件下没有片子，放宽一点试试？');
    bindMediaFilterEvents(view);
    $('#mediaPager').classList.add('hidden');
    applyRestore(view);
    return;
  }

  const pages = Math.ceil(list.length / PAGE_SIZE);
  const p = Math.min(state.mediaPage[view], pages);
  state.mediaPage[view] = p;
  const slice = list.slice((p - 1) * PAGE_SIZE, p * PAGE_SIZE);

  const countText = mediaFiltersActive(view)
    ? `筛出 ${list.length} / ${all.length} 部 · 第 ${p}/${pages} 页`
    : `共 ${all.length} 部${view === 'watched' ? '看过' : '想看'} · 第 ${p}/${pages} 页`;

  contentEl.innerHTML = `
    <div>
      ${filterBar}
      <p class="text-xs opacity-50">${countText}</p>
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2">${slice.map((m, i) => mediaCard(m, i)).join('')}</div>
    </div>`;
  bindMediaFilterEvents(view);
  applyRestore(view);

  if (pages > 1) {
    const btns = [];
    btns.push(`<button class="join-item btn btn-sm ${p === 1 ? 'btn-disabled' : ''}" data-p="${p - 1}">«</button>`);
    const win = [];
    for (let i = 1; i <= pages; i++) {
      if (i === 1 || i === pages || Math.abs(i - p) <= 2) win.push(i);
    }
    let prev = 0;
    win.forEach(i => {
      if (i - prev > 1) btns.push('<button class="join-item btn btn-sm btn-disabled">…</button>');
      btns.push(`<button class="join-item btn btn-sm ${i === p ? 'btn-active' : ''}" data-p="${i}">${i}</button>`);
      prev = i;
    });
    btns.push(`<button class="join-item btn btn-sm ${p === pages ? 'btn-disabled' : ''}" data-p="${p + 1}">»</button>`);
    const pager = $('#pagerBtns');
    pager.innerHTML = btns.join('');
    pager.querySelectorAll('button[data-p]').forEach(b => {
      b.onclick = () => {
        if (b.classList.contains('btn-disabled')) return;
        state.mediaPage[view] = Number(b.dataset.p);
        renderMediaPage(view);
        scrollToTop({ behavior: 'smooth' });
      };
    });
    $('#mediaPager').classList.remove('hidden');
  } else {
    $('#mediaPager').classList.add('hidden');
  }
}

/* ---------- 滚动位置管理（各视图独立保存/恢复） ---------- */
const viewScrollPos = { say: 0, photos: 0, watched: 0, watchlist: 0, clips: 0, hot: 0, bookmarks: 0, worldtime: 0 };
let sayUnfilteredScroll = 0;   // 说说无筛选时保存的滚动位置
let sayUnfilteredPage = 1;     // 说说无筛选时保存的已加载页数
let sayLoadedPage = 1;         // 说说当前已加载到的页码
let restoreTarget = null;      // { view, pos, page } 渲染完成后恢复

function saveCurrentScroll() {
  if (mainScroll && state.view) {
    viewScrollPos[state.view] = getScrollPos();
    if (state.view === 'say') sayLoadedPage = state.sayPage;
  }
}

function applyRestore(view) {
  if (!restoreTarget || restoreTarget.view !== view) return;
  const { pos, page } = restoreTarget;
  restoreTarget = null;
  if (view === 'say' && page > 1) {
    // 延迟到当前 loadSayPage 结束后（state.loading 复位）再补加载
    setTimeout(() => loadSayToPage(page, pos), 0);
  } else {
    setScrollPos(pos);
  }
}

async function loadSayToPage(targetPage, pos) {
  while (state.sayPage < targetPage && state.sayPage < state.sayTotalPages && !state.loading) {
    await loadSayPage(state.sayPage + 1);
  }
  setScrollPos(pos);
}

  if (state.view === 'say' && state.selectedTags.size === 0) {

 document.querySelectorAll('.tab-btn[data-view]').forEach(t => {

});

  // 立即回顶部，避免旧视图滚动位置残留
  scrollToTop();

  if (view === 'say') {
    restoreTarget = { view: 'say', pos: viewScrollPos.say, page: sayLoadedPage };
    loadTags({ force: true });   // 每次切到说说都重新拉取标签，与后台的删除/改动保持同步
    resetSay();
  } else if (view === 'photos') {
    restoreTarget = { view: 'photos', pos: viewScrollPos.photos };
    loadPhotos();
  } else if (view === 'clips') {
    restoreTarget = { view: 'clips', pos: viewScrollPos.clips };
    loadClips();
  } else if (view === 'hot') {
    restoreTarget = { view: 'hot', pos: viewScrollPos.hot };
    loadHotView();
  } else if (view === 'bookmarks') {
    restoreTarget = { view: 'bookmarks', pos: viewScrollPos.bookmarks };
    loadBookmarks();
  } else if (view === 'worldtime') {
    restoreTarget = { view: 'worldtime', pos: viewScrollPos.worldtime };
    loadWorldClock();
  } else {

  }
}

/* ============================================================
   标签抽屉：左侧滑出
   - 点击菜单按钮打开
   - 点击外部或右上角关闭
   - 点击任意标签不会关闭，可连续组合 AND 筛选
============================================================ */
/* ============================================================
   标签抽屉（2026-09-15 起：**改到屏幕右侧**，从左边缘侧滑的菜单里彻底分家）
   文哥原话：「这个标签打开抽屉跟右滑出菜单的抽屉逻辑体验有点冲突，
             把这个标签菜单直接变成在屏幕右侧左滑出标签抽屉，
             直接把这个标签菜单抽离出来就会好很多。」
   ------------------------------------------------------------
   两条进入路径（都通到同一个抽屉，抽屉本身在右边）：
     · 左菜单里点「标签」→ 菜单收掉，抽屉从右侧滑进来（open()）
     · 右边缘往左滑 → 直接开（手势脚本在文件末尾，调 window.openTagDrawer）
   ------------------------------------------------------------
   上一版那套「记住上次在标签抽屉 → 拉开菜单就自动带出来」的逻辑**整块删掉了**：
   它正是文哥说的"冲突"来源。现在两边各管各的边，不需要记忆了。
   注：`chk.dispatchEvent(change)` 那两处保留 —— 那是给 Dock「更多」的 aria 同步用的，
       顺手修的老毛病（程序化 .checked = true 不触发原生 change），跟本段无关。
   ============================================================ */
(function initTagDrawer() {
  const drawer = document.getElementById('tagBar');
  const overlay = document.getElementById('tagDrawerOverlay');
  const openBtn = document.getElementById('tagDrawerOpen');
  const closeBtn = document.getElementById('tagDrawerClose');

  if (!drawer || !overlay || !openBtn || !closeBtn) return;

  const show = () => {
    // 都挤在右边：歌单抽屉开着就先收掉，别叠一起（它自己那个 IIFE 在 5333 行，晚于本段执行，所以这里能取到）
    if (typeof window.closeMusicDrawer === 'function') window.closeMusicDrawer();
    drawer.classList.add('open');
    overlay.classList.add('open');
    openBtn.setAttribute('aria-expanded', 'true');
    overlay.setAttribute('aria-hidden', 'false');
  };

  /* 从左侧菜单点「标签」进来：菜单收掉（不然左边还杵着一块），抽屉从右边进来 */
  const open = () => {
    closeNav();
    show();
  };

  const close = () => {
    drawer.classList.remove('open');
    overlay.classList.remove('open');
    openBtn.setAttribute('aria-expanded', 'false');
    overlay.setAttribute('aria-hidden', 'true');
  };

  openBtn.onclick = open;
  closeBtn.onclick = close;
  /* 点抽屉外面（现在是左边那一大片）→ 收掉抽屉，回到内容 */
  overlay.onclick = close;

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && drawer.classList.contains('open')) close();
  });

  /* 给右侧边缘手势用（那个脚本在文件末尾，晚于本段执行）*/
  window.openTagDrawer = open;
  window.closeTagDrawer = close;
  window.isTagDrawerOpen = () => drawer.classList.contains('open');
})();

function closeNav() {
  const chk = document.getElementById('appNavChk');
  if (!chk || !chk.checked) return;   // 桌面端侧栏常驻，仅在移动端抽屉打开时收起
  chk.checked = false;
  const btn = document.getElementById('navToggleBtn');
  if (btn) btn.setAttribute('aria-expanded', 'false');
  document.querySelectorAll('#appSidebar details').forEach(d => { d.open = false; });
}

(function initMobileNav() {
  const btn = document.getElementById('navToggleBtn');
  const chk = document.getElementById('appNavChk');
  if (!btn || !chk) return;
  btn.onclick = () => {
    chk.checked = true;
    // 程序化勾选不会触发原生 change，手动补一次：
    // Dock「更多」的 aria 同步（第 7249 行那段）监听的就是这个事件
    chk.dispatchEvent(new Event('change', { bubbles: true }));
    btn.setAttribute('aria-expanded', 'true');
  };
})();

// 只绑定真正代表视图的菜单项；标签抽屉按钮没有 data-view，交给 initTagDrawer 自己处理

/* 浏览器/系统 UI 的颜色跟着**站点主题**走（iOS Safari 顶栏与底栏、Android 状态栏）。
   为什么不用 `<meta media="(prefers-color-scheme: …)">` 写死：
   本站主题存在 localStorage['memo-theme']，可以和系统偏好**相反** ——
   手机是浅色但稿子切成深色时，写死 media 会把顶栏染成白的，又对不上了。
   取值与 §㉑ 的 html 底色一一对应：浅 #ffffff / 深 #1c1c1e。 */
function syncThemeColor(theme) {
  const m = document.getElementById('metaThemeColor');
  if (!m) return;
  m.setAttribute('content', isDarkTheme(theme) ? '#1c1c1e' : '#ffffff');
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  updateThemeIcons(theme);
  syncThemeColor(theme);
  try { localStorage.setItem('memo-theme', theme); } catch {}
}

function toggleTheme() {
  applyTheme(isDarkTheme(document.documentElement.dataset.theme) ? 'light' : 'dark');
}

document.querySelectorAll('.theme-toggle-btn').forEach(btn => {
  btn.onclick = () => {
    toggleTheme();
    closeNav();
  };
});

(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('memo-theme'); } catch {}
  // 兼容旧版多主题偏好：只认 light / dark，其余（含 caramellatte 等）一律跟随系统
  const theme = saved === 'light' || saved === 'dark'
    ? saved
    : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(theme);
})();

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  let saved = null;
  try { saved = localStorage.getItem('memo-theme'); } catch {}
  if (saved !== 'light' && saved !== 'dark') applyTheme(e.matches ? 'dark' : 'light');
});

/* ---------- 全站快速搜索（Ctrl+K） ---------- */
const cmdk = { open: false, query: '', flat: [], active: -1, memosLoading: false, tagView: null };
const cmdkOverlay = $('#cmdkOverlay');
const cmdkResults = $('#cmdkResults');
const cmdkInput = $('#cmdkInput');

/* 首次打开面板时并行补齐三份数据（都写入全局缓存，与各页面共享） */
function cmdkEnsureData() {
  // 说说全量（独立标志，不与说说页翻页互斥）
  if (!state.searchMemosCache && !cmdk.memosLoading) {
    cmdk.memosLoading = true;
    (async () => {
      try {
        if (USE_MOCK) { await sleep(200); state.searchMemosCache = MOCK_MEMOS; }
        else {
          const first = await fetchData({ view: 'say', page: 1, tags: [] });
          const all = [...(first.data || [])];
          const totalPages = first.totalPages || 1;
          if (totalPages > 1) {
            const rest = await Promise.all(
              Array.from({ length: totalPages - 1 }, (_, i) => fetchData({ view: 'say', page: i + 2, tags: [] }))
            );
            rest.forEach(r => all.push(...(r.data || [])));
          }
          state.searchMemosCache = all;
        }
      } catch {} finally { cmdk.memosLoading = false; if (cmdk.open) cmdkRender(); }
    })();
  }
  // 书签全量（与书签页共享缓存）
  if (!state.bookmarksCache) {
    (async () => {
      try {
        if (USE_MOCK) { await sleep(200); state.bookmarksCache = MOCK_BOOKMARKS; }
        else {
          const res = await fetch(API_BASE + '?view=bookmarks');
          if (res.ok) {
            const json = await res.json();
            state.bookmarksCache = (Array.isArray(json.data) ? json.data : []).filter(b => b && b.title && b.url);
          }
        }
      } catch {} finally { if (cmdk.open) cmdkRender(); }
    })();
  }
  // 影视两列表（与看过/想看页共享缓存）
  ['watched', 'watchlist'].forEach(v => {
    if (state.mediaCache[v]) return;
    fetchData({ view: v }).then(r => {
      state.mediaCache[v] = r.data || [];
      if (cmdk.open) cmdkRender();
    }).catch(() => {});
  });
  loadTags();   // 标签名映射（详情里点标签跳转标签视图时显示名称）
}

function cmdkHi(text, q) {
  const s = String(text || '');
  if (!q) return escapeHtml(s);
  const i = s.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return escapeHtml(s);
  return escapeHtml(s.slice(0, i)) + '<mark>' + escapeHtml(s.slice(i, i + q.length)) + '</mark>' + escapeHtml(s.slice(i + q.length));
}

/* 内存筛选三组数据，返回 [{type, title, sub, url?, memoId?}] */
function cmdkMatch(q) {
  const kw = q.trim().toLowerCase();
  const hit = s => String(s || '').toLowerCase().includes(kw);
  const groups = [
    {
      name: '说说', icon: 'mdi:chat-processing-outline', cls: 'bg-primary/10 text-primary',
      items: kw ? (state.searchMemosCache || []).filter(m => hit(m.content)).slice(0, 5).map(m => {
        const plain = String(m.content || '').replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/#+\s/g, '').replace(/\s+/g, ' ').trim();
        return { type: 'memo', memoId: m.id, title: plain.slice(0, 64) || '（图片）', sub: relativeTime(m.rawDate), icon: 'mdi:chat-processing-outline', cls: 'bg-primary/10 text-primary' };
      }) : [],
      loading: !state.searchMemosCache,
    },
    {
      name: '书签', icon: 'mdi:link-variant', cls: 'bg-accent/10 text-accent',
      items: kw ? (state.bookmarksCache || []).filter(b => hit(b.title) || hit(b.desc) || (b.tags || []).some(hit)).slice(0, 6).map(b =>
        ({ type: 'link', title: b.title, sub: b.desc || (b.url || '').replace(/^https?:\/\//, '').slice(0, 50), url: b.url, icon: 'mdi:link-variant', cls: 'bg-accent/10 text-accent' })) : [],
      loading: !state.bookmarksCache,
    },
    {
      name: '影视', icon: 'mdi:movie-open-outline', cls: 'bg-secondary/10 text-secondary',
      items: kw ? [...(state.mediaCache.watched || []), ...(state.mediaCache.watchlist || [])]
        .filter(m => hit(m.title) || hit(m.original_title)).slice(0, 6).map(m =>
          ({ type: 'link', title: m.title, sub: `${m.status === 'watched' ? '看过' : '想看'} · ${m.date} · ★${m.vote_average}`, url: m.douban_url, icon: 'mdi:movie-open-outline', cls: 'bg-secondary/10 text-secondary' })) : [],
      loading: !state.mediaCache.watched || !state.mediaCache.watchlist,
    },
  ];
  return groups;
}

function cmdkRender() {
  if (cmdk.tagView !== null) { cmdkRenderTagView(); return; }
  const q = cmdk.query;
  const groups = cmdkMatch(q);
  cmdk.flat = [];
  let html = '';
  groups.forEach(g => {
    if (g.loading && !g.items.length) {
      html += `<div class="cmdk-group-title">${g.name}</div><div class="cmdk-loading"><span class="loading loading-dots loading-xs"></span>正在加载${g.name}数据…</div>`;
      return;
    }
    if (!g.items.length) return;
    html += `<div class="cmdk-group-title">${g.name}</div>`;
    g.items.forEach(it => {
      const idx = cmdk.flat.length;
      cmdk.flat.push(it);
      html += `
      <div class="cmdk-item ${idx === cmdk.active ? 'active' : ''}" data-idx="${idx}">
        <div class="cmdk-ico ${it.cls}"><span class="iconify text-lg" data-icon="${it.icon}"></span></div>
        <div class="flex-1 min-w-0">
          <div class="text-sm leading-snug truncate">${cmdkHi(it.title, q)}</div>
          <div class="text-xs opacity-50 truncate">${escapeHtml(it.sub || '')}</div>
        </div>
        <span class="iconify text-base opacity-25 shrink-0" data-icon="lucide:chevron-right"></span>
      </div>`;
    });
  });
  if (!html) {
    html = `<div class="text-center py-10 opacity-50 text-sm">${q ? '没有匹配的结果' : '输入关键词，同时搜索说说、书签与影视'}</div>`;
  }
  cmdkResults.innerHTML = html;
  cmdkResults.querySelectorAll('.cmdk-item').forEach(el => {
    el.onclick = () => cmdkExec(Number(el.dataset.idx));
  });
  cmdkScrollActive();
}

/* 标签视图：列出某标签下的全部说说（搜索面板内浏览，不跳页） */
function cmdkRenderTagView() {
  const tagId = cmdk.tagView;
  const name = tagNameMap.get(tagId) || String(tagId).replace(/^tag_/, '');
  const list = (state.searchMemosCache || [])
    .filter(m => (m.tags || []).includes(tagId))
    .sort((a, b) => new Date(String(b.rawDate || '').replace(' ', 'T')).getTime() - new Date(String(a.rawDate || '').replace(' ', 'T')).getTime());
  cmdk.flat = list.map(m => {
    const plain = String(m.content || '').replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/#+\s/g, '').replace(/\s+/g, ' ').trim();
    return { type: 'memo', memoId: m.id, title: plain.slice(0, 64) || '（图片）', sub: relativeTime(m.rawDate), icon: 'mdi:chat-processing-outline', cls: 'bg-primary/10 text-primary' };
  });
  const rows = cmdk.flat.map((it, idx) => `
    <div class="cmdk-item ${idx === cmdk.active ? 'active' : ''}" data-idx="${idx}">
      <div class="cmdk-ico ${it.cls}"><span class="iconify text-lg" data-icon="${it.icon}"></span></div>
      <div class="flex-1 min-w-0">
        <div class="text-sm leading-snug truncate">${escapeHtml(it.title)}</div>
        <div class="text-xs opacity-50 truncate">${escapeHtml(it.sub || '')}</div>
      </div>
      <span class="iconify text-base opacity-25 shrink-0" data-icon="lucide:chevron-right"></span>
    </div>`).join('');
  cmdkResults.innerHTML = `
    <div class="flex items-center gap-2 px-2 pt-1 pb-1">
      <button type="button" class="btn btn-ghost btn-xs gap-0.5 cmdk-tag-back">
        <span class="iconify text-base" data-icon="lucide:arrow-left"></span>返回搜索
      </button>
      <span class="text-xs opacity-60 truncate">#${escapeHtml(name)} · ${cmdk.flat.length} 条说说</span>
    </div>
    ${cmdk.flat.length ? rows : `<div class="text-center py-8 opacity-50 text-sm">这个标签下暂时没有说说</div>`}`;
  cmdkResults.querySelectorAll('.cmdk-item').forEach(el => {
    el.onclick = () => cmdkExec(Number(el.dataset.idx));
  });
  const back = cmdkResults.querySelector('.cmdk-tag-back');
  if (back) back.onclick = () => { cmdk.tagView = null; cmdkRender(); cmdkInput.focus(); };
  cmdkScrollActive();
}

function cmdkScrollActive() {
  const el = cmdkResults.querySelector(`.cmdk-item[data-idx="${cmdk.active}"]`);
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function cmdkOpen() {
  cmdk.open = true;
  cmdkOverlay.classList.add('open');
  cmdkEnsureData();
  cmdkRender();
  setTimeout(() => cmdkInput.focus(), 30);
}
function cmdkClose() {
  cmdk.open = false;
  cmdk.tagView = null;
  cmdkOverlay.classList.remove('open');
  cmdkInput.value = '';
  cmdk.query = '';
  $('#cmdkMemoModal').classList.remove('open');
}
function cmdkExec(idx) {
  const it = cmdk.flat[idx];
  if (!it) return;
  if (it.type === 'memo') {
    // 说说：弹出全文详情（复用 memoCard 渲染，图片支持灯箱）
    const m = (state.searchMemosCache || []).find(x => x.id === it.memoId);
    if (!m) return;
    const body = $('#cmdkMemoBody');
    body.innerHTML = `<div class="px-2">${memoCard(m, 0, { plain: true })}</div>`;
    initCarousels(body);   // 弹窗内的多图条需要单独初始化拖拽与计数
    $('#cmdkMemoModal').classList.add('open');
    body.scrollTop = 0;
  } else if (it.url) {
    window.open(it.url, '_blank', 'noopener');   // 面板保持打开，不打断搜索
  }
}

cmdkInput.addEventListener('input', () => {
  cmdk.tagView = null;   // 输入即退出标签视图，回到普通搜索
  cmdk.query = cmdkInput.value;
  cmdk.active = 0;
  cmdkRender();
});
// 详情弹窗内点击标签徽章：面板切到该标签的说说列表（不关面板）
$('#cmdkMemoBody').addEventListener('click', e => {
  const tag = e.target.closest('.memo-tag');
  if (!tag || !tag.dataset.tag) return;
  $('#cmdkMemoModal').classList.remove('open');
  cmdk.tagView = tag.dataset.tag;
  cmdk.active = 0;
  cmdkRender();
});

// 委托挂 document：搜索面板和详情弹窗是两个平级 overlay，挂在其中一个上收不到另一个的点击
document.addEventListener('click', e => {
  const memoModal = $('#cmdkMemoModal');
  const memoOpen = memoModal.classList.contains('open');
  const backFocus = () => setTimeout(() => cmdkInput.focus(), 30);
  // 详情弹窗的 ✕：只关详情，回到搜索列表
  if (e.target.closest('.cmdk-memo-close')) {
    memoModal.classList.remove('open');
    backFocus();
    return;
  }
  // 详情开着时点遮罩（任一层）：先回列表
  if (memoOpen && (e.target === memoModal || e.target === cmdkOverlay)) {
    memoModal.classList.remove('open');
    backFocus();
    return;
  }
  // 搜索面板遮罩 / 面板的 ✕：关闭整个面板
  if (e.target === cmdkOverlay || e.target.closest('.cmdk-close')) cmdkClose();
});
document.querySelectorAll('.cmdk-open').forEach(b => b.addEventListener('click', () => { closeNav(); cmdkOpen(); }));
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    cmdk.open ? cmdkClose() : cmdkOpen();
    return;
  }
  if (!cmdk.open) return;
  if (e.key === 'Escape') {
    // 层级关闭：详情弹窗 → 标签视图 → 整个面板
    if ($('#cmdkMemoModal').classList.contains('open')) {
      $('#cmdkMemoModal').classList.remove('open');
      setTimeout(() => cmdkInput.focus(), 30);
      return;
    }
    if (cmdk.tagView !== null) {
      cmdk.tagView = null;
      cmdkRender();
      return;
    }
    cmdkClose();
    return;
  }
  if ($('#cmdkMemoModal').classList.contains('open')) return;   // 详情弹窗内不响应列表导航
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!cmdk.flat.length) return;
    const delta = e.key === 'ArrowDown' ? 1 : -1;
    cmdk.active = (cmdk.active + delta + cmdk.flat.length) % cmdk.flat.length;
    cmdkResults.querySelectorAll('.cmdk-item').forEach(el =>
      el.classList.toggle('active', Number(el.dataset.idx) === cmdk.active));
    cmdkScrollActive();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    cmdkExec(cmdk.active);
  }
});

/* ---------- 回到顶部 ---------- */
const toTop = $('#toTop');
// 移动端滚动的是 body、桌面端滚动的是 #mainScroll：用 getScrollPos() 统一取值，
// 两个容器都挂监听，任一滚动都触发，跨断点缩放时也能即时同步
function updateToTop() {
  const show = getScrollPos() > 500;
  toTop.style.opacity = show ? '1' : '0';
  toTop.style.pointerEvents = show ? 'auto' : 'none';
}
window.addEventListener('scroll', updateToTop, { passive: true });
mainScroll.addEventListener('scroll', updateToTop, { passive: true });
window.addEventListener('resize', updateToTop);
toTop.onclick = () => scrollToTop({ behavior: 'smooth' });

switchView('say');
startReminderWatch();                    // 提醒监视器：到点实时弹右上角 toast
setTimeout(showReminderBanner, 1800);   // 首页提示最近的播放提醒

        const repeatFlags = new Map();

        let audioEl = null;
        let audioLoadedTrackId = null;
        let loadGeneration = 0;
        // ===== Media Session（系统媒体条：歌名/歌手/封面）=====
        function updateMediaSession(meta) {
          if (!("mediaSession" in navigator)) return;
          try {
            if (!meta || !meta.title) {
              navigator.mediaSession.metadata = null;
              navigator.mediaSession.playbackState = "none";
              return;
            }
            const art = meta.cover
              ? [
                  { src: meta.cover, sizes: "96x96", type: "image/jpeg" },
                  { src: meta.cover, sizes: "256x256", type: "image/jpeg" },
                  { src: meta.cover, sizes: "512x512", type: "image/jpeg" },
                ]
              : [];
            navigator.mediaSession.metadata = new MediaMetadata({
              title: meta.title || "未知歌曲",
              artist: meta.artist || "未知歌手",
              album: meta.album || "",
              artwork: art,
            });
            navigator.mediaSession.playbackState = state.isPlaying
              ? "playing"
              : "paused";
          } catch (e) {
            /* ignore */
          }
        }

        function updateMediaPosition() {
          if (!("mediaSession" in navigator) || !audioEl) return;
          try {
            const dur = audioEl.duration;
            if (!dur || !isFinite(dur) || dur <= 0) return;
            let pos = audioEl.currentTime || 0;
            if (pos < 0) pos = 0;
            if (pos > dur) pos = dur;
            navigator.mediaSession.setPositionState({
              duration: dur,
              playbackRate: audioEl.playbackRate || 1,
              position: pos,
            });
          } catch (e) {
            /* 部分浏览器不支持 setPositionState */
          }
        }

        let _posThrottle = 0;
        function bindMediaSessionHandlers() {
          if (!("mediaSession" in navigator)) return;
          if (navigator.mediaSession.__hwBound) return;
          navigator.mediaSession.__hwBound = true;

          const safe = (fn) => {
            try {
              fn();
            } catch (e) {}
          };

          navigator.mediaSession.setActionHandler("play", () => {
            safe(() => {
              ensureAudioEl();
              if (audioEl) audioEl.play().catch(() => {});
            });
          });
          navigator.mediaSession.setActionHandler("pause", () => {
            safe(() => {
              if (audioEl) audioEl.pause();
            });
          });
          navigator.mediaSession.setActionHandler("previoustrack", () => {
            safe(() => {
              if (!state.queue) return;
              const pls = getPlaylistState(state.queue.listId);
              let prev = pls.posInOrder - 1;
              if (prev < 0) {
                if (pls.repeatMode === "all") prev = pls.order.length - 1;
                else return;
              }
              pls.posInOrder = prev;
              playFromPlaylist(state.queue.listId, pls.order[prev]);
            });
          });
          navigator.mediaSession.setActionHandler("nexttrack", () => {
            safe(() => {
              if (state.queue) advanceQueue();
            });
          });
          try {
            navigator.mediaSession.setActionHandler("seekto", (details) => {
              if (!audioEl || details.seekTime == null) return;
              audioEl.currentTime = details.seekTime;
              updateMediaPosition();
            });
          } catch (e) {}
          try {
            navigator.mediaSession.setActionHandler("seekbackward", (details) => {
              if (!audioEl) return;
              const off = details.seekOffset || 10;
              audioEl.currentTime = Math.max(0, audioEl.currentTime - off);
              updateMediaPosition();
            });
            navigator.mediaSession.setActionHandler("seekforward", (details) => {
              if (!audioEl) return;
              const off = details.seekOffset || 10;
              const dur = audioEl.duration || 0;
              audioEl.currentTime = Math.min(dur, audioEl.currentTime + off);
              updateMediaPosition();
            });
          } catch (e) {}
        }

        function resolveCurrentMeta() {
          if (state.queue) {
            const pls = getPlaylistState(state.queue.listId);
            const t = pls.tracks[state.queue.index];
            if (t) {
              return {
                trackId: t.trackId,
                title: t.title,
                artist: t.artist,
                album: t.album || "",
                cover: t.cover || "",
              };
            }
          }
          if (
            state._currentMeta &&
            state.activeId &&
            state._currentMeta.trackId === state.activeId
          ) {
            return state._currentMeta;
          }
          return null;
        }
        function isRepeatOn(trackId) {
          return !!repeatFlags.get(trackId);
        }

        function setRepeat(trackId, on) {
          repeatFlags.set(trackId, on);
          if (state.activeId === trackId && state.source === "netease" && audioEl && !state.queue)
            audioEl.loop = on;
        }

        function ensureAudioEl() {
          if (audioEl) return audioEl;
          audioEl = document.createElement("audio");
          audioEl.id = "hwGlobalAudio";
          audioEl.style.display = "none";
          audioEl.preload = "none";
          document.body.appendChild(audioEl);
                    audioEl.addEventListener("timeupdate", () => {
            state.duration = (audioEl.duration || 0) * 1000;
            state.position = (audioEl.currentTime || 0) * 1000;
            broadcast();
            // 进度同步节流，大约每秒一次
            const now = Date.now();
            if (now - _posThrottle > 1000) {
              _posThrottle = now;
              updateMediaPosition();
            }
          });
          audioEl.addEventListener("play", () => {
            state.isPlaying = true;
            broadcast();
          });
          audioEl.addEventListener("pause", () => {
            state.isPlaying = false;
            broadcast();
          });
          audioEl.addEventListener("ended", () => {
            positions.delete(state.activeId);
            if (state.queue) advanceQueue();
            else {
              state.isPlaying = false;
              state.position = 0;
              broadcast();
            }
          });
          return audioEl;
        }

                function broadcast() {
          document.dispatchEvent(
            new CustomEvent("hwplayer:update", { detail: { ...state } })
          );
          updateMediaSession(resolveCurrentMeta());
        }

        function saveCurrentPosition() {
          if (!state.activeId) return;
          let pos = state.position;
          if (audioEl && state.source === "netease")
            pos = audioEl.currentTime * 1000;
          if (pos > 0) positions.set(state.activeId, pos);
        }

        function getSavedPosition(trackId) {
          return positions.get(trackId) || 0;
        }

        function switchToNetease(meta, queueCtx) {
          ensureAudioEl();
          saveCurrentPosition();
          const myGen = ++loadGeneration;
          const resumeMs = getSavedPosition(meta.trackId);
          state.activeId = meta.trackId;
          state.source = "netease";
          state.duration = 0;
          state.position = resumeMs;
          state.isPlaying = false;
          state.queue = queueCtx || null;
                    state._currentMeta = {
            trackId: meta.trackId,
            title: meta.title,
            artist: meta.artist,
            album: meta.album || "",
            cover: meta.cover || "",
          };
          bindMediaSessionHandlers();
          broadcast();
          let loopFlag = false;
          if (queueCtx) {
            const pls = getPlaylistState(queueCtx.listId);
            loopFlag = pls.repeatMode === "one";
          } else {
            loopFlag = isRepeatOn(meta.trackId);
          }
          audioEl.loop = loopFlag;
          const startPlayback = () => {
            if (myGen !== loadGeneration) return;
            audioEl.currentTime = resumeMs / 1000;
            audioEl.play().catch(() => {});
          };
          if (audioLoadedTrackId === meta.trackId && audioEl.src) {
            startPlayback();
            return;
          }
          audioLoadedTrackId = meta.trackId;
          audioEl.src = meta.audioUrl;
          audioEl.load();
          if (audioEl.readyState >= 1) startPlayback();
          else
            audioEl.addEventListener("loadedmetadata", startPlayback, {
              once: true,
            });
        }

        function togglePauseCurrent() {
          if (audioEl) {
            audioEl.paused ? audioEl.play().catch(() => {}) : audioEl.pause();
          }
        }

        function playTrack(meta, queueCtx) {
          const isSameActiveTrack =
            state.activeId === meta.trackId && !queueCtx && !state.queue;
          if (isSameActiveTrack) {
            togglePauseCurrent();
            return;
          }
          switchToNetease(meta, queueCtx || null);
        }

        function loadLikes() {
          try {
            return new Set(
              JSON.parse(localStorage.getItem(LIKE_STORAGE_KEY) || "[]")
            );
          } catch (e) {
            return new Set();
          }
        }

        function saveLikes(set) {
          try {
            localStorage.setItem(LIKE_STORAGE_KEY, JSON.stringify([...set]));
          } catch (e) {}
        }
        const likedTracks = loadLikes();

        function isLiked(trackId) {
          return likedTracks.has(trackId);
        }

        function toggleLike(trackId) {
          if (likedTracks.has(trackId)) likedTracks.delete(trackId);
          else likedTracks.add(trackId);
          saveLikes(likedTracks);
          document.dispatchEvent(
            new CustomEvent("hwplayer:like-update", {
              detail: { trackId, liked: likedTracks.has(trackId) },
            })
          );
        }

        function parseNeteaseId(url) {
          const m = url.match(/[?&]id=(\d+)/);
          return m ? m[1] : null;
        }

        async function fetchNeteaseMeta(url) {
          const id = parseNeteaseId(url);
          if (!id) throw new Error("无法解析网易云歌曲 ID");
          const res = await fetch(NETEASE_SONG_INFO_API(id));
          const json = await res.json();
          const data = Array.isArray(json) ? json[0] : json;
          if (!data || !data.url) throw new Error("网易云元数据获取失败");
          return {
            neteaseId: id,
            trackId: "ne-" + id,
            title: data.name || "未知歌曲",
            artist: data.artist || "未知歌手",
            album: data.album || "",
            cover: data.pic || "",
            audioUrl: data.url,
          };
        }

        async function getMeta(rawUrl) {
          if (metaCache.has(rawUrl)) return metaCache.get(rawUrl);
          const p = fetchNeteaseMeta(rawUrl).catch((err) => ({
            trackId: "err-" + uidSeq++,
            title: "加载失败",
            artist: String(err.message || err),
            album: "",
            cover: "",
            audioUrl: "",
          }));
          metaCache.set(rawUrl, p);
          return p;
        }

        function parseLRC(lrcText) {
          if (!lrcText) return [];
          const lines = lrcText.split("\n");
          const timeTag = /\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
          const result = [];
          for (const line of lines) {
            const tags = [...line.matchAll(timeTag)];
            if (!tags.length) continue;
            const text = line.replace(timeTag, "").trim();
            if (!text) continue;
            for (const t of tags) {
              const min = parseInt(t[1], 10),
                sec = parseInt(t[2], 10);
              const ms = t[3] ? parseInt(t[3].padEnd(3, "0"), 10) : 0;
              result.push({ time: min * 60000 + sec * 1000 + ms, text });
            }
          }
          result.sort((a, b) => a.time - b.time);
          return result;
        }

        async function getLyricsByNeteaseId(neteaseId) {
          if (lyricsCache.has(neteaseId)) return lyricsCache.get(neteaseId);
          const p = (async () => {
            try {
              const res = await fetch(NETEASE_LRC_API(neteaseId));
              const lrcText = await res.text();
              return { lines: parseLRC(lrcText) };
            } catch (e) {
              return { lines: [] };
            }
          })();
          lyricsCache.set(neteaseId, p);
          return p;
        }

        async function fetchPlaylist(listId) {
          if (playlistCache.has(listId)) return playlistCache.get(listId);
          const p = (async () => {
            try {
              const res = await fetch(NETEASE_PLAYLIST_API(listId));
              const json = await res.json();
              const arr = Array.isArray(json) ? json : [];
              const tracks = arr
                .map((item) => {
                  const idMatch = (item.url || "").match(/[?&]id=(\d+)/);
                  const neteaseId = idMatch ? idMatch[1] : null;
                  return {
                    neteaseId,
                    trackId: "ne-" + (neteaseId || uidSeq++),
                    title: item.name || "未知歌曲",
                    artist: item.artist || "未知歌手",
                    cover: item.pic || "",
                    audioUrl: item.url || "",
                  };
                })
                .filter((t) => t.audioUrl);
              return { ok: true, tracks };
            } catch (e) {
              return { ok: false, tracks: [], error: String(e.message || e) };
            }
          })();
          playlistCache.set(listId, p);
          return p;
        }

        function buildOrder(len, shuffle) {
          const arr = Array.from({ length: len }, (_, i) => i);
          if (!shuffle) return arr;
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        }

        const playlistStates = new Map();

        function getPlaylistState(listId) {
          if (!playlistStates.has(listId))
            playlistStates.set(listId, {
              tracks: [],
              order: [],
              posInOrder: 0,
              shuffle: false,
              repeatMode: "off",
              lastPlayedIndex: null,
            });
          return playlistStates.get(listId);
        }

        function playFromPlaylist(listId, trackIndex) {
          const pls = getPlaylistState(listId);
          const track = pls.tracks[trackIndex];
          if (!track) return;
          const orderPos = pls.order.indexOf(trackIndex);
          pls.posInOrder = orderPos >= 0 ? orderPos : 0;
          pls.lastPlayedIndex = trackIndex;
          switchToNetease(track, { listId, index: trackIndex });
          document.dispatchEvent(
            new CustomEvent("hwplayer:queue-change", { detail: { listId } })
          );
        }

        function advanceQueue() {
          const ctx = state.queue;
          if (!ctx) return;
          const pls = getPlaylistState(ctx.listId);
          let nextOrderPos = pls.posInOrder + 1;
          if (nextOrderPos >= pls.order.length) {
            if (pls.repeatMode === "all") nextOrderPos = 0;
            else {
              state.isPlaying = false;
              state.position = 0;
              state.queue = null;
              broadcast();
              return;
            }
          }
          pls.posInOrder = nextOrderPos;
          playFromPlaylist(ctx.listId, pls.order[nextOrderPos]);
        }

        function togglePlaylistShuffle(listId) {
          const pls = getPlaylistState(listId);
          pls.shuffle = !pls.shuffle;
          const currentTrackIndex =
            state.queue && state.queue.listId === listId
              ? state.queue.index
              : null;
          pls.order = buildOrder(pls.tracks.length, pls.shuffle);
          if (currentTrackIndex !== null) {
            const pos = pls.order.indexOf(currentTrackIndex);
            if (pos > 0) {
              pls.order.splice(pos, 1);
              pls.order.unshift(currentTrackIndex);
            }
            pls.posInOrder = 0;
          }
          document.dispatchEvent(
            new CustomEvent("hwplayer:queue-change", { detail: { listId } })
          );
        }

        function cyclePlaylistRepeat(listId) {
          const pls = getPlaylistState(listId);
          const modes = ["off", "all", "one"];
          pls.repeatMode =
            modes[(modes.indexOf(pls.repeatMode) + 1) % modes.length];
          if (audioEl && state.queue && state.queue.listId === listId) {
            audioEl.loop = pls.repeatMode === "one";
          }
          document.dispatchEvent(
            new CustomEvent("hwplayer:queue-change", { detail: { listId } })
          );
        }

        const SHORTCODE_SONG_RE =
          /\{\{<\s*music\s+url=["']([^"']+)["']\s*>\}\}/g;
        const SHORTCODE_LIST_RE =
          /\{\{<\s*musiclist\s+id=["']([^"']+)["']\s*>\}\}/g;

        function escapeAttr(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        function parseShortcodes(text) {
          if (!text) return text;
          let out = text;
          if (SHORTCODE_SONG_RE.test(out)) {
            SHORTCODE_SONG_RE.lastIndex = 0;
            out = out.replace(SHORTCODE_SONG_RE, (_, url) => {
              const mountId = "hwmount-" + uidSeq++;
              return `\n<div class="hw-player-mount" data-hw-url="${escapeAttr(url)}" data-hw-mount-id="${mountId}"></div>\n`;
            });
          }
          if (SHORTCODE_LIST_RE.test(out)) {
            SHORTCODE_LIST_RE.lastIndex = 0;
            out = out.replace(SHORTCODE_LIST_RE, (_, listId) => {
              const mountId = "hwlistmount-" + uidSeq++;
              return `\n<div class="hw-playlist-mount" data-hw-list-id="${escapeAttr(listId)}" data-hw-mount-id="${mountId}"></div>\n`;
            });
          }
          return out;
        }

        function skeletonHTML() {
          return `<div class="hw-player hw-player-loading"><div class="hw-note-corner">♪</div><div class="hw-player-head"><div class="hw-disc-wrap"><div class="hw-disc"></div></div></div><div class="hw-meta"><div class="hw-title">加载中…</div></div></div>`;
        }

        function cardHTML(meta) {
          const cover = meta.cover || "";
          const liked = isLiked(meta.trackId);
          const repeatOn = isRepeatOn(meta.trackId);
          return `<div class="hw-player" data-track-id="${meta.trackId}">
              <div class="hw-note-corner">♪</div>
              <div class="hw-view-normal">
                <div class="hw-player-head">
                  <div class="hw-disc-wrap"><div class="hw-disc" style="${cover ? `background-image:url('${escapeAttr(cover)}')` : ""}"></div></div>
                  <div class="hw-cover">${cover ? `<img class="hw-cover-img" src="${escapeAttr(cover)}" alt="">` : ""}</div>
                </div>
                <div class="hw-meta">
                  <div class="hw-title">${escapeAttr(meta.title)}</div>
                  <div class="hw-artist">${escapeAttr(meta.artist || "")}</div>
                  ${meta.album ? `<div class="hw-album">${escapeAttr(meta.album)}</div>` : ""}
                </div>
              </div>
              <div class="hw-view-lyrics"><div class="hw-lyrics-scroll-full"><div class="hw-lyrics-empty">点击加载歌词…</div></div></div>
              <div class="hw-progress-row">
                <span class="hw-time hw-cur">00:00</span>
                <input type="range" class="hw-progress" min="0" max="1000" value="0">
                <span class="hw-time hw-dur">00:00</span>
              </div>
              <div class="hw-controls">
                <button class="hw-btn hw-like${liked ? " active" : ""}" title="喜欢">${liked ? ICONS.heartFilled : ICONS.heart}</button>
                <button class="hw-btn hw-lyrics-toggle" title="歌词">${ICONS.lyrics}</button>
                <button class="hw-btn hw-play" title="播放/暂停">${ICONS.play}</button>
                <button class="hw-btn hw-repeat${repeatOn ? " active" : ""}" title="单曲循环">${ICONS.repeat}</button>
              </div>
            </div>`;
        }

        function fmtTime(ms) {
          if (!ms || isNaN(ms)) return "00:00";
          const s = Math.floor(ms / 1000),
            m = Math.floor(s / 60),
            ss = s % 60;
          return `${String(m).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
        }

        function refreshCardUI(cardEl, meta) {
          const isActive = state.activeId === meta.trackId && !state.queue;
          const playBtn = cardEl.querySelector(".hw-play");
          const discWrap = cardEl.querySelector(".hw-disc-wrap");
          const progress = cardEl.querySelector(".hw-progress");
          const cur = cardEl.querySelector(".hw-cur");
          const dur = cardEl.querySelector(".hw-dur");
          const playing = isActive && state.isPlaying;
          playBtn.innerHTML = playing ? ICONS.pause : ICONS.play;
          discWrap.classList.toggle("spinning", playing);
          if (isActive) {
            const pct = state.duration
              ? (state.position / state.duration) * 1000
              : 0;
            progress.value = Math.min(1000, Math.max(0, pct));
            cur.textContent = fmtTime(state.position);
            dur.textContent = fmtTime(state.duration);
            syncLyrics(cardEl, state.position);
          } else {
            const savedMs = getSavedPosition(meta.trackId);
            progress.value = 0;
            cur.textContent = savedMs > 0 ? fmtTime(savedMs) : "00:00";
            dur.textContent = "00:00";
          }
        }

        function refreshLikeUI(cardEl, trackId) {
          const likeBtn = cardEl.querySelector(".hw-like");
          if (!likeBtn) return;
          const liked = isLiked(trackId);
          likeBtn.classList.toggle("active", liked);
          likeBtn.innerHTML = liked ? ICONS.heartFilled : ICONS.heart;
        }

        function refreshRepeatUI(cardEl, trackId) {
          const repeatBtn = cardEl.querySelector(".hw-repeat");
          if (!repeatBtn) return;
          repeatBtn.classList.toggle("active", isRepeatOn(trackId));
        }

        function renderLyricsList(scrollEl, lyricsResult) {
          if (!lyricsResult.lines.length) {
            scrollEl.innerHTML = '<div class="hw-lyrics-empty">暂无歌词</div>';
            return;
          }
          scrollEl.innerHTML = lyricsResult.lines
            .map(
              (l, i) =>
                `<div class="hw-lyrics-line" data-idx="${i}" data-time="${l.time}">${escapeAttr(l.text)}</div>`
            )
            .join("");
        }

        function syncLyricsScroll(scroll, positionMs) {
          if (!scroll) return;
          const lineEls = scroll.querySelectorAll(".hw-lyrics-line");
          if (!lineEls.length) return;
          let activeIdx = -1;
          lineEls.forEach((el, i) => {
            if (Number(el.dataset.time) <= positionMs) activeIdx = i;
          });
          lineEls.forEach((el, i) =>
            el.classList.toggle("active", i === activeIdx)
          );
          if (activeIdx >= 0) {
            const activeEl = lineEls[activeIdx];
            const targetTop = activeEl.offsetTop - scroll.clientHeight / 2 + activeEl.clientHeight / 2;
            scroll.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });
          }
        }
        function syncLyrics(cardEl, positionMs) {
          syncLyricsScroll(cardEl && cardEl.querySelector(".hw-lyrics-scroll-full"), positionMs);
          syncLyricsScroll(document.getElementById("hwLyricsFloatScroll"), positionMs);
          return;
          const scroll = cardEl.querySelector(".hw-lyrics-scroll-full");
          if (!scroll) return;
          const lineEls = scroll.querySelectorAll(".hw-lyrics-line");
          if (!lineEls.length) return;
          let activeIdx = -1;
          lineEls.forEach((el, i) => {
            if (Number(el.dataset.time) <= positionMs) activeIdx = i;
          });
          lineEls.forEach((el, i) =>
            el.classList.toggle("active", i === activeIdx)
          );
          if (activeIdx >= 0) {
            const activeEl = lineEls[activeIdx];
            const targetTop =
              activeEl.offsetTop -
              scroll.clientHeight / 2 +
              activeEl.clientHeight / 2;
            scroll.scrollTo({
              top: Math.max(0, targetTop),
              behavior: "smooth",
            });
          }
        }

        function bindCard(cardEl, meta) {
          if (cardEl.dataset.hwBound) {
            refreshCardUI(cardEl, meta);
            refreshLikeUI(cardEl, meta.trackId);
            refreshRepeatUI(cardEl, meta.trackId);
            return;
          }
          cardEl.dataset.hwBound = "1";
          const playBtn = cardEl.querySelector(".hw-play");
          const likeBtn = cardEl.querySelector(".hw-like");
          const repeatBtn = cardEl.querySelector(".hw-repeat");
          const lyricsBtn = cardEl.querySelector(".hw-lyrics-toggle");
          const progress = cardEl.querySelector(".hw-progress");

          playBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            playTrack(meta);
          });
          likeBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            toggleLike(meta.trackId);
          });
          repeatBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            setRepeat(meta.trackId, !isRepeatOn(meta.trackId));
            refreshRepeatUI(cardEl, meta.trackId);
          });
          progress.addEventListener("input", (e) => {
            e.stopPropagation();
            if (state.activeId !== meta.trackId || state.queue || !audioEl)
              return;
            audioEl.currentTime =
              (Number(progress.value) / 1000) * (audioEl.duration || 0);
          });

          let lyricsLoaded = false;
          lyricsBtn.addEventListener("click", async (e) => {
            e.preventDefault();
            e.stopPropagation();
            const nowOn = cardEl.classList.toggle("lyrics-mode");
            lyricsBtn.classList.toggle("active", nowOn);
            setLyricsFloatOpen(nowOn);
            const titleEl = document.getElementById("hwLyricsFloatTitle");
            if (nowOn && titleEl) titleEl.textContent = meta.title || "歌词";
            if (nowOn && !lyricsLoaded) {
              lyricsLoaded = true;
              const lyricsResult = await getLyricsByNeteaseId(meta.neteaseId);
              renderLyricsList(
                document.getElementById("hwLyricsFloatScroll") ||
                cardEl.querySelector(".hw-lyrics-scroll-full"),
                lyricsResult
              );
              if (state.activeId === meta.trackId)
                syncLyrics(cardEl, state.position);
            }
            if (typeof window.HWonMasonryNeeded === "function")
              window.HWonMasonryNeeded();
          });

          cardEl.addEventListener("mousedown", (e) => e.stopPropagation());
          cardEl.addEventListener("touchstart", (e) => e.stopPropagation(), {
            passive: true,
          });

          document.addEventListener("hwplayer:update", () =>
            refreshCardUI(cardEl, meta)
          );
          document.addEventListener("hwplayer:like-update", (e) => {
            if (e.detail.trackId === meta.trackId)
              refreshLikeUI(cardEl, meta.trackId);
          });
          refreshCardUI(cardEl, meta);
          refreshLikeUI(cardEl, meta.trackId);
          refreshRepeatUI(cardEl, meta.trackId);
        }

        async function mountOne(mountEl) {
          const url = mountEl.getAttribute("data-hw-url");
          if (!url) return;
          mountEl.innerHTML = skeletonHTML();
          const meta = await getMeta(url);
          if (typeof window.HWonMasonryNeeded === "function")
            window.HWonMasonryNeeded();
          mountEl.innerHTML = cardHTML(meta);
          const cardEl = mountEl.querySelector(".hw-player");
          bindCard(cardEl, meta);
          if (typeof window.HWonMasonryNeeded === "function")
            window.HWonMasonryNeeded();
        }

        function playlistSkeletonHTML() {
          return `<div class="hw-playlist"><div class="hw-pl-loading">歌单加载中…</div></div>`;
        }

        function playlistErrorHTML(msg) {
          return `<div class="hw-playlist"><div class="hw-pl-error">歌单加载失败：${escapeAttr(msg)}</div></div>`;
        }

        function playlistCardHTML(listId, pls) {
          const track =
            state.queue && state.queue.listId === listId
              ? pls.tracks[state.queue.index]
              : pls.tracks[0];
          const cover = (track && track.cover) || "";
          const rowsHTML = pls.tracks
            .map(
              (t, i) =>
                `
              <div class="hw-pl-row" data-idx="${i}">
                <span class="hw-pl-row-idx">${i + 1}</span>
                <div class="hw-pl-row-thumb">${t.cover ? `<img src="${escapeAttr(t.cover)}" alt="">` : ""}</div>
                <div class="hw-pl-row-info">
                  <div class="hw-pl-row-title">${escapeAttr(t.title)}</div>
                  <div class="hw-pl-row-artist">${escapeAttr(t.artist)}</div>
                </div>
                <span class="hw-pl-row-playicon">♪</span>
              </div>`
            )
            .join("");

          return `<div class="hw-playlist" data-list-id="${escapeAttr(listId)}">
              <div class="hw-pl-view-normal">
                <div class="hw-pl-header">
                  <div class="hw-pl-cover">${cover ? `<img class="hw-cover-img hw-pl-cover-img" src="${escapeAttr(cover)}" alt="">` : ""}</div>
                  <div class="hw-pl-meta">
                    <div class="hw-pl-title hw-pl-current-title">${escapeAttr(track ? track.title : "播放列表")}</div>
                    <div class="hw-pl-artist hw-pl-current-artist">${escapeAttr(track ? track.artist : "")}</div>
                    <div class="hw-pl-count">共 ${pls.tracks.length} 首</div>
                  </div>
                </div>
              </div>
              <div class="hw-pl-view-lyrics"><div class="hw-lyrics-scroll-full"><div class="hw-lyrics-empty">点击歌曲开始播放</div></div></div>
              <div class="hw-pl-progress-row">
                <span class="hw-time hw-pl-cur">00:00</span>
                <input type="range" class="hw-progress hw-pl-progress" min="0" max="1000" value="0">
                <span class="hw-time hw-pl-dur">00:00</span>
              </div>
              <div class="hw-pl-controls">
                <button class="hw-btn hw-pl-shuffle${pls.shuffle ? " active" : ""}" title="随机播放">${ICONS.shuffle}</button>
                <button class="hw-btn hw-pl-lyrics-toggle" title="歌词">${ICONS.lyrics}</button>
                <button class="hw-btn hw-play hw-pl-play" title="播放/暂停">${ICONS.play}</button>
                <button class="hw-btn hw-pl-repeat${pls.repeatMode !== "off" ? " active" : ""}" title="循环模式">${ICONS.repeat}${pls.repeatMode === "one" ? '<span class="hw-repeat-badge">1</span>' : ""}</button>
              </div>
              <div class="hw-pl-list">${rowsHTML}</div>
            </div>`;
        }

        function refreshPlaylistUI(cardEl, listId) {
          const pls = getPlaylistState(listId);
          const isThisQueueActive =
            state.queue && state.queue.listId === listId;
          const playBtn = cardEl.querySelector(".hw-pl-play");
          const progress = cardEl.querySelector(".hw-pl-progress");
          const cur = cardEl.querySelector(".hw-pl-cur");
          const dur = cardEl.querySelector(".hw-pl-dur");
          const titleEl = cardEl.querySelector(".hw-pl-current-title");
          const artistEl = cardEl.querySelector(".hw-pl-current-artist");
          const shuffleBtn = cardEl.querySelector(".hw-pl-shuffle");
          const repeatBtn = cardEl.querySelector(".hw-pl-repeat");
          const coverImg = cardEl.querySelector(".hw-pl-cover-img");
          const rows = cardEl.querySelectorAll(".hw-pl-row");

          shuffleBtn.classList.toggle("active", pls.shuffle);
          repeatBtn.classList.toggle("active", pls.repeatMode !== "off");
          repeatBtn.innerHTML =
            ICONS.repeat +
            (pls.repeatMode === "one"
              ? '<span class="hw-repeat-badge">1</span>'
              : "");

          const playing = isThisQueueActive && state.isPlaying;
          playBtn.innerHTML = playing ? ICONS.pause : ICONS.play;

          if (isThisQueueActive) {
            const track = pls.tracks[state.queue.index];
            if (track) {
              titleEl.textContent = track.title;
              artistEl.textContent = track.artist;
              if (coverImg && track.cover) coverImg.src = track.cover;
            }
            const pct = state.duration
              ? (state.position / state.duration) * 1000
              : 0;
            progress.value = Math.min(1000, Math.max(0, pct));
            cur.textContent = fmtTime(state.position);
            dur.textContent = fmtTime(state.duration);
            rows.forEach((row, i) =>
              row.classList.toggle("playing", i === state.queue.index)
            );
            syncLyrics(cardEl, state.position);
          } else {
            const lastTrack =
              pls.lastPlayedIndex !== null
                ? pls.tracks[pls.lastPlayedIndex]
                : null;
            const savedMs = lastTrack ? getSavedPosition(lastTrack.trackId) : 0;
            if (lastTrack) {
              titleEl.textContent = lastTrack.title;
              artistEl.textContent = lastTrack.artist;
              if (coverImg && lastTrack.cover) coverImg.src = lastTrack.cover;
            }
            progress.value = 0;
            cur.textContent = savedMs > 0 ? fmtTime(savedMs) : "00:00";
            dur.textContent = "00:00";
            rows.forEach((row) => row.classList.remove("playing"));
          }
        }

        function bindPlaylistCard(cardEl, listId) {
          const pls = getPlaylistState(listId);
          const playBtn = cardEl.querySelector(".hw-pl-play");
          const shuffleBtn = cardEl.querySelector(".hw-pl-shuffle");
          const repeatBtn = cardEl.querySelector(".hw-pl-repeat");
          const lyricsBtn = cardEl.querySelector(".hw-pl-lyrics-toggle");
          const progress = cardEl.querySelector(".hw-pl-progress");

          playBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            const isThisQueueActive =
              state.queue && state.queue.listId === listId;
            if (isThisQueueActive) togglePauseCurrent();
            else playFromPlaylist(listId, pls.order[pls.posInOrder] || 0);
          });

          shuffleBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            togglePlaylistShuffle(listId);
          });
          repeatBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            cyclePlaylistRepeat(listId);
          });

          progress.addEventListener("input", (e) => {
            e.stopPropagation();
            const isThisQueueActive =
              state.queue && state.queue.listId === listId;
            if (!isThisQueueActive || !audioEl) return;
            audioEl.currentTime =
              (Number(progress.value) / 1000) * (audioEl.duration || 0);
          });

          let lyricsLoadedForTrackId = null;
          lyricsBtn.addEventListener("click", async (e) => {
            e.preventDefault();
            e.stopPropagation();
            const nowOn = cardEl.classList.toggle("lyrics-mode");
            lyricsBtn.classList.toggle("active", nowOn);
            const isThisQueueActive =
              state.queue && state.queue.listId === listId;
            setLyricsFloatOpen(nowOn);
            if (nowOn && isThisQueueActive) {
              const track = pls.tracks[state.queue.index];
              if (track) {
                const titleEl = document.getElementById("hwLyricsFloatTitle");
                if (titleEl) titleEl.textContent = track.title || "歌词";
              }
              if (track && lyricsLoadedForTrackId !== track.trackId) {
                lyricsLoadedForTrackId = track.trackId;
                const lyricsResult = await getLyricsByNeteaseId(
                  track.neteaseId
                );
                renderLyricsList(
                  document.getElementById("hwLyricsFloatScroll") ||
                  cardEl.querySelector(
                    ".hw-pl-view-lyrics .hw-lyrics-scroll-full"
                  ),
                  lyricsResult
                );
                syncLyrics(cardEl, state.position);
              }
            }
            if (typeof window.HWonMasonryNeeded === "function")
              window.HWonMasonryNeeded();
          });

          cardEl.querySelectorAll(".hw-pl-row").forEach((row) => {
            row.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              playFromPlaylist(listId, Number(row.dataset.idx));
            });
          });

          cardEl.addEventListener("mousedown", (e) => e.stopPropagation());
          cardEl.addEventListener("touchstart", (e) => e.stopPropagation(), {
            passive: true,
          });

          document.addEventListener("hwplayer:update", () =>
            refreshPlaylistUI(cardEl, listId)
          );
          document.addEventListener("hwplayer:queue-change", (e) => {
            if (e.detail.listId !== listId) return;
            refreshPlaylistUI(cardEl, listId);
            const isThisQueueActive =
              state.queue && state.queue.listId === listId;
            if (cardEl.classList.contains("lyrics-mode") && isThisQueueActive) {
              const track = pls.tracks[state.queue.index];
              if (track && lyricsLoadedForTrackId !== track.trackId) {
                lyricsLoadedForTrackId = track.trackId;
                const scroll = cardEl.querySelector(
                  ".hw-pl-view-lyrics .hw-lyrics-scroll-full"
                );
                getLyricsByNeteaseId(track.neteaseId).then((r) => {
                  const floatScroll = document.getElementById("hwLyricsFloatScroll");
                  renderLyricsList(floatScroll || scroll, r);
                  const tEl = document.getElementById("hwLyricsFloatTitle");
                  if (tEl) tEl.textContent = track.title || "歌词";
                  syncLyrics(cardEl, state.position);
                });
              }
            }
          });
          refreshPlaylistUI(cardEl, listId);
        }

        async function mountOnePlaylist(mountEl) {
          const listId = mountEl.getAttribute("data-hw-list-id");
          if (!listId) return;
          mountEl.innerHTML = playlistSkeletonHTML();
          const result = await fetchPlaylist(listId);
          if (typeof window.HWonMasonryNeeded === "function")
            window.HWonMasonryNeeded();
          if (!result.ok || !result.tracks.length) {
            mountEl.innerHTML = playlistErrorHTML(result.error || "歌单为空");
            return;
          }
          const pls = getPlaylistState(listId);
          pls.tracks = result.tracks;
          pls.order = buildOrder(pls.tracks.length, pls.shuffle);
          mountEl.innerHTML = playlistCardHTML(listId, pls);
          const cardEl = mountEl.querySelector(".hw-playlist");
          bindPlaylistCard(cardEl, listId);
          if (typeof window.HWonMasonryNeeded === "function")
            window.HWonMasonryNeeded();
        }

        function mountAll(container) {
          const root = container || document;
          root.querySelectorAll(".hw-player-mount").forEach((el) => {
            if (el.dataset.hwMounted) return;
            el.dataset.hwMounted = "1";
            mountOne(el);
          });
          root.querySelectorAll(".hw-playlist-mount").forEach((el) => {
            if (el.dataset.hwMounted) return;
            el.dataset.hwMounted = "1";
            mountOnePlaylist(el);
          });
        }

        window.HWPlayer = {
          parseShortcodes,
          mountAll,
          getState: () => ({ ...state }),
        };
      })();
</script>

<!-- ========== 音乐抽屉控制 ========== -->
<script>
(function () {
  const drawer = document.getElementById('musicDrawer');
  const overlay = document.getElementById('musicDrawerOverlay');
  let mounted = false;

  function openDrawer() {
    drawer.classList.add('open');
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    if (!mounted && window.HWPlayer) {
      mounted = true;
      window.HWPlayer.mountAll(document.getElementById('musicDrawerMount').parentElement);
    }
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  document.querySelectorAll('.music-trigger').forEach(btn => {
    btn.onclick = () => {
      openDrawer();
      closeNav();
    };
  });
  document.getElementById('musicDrawerClose').onclick = closeDrawer;
  overlay.onclick = closeDrawer;

  // 标签抽屉（右边那本）打开时要先把歌单抽屉收掉，所以把关闭函数交出去
  window.closeMusicDrawer = closeDrawer;

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
  });

  // 播放状态指示点
  document.addEventListener('hwplayer:update', e => {
    const dot = document.getElementById('musicDot');
    if (dot) dot.classList.toggle('hidden', !(e.detail && e.detail.isPlaying));
  });
})();

</script>

/* 桌面：不用任何外部壁纸，纯 CSS 做旧木桌
   ★ 原来这里还叠了一层 repeating-linear-gradient(0deg, ... 0 1px, transparent 1px 5px) 的木纹细横纹。
     以前 #appShell 是不透明的把它挡住了；现在 #appShell 透明（为了透出 #bgOrbs 光斑），

  line-height: 32px !important;
}

}

/* 单图：像照片贴在纸上 */
.memo-img-single-wrap {

  padding: 7px !important;
   background: var(--journal-photo-paper) !important;
  border: 1px solid rgba(72, 53, 33, .10) !important;
  box-shadow:
    0 3px 9px rgba(65, 47, 28, .15) !important;
  transform: rotate(-.35deg);
}

.memo-img-single-wrap img {
  border-radius: 0 !important;
}

/* 连续单图：照片卡 */
.memo-split {
  gap: 28px !important;
}

.split-img {
  padding: 7px !important;
   background: var(--journal-photo-paper) !important;
  box-shadow: 0 4px 10px rgba(65, 47, 28, .14) !important;
  transform: rotate(-.6deg);
}

.memo-split.rev .split-img {
  transform: rotate(.7deg);
}

.split-img img {
  height: 235px !important;
  border-radius: 0 !important;
}

/* 多图横条：保留原来的拖拽逻辑，只换成照片排布 */
.carousel-strip {
  gap: 14px !important;
  padding: 8px 4px 12px !important;
}

.carousel-strip .strip-item {
  padding: 6px !important;
    background: var(--journal-photo-paper);
  box-shadow: 0 3px 9px rgba(65, 47, 28, .12);
}

.carousel-strip .strip-item:nth-child(odd) {
  transform: rotate(-.45deg);
}

.carousel-strip .strip-item:nth-child(even) {
  transform: rotate(.5deg);
}

.carousel-strip .strip-item img {
  border-radius: 0 !important;
}

/* 正文里的标题继续保留原本“手写标记”的味道 */
.memo-text h2::before,
.memo-text h2::after {

  opacity: .20 !important;
}

/* 页面底部：像纸页边缘 */
#sentinel {
  color: #887a68;
}

#endHint {
  letter-spacing: .16em;
}

/* 桌面端给页面一点“纸张不完全平整”的细节 */
@media (min-width: 1024px) {

    content: "";

    inset: 0;
    pointer-events: none;
    z-index: 3;
    background:

        ellipse at 15% 10%,
        rgba(255,255,255,.22),
        transparent 35%
      ),
      radial-gradient(
        ellipse at 90% 90%,
        rgba(105,78,48,.06),
        transparent 38%

    opacity: .45;
