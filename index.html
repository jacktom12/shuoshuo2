function cmdkRender() {
  if (cmdk.tagView !== null) { cmdkRenderTagView(); return; }
  const q = cmdk.query;
  const groups = cmdkMatch(q);
  cmdk.flat = [];
  let html = '';
  groups.forEach(g => {
    if (g.loading && !g.items.length) {
      html += `<div class="cmdk-group-title">${g.name}</div><div class="cmdk-loading"><span class="loading loading-dots loading-xs"></span>正在加载${g.name}数据…</div>`;
      return;
    }
    if (!g.items.length) return;
    html += `<div class="cmdk-group-title">${g.name}</div>`;
    g.items.forEach(it => {
      const idx = cmdk.flat.length;
      cmdk.flat.push(it);
      html += `
      <div class="cmdk-item ${idx === cmdk.active ? 'active' : ''}" data-idx="${idx}">
        <div class="cmdk-ico ${it.cls}"><span class="iconify text-lg" data-icon="${it.icon}"></span></div>
        <div class="flex-1 min-w-0">
          <div class="text-sm leading-snug truncate">${cmdkHi(it.title, q)}</div>
          <div class="text-xs opacity-50 truncate">${escapeHtml(it.sub || '')}</div>
        </div>
        <span class="iconify text-base opacity-25 shrink-0" data-icon="lucide:chevron-right"></span>
      </div>`;
    });
  });
  if (!html) {
    html = `<div class="text-center py-10 opacity-50 text-sm">${q ? '没有匹配的结果' : '输入关键词，同时搜索说说、书签与影视'}</div>`;
  }
  cmdkResults.innerHTML = html;
  cmdkResults.querySelectorAll('.cmdk-item').forEach(el => {
    el.onclick = () => cmdkExec(Number(el.dataset.idx));
  });
  cmdkScrollActive();
}

/* 标签视图：列出某标签下的全部说说（搜索面板内浏览，不跳页） */
function cmdkRenderTagView() {
  const tagId = cmdk.tagView;
  const name = tagNameMap.get(tagId) || String(tagId).replace(/^tag_/, '');
  const list = (state.searchMemosCache || [])
    .filter(m => (m.tags || []).includes(tagId))
    .sort((a, b) => new Date(String(b.rawDate || '').replace(' ', 'T')).getTime() - new Date(String(a.rawDate || '').replace(' ', 'T')).getTime());
  cmdk.flat = list.map(m => {
    const plain = String(m.content || '').replace(/!\[[^\]]*\]\([^)]*\)/g, '').replace(/#+\s/g, '').replace(/\s+/g, ' ').trim();
    return { type: 'memo', memoId: m.id, title: plain.slice(0, 64) || '（图片）', sub: relativeTime(m.rawDate), icon: 'mdi:chat-processing-outline', cls: 'bg-primary/10 text-primary' };
  });
  const rows = cmdk.flat.map((it, idx) => `
    <div class="cmdk-item ${idx === cmdk.active ? 'active' : ''}" data-idx="${idx}">
      <div class="cmdk-ico ${it.cls}"><span class="iconify text-lg" data-icon="${it.icon}"></span></div>
      <div class="flex-1 min-w-0">
        <div class="text-sm leading-snug truncate">${escapeHtml(it.title)}</div>
        <div class="text-xs opacity-50 truncate">${escapeHtml(it.sub || '')}</div>
      </div>
      <span class="iconify text-base opacity-25 shrink-0" data-icon="lucide:chevron-right"></span>
    </div>`).join('');
  cmdkResults.innerHTML = `
    <div class="flex items-center gap-2 px-2 pt-1 pb-1">
      <button type="button" class="btn btn-ghost btn-xs gap-0.5 cmdk-tag-back">
        <span class="iconify text-base" data-icon="lucide:arrow-left"></span>返回搜索
      </button>
      <span class="text-xs opacity-60 truncate">#${escapeHtml(name)} · ${cmdk.flat.length} 条说说</span>
    </div>
    ${cmdk.flat.length ? rows : `<div class="text-center py-8 opacity-50 text-sm">这个标签下暂时没有说说</div>`}`;
  cmdkResults.querySelectorAll('.cmdk-item').forEach(el => {
    el.onclick = () => cmdkExec(Number(el.dataset.idx));
  });

  if (back) back.onclick = () => { cmdk.tagView = null; cmdkRender(); cmdkInput.focus(); };

}

function cmdkScrollActive() {
  const el = cmdkResults.querySelector(`.cmdk-item[data-idx="${cmdk.active}"]`);
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function cmdkOpen() {
  cmdk.open = true;
  cmdkOverlay.classList.add('open');

function cmdkClose() {
  cmdk.open = false;

  cmdkOverlay.classList.remove('open');
  cmdkInput.value = '';
  cmdk.query = '';
  $('#cmdkMemoModal').classList.remove('open');
}
function cmdkExec(idx) {
  const it = cmdk.flat[idx];
  if (!it) return;
  if (it.type === 'memo') {
    // 说说：弹出全文详情（复用 memoCard 渲染，图片支持灯箱）
    const m = (state.searchMemosCache || []).find(x => x.id === it.memoId);
    if (!m) return;
    const body = $('#cmdkMemoBody');
    body.innerHTML = `<div class="px-2">${memoCard(m, 0, { plain: true })}</div>`;
    $('#cmdkMemoModal').classList.add('open');
    body.scrollTop = 0;
  } else if (it.url) {
    window.open(it.url, '_blank', 'noopener');   // 面板保持打开，不打断搜索
  }
}

$('#cmdkMemoBody').addEventListener('click', e => {

// 委托挂 document：搜索面板和详情弹窗是两个平级 overlay，挂在其中一个上收不到另一个的点击
document.addEventListener('click', e => {
  const memoModal = $('#cmdkMemoModal');
  const memoOpen = memoModal.classList.contains('open');
  const backFocus = () => setTimeout(() => cmdkInput.focus(), 30);
  // 详情弹窗的 ✕：只关详情，回到搜索列表
  if (e.target.closest('.cmdk-memo-close')) {
    memoModal.classList.remove('open');
    backFocus();
    return;
  }
  // 详情开着时点遮罩（任一层）：先回列表
  if (memoOpen && (e.target === memoModal || e.target === cmdkOverlay)) {
    memoModal.classList.remove('open');
    backFocus();
    return;
  }
  // 搜索面板遮罩 / 面板的 ✕：关闭整个面板
  if (e.target === cmdkOverlay || e.target.closest('.cmdk-close')) cmdkClose();
});
document.querySelectorAll('.cmdk-open').forEach(b => b.addEventListener('click', () => { closeNav(); cmdkOpen(); }));
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    cmdk.open ? cmdkClose() : cmdkOpen();
    return;
  }
  if (!cmdk.open) return;
  if (e.key === 'Escape') {
    // 层级关闭：详情弹窗 → 标签视图 → 整个面板
    if ($('#cmdkMemoModal').classList.contains('open')) {
      $('#cmdkMemoModal').classList.remove('open');
      setTimeout(() => cmdkInput.focus(), 30);
      return;
    }
    if (cmdk.tagView !== null) {
      cmdk.tagView = null;
      cmdkRender();
      return;
    }
    cmdkClose();
    return;
  }
  if ($('#cmdkMemoModal').classList.contains('open')) return;   // 详情弹窗内不响应列表导航
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!cmdk.flat.length) return;
    const delta = e.key === 'ArrowDown' ? 1 : -1;
    cmdk.active = (cmdk.active + delta + cmdk.flat.length) % cmdk.flat.length;
    cmdkResults.querySelectorAll('.cmdk-item').forEach(el =>
      el.classList.toggle('active', Number(el.dataset.idx) === cmdk.active));
    cmdkScrollActive();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    cmdkExec(cmdk.active);
  }
});

            broadcast();
            // 进度同步节流，大约每秒一次
            const now = Date.now();
            if (now - _posThrottle > 1000) {
              _posThrottle = now;
              updateMediaPosition();
            }
          });
          audioEl.addEventListener("play", () => {
            state.isPlaying = true;
            broadcast();
          });
          audioEl.addEventListener("pause", () => {
            state.isPlaying = false;
            broadcast();
          });
          audioEl.addEventListener("ended", () => {
            positions.delete(state.activeId);
            if (state.queue) advanceQueue();
            else {
              state.isPlaying = false;
              state.position = 0;
              broadcast();
            }
          });
          return audioEl;
        }

                function broadcast() {
          document.dispatchEvent(
            new CustomEvent("hwplayer:update", { detail: { ...state } })
          );
          updateMediaSession(resolveCurrentMeta());
        }

        function saveCurrentPosition() {
          if (!state.activeId) return;
          let pos = state.position;
          if (audioEl && state.source === "netease")
            pos = audioEl.currentTime * 1000;
          if (pos > 0) positions.set(state.activeId, pos);
        }

        function getSavedPosition(trackId) {
          return positions.get(trackId) || 0;
        }

        function switchToNetease(meta, queueCtx) {
          ensureAudioEl();
          saveCurrentPosition();
          const myGen = ++loadGeneration;
          const resumeMs = getSavedPosition(meta.trackId);
          state.activeId = meta.trackId;
          state.source = "netease";
          state.duration = 0;
          state.position = resumeMs;
          state.isPlaying = false;
          state.queue = queueCtx || null;
                    state._currentMeta = {
            trackId: meta.trackId,
            title: meta.title,
            artist: meta.artist,
            album: meta.album || "",
            cover: meta.cover || "",
          };
          bindMediaSessionHandlers();
          broadcast();
          let loopFlag = false;
          if (queueCtx) {
            const pls = getPlaylistState(queueCtx.listId);
            loopFlag = pls.repeatMode === "one";
          } else {
            loopFlag = isRepeatOn(meta.trackId);
          }
          audioEl.loop = loopFlag;
          const startPlayback = () => {
            if (myGen !== loadGeneration) return;
            audioEl.currentTime = resumeMs / 1000;
            audioEl.play().catch(() => {});
          };
          if (audioLoadedTrackId === meta.trackId && audioEl.src) {
            startPlayback();
            return;
          }
          audioLoadedTrackId = meta.trackId;
          audioEl.src = meta.audioUrl;
          audioEl.load();
          if (audioEl.readyState >= 1) startPlayback();
          else
            audioEl.addEventListener("loadedmetadata", startPlayback, {
              once: true,
            });
        }

        function togglePauseCurrent() {
          if (audioEl) {
            audioEl.paused ? audioEl.play().catch(() => {}) : audioEl.pause();
          }
        }

        function playTrack(meta, queueCtx) {
          const isSameActiveTrack =
            state.activeId === meta.trackId && !queueCtx && !state.queue;
          if (isSameActiveTrack) {
            togglePauseCurrent();
            return;
          }
          switchToNetease(meta, queueCtx || null);
        }

        function loadLikes() {
          try {
            return new Set(
              JSON.parse(localStorage.getItem(LIKE_STORAGE_KEY) || "[]")
            );
          } catch (e) {
            return new Set();
          }
        }

        function saveLikes(set) {
          try {
            localStorage.setItem(LIKE_STORAGE_KEY, JSON.stringify([...set]));
          } catch (e) {}
        }
        const likedTracks = loadLikes();

        function isLiked(trackId) {
          return likedTracks.has(trackId);
        }

        function toggleLike(trackId) {
          if (likedTracks.has(trackId)) likedTracks.delete(trackId);
          else likedTracks.add(trackId);
          saveLikes(likedTracks);
          document.dispatchEvent(
            new CustomEvent("hwplayer:like-update", {
              detail: { trackId, liked: likedTracks.has(trackId) },
            })
          );
        }

        function parseNeteaseId(url) {
          const m = url.match(/[?&]id=(\d+)/);
          return m ? m[1] : null;
        }

        async function fetchNeteaseMeta(url) {
          const id = parseNeteaseId(url);
          if (!id) throw new Error("无法解析网易云歌曲 ID");
          const res = await fetch(NETEASE_SONG_INFO_API(id));
          const json = await res.json();
          const data = Array.isArray(json) ? json[0] : json;
          if (!data || !data.url) throw new Error("网易云元数据获取失败");
          return {
            neteaseId: id,
            trackId: "ne-" + id,
            title: data.name || "未知歌曲",
            artist: data.artist || "未知歌手",
            album: data.album || "",
            cover: data.pic || "",
            audioUrl: data.url,
          };
        }

        async function getMeta(rawUrl) {
          if (metaCache.has(rawUrl)) return metaCache.get(rawUrl);
          const p = fetchNeteaseMeta(rawUrl).catch((err) => ({
            trackId: "err-" + uidSeq++,
            title: "加载失败",
            artist: String(err.message || err),
            album: "",
            cover: "",
            audioUrl: "",
          }));
          metaCache.set(rawUrl, p);
          return p;
        }

        function parseLRC(lrcText) {
          if (!lrcText) return [];
          const lines = lrcText.split("\n");
          const timeTag = /\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
          const result = [];
          for (const line of lines) {
            const tags = [...line.matchAll(timeTag)];
            if (!tags.length) continue;
            const text = line.replace(timeTag, "").trim();
            if (!text) continue;
            for (const t of tags) {
              const min = parseInt(t[1], 10),
                sec = parseInt(t[2], 10);
              const ms = t[3] ? parseInt(t[3].padEnd(3, "0"), 10) : 0;
              result.push({ time: min * 60000 + sec * 1000 + ms, text });
            }
          }
          result.sort((a, b) => a.time - b.time);
          return result;
        }

        async function getLyricsByNeteaseId(neteaseId) {
          if (lyricsCache.has(neteaseId)) return lyricsCache.get(neteaseId);
          const p = (async () => {
            try {
              const res = await fetch(NETEASE_LRC_API(neteaseId));
              const lrcText = await res.text();
              return { lines: parseLRC(lrcText) };
            } catch (e) {
              return { lines: [] };
            }
          })();
          lyricsCache.set(neteaseId, p);
          return p;
        }

        async function fetchPlaylist(listId) {
          if (playlistCache.has(listId)) return playlistCache.get(listId);
          const p = (async () => {
            try {
              const res = await fetch(NETEASE_PLAYLIST_API(listId));
              const json = await res.json();
              const arr = Array.isArray(json) ? json : [];
              const tracks = arr
                .map((item) => {
                  const idMatch = (item.url || "").match(/[?&]id=(\d+)/);
                  const neteaseId = idMatch ? idMatch[1] : null;
                  return {
                    neteaseId,
                    trackId: "ne-" + (neteaseId || uidSeq++),
                    title: item.name || "未知歌曲",
                    artist: item.artist || "未知歌手",
                    cover: item.pic || "",
                    audioUrl: item.url || "",
                  };
                })
                .filter((t) => t.audioUrl);
              return { ok: true, tracks };
            } catch (e) {
              return { ok: false, tracks: [], error: String(e.message || e) };
            }
          })();
          playlistCache.set(listId, p);
          return p;
        }

        function buildOrder(len, shuffle) {
          const arr = Array.from({ length: len }, (_, i) => i);
          if (!shuffle) return arr;
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        }

        const playlistStates = new Map();

        function getPlaylistState(listId) {
          if (!playlistStates.has(listId))
            playlistStates.set(listId, {
              tracks: [],
              order: [],
              posInOrder: 0,
              shuffle: false,
              repeatMode: "off",
              lastPlayedIndex: null,
            });
          return playlistStates.get(listId);
        }

        function playFromPlaylist(listId, trackIndex) {
          const pls = getPlaylistState(listId);
          const track = pls.tracks[trackIndex];
          if (!track) return;
          const orderPos = pls.order.indexOf(trackIndex);
          pls.posInOrder = orderPos >= 0 ? orderPos : 0;
          pls.lastPlayedIndex = trackIndex;
          switchToNetease(track, { listId, index: trackIndex });
          document.dispatchEvent(
            new CustomEvent("hwplayer:queue-change", { detail: { listId } })
          );
        }

        function advanceQueue() {
          const ctx = state.queue;
          if (!ctx) return;
          const pls = getPlaylistState(ctx.listId);
          let nextOrderPos = pls.posInOrder + 1;
          if (nextOrderPos >= pls.order.length) {
            if (pls.repeatMode === "all") nextOrderPos = 0;
            else {
              state.isPlaying = false;
              state.position = 0;
              state.queue = null;
              broadcast();
              return;
            }
          }
          pls.posInOrder = nextOrderPos;
          playFromPlaylist(ctx.listId, pls.order[nextOrderPos]);
        }

        function togglePlaylistShuffle(listId) {
          const pls = getPlaylistState(listId);
          pls.shuffle = !pls.shuffle;
          const currentTrackIndex =
            state.queue && state.queue.listId === listId
              ? state.queue.index
              : null;
          pls.order = buildOrder(pls.tracks.length, pls.shuffle);
          if (currentTrackIndex !== null) {
            const pos = pls.order.indexOf(currentTrackIndex);
            if (pos > 0) {
              pls.order.splice(pos, 1);
              pls.order.unshift(currentTrackIndex);
            }
            pls.posInOrder = 0;
          }
          document.dispatchEvent(
            new CustomEvent("hwplayer:queue-change", { detail: { listId } })
          );
        }

        function cyclePlaylistRepeat(listId) {
          const pls = getPlaylistState(listId);
          const modes = ["off", "all", "one"];
          pls.repeatMode =
            modes[(modes.indexOf(pls.repeatMode) + 1) % modes.length];
          if (audioEl && state.queue && state.queue.listId === listId) {
            audioEl.loop = pls.repeatMode === "one";
          }
          document.dispatchEvent(
            new CustomEvent("hwplayer:queue-change", { detail: { listId } })
          );
        }

        const SHORTCODE_SONG_RE =
          /\{\{<\s*music\s+url=["']([^"']+)["']\s*>\}\}/g;
        const SHORTCODE_LIST_RE =
          /\{\{<\s*musiclist\s+id=["']([^"']+)["']\s*>\}\}/g;

        function escapeAttr(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        function parseShortcodes(text) {
          if (!text) return text;
          let out = text;
          if (SHORTCODE_SONG_RE.test(out)) {
            SHORTCODE_SONG_RE.lastIndex = 0;
            out = out.replace(SHORTCODE_SONG_RE, (_, url) => {
              const mountId = "hwmount-" + uidSeq++;
              return `\n<div class="hw-player-mount" data-hw-url="${escapeAttr(url)}" data-hw-mount-id="${mountId}"></div>\n`;
            });
          }
          if (SHORTCODE_LIST_RE.test(out)) {
            SHORTCODE_LIST_RE.lastIndex = 0;
            out = out.replace(SHORTCODE_LIST_RE, (_, listId) => {
              const mountId = "hwlistmount-" + uidSeq++;
              return `\n<div class="hw-playlist-mount" data-hw-list-id="${escapeAttr(listId)}" data-hw-mount-id="${mountId}"></div>\n`;
            });
          }
          return out;
        }

        function skeletonHTML() {
          return `<div class="hw-player hw-player-loading"><div class="hw-note-corner">♪</div><div class="hw-player-head"><div class="hw-disc-wrap"><div class="hw-disc"></div></div></div><div class="hw-meta"><div class="hw-title">加载中…</div></div></div>`;
        }

        function cardHTML(meta) {
          const cover = meta.cover || "";
          const liked = isLiked(meta.trackId);
          const repeatOn = isRepeatOn(meta.trackId);
          return `<div class="hw-player" data-track-id="${meta.trackId}">
              <div class="hw-note-corner">♪</div>
              <div class="hw-view-normal">
                <div class="hw-player-head">
                  <div class="hw-disc-wrap"><div class="hw-disc" style="${cover ? `background-image:url('${escapeAttr(cover)}')` : ""}"></div></div>
                  <div class="hw-cover">${cover ? `<img class="hw-cover-img" src="${escapeAttr(cover)}" alt="">` : ""}</div>
                </div>
                <div class="hw-meta">
                  <div class="hw-title">${escapeAttr(meta.title)}</div>
                  <div class="hw-artist">${escapeAttr(meta.artist || "")}</div>
                  ${meta.album ? `<div class="hw-album">${escapeAttr(meta.album)}</div>` : ""}
                </div>
              </div>
              <div class="hw-view-lyrics"><div class="hw-lyrics-scroll-full"><div class="hw-lyrics-empty">点击加载歌词…</div></div></div>
              <div class="hw-progress-row">
                <span class="hw-time hw-cur">00:00</span>
                <input type="range" class="hw-progress" min="0" max="1000" value="0">
                <span class="hw-time hw-dur">00:00</span>
              </div>
              <div class="hw-controls">
                <button class="hw-btn hw-like${liked ? " active" : ""}" title="喜欢">${liked ? ICONS.heartFilled : ICONS.heart}</button>
                <button class="hw-btn hw-lyrics-toggle" title="歌词">${ICONS.lyrics}</button>
                <button class="hw-btn hw-play" title="播放/暂停">${ICONS.play}</button>
                <button class="hw-btn hw-repeat${repeatOn ? " active" : ""}" title="单曲循环">${ICONS.repeat}</button>
              </div>
            </div>`;
        }

        function fmtTime(ms) {
          if (!ms || isNaN(ms)) return "00:00";
          const s = Math.floor(ms / 1000),
            m = Math.floor(s / 60),
            ss = s % 60;
          return `${String(m).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
        }

        function refreshCardUI(cardEl, meta) {
          const isActive = state.activeId === meta.trackId && !state.queue;
          const playBtn = cardEl.querySelector(".hw-play");
          const discWrap = cardEl.querySelector(".hw-disc-wrap");
          const progress = cardEl.querySelector(".hw-progress");
          const cur = cardEl.querySelector(".hw-cur");
          const dur = cardEl.querySelector(".hw-dur");
          const playing = isActive && state.isPlaying;
          playBtn.innerHTML = playing ? ICONS.pause : ICONS.play;
          discWrap.classList.toggle("spinning", playing);
          if (isActive) {
            const pct = state.duration
              ? (state.position / state.duration) * 1000
              : 0;
            progress.value = Math.min(1000, Math.max(0, pct));
            cur.textContent = fmtTime(state.position);
            dur.textContent = fmtTime(state.duration);
            syncLyrics(cardEl, state.position);
          } else {
            const savedMs = getSavedPosition(meta.trackId);
            progress.value = 0;
            cur.textContent = savedMs > 0 ? fmtTime(savedMs) : "00:00";
            dur.textContent = "00:00";
          }
        }

        function refreshLikeUI(cardEl, trackId) {
          const likeBtn = cardEl.querySelector(".hw-like");
          if (!likeBtn) return;
          const liked = isLiked(trackId);
          likeBtn.classList.toggle("active", liked);
          likeBtn.innerHTML = liked ? ICONS.heartFilled : ICONS.heart;
        }

        function refreshRepeatUI(cardEl, trackId) {
          const repeatBtn = cardEl.querySelector(".hw-repeat");
          if (!repeatBtn) return;
          repeatBtn.classList.toggle("active", isRepeatOn(trackId));
        }

        function renderLyricsList(scrollEl, lyricsResult) {
          if (!lyricsResult.lines.length) {
            scrollEl.innerHTML = '<div class="hw-lyrics-empty">暂无歌词</div>';
            return;
          }
          scrollEl.innerHTML = lyricsResult.lines
            .map(
              (l, i) =>
                `<div class="hw-lyrics-line" data-idx="${i}" data-time="${l.time}">${escapeAttr(l.text)}</div>`
            )
            .join("");
        }

        function syncLyricsScroll(scroll, positionMs) {
          if (!scroll) return;
          const lineEls = scroll.querySelectorAll(".hw-lyrics-line");
          if (!lineEls.length) return;
          let activeIdx = -1;
          lineEls.forEach((el, i) => {
            if (Number(el.dataset.time) <= positionMs) activeIdx = i;
          });
          lineEls.forEach((el, i) =>
            el.classList.toggle("active", i === activeIdx)
          );
          if (activeIdx >= 0) {
            const activeEl = lineEls[activeIdx];
            const targetTop = activeEl.offsetTop - scroll.clientHeight / 2 + activeEl.clientHeight / 2;
            scroll.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });
          }
        }
        function syncLyrics(cardEl, positionMs) {
          syncLyricsScroll(cardEl && cardEl.querySelector(".hw-lyrics-scroll-full"), positionMs);
          syncLyricsScroll(document.getElementById("hwLyricsFloatScroll"), positionMs);
          return;
          const scroll = cardEl.querySelector(".hw-lyrics-scroll-full");
          if (!scroll) return;
          const lineEls = scroll.querySelectorAll(".hw-lyrics-line");
          if (!lineEls.length) return;
          let activeIdx = -1;
          lineEls.forEach((el, i) => {
            if (Number(el.dataset.time) <= positionMs) activeIdx = i;
          });
          lineEls.forEach((el, i) =>
            el.classList.toggle("active", i === activeIdx)
          );
          if (activeIdx >= 0) {
            const activeEl = lineEls[activeIdx];
            const targetTop =
              activeEl.offsetTop -
              scroll.clientHeight / 2 +
              activeEl.clientHeight / 2;
            scroll.scrollTo({
              top: Math.max(0, targetTop),
              behavior: "smooth",
            });
          }
        }

        function bindCard(cardEl, meta) {
          if (cardEl.dataset.hwBound) {
            refreshCardUI(cardEl, meta);
            refreshLikeUI(cardEl, meta.trackId);
            refreshRepeatUI(cardEl, meta.trackId);
            return;
          }
          cardEl.dataset.hwBound = "1";
          const playBtn = cardEl.querySelector(".hw-play");
          const likeBtn = cardEl.querySelector(".hw-like");
          const repeatBtn = cardEl.querySelector(".hw-repeat");
          const lyricsBtn = cardEl.querySelector(".hw-lyrics-toggle");
          const progress = cardEl.querySelector(".hw-progress");

          playBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            playTrack(meta);
          });
          likeBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            toggleLike(meta.trackId);
          });
          repeatBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            setRepeat(meta.trackId, !isRepeatOn(meta.trackId));
            refreshRepeatUI(cardEl, meta.trackId);
          });
          progress.addEventListener("input", (e) => {
            e.stopPropagation();
            if (state.activeId !== meta.trackId || state.queue || !audioEl)
              return;
            audioEl.currentTime =
              (Number(progress.value) / 1000) * (audioEl.duration || 0);
          });

          let lyricsLoaded = false;
          lyricsBtn.addEventListener("click", async (e) => {
            e.preventDefault();
            e.stopPropagation();
            const nowOn = cardEl.classList.toggle("lyrics-mode");
            lyricsBtn.classList.toggle("active", nowOn);
            setLyricsFloatOpen(nowOn);
            const titleEl = document.getElementById("hwLyricsFloatTitle");
            if (nowOn && titleEl) titleEl.textContent = meta.title || "歌词";
            if (nowOn && !lyricsLoaded) {
              lyricsLoaded = true;
              const lyricsResult = await getLyricsByNeteaseId(meta.neteaseId);
              renderLyricsList(
                document.getElementById("hwLyricsFloatScroll") ||
                cardEl.querySelector(".hw-lyrics-scroll-full"),
                lyricsResult
              );
              if (state.activeId === meta.trackId)
                syncLyrics(cardEl, state.position);
            }
            if (typeof window.HWonMasonryNeeded === "function")
              window.HWonMasonryNeeded();
          });

          cardEl.addEventListener("mousedown", (e) => e.stopPropagation());
          cardEl.addEventListener("touchstart", (e) => e.stopPropagation(), {
            passive: true,
          });

          document.addEventListener("hwplayer:update", () =>
            refreshCardUI(cardEl, meta)
          );
          document.addEventListener("hwplayer:like-update", (e) => {
            if (e.detail.trackId === meta.trackId)
              refreshLikeUI(cardEl, meta.trackId);
          });
          refreshCardUI(cardEl, meta);
          refreshLikeUI(cardEl, meta.trackId);
          refreshRepeatUI(cardEl, meta.trackId);
        }

        async function mountOne(mountEl) {

            window.HWonMasonryNeeded();
        }

        function playlistSkeletonHTML() {

                <span class="hw-time hw-pl-dur">00:00</span>
              </div>
              <div class="hw-pl-controls">
                <button class="hw-btn hw-pl-shuffle${pls.shuffle ? " active" : ""}" title="随机播放">${ICONS.shuffle}</button>
                <button class="hw-btn hw-play hw-pl-play" title="播放/暂停">${ICONS.play}</button>
                <button class="hw-btn hw-pl-repeat${
                  pls.repeatMode !== "off" ? " active" : ""
                }" data-repeat-mode="${pls.repeatMode}" data-hint="${
                  REPEAT_MODE_HINT[pls.repeatMode]
                }" aria-label="循环模式：${
                  REPEAT_MODE_LABEL[pls.repeatMode]
                }，点击切换">${
                  ICONS.repeat
                }<span class="hw-repeat-flag">${
                  REPEAT_MODE_LABEL[pls.repeatMode]
                }</span></button>
              </div>
              <div class="hw-pl-list">${rowsHTML}</div>
            </div>`;
        }

        function refreshPlaylistUI(cardEl, listId) {
          const pls = getPlaylistState(listId);
          const isThisQueueActive =
            state.queue && state.queue.listId === listId;
          const playBtn = cardEl.querySelector(".hw-pl-play");
          const progress = cardEl.querySelector(".hw-pl-progress");
          const cur = cardEl.querySelector(".hw-pl-cur");
          const dur = cardEl.querySelector(".hw-pl-dur");
          const titleEl = cardEl.querySelector(".hw-pl-current-title");
          const artistEl = cardEl.querySelector(".hw-pl-current-artist");
          const shuffleBtn = cardEl.querySelector(".hw-pl-shuffle");
          const repeatBtn = cardEl.querySelector(".hw-pl-repeat");
          const coverImg = cardEl.querySelector(".hw-pl-cover-img");
          const rows = cardEl.querySelectorAll(".hw-pl-row");

          shuffleBtn.classList.toggle("active", pls.shuffle);
          repeatBtn.classList.toggle("active", pls.repeatMode !== "off");
          repeatBtn.dataset.repeatMode = pls.repeatMode;
          repeatBtn.dataset.hint = REPEAT_MODE_HINT[pls.repeatMode];
          repeatBtn.setAttribute(
            "aria-label",
            `循环模式：${REPEAT_MODE_LABEL[pls.repeatMode]}，点击切换`
          );
          const repeatFlag = repeatBtn.querySelector(".hw-repeat-flag");
          if (repeatFlag)
            repeatFlag.textContent = REPEAT_MODE_LABEL[pls.repeatMode];

          const playing = isThisQueueActive && state.isPlaying;
          cardEl.classList.toggle("is-current", isThisQueueActive);
          playBtn.innerHTML = playing ? ICONS.pause : ICONS.play;

          if (isThisQueueActive) {
            const track = pls.tracks[state.queue.index];
            if (track) {
              titleEl.textContent = track.title;
              artistEl.textContent = track.artist;
              if (coverImg && track.cover) coverImg.src = track.cover;
            }
            const pct = state.duration
              ? (state.position / state.duration) * 1000
              : 0;
            progress.value = Math.min(1000, Math.max(0, pct));
            cur.textContent = fmtTime(state.position);
            dur.textContent = fmtTime(state.duration);
            rows.forEach((row, i) =>
              row.classList.toggle("playing", i === state.queue.index)
            );
          } else {
            const lastTrack =
              pls.lastPlayedIndex !== null
                ? pls.tracks[pls.lastPlayedIndex]
                : null;
            const savedMs = lastTrack ? getSavedPosition(lastTrack.trackId) : 0;
            if (lastTrack) {
              titleEl.textContent = lastTrack.title;
              artistEl.textContent = lastTrack.artist;
              if (coverImg && lastTrack.cover) coverImg.src = lastTrack.cover;
            }
            progress.value = 0;
            cur.textContent = savedMs > 0 ? fmtTime(savedMs) : "00:00";
            dur.textContent = "00:00";
            rows.forEach((row) => row.classList.remove("playing"));
          }
        }

        function bindPlaylistCard(cardEl, listId) {
          const pls = getPlaylistState(listId);
          const playBtn = cardEl.querySelector(".hw-pl-play");
          const shuffleBtn = cardEl.querySelector(".hw-pl-shuffle");
          const repeatBtn = cardEl.querySelector(".hw-pl-repeat");
          const progress = cardEl.querySelector(".hw-pl-progress");
          let repeatHintTimer = null;

          playBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            const isThisQueueActive =
              state.queue && state.queue.listId === listId;
            if (isThisQueueActive) togglePauseCurrent();
            else playFromPlaylist(listId, pls.order[pls.posInOrder] || 0);
          });

          shuffleBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            togglePlaylistShuffle(listId);
          });
          repeatBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            cyclePlaylistRepeat(listId);
            // 触屏没有 hover，点完把气泡顶出来一小会儿，让人看清切到了哪一档
            repeatBtn.classList.add("show-hint");
            clearTimeout(repeatHintTimer);
            repeatHintTimer = setTimeout(
              () => repeatBtn.classList.remove("show-hint"),
              1800
            );
          });

          progress.addEventListener("input", (e) => {
            e.stopPropagation();
            const isThisQueueActive =
              state.queue && state.queue.listId === listId;
            if (!isThisQueueActive || !audioEl) return;
            audioEl.currentTime =
              (Number(progress.value) / 1000) * (audioEl.duration || 0);
          });

          cardEl.querySelectorAll(".hw-pl-row").forEach((row) => {
            row.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              playFromPlaylist(listId, Number(row.dataset.idx));
            });
          });

          cardEl.addEventListener("mousedown", (e) => e.stopPropagation());
          cardEl.addEventListener("touchstart", (e) => e.stopPropagation(), {
            passive: true,
          });

          document.addEventListener("hwplayer:update", () =>
            refreshPlaylistUI(cardEl, listId)
          );
          document.addEventListener("hwplayer:queue-change", (e) => {
            if (e.detail.listId !== listId) return;
            refreshPlaylistUI(cardEl, listId);
          });
          refreshPlaylistUI(cardEl, listId);
        }

        async function mountOnePlaylist(mountEl) {
          const listId = mountEl.getAttribute("data-hw-list-id");
          if (!listId) return;
          mountEl.innerHTML = playlistSkeletonHTML();
          const result = await fetchPlaylist(listId);
          if (typeof window.HWonMasonryNeeded === "function")
            window.HWonMasonryNeeded();
          if (!result.ok || !result.tracks.length) {
            mountEl.innerHTML = playlistErrorHTML(result.error || "歌单为空");
            return;
          }
          const pls = getPlaylistState(listId);
          pls.tracks = result.tracks;
          pls.order = buildOrder(pls.tracks.length, pls.shuffle);
          mountEl.innerHTML = playlistCardHTML(listId, pls);
          const cardEl = mountEl.querySelector(".hw-playlist");
          bindPlaylistCard(cardEl, listId);
          if (typeof window.HWonMasonryNeeded === "function")
            window.HWonMasonryNeeded();
        }

        function mountAll(container) {
          const root = container || document;
          root.querySelectorAll(".hw-player-mount").forEach((el) => {
            if (el.dataset.hwMounted) return;
            el.dataset.hwMounted = "1";
            mountOne(el);
          });
          root.querySelectorAll(".hw-playlist-mount").forEach((el) => {
            if (el.dataset.hwMounted) return;
            el.dataset.hwMounted = "1";
            mountOnePlaylist(el);
          });
        }

        window.HWPlayer = {
          parseShortcodes,
          mountAll,
          getState: () => ({ ...state }),
        };
      })();
</script>

<script>
(function () {
  const drawer = document.getElementById('musicDrawer');
  const overlay = document.getElementById('musicDrawerOverlay');
  let mounted = false;

  function openDrawer() {
    drawer.classList.add('open');
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    if (!mounted && window.HWPlayer) {
      mounted = true;
      window.HWPlayer.mountAll(document.getElementById('musicDrawerMount').parentElement);
    }
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  document.querySelectorAll('.music-trigger').forEach(btn => {
    btn.onclick = () => {
      openDrawer();
      closeNav();
    };
  });
  document.getElementById('musicDrawerClose').onclick = closeDrawer;
  overlay.onclick = closeDrawer;

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
  });

  // 播放状态指示点
  document.addEventListener('hwplayer:update', e => {
    const dot = document.getElementById('musicDot');
    if (dot) dot.classList.toggle('hidden', !(e.detail && e.detail.isPlaying));
  });
})();

/* ============================================================

  --nb-nav-bg: #ffffff;
  --nb-ink: #211d17;           /* 墨色（文字 / 描边 / 硬阴影） */
  --nb-border: #211d17;
  --nb-hard: #211d17;
  --nb-ink-55: rgba(33, 29, 23, .55);
  --nb-ink-22: rgba(33, 29, 23, .22);
  --nb-yellow: #ffc931;
  --nb-pink: #ff7bac;
  --nb-blue: #4d8dff;
  --nb-green: #5fd68a;
  --nb-purple: #b18cff;
  --nb-dot: rgba(33, 29, 23, .09);
  /* 页面壁纸：浅色模式（外部图床代理） */
  --nb-wallpaper: url("https://images.weserv.nl/?url=https://raw.githubusercontent.com/jacktom12/blogpic3/main/wallpaperlight.png");
  /* 翻页器当前页强调色（参考图中的暖橙） */

}
html:is([data-theme="dark"], [data-theme="halloween"]) {
  --nb-bg: #14151b;
  --nb-panel: #1e2029;
  --nb-panel-deep: #1a1c24;
  --nb-nav-bg: #14151b;        /* 深色下顶栏仍与页面同色 */
  --nb-ink: #ece8db;
  --nb-border: rgba(236, 232, 219, .32);
  --nb-hard: rgba(0, 0, 0, .55);
  --nb-ink-55: rgba(236, 232, 219, .55);
  --nb-ink-22: rgba(236, 232, 219, .22);
  --nb-yellow: #ffd94d;
  --nb-pink: #ff85b3;

}

<script>
// 歌词：播放在即印在播放器封面右侧，替代歌曲信息；过长则左右滚动
(function () {
  const lrcCache = new Map();
  let currentTrackId = null;
  let lines = [];
  let shownText = null;
  let paintedBoxes = 0;

  function parseLRC(lrcText) {
    if (!lrcText) return [];
    const timeTag = /\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
    const result = [];
    for (const line of String(lrcText).split(/\r?\n/)) {
      const tags = [...line.matchAll(timeTag)];
      if (!tags.length) continue;
      const text = line.replace(timeTag, '').trim();
      if (!text) continue;
      for (const t of tags) {
        const min = parseInt(t[1], 10), sec = parseInt(t[2], 10);
        let frac = t[3] || '';
        if (frac.length === 1) frac += '00';
        else if (frac.length === 2) frac += '0';
        const ms = frac ? parseInt(frac.slice(0, 3), 10) : 0;
        result.push({ time: min * 60000 + sec * 1000 + ms, text });
      }
    }
    result.sort((a, b) => a.time - b.time);
    return result;
  }

  function extractLrc(raw) {
    const t = String(raw || '').trim();
    if (!t) return '';
    if (t.startsWith('{') || t.startsWith('[')) {
      try {
        const j = JSON.parse(t);
        if (typeof j === 'string') return j;
        if (Array.isArray(j)) {
          const first = j[0] || {};
          return first.lrc && first.lrc.lyric || first.lyric || first.lrc || '';
        }
        return (j.lrc && j.lrc.lyric) || j.lyric || (typeof j.lrc === 'string' ? j.lrc : '') || '';
      } catch (_) {}
    }
    return t;
  }

  function fetchLyrics(neteaseId) {
    if (lrcCache.has(neteaseId)) return lrcCache.get(neteaseId);
    const p = (async () => {
      try {
        const res = await fetch('https://meting.zhheo.com/?server=netease&type=lrc&id=' + encodeURIComponent(neteaseId));
        const txt = await res.text();
        return parseLRC(extractLrc(txt));
      } catch { return []; }
    })();
    lrcCache.set(neteaseId, p);
    return p;
  }

  function boxes() {
    return [...document.querySelectorAll('.hw-playlist.is-current .hw-pl-lyric')];
  }

  function applyMarquee(box, text) {
    const marquee = box.querySelector('.hw-pl-lyric-marquee');
    const textEl = box.querySelector('.hw-pl-lyric-text');
    if (!marquee || !textEl) return;
    marquee.classList.remove('is-scrolling');
    marquee.style.removeProperty('--lyrics-shift');
    marquee.style.removeProperty('--lyrics-dur');
    textEl.textContent = text;
    // 同步测量：文本一改完就能拿到真实宽度，不必等下一帧
    const overflow = textEl.scrollWidth - marquee.clientWidth;
    if (overflow > 8) {
      marquee.style.setProperty('--lyrics-shift', '-' + overflow + 'px');
      marquee.style.setProperty('--lyrics-dur', Math.max(6, overflow / 28) + 's');
      marquee.classList.add('is-scrolling');
    }
  }

  let loading = false;
  let lastPos = 0;
  let lastMeta = null;

  function renderLine(force) {
    const list = boxes();
    let text = '';
    if (lines.length) {
      let idx = -1;
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].time <= lastPos) idx = i; else break;
      }
      text = idx >= 0 ? lines[idx].text : '';
    }
    if (!text) text = loading ? '歌词加载中…' : '♪ 播放中';
    if (!force && text === shownText && list.length === paintedBoxes) return;
    shownText = text;
    paintedBoxes = list.length;
    list.forEach(b => applyMarquee(b, text));
  }

  document.addEventListener('hwplayer:update', e => {
    const d = e.detail || {};
    const meta = d._currentMeta || d.currentMeta || null;
    lastPos = d.position || 0;
    lastMeta = meta;
    if (!d.queue || !meta || !meta.trackId) {
      currentTrackId = null;
      lines = [];
      shownText = null;
      return;
    }
    const trackId = meta.trackId;
    if (trackId !== currentTrackId) {
      currentTrackId = trackId;
      lines = [];
      shownText = null;
      loading = true;
      const neId = String(trackId).replace(/^ne-/, '');
      if (neId) {
        fetchLyrics(neId).then(ls => {
          if (currentTrackId !== trackId) return;
          loading = false;
          lines = ls;
          renderLine(true);
        });
      } else {
        loading = false;
      }
    }
    renderLine(false);
  });

  // 播放器宽度变化（抽屉开合、断点切换）时重算滚动距离
  window.addEventListener('resize', () => renderLine(true));
})();
</script>

<script>
/* 桌面右侧常驻栏：直接挂载歌单（抽屉那份仍是懒加载，两处各自刷新、共用同一播放状态） */
(function mountRailPlayer() {
  const mount = document.getElementById('musicRailMount');
  if (!mount || !window.HWPlayer) return;
  window.HWPlayer.mountAll(mount.parentElement);
})();

/* 底部歌词条与「回到顶部」都贴着说说列表的左右沿走：
   列表是居中定宽，外层又是「居中容器 + 右栏」两列，纯 CSS 算不出这两条边，量一次最省事。 */
(function alignToMemoList() {
  const col = document.querySelector('.feed-col');
  const content = document.getElementById('content');
  if (!col || !content) return;
  const root = document.documentElement.style;
  const sync = () => {
    const card = content.querySelector('.memo-card');
    if (!card) return;
    const box = card.getBoundingClientRect();
    if (!box.width) return;
    const inset = col.getBoundingClientRect().right - box.right;
    root.setProperty('--totop-right', Math.max(8, Math.round(inset)) + 'px');
  };
  if (window.ResizeObserver) new ResizeObserver(sync).observe(content);
  addEventListener('resize', sync, { passive: true });
  sync();
})();
</script>

  background:linear-gradient(180deg, var(--k2-chrome-a), var(--k2-chrome-b)) !important;
  color:var(--k2-chrome-ink) !important;
  box-shadow:none !important;
  font-family:var(--k2-font-nav) !important;
  font-weight:700 !important;
}
#mainScroll#mainScroll .pager-btn:hover,
#mainScroll .hot-tabs .tag-chip:hover,
#mainScroll .bm-cats .tag-chip:hover{
  background:linear-gradient(180deg, var(--k2-banner-a), var(--k2-banner-b)) !important;
  color:var(--k2-banner-ink) !important;
  transform:none !important;
  box-shadow:none !important;
}
#mainScroll#mainScroll .pager-btn.is-active,
#mainScroll .hot-tabs .tag-chip.active,
#mainScroll .bm-cats .tag-chip.active{
  border-style:inset !important;
  background:linear-gradient(180deg, var(--k2-press-a), var(--k2-press-b)) !important;
  color:var(--k2-press-ink) !important;
}
/* ---------- 表单控件：下凹的文本框，不是现代软边胶囊 ---------- */
#mainScroll#mainScroll .input,
#mainScroll#mainScroll .select,
#mainScroll#mainScroll textarea,
#mainScroll#mainScroll .bm-search,
.cmdk-panel.cmdk-panel input{
  border:2px inset var(--k2-chrome-b) !important;
  background:var(--k2-strip) !important;
  color:var(--k2-link) !important;
  font-family:var(--k2-font-nav) !important;
}
/* ---------- 收尾：整站不留任何弧度 ---------- */
*,
*::before,
*::after{ border-radius:0 !important; }
/* 兜住前面那些 “#content .xxx / html:is(...) #content .xxx” 的 !important 圆角：
   同一个元素上重复写一次 id（合法，且把权重抬到两位 id）。 */
#mainScroll#mainScroll *,
#mainScroll #content *,
#tagBar#tagBar *,
#musicDrawer#musicDrawer *,
#hwLyricsFloat#hwLyricsFloat *,
#cmdkMemoModal#cmdkMemoModal *,
.cmdk-panel.cmdk-panel *,
#mainScroll#mainScroll *::before,
#mainScroll#mainScroll *::after,
#tagBar#tagBar *::before,
#tagBar#tagBar *::after,
.cmdk-panel.cmdk-panel *::before,
.cmdk-panel.cmdk-panel *::after{ border-radius:0 !important; }
/* ---------- 直角化第二轮：内容里的药丸 / 芯片 / 浮窗 ---------- */
/* 日期徽章、标签芯片：当年是小方框，不是药丸 */
#content .memo-tape-date,
#content .tag-chip,
#content .badge,
#content .tag,
#content .chip,
.tag-drawer-close,
.tag-drawer-clear,
.tag-drawer-current,
.tag-drawer-title,
.sidebar-tag,
.drawer-close,
.hw-lyrics-float-close,
.cmdk-close,
.cmdk-memo-close{
  border-radius:0 !important;
}
#content .memo-tape-date{
  border:1px solid var(--k2-edge) !important;
  background:var(--k2-strip) !important;
  font-family:var(--k2-font-nav) !important;
  letter-spacing:.04em !important;
}
#content .tag-chip,
.sidebar-tag{
  border:1px solid var(--k2-hair) !important;
}
.tag-drawer-current{
  border:1px solid var(--k2-hair) !important;
  border-radius:0 !important;
}
/* 图片条 / 多图格 */
.strip-item,
.strip-item img{ border-radius:0 !important; }
html body .strip-wrap .memo-image-grid .strip-item,
html body .strip-wrap .memo-image-grid .strip-item img,
html body .strip-wrap .memo-image-grid .strip-item[data-more]::after{
  border-radius:0 !important;
  box-shadow:none !important;
}
html body .strip-wrap .memo-image-grid .strip-item[data-more]::after{
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
  border:1px solid var(--k2-strip) !important;
}
/* 标签芯片 / 徽章：所有主题下的药丸统一清零 */
.tag-chip,
#content .badge,
.badge.tag-chip,
.bm-cats .tag-chip,
.hot-tabs .tag-chip,
.tag-drawer-list .tag-chip,
#tagChips .sidebar-tag.tag-chip,
html:is([data-theme="light"], [data-theme="dark"], [data-theme="halloween"]) .tag-drawer-list .tag-chip{
  border-radius:0 !important;
}
.hot-tabs .tab-btn,
.hot-tabs .tag-chip{ border-radius:0 !important; }
/* 图片墙：直角 + 发丝线，去掉上浮与投影 */
.photo-item a,
.photo-item img,
.poster-card img,
html:is([data-theme="light"], [data-theme="dark"], [data-theme="halloween"]) .photo-item a{
  border-radius:0 !important;
  box-shadow:none !important;
  transform:none !important;
}
/* 歌词浮窗：小窗口，直角 + 标题栏（当年弹窗就是这个样子） */
.hw-lyrics-float{
  border-radius:0 !important;
  border:2px solid var(--k2-edge) !important;
  box-shadow:4px 4px 0 var(--k2-hair) !important;
}
.hw-lyrics-float-bar{
  background:linear-gradient(180deg, var(--k2-banner-a), var(--k2-banner-b)) !important;
  border-bottom:1px solid var(--k2-edge) !important;
}
/* 输入框：Win 文本框的下凹内边框（sunken field） */
input,textarea,select{ border-radius:0 !important; }
#cmdkInput,
input[type="text"],input[type="search"],input[type="url"],input[type="number"],textarea{
  border:2px inset var(--k2-chrome-b) !important;
  background:var(--k2-strip) !important;
}
/* ---------- 外框容器：直角、无毛玻璃（导航上方那道弧形就是它造成的） ---------- */
#mainScroll,
#mainScroll:hover,
#mainScroll:active,
html:is([data-theme="light"], [data-theme="dark"], [data-theme="halloween"]) #mainScroll{
  border-radius:0 !important;
  border:0 !important;
  outline:0 !important;
  box-shadow:none !important;
  background-color:transparent !important;
  background-image:none !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
}
/* ---------- 抽屉 / 弹窗：跟导航同一套直角硬边 ---------- */
html:is([data-theme="light"], [data-theme="dark"], [data-theme="halloween"]) #tagBar.tag-drawer,
#tagBar.tag-drawer{
  border-radius:0 !important;
  box-shadow:none !important;
  border:0 !important;
  border-right:2px solid var(--k2-edge) !important;
}
html:is([data-theme="light"], [data-theme="dark"], [data-theme="halloween"]) #musicDrawer.music-drawer,
#musicDrawer.music-drawer{
  border-radius:0 !important;
  box-shadow:none !important;
  border:0 !important;
  border-left:2px solid var(--k2-edge) !important;
}
html:is([data-theme="light"], [data-theme="dark"], [data-theme="halloween"]) .cmdk-panel,
.cmdk-panel{
  border-radius:0 !important;
  border:2px solid var(--k2-edge) !important;
  box-shadow:4px 4px 0 var(--k2-hair) !important;
}
.cmdk-item{ border-radius:0 !important; }
.cmdk-ico{ border-radius:0 !important; }
.cmdk-footer .kbd{
  border-radius:0 !important;
  border:1px solid var(--k2-edge) !important;
}
#toTop{ border-radius:0 !important; }
/* ---------- 窄屏：菜单改成表格似的多列文字链，避免横向截断 ---------- */
@media  (min-width:761px){/* 双横幅后导航变高，锚点偏移重新校准 */
#content{ scroll-padding-top:88px !important; }
#content .filter-bar,
  #content .filters,
  #content .toolbar,
  #content .section-toolbar{ scroll-margin-top:88px !important; }}
@media  (max-width:760px){#content{ scroll-padding-top:112px !important; }
#content .filter-bar,
  #content .filters,
  #content .toolbar,
  #content .section-toolbar{ scroll-margin-top:112px !important; }}
/* ---------- 修复：当前菜单项文字被 -webkit-text-fill-color 涂成同色 ----------
   apple-glass 段在 7206 行给 .tab-btn.active 写死了 text-fill-color: var(--g-ink)，
   浅色下就是深紫字 + 深紫底，完全看不见。用重复 id 抬权重压过它。 */
/* 桌面右侧常驻栏的网格布局见文末「只让内容列滚动」段：
   它必须排在同权重的基础骨架之后才能生效。 */
.music-rail{
  font-family:var(--k2-font-nav) !important;
  border:1px solid var(--k2-edge) !important;
  background:var(--k2-strip) !important;
  box-shadow:none !important;
  padding:0 !important;
  margin:0 !important;
}
.rail-head{
  display:flex; align-items:center; gap:5px;
  padding:4px 7px;
  background:linear-gradient(180deg, var(--k2-banner-a), var(--k2-banner-b)) !important;
  border-bottom:1px solid var(--k2-edge) !important;
  color:var(--k2-banner-ink) !important;
  font-size:.72rem !important;
  font-weight:700 !important;
  letter-spacing:.16em !important;
}
/* 常驻栏里的播放器：借 .music-drawer 这套变量与内部样式，但把抽屉的外壳拍平 */
.rail-player{
  position:static !important;
  inset:auto !important;
  width:auto !important;
  max-width:none !important;
  height:auto !important;
  transform:none !important;
  transition:none !important;
  z-index:auto !important;
  background:transparent !important;
  border:0 !important;
  box-shadow:none !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
  padding:8px 9px 9px !important;
  overflow:hidden !important;
  --bg:var(--k2-strip);
  --paper:var(--k2-strip);
  --border:var(--k2-hair);
  --border-light:var(--k2-hair);
  --text:var(--k2-link);
  --text-main:var(--k2-link);
  --secondary-text:var(--k2-mute);
  --text-muted:var(--k2-mute);
  --accent:var(--k2-press-a);
  --accent-color:var(--k2-press-a);
  --accent-dark:var(--k2-press-b);
  --bg-player:var(--k2-strip-2);
  --dot-normal:var(--k2-hair);
}
.rail-player .hw-pl-header{ border-bottom:1px solid var(--k2-hair) !important; }
.rail-player .hw-pl-cover{
  width:56px !important; height:56px !important; flex:0 0 56px !important;
  border:1px solid var(--k2-edge) !important;
  background:#fff !important;
}
.rail-player .hw-pl-title{ font-size:.8rem !important; }
.rail-player .hw-pl-artist{ font-size:.74rem !important; }
.rail-player .hw-pl-list{
  border-top:1px solid var(--k2-edge) !important;
  scrollbar-width:thin !important;
}
/* 曲目行：表格似的一行一条，行与行之间压一根发丝线 */
.rail-player .hw-pl-row{
  padding:4px 2px !important;
  border-bottom:1px solid var(--k2-hair) !important;
  border-radius:0 !important;
  transition:background-color .1s linear !important;
}
.rail-player .hw-pl-row:hover{ background:var(--k2-banner-a) !important; }
.rail-player .hw-pl-row-idx{ font-family:var(--k2-font-nav) !important; }
.rail-player .hw-pl-row-title{ font-size:.78rem !important; }
.rail-player .hw-pl-row-artist{ font-size:.68rem !important; }
/* 当前曲目：列表框选中行那样整条反白 */
.rail-player .hw-pl-row.playing,
.rail-player .hw-pl-row.playing:hover{
  background:linear-gradient(180deg, var(--k2-press-a), var(--k2-press-b)) !important;
}
.rail-player .hw-pl-row.playing .hw-pl-row-idx,
.rail-player .hw-pl-row.playing .hw-pl-row-title,
.rail-player .hw-pl-row.playing .hw-pl-row-artist,
.rail-player .hw-pl-row.playing .hw-pl-row-playicon{
  color:var(--k2-press-ink) !important;
  -webkit-text-fill-color:var(--k2-press-ink) !important;
}
/* 控制键：小立体键，播放键按下时转凹陷 */
.rail-player .hw-btn{
  width:32px !important; height:28px !important;
  border:2px outset var(--k2-chrome-b) !important;
  border-radius:0 !important;
  background:linear-gradient(180deg, var(--k2-chrome-a), var(--k2-chrome-b)) !important;
  color:var(--k2-chrome-ink) !important;
}
.rail-player .hw-btn:hover{
  background:linear-gradient(180deg, var(--k2-banner-a), var(--k2-banner-b)) !important;
  color:var(--k2-banner-ink) !important;
  transform:none !important;
}
.rail-player .hw-btn:active{ transform:none !important; border-style:inset !important; }
.rail-player .hw-btn.active{ color:var(--k2-press-a) !important; -webkit-text-fill-color:var(--k2-press-a) !important; }
.rail-player .hw-play{
  background:linear-gradient(180deg, var(--k2-press-a), var(--k2-press-b)) !important;
  color:var(--k2-press-ink) !important;
  -webkit-text-fill-color:var(--k2-press-ink) !important;
}
/* 进度条：方头滑轨 + 方形拉钮 */
.rail-player .hw-progress{ height:6px !important; border:1px solid var(--k2-hair) !important; background:var(--k2-strip-2) !important; }
.rail-player .hw-progress::-webkit-slider-thumb{ width:9px !important; height:14px !important; border-radius:0 !important; background:var(--k2-press-a) !important; border:1px solid var(--k2-edge) !important; }
.rail-player .hw-progress::-moz-range-thumb{ width:9px !important; height:14px !important; border-radius:0 !important; background:var(--k2-press-a) !important; border:1px solid var(--k2-edge) !important; }
.rail-player .hw-time{ font-family:var(--k2-font-nav) !important; letter-spacing:.02em !important; }
/* ---------- 循环模式：三档一眼分清 ----------
   原来只有一个小圆点角标，列表循环和单曲循环几乎看不出差别。
   现在图标旁边直接写档位名，三档各有一种底色，下面再补一句它意味着什么。 */
.hw-playlist .hw-pl-repeat{
  width:auto !important; min-width:0 !important; height:auto !important;
  position:relative !important;
  gap:4px !important; padding:5px 7px !important;
  font-family:var(--k2-font-nav) !important;
}
.hw-playlist .hw-repeat-flag{
  font-size:.62rem !important; font-weight:700 !important;
  letter-spacing:.03em !important; line-height:1.25 !important;
  white-space:nowrap;
}
.hw-playlist .hw-pl-repeat[data-repeat-mode="off"]{
  color:var(--k2-chrome-ink) !important;
  -webkit-text-fill-color:var(--k2-chrome-ink) !important;
}
.hw-playlist .hw-pl-repeat[data-repeat-mode="off"] svg{ opacity:.55; }
.hw-playlist .hw-pl-repeat[data-repeat-mode="all"]{
  background:linear-gradient(180deg, var(--k2-banner-a), var(--k2-banner-b)) !important;
  color:var(--k2-banner-ink) !important;
  -webkit-text-fill-color:var(--k2-banner-ink) !important;
  border-color:var(--k2-banner-b) !important;
}
.hw-playlist .hw-pl-repeat[data-repeat-mode="one"]{
  background:linear-gradient(180deg, var(--k2-press-a), var(--k2-press-b)) !important;
  color:var(--k2-press-ink) !important;
  -webkit-text-fill-color:var(--k2-press-ink) !important;
  border-color:var(--k2-press-b) !important;
}
/* 档位说明改用气泡：鼠标一动就出字。
   原生 title 要等约 1 秒才显示，触屏更是根本没有 hover，所以自己画一个。 */
.hw-playlist .hw-pl-repeat::after{
  content:attr(data-hint);
  position:absolute; z-index:40;
  top:calc(100% + 6px); right:0;
  width:max-content; max-width:14em;
  padding:3px 6px;
  text-align:left;
  font-family:var(--k2-font-nav) !important;
  font-size:.62rem !important;
  line-height:1.45 !important;
  letter-spacing:.01em !important;
  color:var(--k2-tip-ink) !important;
  -webkit-text-fill-color:var(--k2-tip-ink) !important;
  background:var(--k2-tip-bg) !important;
  border:1px solid var(--k2-tip-ink) !important;
  box-shadow:2px 2px 0 rgba(0,0,0,.24) !important;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.hw-playlist .hw-pl-repeat:hover::after,
.hw-playlist .hw-pl-repeat:focus-visible::after,
.hw-playlist .hw-pl-repeat.show-hint::after{
  opacity:1;
  visibility:visible;
}
/* ---------- 外框贴屏：导航左右两侧和顶部不再有缝隙 ----------
   外框原本是 position:fixed; inset:6~12px，那圈缝露出的是 body 的纸纹，
   导航再怎么负边距也只能贴到外框内沿。直接把外框铺满视口。 */
#mainScroll,
#mainScroll:hover,
#mainScroll:active,
html:is([data-theme="light"], [data-theme="dark"], [data-theme="halloween"]) #mainScroll{
  inset:0 !important;
  padding-inline:var(--k2-ms-pad) !important;
}
/* ---------- 只让内容列滚动 ----------
   外框 body/#mainScroll 都不再滚动，导航钉在顶部，右栏高度由网格行锁死；
   滚动条搬进 #feedScroll，说说列表怎么拉，右侧播放器都是静止的。 */
#mainScroll#mainScroll{
  overflow:hidden !important;
  height:100% !important;
  display:flex !important;
  flex-direction:column !important;
  padding-bottom:max(12px, env(safe-area-inset-bottom, 0px)) !important;
}
.page-container.page-container{
  flex:1 1 auto !important;
  min-height:0 !important;
  height:auto !important;
  display:flex !important;
  flex-direction:column !important;
  overflow:hidden !important;
}
.page-container > .feed-col{
  position:relative !important;
  flex:1 1 auto !important;
  min-width:0 !important;
  min-height:0 !important;
  display:flex !important;
  overflow:hidden !important;
  z-index:auto !important;
}
#feedScroll#feedScroll{
  flex:1 1 auto !important;
  width:100% !important;
  min-height:0 !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
}
/* ---------- 回到顶部：只剩一个图标，贴说说列表右沿 ----------
   没有底色也没有描边，可见度全交给字色；--k2-link 在深浅两套里都够对比。 */
#toTop#toTop{
  position:absolute !important;
  right:var(--totop-right, 12px) !important;
  bottom:max(16px, calc(env(safe-area-inset-bottom, 0px) + 8px)) !important;
  z-index:120 !important;
  background:transparent !important;
  background-image:none !important;
  border:0 !important;
  box-shadow:none !important;
  /* Tailwind 的 transition-all 会把投影动画一路带到 hover 层，旧值赖着不走；
     这里只保留脚本控制的透明度淡入。 */
  transition:opacity .3s ease !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
  color:var(--k2-link) !important;
  text-shadow:none !important;
}
#toTop#toTop:hover,
#toTop#toTop:focus-visible{
  color:var(--k2-link-hover) !important;
  box-shadow:none !important;
  transform:none !important;
}
#toTop#toTop svg{ fill:currentColor !important; }
/* ---------- 桌面右侧常驻栏：直接铺开的歌单 ----------
   必须排在上面的基础骨架之后：媒体查询不加权重，
   .page-container.page-container 的 display:flex 会把这里的 grid 顶掉。 */
@media  (min-width:1024px){.page-container.page-container{
    display:grid !important;
    grid-template-columns:minmax(0,1fr) 300px !important;
    grid-template-rows:minmax(0,1fr) !important;
    column-gap:20px !important;
    align-items:stretch !important;
    max-width:1300px !important;
  }
.page-container > *{ grid-column:1; grid-row:1; }
.music-rail{
    grid-column:2;
    grid-row:1;
    min-height:0 !important;
    display:flex !important;
    flex-direction:column !important;
    overflow:hidden !important;
  }
.music-rail .rail-player{ flex:1 1 auto; min-height:0; display:flex; }
.music-rail .drawer-body{ padding:0 !important; }
/* 播放器已经常驻在右侧，菜单里开抽屉的那项音乐就不再重复出现 */}
@media  (max-width:1023px){.music-rail{ display:none !important; }}
/* ---------- 右侧常驻栏与第一条说说顶部对齐 ----------
   偈语上移后刊头没了，正文列只剩 #content 自己的外边距；
   把它原本 12px 外边距 + 4px 内边距挪进容器顶边距，两列就同一条基线。 */
.page-container{ padding-top:26px !important; }
#content#content{ margin-top:0 !important; padding-top:0 !important; }
/* ---------- 歌词搬进播放器：印在封面右侧，播放时取代歌曲信息 ----------
   卡片上的 is-current 由 refreshPlaylistUI 按「当前队列是不是我这列表」加；
   手机端抽屉里是同一个组件，所以两条规则两边都生效。 */
.music-drawer .hw-playlist:not(.is-current) .hw-pl-lyric{ display:none !important; }
.music-drawer .hw-playlist.is-current .hw-pl-meta{ display:none !important; }
.music-drawer .hw-pl-lyric{
  flex:1 1 auto !important; min-width:0 !important;
  display:flex; align-items:center;
  font:.78rem/1.45 var(--k2-font-nav) !important;
  color:var(--secondary-text) !important;
  -webkit-text-fill-color:var(--secondary-text) !important;
}
.music-drawer .hw-pl-lyric-marquee{ flex:1 1 auto; min-width:0; overflow:hidden; }
.music-drawer .hw-pl-lyric-text{ display:inline-block; white-space:nowrap; }
.music-drawer .hw-playlist.is-current .hw-pl-lyric{ color:var(--text) !important; -webkit-text-fill-color:var(--text) !important; }</style>
<style id="imgbox-1999">/* ---------- 图片查看窗：直角套框 + Win98 标题栏 ----------
   颜色全走 k2 变量，深浅两套自动跟着换；框子贴着图片收缩。 */
#imgBox#imgBox{
  position:fixed; inset:0; z-index:10020;
  display:flex; align-items:center; justify-content:center;
  padding:min(4vw, 28px);
}
#imgBox#imgBox.hidden{ display:none !important; }
#imgBox .imgbox-mask{ position:absolute; inset:0; background:rgba(12,6,16,.74); }
#imgBox .imgbox-frame{
  position:relative; display:flex; flex-direction:column;
  max-width:min(1200px, 94vw); max-height:88vh;
  background:var(--k2-strip);
  border:2px solid var(--k2-edge);
  border-radius:0;
  box-shadow:inset 1px 1px 0 var(--k2-bevel-lt), 5px 5px 0 rgba(0,0,0,.4);
}
#imgBox .imgbox-bar{
  display:flex; align-items:center; gap:4px; padding:3px 4px;
  min-width:0;
  background:linear-gradient(180deg, var(--k2-banner-a), var(--k2-banner-b));
  border-bottom:2px solid var(--k2-edge);
  color:var(--k2-banner-ink);
  font:.76rem var(--k2-font-nav);
}
#imgBox .imgbox-name{
  /* 同上：标题是任意长度的用户文字，给了固有宽度就会把窗撑到比图片宽得多。
     定宽 0 + flex 撑开，它只吃标题栏剩下的空间，控件永远放得下。 */
  flex:1 1 0; width:0; min-width:0;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  font-weight:700; letter-spacing:.02em;
}
#imgBox .imgbox-zoom{
  min-width:3.9em; padding:1px 2px; text-align:center;
  font:.72rem var(--font-num);
  background:var(--k2-strip); color:var(--k2-chrome-ink);
  border:1px solid;
  border-color:var(--k2-bevel-dk) var(--k2-bevel-lt) var(--k2-bevel-lt) var(--k2-bevel-dk);
}
#imgBox .imgbox-btn{
  min-width:22px; height:20px; padding:0 5px;
  font:.78rem/1 var(--k2-font-nav);
  background:linear-gradient(180deg, var(--k2-chrome-a), var(--k2-chrome-b));
  color:var(--k2-chrome-ink);
  border:2px solid;
  border-color:var(--k2-bevel-lt) var(--k2-bevel-dk) var(--k2-bevel-dk) var(--k2-bevel-lt);
  cursor:pointer;
}
#imgBox .imgbox-btn:hover{ background:var(--k2-banner-a); color:var(--k2-banner-ink); }
#imgBox .imgbox-btn:active{
  border-color:var(--k2-bevel-dk) var(--k2-bevel-lt) var(--k2-bevel-lt) var(--k2-bevel-dk);
  background:linear-gradient(180deg, var(--k2-press-a), var(--k2-press-b));
  color:var(--k2-press-ink);
}
#imgBox .imgbox-view{
  flex:1 1 auto; min-width:0; min-height:0; overflow:auto;
  padding:8px; background:var(--k2-strip-2); scrollbar-width:thin;
}
/* Tailwind 的 preflight 给所有 img 上了 max-width:100%，放大就会被压回框内 */
#imgBox .imgbox-view img{
  display:block; max-width:none !important; height:auto;
  /* 竖图的宽度由自身决定，窗口宽度却由标题栏和底部说明撑开，
     不居中就会把空白全留在右边；放大到超出可视区时 auto 自动归零，不影响滚动。 */
  margin-inline:auto;
  border:1px solid var(--k2-edge); background:var(--k2-strip);
}
#imgBox .imgbox-foot{
  padding:3px 7px;
  background:linear-gradient(180deg, var(--k2-strip), var(--k2-strip-2));
  border-top:1px solid var(--k2-hair);
  color:var(--k2-mute); font:.7rem var(--k2-font-nav);
  /* 列向 flex 的窗宽取各子项 max-content 的最大值，
     这行 nowrap 文字会把整扇窗撑到它的长度，竖图就成了左右两大片空白。
     width:0 让它不再贡献宽度，min-width:100% 再把它拉回满幅（百分比不参与固有尺寸计算）。 */
  width:0; min-width:100%;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
}
@media  (max-width:600px){#imgBox .imgbox-frame{ max-width:96vw; max-height:92vh; }
#imgBox .imgbox-view{ padding:5px; }}</style>
<style id="site-footer-y2k">/* ---------- 页脚：一条发丝分隔线 + 一行年份，直角无底色 ----------
   页脚是 #mainScroll 的最后一个子元素，不进 .page-container：
   那个容器在桌面断点是两列网格，多一个子元素会被 grid-row:1 拍到左上角、还会撑坏行高。 */
.site-footer{
  flex:0 0 auto !important;
  height:fit-content !important;
  align-self:stretch;
  margin:10px 0 0;
  padding:6px 0 2px;
  border-top:1px solid var(--k2-hair);
  color:var(--k2-mute);
  font:.72rem/1.4 var(--k2-font-nav);
  letter-spacing:.06em;
  text-align:center;
}
@media  (max-width:760px){.site-footer{ padding:5px 0 0; }}
</style>
<script id="siteFooterYearScript">document.getElementById("siteFooterYear").textContent = new Date().getFullYear();</script>
</body>
</html>
