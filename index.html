    { id: 35, name: '喜剧' }, { id: 80, name: '犯罪' }, { id: 99, name: '纪录' },
    { id: 18, name: '剧情' }, { id: 10751, name: '家庭' }, { id: 14, name: '奇幻' },
    { id: 36, name: '历史' }, { id: 27, name: '恐怖' }, { id: 10402, name: '音乐' },
    { id: 9648, name: '悬疑' }, { id: 10749, name: '爱情' }, { id: 878, name: '科幻' },
    { id: 10770, name: '电视电影' }, { id: 53, name: '惊悚' }, { id: 10752, name: '战争' },
    { id: 37, name: '西部' }, { id: 10759, name: '动作冒险' }, { id: 10762, name: '儿童' },
    { id: 10763, name: '新闻' }, { id: 10764, name: '真人秀' }, { id: 10765, name: 'Sci-Fi & Fantasy' },
    { id: 10766, name: '肥皂剧' }, { id: 10767, name: '脱口秀' }, { id: 10768, name: 'War & Politics' },
  ];

  const uniqueGenres = [];
  const seen = new Set();
  for (const g of GENRES_MAP) {
    if (!seen.has(g.id)) {
      seen.add(g.id);
      uniqueGenres.push(g);
    }
  }
  const GENRE_LOOKUP = Object.fromEntries(uniqueGenres.map(g => [g.id, g.name]));

  createApp({
    data() {
      return {
        currentView: 'say',
        showModal: false,
        modalType: '',
        mediaTypeFilter: 'all',
        selectedGenres: [],
        apiBase: 'https://pub.199105.xyz/api/public-memos',
        pageSize: 12,

        // 右上角菜单
        menuOpen: false,
        isDark: false,
        musicPlaying: false,

        views: {
          say: {
            items: [],
            page: 1,
            totalPages: 1,
            loading: false,
            hasMore: true,
            scrollPos: 0,
          },
          watched: {
            allItems: [],
            page: 1,
            loading: false,
            scrollPos: 0,
          },
          watchlist: {
            allItems: [],
            page: 1,
            loading: false,
            scrollPos: 0,
          }
        }
      };
    },

    computed: {
      displayGenres() {
        if (this.mediaTypeFilter === 'all') return uniqueGenres;
        const movieIds = new Set([28,12,16,35,80,99,18,10751,14,36,27,10402,9648,10749,878,10770,53,10752,37]);
        const tvIds = new Set([10759,16,35,80,99,18,10751,10762,9648,10763,10764,10765,10766,10767,10768,37]);
        if (this.mediaTypeFilter === 'movie') return uniqueGenres.filter(g => movieIds.has(g.id));
        if (this.mediaTypeFilter === 'tv') return uniqueGenres.filter(g => tvIds.has(g.id));
        return uniqueGenres;
      },
      activeMediaKey() {
        return this.modalType || 'watched';
      },
      currentMediaData() {
        return this.views[this.activeMediaKey] || this.views.watched;
      },
      sayData() {
        return this.views.say;
      },
      loading() {
        if (this.showModal) return !!this.currentMediaData.loading;
        return !!this.sayData.loading;
      },
      currentPage() {
        if (this.showModal) return this.currentMediaData.page;
        return this.sayData.page;
      },
      posts() {
        return this.sayData.items;
      },
      hasMore() {
        return this.sayData.page < this.sayData.totalPages;
      },
      filteredMedia() {
        if (!this.showModal) return [];
        const all = this.currentMediaData.allItems || [];
        return all.filter(item => {
          const matchType = this.mediaTypeFilter === 'all' || item.media_type === this.mediaTypeFilter;
          const matchGenre = this.selectedGenres.length === 0 ||
            this.selectedGenres.every(g => item.genre_ids && item.genre_ids.includes(g));
          return matchType && matchGenre;
        });
      },
      totalPages() {
        if (!this.showModal) return this.sayData.totalPages || 1;
        return Math.ceil(this.filteredMedia.length / this.pageSize) || 1;
      },
      mediaList() {
        if (!this.showModal) return [];
        const page = this.currentMediaData.page;
        const start = (page - 1) * this.pageSize;
        return this.filteredMedia.slice(start, start + this.pageSize);
      }
    },

    methods: {
      renderMarkdown(content) {
        if (!content) return '';
        return marked.parse(content);
      },
      formatTime(timeStr) {
        if (!timeStr) return '';
        return timeStr.replace(/\//g, '-');
      },
      getGenreName(id) {
        return GENRE_LOOKUP[id] || id;
      },

      /* ========== 右上角菜单 ========== */
      toggleMenu() {
        this.menuOpen = !this.menuOpen;
        if (this.menuOpen) {
          this.$nextTick(() => {
            if (window.Iconify && this.$el) {
              try { window.Iconify.scan(this.$el); } catch (e) {}
            }
          });
        }
      },
      closeMenu() {
        this.menuOpen = false;
      },
      syncChromeState() {
        this.isDark = document.body.classList.contains('dark');
        try {
          if (window.HWPlayer && typeof window.HWPlayer.getState === 'function') {
            this.musicPlaying = !!window.HWPlayer.getState().isPlaying;
          }
        } catch (e) {
          this.musicPlaying = false;
        }
      },
      onMenuMusic() {
        this.closeMenu();
        if (typeof window.__toggleMusicDrawer === 'function') {
          window.__toggleMusicDrawer();
        }
      },
      onMenuWatched() {
        this.closeMenu();
        this.switchView('watched');
      },
      onMenuWatchlist() {
        this.closeMenu();
        this.switchView('watchlist');
      },
      onMenuTheme() {
        if (typeof window.__toggleTheme === 'function') {
          window.__toggleTheme();
        }
        this.syncChromeState();
        // 主题可连点，不强制关菜单；若想点完就关，取消下一行注释：
        // this.closeMenu();
      },

      /* ========== 看过 / 想看 弹窗 ========== */
      switchView(view) {
        if (view === 'say') {
          this.closeModal();
          return;
        }

        this.closeMenu();
        this.showModal = true;
        this.modalType = view;
        this.currentView = view;
        document.body.classList.add('modal-open');
        document.body.style.overflow = 'hidden';

        this.mediaTypeFilter = 'all';
        this.selectedGenres = [];

        const target = this.views[view];
        if (!target.allItems || target.allItems.length === 0) {
          this.fetchMedia(view);
        } else {
          target.page = 1;
        }
      },

      closeModal() {
        this.showModal = false;
        this.modalType = '';
        this.currentView = 'say';
        document.body.classList.remove('modal-open');

        const drawer = document.getElementById('musicDrawer');
        if (!drawer || !drawer.classList.contains('open')) {
          document.body.style.overflow = '';
        }
      },

      /* ========== 说说 ========== */
      async fetchSayPosts(page) {
        const viewData = this.views.say;
        if (viewData.loading) return;
        viewData.loading = true;

        try {
          const url = `${this.apiBase}?view=say&page=${page}&pageSize=${this.pageSize}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          if (json.error) throw new Error(json.error);

          if (page === 1) {
            viewData.items = json.data || [];
          } else {
            viewData.items = viewData.items.concat(json.data || []);
          }
          viewData.page = json.page;
          viewData.totalPages = json.totalPages || 1;
          viewData.loading = false;

          this.$nextTick(() => {
            if (typeof Fancybox !== 'undefined') Fancybox.bind('[data-fancybox]', {});
          });
        } catch (e) {
          console.error('加载说说失败', e);
          viewData.loading = false;
        }
      },

      loadMore() {
        if (this.sayData.loading) return;
        if (this.sayData.page >= this.sayData.totalPages) return;
        this.fetchSayPosts(this.sayData.page + 1);
      },

      /* ========== 影视 ========== */
      async fetchMedia(view) {
        const viewData = this.views[view];
        if (!viewData || viewData.loading) return;
        viewData.loading = true;

        try {
          const url = `${this.apiBase}?view=${view}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          if (json.error) throw new Error(json.error);

          viewData.allItems = json.data || [];
          viewData.page = 1;
          viewData.loading = false;
        } catch (e) {
          console.error('加载媒体失败', e);
          viewData.loading = false;
        }
      },

      setMediaType(type) {
        if (this.mediaTypeFilter === type) return;
        this.mediaTypeFilter = type;
        this.selectedGenres = [];
        if (this.showModal && this.currentMediaData) {
          this.currentMediaData.page = 1;
        }
      },

      toggleGenre(id) {
        const idx = this.selectedGenres.indexOf(id);
        if (idx > -1) this.selectedGenres.splice(idx, 1);
        else this.selectedGenres.push(id);
        if (this.showModal && this.currentMediaData) {
          this.currentMediaData.page = 1;
        }
      },

      goPage(page) {
        if (!this.showModal) return;
        if (page < 1 || page > this.totalPages) return;
        this.currentMediaData.page = page;
        const body = document.querySelector('.modal-body');
        if (body) body.scrollTo({ top: 0, behavior: 'smooth' });
      },

      onKeydown(e) {
        if (e.key !== 'Escape') return;
        // 先关菜单，再关弹窗
        if (this.menuOpen) {
          this.closeMenu();
          return;
        }
        if (this.showModal) {
          this.closeModal();
        }
      },

      onDocClick(e) {
        if (!this.menuOpen) return;
        const fab = this.$el && this.$el.querySelector
          ? this.$el.querySelector('.fab-menu')
          : document.querySelector('.fab-menu');
        if (fab && fab.contains(e.target)) return;
        this.closeMenu();
      }
    },

    mounted() {
      this.fetchSayPosts(1);
      this.syncChromeState();

      window.addEventListener('keydown', this.onKeydown);
      // 下一帧再绑，避免打开菜单的同一次 click 立刻被当成“外部点击”
      this.$nextTick(() => {
        document.addEventListener('click', this.onDocClick);
      });

      this._onHwUpdate = () => this.syncChromeState();
      document.addEventListener('hwplayer:update', this._onHwUpdate);

      this._themeObs = new MutationObserver(() => this.syncChromeState());
      this._themeObs.observe(document.body, {
        attributes: true,
        attributeFilter: ['class']
      });
    },

    beforeUnmount() {
      window.removeEventListener('keydown', this.onKeydown);
      document.removeEventListener('click', this.onDocClick);
      if (this._onHwUpdate) {
        document.removeEventListener('hwplayer:update', this._onHwUpdate);
      }
      if (this._themeObs) this._themeObs.disconnect();
      document.body.classList.remove('modal-open');
      document.body.style.overflow = '';
    },

    watch: {
      posts() {
        this.$nextTick(() => {
          if (typeof Fancybox !== 'undefined') Fancybox.bind('[data-fancybox]', {});
        });
      }
    }
  }).mount('#app');
</script>

    <script>
      (function () {
       
        const iconEl = document.getElementById("themeIcon");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        let stored = localStorage.getItem("hwTheme");
        let isDark = false;
        if (stored === "dark") isDark = true;
        else if (stored === "light") isDark = false;
        else isDark = prefersDark;

        function applyTheme(dark) {
          document.body.classList.toggle("dark", dark);
          if (iconEl) {
            iconEl.setAttribute("data-icon", dark ? "carbon:moon" : "carbon:sun");
          }
          localStorage.setItem("hwTheme", dark ? "dark" : "light");
          isDark = dark;
        }
        applyTheme(isDark);

         
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
          const stored = localStorage.getItem("hwTheme");
          if (!stored) applyTheme(e.matches);
        });

        
        const drawer = document.getElementById("musicDrawer");
        const overlay = document.getElementById("drawerOverlay");
        const closeBtn = document.getElementById("drawerCloseBtn");

        function openDrawer() {
          drawer.classList.add("open");
          overlay.classList.add("open");
          const mount = document.getElementById("drawerPlayerMount");
          if (mount && !mount.dataset.hwMounted && window.HWPlayer) {
            window.HWPlayer.mountAll();
          }
          document.body.style.overflow = "hidden";
        }

        function closeDrawer() {
  drawer.classList.remove("open");
  overlay.classList.remove("open");
  // 弹窗还开着 → 继续锁滚动；都关了 → 恢复
  if (document.body.classList.contains("modal-open")) {
    document.body.style.overflow = "hidden";
  } else {
    document.body.style.overflow = "";
  }
}
window.__toggleTheme = function () {
  applyTheme(!isDark);
};

window.__toggleMusicDrawer = function () {
  if (drawer.classList.contains("open")) closeDrawer();
  else openDrawer();
};
         
        if (closeBtn) closeBtn.addEventListener("click", function (e) { e.preventDefault(); closeDrawer(); });
        if (overlay) overlay.addEventListener("click", function () { closeDrawer(); });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && drawer.classList.contains("open")) closeDrawer();
        });

        
         

        window.HWonMasonryNeeded = function () {
          window.dispatchEvent(new Event("resize"));
        };

        document.addEventListener("DOMContentLoaded", function () {
          if (window.HWPlayer) window.HWPlayer.mountAll();
        });
      })();
    </script>
  </body>
